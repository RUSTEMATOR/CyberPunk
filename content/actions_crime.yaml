- key: cartel_courier
  section: crime
  name: Курьер для картеля
  button: Курьер
  description: "Отвезти сумку из Санто-Доминго в Пасифику и не заглядывать внутрь. Если в сумке то, о чём ты думаешь, лучше не думать."
