# More crime (owner request). Criminal → «Ещё дела». A miss can bring heat, wounds or jail (jail_weeks).

- key: porch_pirate
  section: crime
  name: Кража посылок
  button: Посылки
  description: "Дроны оставляют посылки у дверей. Некоторые дороже, чем кажутся."
  check: {stat: REF, skill: stealth, dv: 12}
  success:
    - {weight: 3, text: "Три коробки за вечер. В одной — новенький кибер-глаз в упаковке. Барыга берёт его за три сотни.", effects: {eddies: 300}}
    - {weight: 2, text: "В коробке оказывается пятьдесят пар носков. Хорошие носки, но всё же.", effects: {eddies: 40, mood: 2}}
    - {weight: 1, text: "Ты уносишь коробку, а внутри — живой котёнок с запиской «Позаботьтесь о нём». Теперь он твой.", effects: {mood: 6, humanity: 1}}
  fail:
    - {weight: 2, text: "Дверная камера снимает тебя крупным планом. Фото уже гуляет по соседским чатам.", effects: {heat: 1, mood: -2}}
    - {weight: 1, text: "Посылка оказывается ловушкой с краской. Ты неделю ходишь синим.", effects: {heat: 1, mood: -5, fame: 1}}
  bus: [crime_done:kind=pickpocket]

- key: delivery_drone_theft
  section: crime
  name: Угон дрона-доставщика
  button: Угнать дрона
  description: "Сбить дрон с курса и продать на запчасти. Груз — бонусом."
  check: {stat: TECH, skill: tech, dv: 14}
  success:
    - {weight: 3, text: "Дрон послушно садится тебе в руки. Запчасти уходят за четыре сотни, груз — пакет протеиновых батончиков.", effects: {eddies: 400, skill_xp:tech: 1}}
    - {weight: 1, text: "Дрон вёз чьи-то лекарства. Ты возвращаешь их адресату и всё равно продаёшь дрон.", effects: {eddies: 300, humanity: 1}}
  fail:
    - {weight: 2, text: "Дрон отбивается и бьёт тебя током. Он улетает, а ты лежишь на асфальте.", effects: {hp: -5, heat: 1}}
    - {weight: 1, text: "Дрон оказывается полицейским. Как можно было его не узнать — загадка.", effects: {heat: 2, jail_weeks: 2}}
  bus: [crime_done:kind=car_theft]

- key: chip_skimming
  section: crime
  name: Скимминг кредчипов
  button: Скимминг
  description: "Скиммер на банкомате у метро. Тихие деньги, пока не заметят."
  check: {stat: INT, skill: netrunning, dv: 15}
  success:
    - {weight: 3, text: "За ночь скиммер собирает десяток чипов. Ты снимаешь понемногу с каждого, чтобы никто не заметил.", effects: {eddies: 700, humanity: -1}}
    - {weight: 1, text: "Один из чипов принадлежит корпорату. На нём столько, что даже страшно. Ты берёшь чуть-чуть.", effects: {eddies: 1200, heat: 1}}
  fail:
    - {weight: 2, text: "Банк ловит скиммер за час. Хорошо, что на нём нет твоих пальцев. Почти нет.", effects: {heat: 2}}
    - {weight: 1, text: "Тебя берут у банкомата с поличным.", effects: {heat: 2, jail_weeks: 4}}
  bus: [hack]

- key: fake_chrome
  section: crime
  name: Поддельный хром
  button: Подделки
  description: "Покрасить старые импланты, переклеить серийники и продать как новые."
  cost: 200
  check: {stat: COOL, skill: persuasion, dv: 14}
  success:
    - {weight: 3, text: "Покупатель в восторге от «нового» сандевистана. Ты в восторге от его денег.", effects: {eddies: 900, humanity: -1}}
  fail:
    - {weight: 2, text: "Покупатель оказывается риппером и узнаёт подделку за секунду. Он забирает товар и бьёт тебя.", effects: {hp: -6, mood: -3}}
    - {weight: 1, text: "Через неделю покупатель находит тебя. С друзьями.", effects: {hp: -10, heat: 1}}
  bus: [deal:kind=trade]

- key: extortion
  section: crime
  name: Вымогательство
  button: Вымогать
  description: "Объяснить лавочнику, что его витрина очень хрупкая. А ты нет."
  check: {stat: BODY, skill: persuasion, dv: 14}
  success:
    - {weight: 3, text: "Лавочник платит без лишних слов. Три сотни и бесплатный кофе.", effects: {eddies: 300, humanity: -2, street_cred: 1}}
    - {weight: 1, text: "Лавочник платит и предлагает работу охранника. Ты отказываешься, но визитку берёшь.", effects: {eddies: 250, humanity: -1}}
  fail:
    - {weight: 2, text: "У лавочника под стойкой дробовик и сын-боксёр. Ты уходишь быстро.", effects: {hp: -6, mood: -4}}
    - {weight: 1, text: "Лавочник оказывается под защитой банды. Банда тебя запоминает.", effects: {heat: 1, hp: -4}}

- key: bank_job
  section: crime
  name: Ограбление банка
  button: Банк
  description: "Большое дело: отделение банка в Сити-центре. Либо ты богат, либо долго сидишь."
  ap: 2
  cost: 500
  conditions:
    min_street_cred: 15
  check: {stat: COOL, skill: firearms, dv: 18}
  success:
    - {weight: 3, text: "Сейф открыт, деньги в сумке, машина у входа. Через час ты пересчитываешь восемь тысяч в безопасной квартире.", effects: {eddies: 8000, heat: 3, street_cred: 3, fame: 2}, loud: "Ограблено отделение банка в Сити-центре. Камеры успели снять лицо: это {name}. Награда за информацию пока не объявлена."}
    - {weight: 1, text: "Ты уходишь с деньгами и чужим кредитным ключом от ячейки. В ячейке — ещё больше денег.", effects: {eddies: 12000, heat: 4, street_cred: 4, fame: 3}, loud: "{name} выносит из банка сейф и ячейку в придачу. NCPD в бешенстве, улицы в восторге."}
  fail:
    - {weight: 2, text: "Охрана быстрее, чем казалось. Тебя берут у сейфа.", effects: {heat: 3, jail_weeks: 16}, loud: "{name}: арест прямо у банковского сейфа. Шестнадцать недель за решёткой."}
    - {weight: 1, text: "Ты уходишь ни с чем, с пулей в плече и сиренами за спиной.", effects: {hp: -15, heat: 3}}
  bus: [crime_done:kind=store_robbery]

- key: graffiti_tag
  section: crime
  name: Граффити на корпоративной башне
  button: Граффити
  description: "Нарисовать что-нибудь неприличное на стене корпоративной башни. Для души и славы."
  check: {stat: REF, skill: stealth, dv: 13}
  success:
    - {weight: 2, text: "К утру на стене Arasaka красуется огромный кот в каске. Фото во всех лентах.", effects: {fame: 2, street_cred: 1, mood: 8}}
    - {weight: 1, text: "Ты пишешь на стене что-то философское. Утром это закрашивают, но фото уже разошлось.", effects: {fame: 1, mood: 6}}
  fail:
    - {weight: 2, text: "Дрон охраны засекает тебя на половине рисунка. Убегаешь, оставив недорисованного кота.", effects: {heat: 1, fame: 1}}
    - {weight: 1, text: "Тебя ловит охрана и заставляет оттирать стену до утра.", effects: {heat: 1, mood: -5}}

- key: braindance_bootleg
  section: crime
  name: Пиратские брейндансы
  button: Пиратство
  description: "Переписать свежие брейндансы с премьеры и продать на рынке. Студии это очень не любят."
  check: {stat: TECH, skill: tech, dv: 13}
  success:
    - {weight: 3, text: "Партия копий уходит за вечер. Пятьсот эдди и благодарные фанаты.", effects: {eddies: 500}}
  fail:
    - {weight: 2, text: "Копии бракованные: у покупателей неделю звенит в ушах. Деньги приходится вернуть.", effects: {mood: -3}}
    - {weight: 1, text: "Студия выслеживает тебя через водяные знаки.", effects: {heat: 2, eddies: -300}}

