    - {weight: 1, text: "Постоянный клиент берёт оптом для вечеринки в Чартер-Хилл. Корпораты тоже нюхают.", effects: {eddies: 1500, heat: 1, humanity: -1}}
  fail:
    - {weight: 2, text: "Под видом клиента подходит коп в штатском. Ты успеваешь сбросить товар, но тебя запомнили.", effects: {heat: 2}}
