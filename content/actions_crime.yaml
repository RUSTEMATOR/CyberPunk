- key: cook_glitter
  section: crime
  name: Варить «Блеск» в подвале
  button: Варить Блеск
  description: "Подпольная лаборатория в подвале мегабашни. Раз в день: варка занимает сутки. Нужна техника, чтобы ничего не взорвалось."
  cost: 500
