# Small deeds after the audiobooks of Ozon671Games (owner request: quests from the books). Leisure and crime menus.
# The quests in quests.yaml (daily_ozon_*, weekly_ozon_*) count them through `action_done`.

- key: ozon_brepsi_kolkhoz
  section: leisure
  name: «Брепси» с водкой «Колхоз»
  button: Брепси с Колхозом
  description: "Коктейль Тихого Дэна: банка «Брепси», стопка «Колхоза», тишина. Поднимает настроение, иногда — приключения."
  cost: 30
  success:
    - {weight: 4, text: "Шипит, обжигает, отпускает. Мир становится, можно сказать, определённым.", effects: {mood: 5}}
    - {weight: 2, text: "После второй банки ты понимаешь Дэна. После третьей Дэн, кажется, понимает тебя, хотя его тут нет.", effects: {mood: 7, hp: -1}}
    - {weight: 1, text: "Бармен узнаёт заказ и шепчет: «Ещё один из этих». Ставит третью банку за счёт заведения.", effects: {mood: 6, fame: 1}}
    - {weight: 1, text: "Ты просыпаешься в автобусе в другом районе. Город снова поменял географию. Или это был «Колхоз».", effects: {mood: 2, eddies: -60}}
  bus: [bar]

- key: ozon_floor_wash
  section: leisure
  name: Смена промывателя полов
  button: Помыть полы
  description: "Холл мегабашни, ведро, швабра и тишина. Платят немного, зато голова пустая и совесть чистая. Сейчас такое время: и уборщиков убирают."
  success:
    - {weight: 4, text: "Пол блестит, управляющий не находит разводов и потому недоволен. Сотню всё же даёт.", effects: {eddies: 100, humanity: 1}}
    - {weight: 2, text: "Под ковриком у лифта находишь чей-то кредчип. Хозяин так и не объявляется.", effects: {eddies: 260}}
    - {weight: 1, text: "Мимо проходит парень в оранжевом жилете, кивает на твою швабру: «Восьмёркой надо». Он прав.", effects: {eddies: 120, mood: 3, skill_xp:tech: 1}}
  bus: [service]

- key: ozon_taxi_shift
  section: leisure
  name: Ночная смена в такси
  button: Таксовать ночью
  description: "Говорят, таксист в Найт-Сити поднимает девять тысяч за ночь. Проверь сам: машина в аренду, город твой до утра."
  cost: 80
  check: {stat: REF, skill: driving, dv: 13}
  success:
    - {weight: 4, text: "Двенадцать поездок, ни одной аварии. Не девять тысяч, но и не ноль.", effects: {eddies: 450, skill_xp:driving: 1}}
    - {weight: 2, text: "Пассажир из Чартер-Хилла платит втрое, чтобы его лицо никто не запомнил. Никто и не запомнит.", effects: {eddies: 900}}
    - {weight: 1, text: "Под утро у машины останавливается жёлтое такси без номеров. Водитель улыбается слишком широко и показывает большой палец. Коллега.", effects: {eddies: 400, mood: -2}}
  fail:
    - {weight: 3, text: "Ты везёшь пассажира в Пасифику, а приезжаешь в Хейвуд. Пассажир не платит, аренда платится.", effects: {mood: -3}}
    - {weight: 1, text: "Помятое крыло, протокол NCPD, утренняя ругань в таксопарке.", effects: {eddies: -200, heat: 1}}
  bus: [drive]

- key: ozon_audiobook
  section: leisure
  name: Аудиокнига Озона на ночь
  button: Аудиокнига
  description: "Голос читает книгу, которую сочиняет прямо сейчас. Сюжет меняется на ходу, цены тоже. Странно успокаивает."
  ap: 0
  daily: true
  success:
    - {weight: 3, text: "«Он вышел из лифта как зажжённый жук». Ты засыпаешь с улыбкой и просыпаешься отдохнувшим.", effects: {mood: 4, hp: 2}}
    - {weight: 2, text: "Главный герой три главы подряд пьёт «Брепси». Тебе тоже хочется. Утро начинается с банки.", effects: {mood: 3, eddies: -10}}
    - {weight: 2, text: "«Опа, нормально», — говорит рассказчик в кульминации. Ты не можешь объяснить, почему это так хорошо.", effects: {mood: 5, luck_pool: 1}}
    - {weight: 1, text: "Сюжет катится в полный чердак, и ты дослушиваешь до утра. Не выспаться, зато какой финал.", effects: {mood: 6, hp: -2}}

- key: ozon_chips_guard
  section: leisure
  name: Ночное дежурство на парковке
  button: Дежурство
  description: "Будка, мигающая лампа, пачка чипсов и начальник смены с усами. Охранник не человек, а функция."
  success:
    - {weight: 4, text: "Восемь часов тишины. Чипсы целы, функция выполнена. Оплата купюрами по одному эдди.", effects: {eddies: 180, mood: -1}}
    - {weight: 2, text: "Начальник смены забирает чипсы «на экспертизу» и не возвращает. Зато ставит лишний час.", effects: {eddies: 220, mood: -4}}
    - {weight: 1, text: "Ты ловишь угонщика у третьего ряда. Начальник докладывает, что поймал сам, но премию выдаёт.", effects: {eddies: 400, street_cred: 1}}

- key: ozon_silver_resale
  section: crime
  name: Скупка серебряных сервизов
  button: Скупка сервизов
  description: "В Найт-Сити внезапно мода на серебряные сервизы, и почему-то все они «подарок тёти». Скупить у мутных людей, перепродать коллекционерам."
  cost: 300
  check: {stat: COOL, skill: persuasion, dv: 14}
  success:
    - {weight: 3, text: "Сервиз на двенадцать персон уходит коллекционеру втрое дороже. Продавец в шубе летом уже скрылся.", effects: {eddies: 900}}
    - {weight: 1, text: "Среди ложек находишь одну с гравировкой «Дэну от тёти». Покупатель платит за неё отдельно.", effects: {eddies: 1200, humanity: -1}}
  fail:
    - {weight: 2, text: "Сервиз оказывается мельхиором. Скупщик смеётся так, что звенят ложки.", effects: {mood: -3}}
    - {weight: 1, text: "Хозяйка сервиза находит тебя раньше покупателя. С ней Кюни и Сметания.", effects: {hp: -6, heat: 1}}
  bus: ["deal"]
