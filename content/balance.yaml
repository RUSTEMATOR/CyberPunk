           fail_effects: {mood: -4},
           text: "Брейнданс-реклама: зритель чувствует, как «Брепси» шипит на языке. Заказчик хочет, чтобы хотелось ещё.",
           win_text: "После ролика продажи «Брепси» в районе растут вдвое. Заказчик доволен.",
           fail_text: "В записи слишком честно передан вкус. Заказчик просит переснять за свой счёт. За твой."}
