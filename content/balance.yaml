      lines: ["Охрана корпораций узнаёт тебя по походке и отводит глаза.", "На форумах фиксеров спорят, сколько этажей ты возьмёшь в следующий раз."]
      effects: {street_cred: 1}
    dyn_gone:
      lines: ["Бывшие сотрудники разгромленной корпорации ищут работу. Двое приходят спросить, не нужны ли тебе люди."]
      effects: {street_cred: 1, mood: 2}
    lair:
      lines: ["В районе тише: банды обходят квартал, где ты взял логово."]
      effects: {street_cred: 1}
    turf:
      lines: ["Лавочники района здороваются первыми: теперь ты здесь закон.", "На стенах района появляется твоя метка. Её никто не трогает."]
      effects: {mood: 3}
    avatar:
      lines: ["Соседи вешают на двери медную сетку от помех. Дети показывают на тебя пальцем.", "Нетраннеры города отключают деки, когда ты проходишь мимо."]
      effects: {street_cred: 2}
    borg:
      lines: ["Старые знакомые не узнают твой голос и переспрашивают имя.", "Уличный риппер просит разрешения просто посмотреть на работу."]
      effects: {mood: -1, street_cred: 1}
    legend_duel:
      lines: ["О поединке с легендой спорят в каждом баре. Твоё имя теперь рядом с её."]
      effects: {fame: 1}
    psycho:
      lines: ["Твоё лицо на каждом экране NCPD. Люди переходят на другую сторону улицы."]
      effects: {heat: 2}
    challenge:
      lines: ["Фиксеры поднимают ставки: о тебе говорят как о человеке, которого не остановить."]
      effects: {street_cred: 1}
    ambition:
      lines: ["Город произносит твоё имя иначе. В новостях его пишут с большой буквы."]
      effects: {fame: 1}
    exped:
      lines: ["Ты рассказываешь об экспедиции в баре, и вокруг собирается ползала."]
      effects: {mood: 3}
    escort:
