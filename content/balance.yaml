director:                       # owner request 26.10: the city director, once a day (app/services/director.py)
  enabled: true
  hour: 9                       # the input of the day is written after 9:00 Kyiv; the scheduled task runs at ~9:40
  categories: [street, money, relationships, ncpd, work, rare]
  menu_size: 12
  deeds_shown: 50
  max_hooks: 8
  max_moves: 6
  move_step: 8
  max_rumors: 4
  story_max: 1800
  memory_days: 7
  memory_max: 8000
  max_scenes: 4
  scenes_kept: 60
  max_fx: 8
  fx_keys: 8
  fx_caps: {eddies_pct: 25, hp: 25, mood: 15, humanity: 8, street_cred: 6, heat: 2, fame: 5, status: 3, luck_pool: 2,
            bw_rot: 12, bw_favor: 6, glitches: 2, dirt: 3, hook: 3, enmity: 3, crisis_pts: 5}
  fx_param_caps: {skill_xp: 4, faction_rep: 4, rel_npc: 12, rel_fixer: 12, path_xp: 6}
  fx_grants: [item_grant, item_take, vehicle_grant, cyberware_grant, buff, queue_event, flag_set, flag_clear, add_npc]
  fx_eddies_pct: 0.2
  fx_eddies_floor: 5000
  max_bw: 3
  bw_step: 2
  max_corps: 3
  corp_step: 10
  max_crews: 3
  crew_step: 10
  fallback_hour: 14
  quiet_lines:
    - "Ночь прошла без громких имён. Неон гудит, NCPD пьёт кофе в машинах, банды считают эдди. Город копит злость на завтра."
    - "Тихий день в Найт-Сити — значит, кто-то готовит громкую ночь. На улицах пусто, в сети шумно."
    - "Ни одного имени в новостях. Корпо молчат, банды молчат. Так тихо бывает только перед бурей."
  rules: >-
    Ты режиссёр города в игре про Найт-Сити. Каждый день город обязан меняться: улицы (moves), сюжеты (scenes, hooks,
    fx) и Чёрный заслон (blackwall). Прочитай deeds, districts (gang/corp 0..100), blackwall (заражение районов
    0..level_max), corps (стойкость), corp_conflict, crews, players (их навыки, инвентарь, импланты, люди, долги),
    memory (твои прошлые сюжеты, нити и что бот принял вчера). Продолжай свои нити из memory.threads, закрывай старые,
    открывай новые; запиши обновлённые нити в memory. Опирайся на реальные деяния и имена, ничего не выдумывай про
    игроков сверх входа; NPC, корпо и банды можешь придумывать. Если деяний нет, город живёт сам: войны банд, корпо,
    Заслон, погода, слухи, и всё равно напиши сюжет и сдвиги. Без морали и без цифр, которых нет во входе. Тексты для
    игроков без указания пола (не «сделал/сделала», а «сделано», «твоё»), жёстко и коротко.
    hooks: сцена игроку из его menu, из своих scenes или любое событие из library. scenes: новые сцены в формате
    scene_format (или extends — дописать существующую). fx: прямые последствия для персонажа в рамках fx_caps
    (деньги, здоровье, навыки, вещи, импланты, люди, репутация, заражение). Не больше одной сцены и одного fx на
    игрока в день. Награда и цена соразмерны деянию. season: если до конца сезона меньше двух дней, готовь город к
    последней ночи сезона.

