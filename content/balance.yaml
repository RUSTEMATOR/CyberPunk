         ok_text: "Конвой дошёл. У костра тебя впервые называют по имени старейшины.", fail_text: "Рейдеры отбили две машины. Клан помнит, кто вёл.",
         fail: {hp: 15, mood: -5}}
      - {key: smuggle, name: Контрабанда за кордон, ap: 3, stat: COOL, skill: stealth, dv: 17, min_rank: 2, pay: [5000, 10000], promo: true, crime: true,
         text: "Клан везёт через пограничный пост ящики, о которых лучше не спрашивать. Ты говоришь с пограничниками.",
         ok_text: "Шлагбаум поднимается. Ящики в Найт-Сити, клан богаче, ты выше.", fail_text: "Пограничники открывают ящик. Стрельба, гонка по пустыне.",
         fail: {hp: 20, heat: 2, death_chance: 0.08}}
  join_ap: 1
  join_max_heat: 1              # the wanted level above which nobody hires you
  join_max_heat_law: 0          # ... and for the law careers below
  law_careers: [ncpd, maxtac]
  work_hard_cap: 6              # the stacked promotion bonus never goes above this
  promo_ap: 1
  promo_retry_weeks: 4          # weeks to wait after a refused promotion
  quit_mood: -5
  desertion_heat: 5             # leaving a MaxTac contract early: heat, and the character is a fugitive again

world:
  start_year: 2013              # the year a new lineage starts in (personal time, DESIGN.md 9a)
  future_beat_weeks: 26         # after the canon ends: one big Claude-written event per N weeks
  history_veto_hours: 24        # admin can veto a generated event within this time
  district_heat_max: 10
  district_heat_decay_per_day: 1
  district_heat_per_public_gig: 1
  raid_bonus_per_district_heat: 0.02
  gang_war_daily_chance: 0.10
  gang_war_min_days: 3
  gang_war_max_days: 7
  gang_war_danger_bonus: 1
  danger_max: 5
  legend_death_min_street_cred: 20   # a death at this street cred or more goes into the world history as a local legend
  legend_dynasty_lives: 3            # the death of the Nth life of a lineage is a dynasty entry
  legend_gig_tier: 7                 # a gig of this tier done well is a local legend (29.10: 5 became routine, contracts are the legends)
  banned_install_heat: 2        # an implant the world banned, installed by an underground ripper: heat for the buyer

ui:                             # window, outbox and cleanup (DESIGN.md section 3)
  window_idle_minutes: 10       # an untouched window collapses after this
  auto_delete_minutes: 30       # owner request 23.10: temp posts and closed windows go after this; the feed and digests keep their own ttl
  idle_sweep_interval_s: 60     # how often the idle sweeper looks
  temp_message_ttl_s: 60        # errors, /who, admin confirmations
  help_ttl_s: 240               # the /help guide stays this long (it is longer than an error)
  news_ttl_h: 48                # night news in the city feed
  alert_ttl_h: 24               # cyberpsycho, MaxTac, arrests in the city feed
  feed_batch_min: 20            # owner request 25.10 «меньше спама»: loud deeds, arrests, wanted go out as one post
  feed_batch_max_lines: 12
  max_ops_per_minute: 18        # sends and edits per chat per minute (Telegram: ~20 in a group); deletes and late refinements only with headroom (ui/outbox.py)
  max_screen_chars: 3500        # a screen is cut from the front down to this (Telegram limit is 4096)
  combat_log_rounds: 3          # the combat screen shows this many last rounds
  cleanup_interval_s: 10        # the cleanup loop runs this often
  cleanup_batch: 50             # deletions taken from the queue per run
  presets_per_page: 6           # preset buttons per page at character creation
  button_chars: [24, 11, 7, 5]  # narrow phone: label chars per button with 1, 2, 3, 4+ in a row; over = one per row
  minigame_ttl_s: 300           # /caliber, /race, /legends and the like stay in the chat this long
  dice_reveal_s: 3.5            # a Telegram dice (die, slot machine) spins this long; the result is shown after it
  rich_windows: false           # windows as rich messages (Bot API 10.1+); off: premium emoji do not show in rich windows
  name_blocklist: ["http", "www.", ".com", ".ru", ".ua", "t.me", "@"]  # a typed name may not contain these

narrator:
  message_max_chars: 600
  obituary_max_chars: 900
  news_max_chars: 3000          # owner request 24.10: the news got concrete, give it room
  npc_chat_max_player_messages: 6
  classify_summary_max_chars: 80
  timeout_seconds: 30
  retries: 1
  max_tokens:
    gig_brief: 350
    gig_result: 350
    event_text: 350
    event_outcome: 300
    obituary: 500
    news: 800
    npc_chat: 250
    classify_action: 120
    unique_event: 900
    saga_step: 1200
    chronicle: 1400
    future_beat: 700
    history_digest: 700
    free_classify: 150
    free_outcome: 350
    find_story: 600               # owner request 24.10: how a character came by a thing an admin granted
    challenge: 900                # owner request 25.10: a personal challenge against an outgrown build
    challenge_w: 1000             # owner request 25.10: a personal challenge against a fortune
    legend_scene: 3000            # owner request 27.10: the epic last deed of a legend
    scenarist: 900                # owner request 27.10: the scenarist inside the bot (services/dialogs.py)
  budget_warn_pct: 0.75
  budget_fallback_pct: 0.90   # at 90% switch to fallback texts and notify admins
  txn_timeout_seconds: 6      # a gig result, an event outcome or an obituary is written while the database is locked: short wait, no retry (24.10: was 12, it held the lock for everyone)
  txn_retries: 0
  window_timeout_seconds: 15  # a player waits in the window for a unique event or an npc_chat answer: shorter wait, no retry (24.10: was 20; long saga steps take 7-9 s)
  window_retries: 0
  concurrency: 4              # calls to Claude in flight at once
  breaker_failures: 3         # this many failures in a row pause the narrator for breaker_pause_seconds (fallback texts meanwhile)
  breaker_pause_seconds: 120
  target_ratio: 0.8           # the prompt asks for this share of a hard limit; the text is cut to the limit anyway
  min_keep_ratio: 0.4         # a text that has to be cut to less than this share of itself is dropped for the fallback
  news_paragraph_max_chars: 400   # one district paragraph of the night news
  npc_chat_player_max_chars: 300
  npc_chat_exchanges_shown: 2     # last exchanges visible in the window
  unique_title_max_chars: 60
  unique_label_max_chars: 28      # a choice button
  unique_outcome_max_chars: 300
  history_digest_max_chars: 1500
  history_digest_bucket_years: 5      # one digest per 5 years of the character's date: it holds only what happened up to that year
  history_digest_entries_max: 60      # history entries handed to one digest build (the newest)
  history_digest_retry_seconds: 600   # pause after a failed digest build
  history_digest_refresh_seconds: 3600  # a digest with new entries is rebuilt after this long
  future_beat_retry_seconds: 3600     # pause before a failed future beat is asked again
  future_beat_per_call: 3             # future beats written by one ensure_future_beats call (the rest on the next call)
  history_recent_rows: 6              # recent world_history rows handed to the news
  future_beat_title_max_chars: 80
  future_beat_max_effects: 4
  llm_event_text: true        # Claude rewrites the text of a drawn event once (cached on the character)

mods_caps:                      # caps on the SUM of a mod over everything the character has; other mods are uncapped
  ap_week: 1                    # max +1 AP per week from implants
  shop_discount_pct: 50
  ripper_discount_pct: 50
  humanity_loss_pct: -50        # a floor: stabilizers cannot cut humanity loss by more than 50%
  humanity_floor: 10            # max of the summed `humanity_floor` mod (the MaxTac inhibitor gives 5)

enemy_ai:                       # DESIGN.md section 6 "Поведение"
  brute: {}                     # turns on everything as soon as the charge allows, never cancels
  tactical:
    activate_hp_below_pct: 0.6  # turns on duration implants below 60% hp, or when the player has one running
    cancel_charge_below: 30     # cancels early below 30% charge when the player is no threat; otherwise hoards charge
  netrunner:
    defense_bonus: 2            # stays at the back; first hack target is the player's running implant
  coward:
    flee_hp_below_pct: 0.5

netrun:
  base_ice: 0                   # ice of every combatant before `ice` mods
  enemy_hack_dv_by_danger: {1: 9, 2: 11, 3: 13, 4: 15, 5: 17}   # player defense roll: INT + netrunning + ice + d10 vs this dv
  ram_start_pct: 1.0            # share of ram_max at the start of a fight
  ram_full_recharge_after_combat: true

# --- Paths, eras and daily loop (PLAN.md 1.6; DESIGN.md 7a, 9a, 12a) ---

chrome_free:                    # a body without implants, DESIGN.md 7a
  xp_pct: 25                    # extra skill xp, percent
  check_bonus: {social: 1, heal: 1, meditation: 2}   # bonus to checks of relations, therapy and meditation
  quickhack_penalty: 5          # penalty to the roll of an environmental quickhack against a clean target

daily:                          # DESIGN.md 12a
  base_eddies: 100              # eddies of the Misty card draw
  eddies_per_streak_day: 10     # extra eddies per day of streak
  eddies_streak_cap: 100        # the streak extra stops here
  streak_rewards:               # streak day -> one-off reward
    7: {eddies: 500, tokens: 3}       # the chest
    30: {eddies: 2000, tokens: 10}    # the rare reward
  quest_tokens: {daily: 1, weekly: 3} # Afterlife tokens for any finished quest of the period
  daily_quests: 3
  weekly_quests: 1
  freeze_max: 2                 # streak freezes a player may hold
  stim_bonus: 2                 # Afterlife stim: bonus to the next check, gone with the week
  path_min_actions: 5           # below this many counted actions a player gets the quests of both paths
  path_share_min: 0.3           # share of combat / non-combat actions that opens that path

caliber:                        # daily caliber mini-game
  change_dice: 1d10-4           # change in mm per day
  start_mm: 5
  min_mm: 0
  titles:                       # title of the highest threshold reached
    - {mm: 0, title: Холостой}
    - {mm: 10, title: Мелкашка, mods: {mood_weekly: 1}}
    - {mm: 25, title: Девятка, mods: {mood_weekly: 1, check.social: 1}}
    - {mm: 50, title: Магнум, mods: {mood_weekly: 1, check.social: 1, check.combat: 1}}
    - {mm: 100, title: Гаубица, mods: {mood_weekly: 2, check.social: 2, check.combat: 1}}
    - {mm: 200, title: Орбитальная пушка, mods: {mood_weekly: 3, check.social: 2, check.combat: 2, check.talk_exit: 1}}
  words: [калибр, качнуть, кач]  # owner request: a word in the chat rolls the caliber of the day

dirt:                           # /dirt and /dump
  gain_dice: 1d3                # dirt gained per day
  dump_cost: 5
  target_cooldown_days: 3       # the same target again not sooner than this
  defense_check: {stat: COOL, dv: 13}   # the target fights the dump off with this check
  defense_fixer_rel_min: 70     # or with a relation to the district fixer at or above this
  heat_gain: 1                  # wanted level added on a successful dump
  post_ttl_h: 24                # the public post lives this long

reputation:                     # caps of the three reputations
  street_cred_max: 50           # must equal character.street_cred_max
  street_cred_titles: {0: никто, 5: новое лицо, 10: знакомое лицо, 18: свой на районе, 26: имя в городе, 35: уважаемый человек, 44: легенда улиц}
  status_max: 50
  fame_max: 50
  bus_gains:                    # bus event -> status / fame per occurrence (events add their own through effects)
    promotion: {status: 3}      # a career promotion
    perform: {fame: 2}          # a stage performance
    report: {fame: 2}           # a story, filming
    deal:broker: {status: 1}
    deal:trade: {status: 1}

reminders:                      # DESIGN.md 12a, Kyiv time
  noon_hour: 12                 # "Ежедневка обновилась"
  noon_ttl_h: 3
  evening_hour: 21              # mentions of the players whose streak is about to burn
  evening_ttl_h: 3
  legends_weekday: 6            # Sunday
  legends_hour: 20
  legends_ttl_h: 48
  legends_top_n: 10             # rows of /caliber_top
  legends_board_n: 5            # rows of /legends per reputation, the dead included
  graveyard_n: 10               # rows of /graveyard, the latest dead first
  dump_log_days: 14

world_effects:                  # corridors of world-effect values (timeline.yaml, Claude events)
  price_mult: {min: 0.5, max: 3.0}
  district_danger: {min: -2, max: 2}    # change of the district danger
  gang_war_weeks: {min: 1, max: 12}
  faction_power: {min: -3, max: 3}      # change of the faction power
  heat_mult: {min: 0.5, max: 2.0}
  gig_pay_mult: {min: 0.5, max: 2.0}
  event_weight: {min: 0.25, max: 4.0}
  coin_shock: {min: 0.2, max: 3.0}      # multiplier of the Eddy-crypto rate, applied once

# --- Emergent roles, exits without a fight, mini-games (PLAN.md 1.8; DESIGN.md 5b, 6, 12a) ---

roles:                          # DESIGN.md 5b; the role records are in roles.yaml
  max_rank: 10                  # ranks 0..10; every filled role has exactly this many rank_thresholds
  perk_ranks: [2, 5, 8]         # a filled role has one perk at each of these ranks
  affinity_max: 500             # affinity of a role stops growing here (above every rank threshold)
  second_role_min_rank: 1       # the second role is shown from this rank
  main_switch_pct: 10           # the city renames you only when the new leader is this % ahead of the old main role
  affinity_floor: 0.5           # decayed affinity below this is forgotten

exits:                          # pay, talk, flee, surrender (DESIGN.md 6 "Выходы без боя")
  # Final dv of an exit = faction dv (gangs.yaml / corps.yaml `disposition`, or maxtac / cyberpsycho below)
  #   + situational shifts, the sum clamped to corridor.situation_shift_min..max, then clamped to dv_min..dv_max.
  # A dv of null in a disposition means the exit is impossible and no shift can change that.
  bribe:
    base_by_danger: {1: 150, 2: 300, 3: 600, 4: 1200, 5: 2500}   # eddies, times disposition.bribe_cost_mult
    step_pct: 0.5               # a bigger bribe goes up in steps of this share of the base cost ...
    dv_per_step: 1              # ... each step lowers the bribe dv by this ...
    max_steps: 4                # ... up to this many steps
    fail_taken_chance: 0.5      # failed check: the money is taken anyway and they still attack
  situation:
    faction_rep: {min: -50, max: 50, per_dv: 10, dv_max: 3}       # bribe and talk: every 10 rep = 1 dv, up to 3
    street_cred:                # bribe and talk: above the pack's threshold = easier, below = harder
      threshold_by_danger: {1: 0, 2: 8, 3: 16, 4: 25, 5: 35}
      per_dv: 8
      dv_max: 3
    fame: {per_dv: 12, dv_max: 2}       # talk only
    status: {per_dv: 12, dv_max: 2}     # talk only
    pack_half_lost: {bribe: -1, talk: -2, flee: -2}   # the pack lost combat.morale_break_fraction of its size
    wounded: {flee: 0}                  # heavy wound (character.heavy_wound_ratio): no extra dv, the -2 to every check already hurts
    betrayed: {bribe: 2, talk: 3, flee: 1}   # the character cheated this faction before
    honest_vow: no_lies         # vows.yaml key: while it is held, lying is impossible ...
    honest_talk_bonus: 2        # ... and an honest talk lowers the talk dv by this
  fail:
    talk_attack_bonus: 2        # failed talk: the enemies get +2 to attack ...
    talk_attack_ticks: 1        # ... in the first tick
    flee_free_attacks: 1        # failed flee: one free round of enemy attacks, the fight goes on
  corridor:
    situation_shift_min: -6     # all situational shifts together
    situation_shift_max: 8
    dv_min: 7                   # final dv of a possible exit
    dv_max: 27
    talk_bonus_cap: 4           # talk_bonus_if entries together
  surrender:
    chrome_strip_count: 1       # implants cut out by `chrome_stripped`
    captured_ransom_pct: 0.5    # `captured`: share of the character's eddies asked for release
    vanished_weeks: 8           # `vanished`: weeks the character is gone
  maxtac:                       # the heat-5 response squad: no deals
    bribe_dv: null
    talk_dv: null
    bribe_cost_mult: 1.0
    flee_mod: 3
    surrender: {arrested: 7, executed: 3}     # 3 of 10: they do not hear you out
  cyberpsycho:                  # nobody to bribe; talking works only for those who know them
    bribe_dv: null
    talk_dv: 23
    bribe_cost_mult: 1.0
    flee_mod: 2
    surrender: {executed: 1}
    talk_gate:
      roles: [medtech]          # the character's main role
      knows_target: true        # or a neighbour / acquaintance of the target

car:                            # /car and /race
  start_hp: 100                 # horsepower of a new car
  min_hp: 20
  max_hp: 2000
  default_name: Тачка
  tune_dice: 1d20-8             # daily tuning: change of horsepower
  break_chance: 0.15            # a part falls off during tuning
  break_hp_loss: 1d10           # extra horsepower lost with the part
  parts:
    - {key: bumper, name: Бампер}
    - {key: exhaust, name: Выхлоп}
    - {key: spoiler, name: Спойлер}
    - {key: headlights, name: Фары}
    - {key: mirror, name: Зеркало}
  repair_cost: 200              # eddies of the current character per part
  race_roll: 2d30               # race score = car_hp - missing_part_penalty * missing parts + this roll
  missing_part_penalty: 8
  stakes_tokens: [0, 1, 2, 3, 5]    # allowed stakes in Afterlife tokens; 0 = for fun
  races_per_pair_per_day: 1

cat:                            # /cat and /catfight
  default_name: Кот
  levels:                       # consecutive from 1; feedings = total feedings to reach the level
    - {level: 1, name: Котёнок, feedings: 0}
    - {level: 2, name: Уличный кот, feedings: 3}
    - {level: 3, name: Подвальный охотник, feedings: 8}
    - {level: 4, name: Кошачий киллер, feedings: 15}
    - {level: 5, name: Кибер-кот, feedings: 25}
    - {level: 6, name: Легенда подворотен, feedings: 40}
  sulk_after_days: 2            # no feeding for 2 days: the cat sulks
  leave_after_days: 7           # no feeding for 7 days: the cat goes to the neighbour
  return_cost_tokens: 5         # tokens to bring the cat back
  sulk_fight_penalty: 5         # taken off the fight score of a sulking cat
  chrome:                       # bought for tokens: afterlife_shop.yaml effect `cat_item:<key>`
    - {key: claws, name: Когти, fight_bonus: 4}
    - {key: optics, name: Оптика, fight_bonus: 3}
    - {key: tail, name: Хвост-балансир, fight_bonus: 3}
  level_power: 5                # fight score = level * 5 + chrome bonuses + fight_roll
  fight_roll: 1d20
  fights_per_day: 1
  stakes_tokens: [0, 1, 2]

coin:                           # /coin (Eddy-crypto); the shared rate and history are in world_state
  start_rate: 100.0             # eddies per coin on day one
  min_rate: 5.0
  max_rate: 5000.0
  daily_drift: 0.0              # mean change of one step, share of the rate
  daily_volatility: 0.05        # one step is drift +- 5%, uniformly (owner request: the rate moves every 30 minutes)
  commission_pct: 0.10          # taken when selling for eddies
  history_days: 48              # steps of history kept (a day of 30-minute steps)
  period_minutes: 30
  min_deal_eddies: 50
  shock_volatility_mult: 2.0    # after a coin_shock world effect the volatility doubles ...
  shock_volatility_days: 3      # ... for 3 days
  buy_steps: [100, 500, 1000, 5000]   # eddy amounts of the buy buttons on the /coin screen
  top_n: 3                      # rows of the wallet top

cyberpsychosis:                 # DESIGN.md 7 and 7b: breakdown, fugitive life, recruitment, MaxTac service
  maxtac_arrival_tick: 2        # MaxTac joins the breakdown fight on this combat tick (danger 5, balance.crime.maxtac_danger)
  fugitive_heat: 5              # heat of a fugitive psycho; it never decays
  hunt_weeks: 4                 # a MaxTac hunt comes for a fugitive every 4 weeks
  duty_weeks: 5                 # a mandatory MaxTac call every 5 weeks of service (events_maxtac.yaml, enemies cyberpsycho_*)
  duty_player_target_chance: 0.25   # share of calls where the target is another player's fugitive (PLAN 7.5)
  recruit:                      # chance of a contract offer after a capture; clamped to min..max, so nobody is sure either way
    base_chance: 0.25
    min_chance: 0.05
    max_chance: 0.95
    tolerance_bonus:            # added to the chance by hidden tolerance type; ironclad and smasher are "almost always"
      fragile: -0.10
      normal: 0.0
      resistant: 0.10
      ironclad: 0.45
      smasher: 0.55
    roles: [solo, lawman]       # roles.yaml keys; the best rank among them counts
    role_rank_bonus: 0.03       # per rank (rank 10 = +0.30)
    street_cred_bonus_per_point: 0.004   # street cred 25 = +0.10, the cap of 50 = +0.20
    civilian_kill_penalty: 0.05 # subtracted per civilian killed: MaxTac does not hire butchers
  isolation_weeks: {min: 26, max: 52}  # term in the isolation ward, rolled at admission
  isolation_humanity_per_week: 3       # therapy: humanity back every week in the ward
  chrome_stripped_pct: 0.5      # share of implants cut out in the ward (rounded up, at least one)
  humanity_after_contract: 10   # humanity right after the inhibitor goes in; must be above the inhibitor floor (5)
  refusal_shock_damage: 2d6     # inhibitor discharge on a refused order; humanity never goes below the floor
  refusal_shock_humanity: 2     # humanity lost to the discharge, never below the inhibitor floor
  refusal_plain_street_cred: 1  # a member without the leash loses this much street cred for a refusal ...
  refusal_plain_mood: 3         # ... and this much mood
  breakdown_ncpd_danger: 3      # NCPD pack around the breakdown; MaxTac (danger 5) lands on maxtac_arrival_tick
  duty_danger: {min: 4, max: 5} # danger of a duty call against a cyberpsycho
  duty_pay: 600                 # eddies for a won call
  duty_pay_player: 1200         # eddies when the target was another player's fugitive
  duty_cred: 1                  # street cred for a won call
  duty_fled_as_refusal: true    # leaving a duty fight counts as refusing the order
  desertion_heat: 5

ripper:                         # PLAN 6.1-6.7: the clinic menu
  install_ap: 1
  remove_ap: 1
  scan_ap: 1
  cure_ap: 1                    # the infection cure (a check or the clinic)
  software_ap: 1
  page_size: 6                  # implants on a catalog page
  family_kinds: [family, child, partner]   # a full conversion drops their relation to cyber.full_conversion.family_rel
  software_dealer: {district: pacifica, gang: voodoo_boys, price_mult: 1.0}   # the netrunner dealer of the "Софт" shop
  clinic_cure_price_mult: 1.0
  heal_per_hp: 40               # owner request 24.10: «Клиника: лечение» patches wounds for money, no AP
  heal_min: 150                 # the smallest bill
  heal_step: 10                 # the small button heals this much
  chrome_price_mult: 1.6        # owner request 23.10: chrome is dearer

upgrades:                       # owner request: weapon attachments and things for your home (app/services/upgrades.py)
  max_weapon_mods: 2            # attachments on one weapon
  weapon_mods:
    - {key: laser_sight, name: Лазерный целеуказатель, price: 250, types: [pistol, smg, shotgun], mods: {check.combat: 1}, description: "Красная точка там, куда полетит пуля. Дёшево и работает."}
