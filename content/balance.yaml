chat_games:                     # owner request: words in the chat start small games (app/bot/handlers/chatgames.py)
  slots:
    words: [слот, слоты, спин, крутка, крутануть, казино]
    max_message_chars: 40
    stake_default: 100
    stake_min: 50
    stake_max: 5000
    cooldown_s: 20
    daily_max: 30
    jackpot_mult: 20            # 777: 1 of 64
    triple_mult: 5              # three bars, grapes or lemons: 3 of 64
    two_sevens_mult: 2          # exactly two sevens: 9 of 64; the house keeps about 17%
    result_ttl_s: 90
  fishing:
    words: [рыбалка, рыбалку, порыбачить, рыбачить]
    bait_cost: 20
    daily_casts: 15
    credit_markup_pct: 30
    junk_div_per_tier: 0.5
    rare_mult_per_tier: 0.6
    harbor_district: waterfront
    harbor_rare_mult: 1.5
    harbor_sell_pct: 30
    dry_districts: [badlands, combat_zone]
    dry_fish_mult: 0.3
    rods:
      - {key: rod_stick, name: Палка с леской, tier: 1, price: 150, description: "Ветка, леска и ржавый крючок. Ловит, если рыбе скучно."}
      - {key: rod_spinning, name: Спиннинг, tier: 2, price: 900, description: "Нормальный спиннинг с катушкой. Мусора меньше, рыбы больше."}
      - {key: rod_carbon, name: Карбоновая удочка, tier: 3, price: 3500, description: "Лёгкая, прочная и чувствительная. Слышит, как рыба думает."}
      - {key: rod_sonar, name: Удочка с сонаром, tier: 4, price: 12000, available_from: 2030, description: "Сонар показывает рыбу на экране, леска с подогревом. Нечестно, зато улов."}
    catches:
      # junk
      - {key: boot, name: Старый ботинок, kind: junk, rarity: 0, weight: 14, price: 2, text: "Ботинок. Левый. Правый, наверное, ещё там."}
      - {key: can, name: Банка «Брепси», kind: junk, rarity: 0, weight: 10, price: 3, text: "Мятая банка «Брепси». Внутри ещё булькает. Лучше не пробовать."}
      - {key: tire, name: Автомобильная шина, kind: junk, rarity: 0, weight: 6, price: 5, text: "Шина от чьей-то машины. Вытаскивать её дольше, чем ловить рыбу."}
      - {key: wet_chip, name: Мокрый кредчип, kind: junk, rarity: 1, weight: 3, price: 120, text: "Кредчип в иле. После просушки на нём ещё что-то есть."}
      # fish
      - {key: mutant_carp, name: Карась-мутант, kind: fish, rarity: 0, weight: 16, price: 25, text: "Карась с тремя глазами. Двумя смотрит на тебя, третьим — в вечность."}
      - {key: synth_salmon, name: Синтетический лосось, kind: fish, rarity: 0, weight: 12, price: 45, text: "Лосось с фермы Biotechnica, сбежавший в залив. На боку штрихкод."}
      - {key: neon_perch, name: Неоновый окунь, kind: fish, rarity: 1, weight: 8, price: 80, text: "Окунь светится розовым. В темноте можно читать."}
      - {key: oil_eel, name: Мазутный угорь, kind: fish, rarity: 1, weight: 6, price: 110, text: "Угорь чёрный и скользкий, пахнет как порт. Рипперы берут его для мазей."}
      - {key: chrome_pike, name: Хромированная щука, kind: fish, rarity: 2, weight: 4, price: 220, text: "Щука с металлическими зубами. Кто-то поставил ей импланты. Зачем — загадка."}
      - {key: glow_jelly, name: Светящаяся медуза, kind: fish, rarity: 2, weight: 3, price: 300, text: "Медуза мерцает в ведре. Клубы Кабуки платят за таких бешеные деньги."}
      - {key: bay_tuna, name: Тунец из залива, kind: fish, rarity: 2, weight: 2, price: 450, min_tier: 2, text: "Огромный тунец. Спина болит, руки трясутся, но это ужин на весь подъезд."}
      - {key: deep_angler, name: Глубинный удильщик, kind: fish, rarity: 3, weight: 0.8, price: 900, min_tier: 3, text: "Рыба с фонарём на лбу из тех глубин, куда не доходит свет. Смотрит недовольно."}
      # loot
      - {key: drowned_pistol, name: Утопленный пистолет, kind: loot, rarity: 1, weight: 2, effects: {item_grant:pawnshop_pistol: true}, text: "На крючке пистолет в иле. После чистки стреляет. Чей был — лучше не знать."}
      - {key: weedy_vest, name: Бронежилет в водорослях, kind: loot, rarity: 1, weight: 1.5, effects: {item_grant:light_vest: true}, text: "Бронежилет, обросший водорослями. Пулевая дырка одна, зато в спине."}
      - {key: jar_implant, name: Имплант в банке, kind: loot, rarity: 2, weight: 0.8, effects: {cyberware_grant:chrome_teeth: true, humanity: -1}, text: "Банка, внутри хромированные зубы в формалине. Риппер на пирсе ставит их за бутылку."}
      - {key: yakuza_case, name: Кейс якудза, kind: loot, rarity: 2, weight: 0.7, effects: {eddies: 1500, heat: 1}, text: "Кейс с наличными, перемотанный цепью. Кто-то его утопил. Кто-то будет его искать."}
      - {key: bottle_note, name: Записка в бутылке, kind: loot, rarity: 1, weight: 1.5, event: fish_bottle_note, text: "Бутылка, а в ней записка. Почерк дрожит."}
      - {key: drone_wreck, name: Утонувший дрон, kind: loot, rarity: 2, weight: 1, effects: {eddies: 400, skill_xp:tech: 2}, text: "Курьерский дрон с полным грузом. Груз размок, а запчасти ещё стоят денег."}
      # legends
      - {key: bay_catfish, name: Старик залива, kind: legend, rarity: 3, weight: 0.25, price: 3000, min_tier: 2, text: "Сом размером с мотоцикл. Про него рассказывали деды. Теперь будут рассказывать про тебя.", loud: "Рыбак дня — {name}: из залива вытащен Старик, сом размером с мотоцикл. Портовые рыбаки снимают кепки."}
      - {key: arasaka_fish, name: Механическая рыба Arasaka, kind: legend, rarity: 3, weight: 0.15, price: 5000, min_tier: 3, text: "Рыба-дрон Arasaka с камерой в глазу. Кто-то в башне только что потерял прототип.", loud: "Рыбак дня — {name}: на крючке рыба-шпион Arasaka. В башне, говорят, уже ищут, кто это."}

