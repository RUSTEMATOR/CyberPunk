paths:                          # owner request: the career paths of a fixer, a ripper and a politician (app/engine/paths.py)
  switch_price: 5000            # a new path starts from zero and costs this much
  rank_pay_pct: 30              # the pay of an action grows by this much per rank above the first
  paths:
    - key: fixer
      name: Фиксер
      text: "Сначала бегаешь по делам с чужими командами. Потом сам находишь исполнителей, пишешь планы и берёшь долю. Чем громче имя на улице, тем выше потолок."
      ranks:
        - {name: Шестёрка, xp: 0, text: "Ходишь на дела с чужими командами и смотришь, как всё устроено."}
        - {name: Связной, xp: 12, min_cred: 8, income: 200, mods: {check.gig_talk: 1}, text: "Можно нанимать исполнителей и отдавать заказы другим игрокам."}
        - {name: Посредник, xp: 35, min_cred: 18, income: 800, mods: {check.gig_talk: 2, gig_pay_pct: 10}, text: "Сводишь продавцов и покупателей. Тебе звонят, а не ты."}
        - {name: Фиксер района, xp: 80, min_cred: 30, income: 2500, mods: {check.gig_talk: 2, gig_pay_pct: 20, check.bribe: 1}, text: "Район знает твоё имя. Банды делят территорию через тебя."}
        - {name: Легенда улиц, xp: 160, min_cred: 42, min_fame: 20, income: 6000, mods: {check.gig_talk: 3, gig_pay_pct: 30, check.social: 2}, text: "Корпорации звонят напрямую. Такие, как Роуг, когда-то начинали так же."}
      actions:
        - {key: crew_job, name: Дело с командой, ap: 2, min_rank: 1, stat: REF, skill: stealth, dv: 13, contexts: [crime], pay: [300, 700], xp: 2, fail_xp: 1,
           fail_effects: {hp: -6, heat: 1},
           text: "Чужая команда берёт тебя на склад. Твоё дело — стоять на стрёме и не облажаться.",
           win_text: "Всё прошло чисто. Старший команды запомнил твоё лицо.",
           fail_text: "Сигнализация, бег по крышам, рваная куртка. Доли нет."}
        - {key: find_runner, name: Найти исполнителя, ap: 1, price: 500, min_rank: 2, stat: COOL, skill: persuasion, dv: 14, contexts: [gig_talk], pay: [1200, 2200], xp: 3,
           text: "Аванс бойцу из Кабуки, заказ — твой. Если человек надёжный, разница твоя.",
           win_text: "Исполнитель сделал дело и принёс товар. Клиент платит тебе, ты — ему.",
           fail_text: "Исполнитель исчез с авансом. Номер больше не отвечает."}
        - {key: broker, name: Свести сделку, ap: 2, min_rank: 3, stat: COOL, skill: persuasion, dv: 16, contexts: [gig_talk, bribe], pay: [3000, 5000], xp: 4, fail_xp: 1,
           fail_effects: {heat: 2, mood: -4},
           text: "Продавец оружия и покупатель из Валентино не доверяют друг другу. Доверяют тебе.",
           win_text: "Ящики переехали, деньги тоже. Процент лёг на счёт.",
           fail_text: "На встрече кто-то нервно дёрнул рукой. Сделка сорвалась, а NCPD теперь знает твой номер."}
        - {key: gang_deal, name: Договор между бандами, ap: 3, price: 2000, min_rank: 4, stat: COOL, skill: persuasion, dv: 19, contexts: [gig_talk, bribe], pay: [8000, 14000], xp: 6, fail_xp: 2,
           fail_effects: {hp: -12, heat: 3},
           text: "Мэлстром и Тигриные Когти делят рынок в Уотсоне. Без посредника будет война.",
           win_text: "Подписали кровью и выпили. Обе стороны платят тебе за мир.",
           fail_text: "Переговоры закончились перестрелкой. Тебя вынесли через чёрный ход."}
        - {key: corp_deal, name: Заказ корпорации, ap: 3, price: 5000, min_rank: 5, stat: COOL, skill: persuasion, dv: 21, contexts: [gig_talk, social], pay: [20000, 35000], xp: 8, fail_xp: 2,
           fail_effects: {heat: 4, mood: -8},
           text: "Арасака хочет, чтобы прототип Милитеха исчез, и чтобы никто не знал, кто заказал.",
           win_text: "Прототип исчез, Арасака довольна, Милитех ищет не тех. Перевод с шестью нулями после запятой.",
           fail_text: "Корпорация отреклась от заказа. Теперь тебя ищут обе."}
    - key: ripper
      name: Риппер
      text: "Сначала штопаешь раненых в подворотне. Потом ставишь хром с рук, открываешь клинику, и к тебе выстраивается очередь из банд и корпоратов."
      ranks:
        - {name: Санитар подворотни, xp: 0, text: "Бинты, скобы, стимуляторы. Платят чем есть."}
        - {name: Подпольный риппер, xp: 12, min_cred: 5, income: 300, mods: {check.heal: 1, ripper_discount_pct: 10}, text: "Стол в подвале и набор инструментов. Можно ставить импланты."}
        - {name: Риппер с клиникой, xp: 35, min_cred: 12, income: 1200, mods: {check.heal: 2, ripper_discount_pct: 20, hp_regen: 1}, text: "Своя клиника. Пациенты приходят сами и платят каждый месяц."}
        - {name: Известный риппер, xp: 80, min_fame: 10, income: 3000, mods: {check.heal: 2, ripper_discount_pct: 30, immuno_cost_pct: -15, hp_regen: 2}, text: "Банды везут бойцов только к тебе. Подавители по своей цене."}
        - {name: Хромовый мастер, xp: 160, min_fame: 25, income: 7000, mods: {check.heal: 3, ripper_discount_pct: 40, immuno_cost_pct: -30, hp_regen: 3}, text: "Про твои руки рассказывают легенды. Корпорации предлагают контракты."}
      actions:
        - {key: patch_up, name: Заштопать раненого, ap: 1, min_rank: 1, stat: TECH, skill: medicine, dv: 12, contexts: [heal], pay: [150, 400], xp: 2,
           fail_effects: {mood: -4},
           text: "В переулке парень с пулей в боку. Его друзья держат фонарик и пистолет.",
           win_text: "Пуля в лотке, рана зашита. Друзья скинулись и пожали руку.",
           fail_text: "Кровь не остановилась. Друзья уносят тело и смотрят так, что лучше уйти."}
        - {key: install, name: Имплант с рук, ap: 2, min_rank: 2, stat: TECH, skill: tech, dv: 14, pay: [800, 1500], xp: 3, fail_xp: 1,
           fail_effects: {heat: 1, mood: -3},
           text: "Клиент принёс ворованный имплант. Поставить без вопросов — двойная цена.",
           win_text: "Имплант встал. Клиент сжимает кулак и смеётся.",
           fail_text: "Отторжение на столе. Клиент жив, но рассказывает о тебе всем."}
        - {key: clinic_shift, name: Смена в клинике, ap: 2, min_rank: 3, stat: TECH, skill: medicine, dv: 15, contexts: [heal], pay: [2000, 3500], xp: 4,
           fail_effects: {mood: -5},
           text: "Очередь до двери: порезы, ломка, сбитая калибровка. Работать до утра.",
           win_text: "Смена закрыта, касса полная, ни одного трупа.",
           fail_text: "Один пациент не дожил до утра. Слухи разошлись быстрее, чем кровь отмыли."}
        - {key: gang_contract, name: Контракт с бандой, ap: 3, min_rank: 4, stat: TECH, skill: medicine, dv: 17, contexts: [heal], pay: [5000, 9000], xp: 5, fail_xp: 1,
           fail_effects: {heat: 2, hp: -8},
           text: "Валентино платят за то, чтобы их бойцы вставали после любой перестрелки.",
           win_text: "Три тяжёлых за ночь, все на ногах. Банда платит и обещает защиту.",
           fail_text: "Их лейтенант умер на твоём столе. Тебе разбили лицо и сказали, что ещё повезло."}
        - {key: prototype, name: Экспериментальная операция, ap: 3, price: 3000, min_rank: 5, stat: TECH, skill: tech, dv: 20, pay: [15000, 25000], xp: 8, fail_xp: 2,
           fail_effects: {heat: 3, mood: -8},
           text: "Корпорация привезла прототип нейролинка и добровольца. Справишься — контракт твой.",
           win_text: "Прототип работает. Корпорация переводит деньги и просит молчать.",
           fail_text: "Доброволец больше не помнит своё имя. Корпорация заметает следы — и тебя заодно."}
    - key: politician
      name: Политик
      text: "Сначала митинги на районе и чужие листовки. Потом кресло в совете, доноры, голосования. На вершине — кресло мэра, и оно одно на весь город."
      ranks:
        - {name: Активист, xp: 0, text: "Листовки, митинги, мегафон. Тебя слушают пятеро и один полицейский."}
        - {name: Помощник советника, xp: 12, min_fame: 5, income: 400, mods: {check.social: 1}, text: "Пишешь речи и носишь кофе. Зато знаешь, кто кому платит."}
        - {name: Советник района, xp: 35, min_fame: 12, income: 1500, mods: {check.social: 2, check.bribe: 1, heat_decay: 1}, text: "Своё кресло и свой район. Полиция на районе здоровается."}
        - {name: Член городского совета, xp: 70, min_fame: 22, income: 4000, mods: {check.social: 2, check.bribe: 2, heat_decay: 2}, text: "Голосуешь за бюджет города. Корпорации зовут на ужины."}
        - {name: Мэр Найт-Сити, xp: 90, min_fame: 30, seat: true, income: 12000, mods: {check.social: 3, check.bribe: 3, heat_decay: 3, check.career: 2}, text: "Кресло одно на весь город. Удержать его труднее, чем занять."}
      actions:
        - {key: rally, name: Митинг на районе, ap: 1, min_rank: 1, stat: COOL, skill: persuasion, dv: 12, contexts: [social], xp: 2, effects: {fame: 1},
           fail_effects: {mood: -3},
           text: "Ящик из-под пива, мегафон и злая толпа. Скажи им, чего они хотят.",
           win_text: "Толпа скандирует твоё имя. Кто-то снимает на камеру.",
           fail_text: "В тебя кинули банкой. Видео разошлось по сети не так, как хотелось."}
        - {key: donors, name: Ужин с донорами, ap: 2, price: 500, min_rank: 2, stat: COOL, skill: persuasion, dv: 14, contexts: [social], pay: [1500, 3000], xp: 3,
           text: "Владелец сети бургерных и два застройщика. Им нужен свой человек в совете.",
           win_text: "Чек на кампанию подписан. Взамен — одна поправка, когда-нибудь потом.",
           fail_text: "Доноры доели стейки и ушли. Счёт за ужин остался тебе."}
        - {key: council_vote, name: Продавить голосование, ap: 2, min_rank: 3, stat: INT, skill: persuasion, dv: 16, contexts: [bribe], pay: [4000, 7000], xp: 4, fail_xp: 1,
           fail_effects: {heat: 2},
           text: "Поправка о застройке Пасифики. Голосов не хватает двух.",
           win_text: "Поправка прошла. Застройщики благодарят конвертом.",
           fail_text: "Поправку провалили, а журналисты нашли конверт."}
        - {key: campaign, name: Предвыборная кампания, ap: 3, price: 8000, min_rank: 3, stat: COOL, skill: persuasion, dv: 17, contexts: [social], xp: 12, fail_xp: 3, effects: {fame: 3},
           fail_effects: {mood: -6},
           text: "Билборды, дебаты, рукопожатия на рынке. Место в городском совете стоит дорого.",
           win_text: "Рейтинг вырос, имя на каждом экране. До совета один шаг.",
           fail_text: "Соперник вытащил старый компромат. Кампания буксует."}
        - {key: mayor_race, name: Выборы мэра, ap: 4, price: 50000, min_rank: 4, stat: COOL, skill: persuasion, dv: 20, contexts: [social], xp: 20, fail_xp: 4, seat: true, effects: {fame: 5},
           fail_effects: {fame: -2, mood: -10},
           text: "Кресло мэра одно. Если в нём сидит другой игрок, выборы его выбросят.",
           win_text: "Победа. Город просыпается с новым мэром.",
           fail_text: "Проигрыш. Деньги кампании сгорели, а соперник улыбается с билбордов."}
        - {key: city_budget, name: Распил бюджета, ap: 2, min_rank: 5, stat: INT, skill: persuasion, dv: 16, contexts: [bribe], pay: [20000, 40000], xp: 3, fail_xp: 1,
           fail_effects: {heat: 4, fame: -3},
           text: "Бюджет на ремонт дорог Санто-Доминго. Дороги подождут.",
           win_text: "Деньги ушли через три подставные фирмы. Дороги так и не починили.",
           fail_text: "Аудитор оказался честным. Скандал на всех каналах."}
    - key: bd_director
      name: Брейнданс-режиссёр
      text: "Сначала монтируешь чужие записи и снимаешь рекламу «Брепси». Потом своя студия и брейндансы по книгам Озона: их смотрит весь город, а с каждого просмотра тебе капают отчисления."
      ranks:
        - {name: Стажёр монтажной, xp: 0, text: "Чужие записи, ночные смены у монтажного стола. Свой брейнданс снять можно, но дёшево и на коленке."}
        - {name: Оператор брейндансов, xp: 12, min_fame: 3, income: 300, mods: {check.social: 1}, text: "Своя записывающая установка. Дистрибьюторы берут твои записи."}
        - {name: Режиссёр БД, xp: 35, min_fame: 10, income: 1200, mods: {check.social: 1, mood_weekly: 1}, text: "Актёры приходят на пробы к тебе. Премьеры обсуждают в барах."}
        - {name: Своя студия, xp: 80, min_fame: 20, income: 3000, mods: {check.social: 2, mood_weekly: 1}, text: "Студия в Японтауне, свой монтажёр и очередь сценаристов."}
        - {name: Легенда брейнданса, xp: 160, min_fame: 32, income: 7000, mods: {check.social: 3, mood_weekly: 2}, text: "Твоё имя на афише продаёт любой брейнданс. Корпорации заказывают рекламу только у тебя."}
