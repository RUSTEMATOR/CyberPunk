vehicles:                       # owner request: rides (app/services/vehicles.py)
  tune_max: 3
  garage_max: 8                 # owner request 24.10: a new ride parks the old one in the garage (a fleet); sell from there
  item_sell_pct: 40             # a weapon or armor from the bag sold back to a shop: this % of its price
  tune_pct: 35                  # one tuning level = this % of the price x the level
  sell_pct: 50
  stolen_sell_pct: 25
  repair_pct: 60                # full repair (100 damage) = this % of the price
  renumber_cost: 800            # new plates make a stolen ride clean
  stolen_heat_decay: -1
  steal_dv: 14                  # REF + driving
  steal_price_max: 10000        # only street rides can be stolen for yourself
  steal_fail_heat: 2
  steal_jail_chance: 0.25
  steal_jail_weeks: 3
  race_ap: 1
  crash_chance: 0.3
  crash_hp: [4, 14]
  crash_damage: [15, 45]
  wreck_at: 100
  races:
    - {key: district, name: Районная гонка, dv: 13, stake: 200, fame: 1}
    - {key: city, name: Городская гонка, dv: 16, stake: 1000, fame: 2, min_street_cred: 10}
    - {key: night_league, name: Ночная лига, dv: 19, stake: 5000, fame: 3, min_street_cred: 25}

retention:                      # owner request: bring players back (app/services/retention.py)
  step_eddies: 200              # each onboarding step
  final_eddies: 1500            # all onboarding steps done
  final_cred: 2
  starter_pack:                 # owner request 30.10: dropped with the last first step (services/retention.py)
    eddies: 5000
    items: [clown_suit, mom_knife, rubber_dildo]          # armor and weapons, a second copy is not kept
    pistols: {street: sp_street, crime: sp_crime, order: sp_order, tech: sp_tech, stage: sp_stage, wheels: sp_wheels}
  quiet_from: 23                # Kyiv hours without pings in the group
  quiet_to: 10
  ping_ttl_h: 8                 # a ping deletes itself after this
  mail_ping_cooldown_h: 3       # owner report 28.10 «спамит»: one «тебя ждёт письмо» per player in this many hours
  goal_hour: 11                 # the shared goal of the day is announced
  goal_reward: 1200             # eddies to every player who helped (owner report 24.10: was 400)
  goals_per_day: 4              # a done goal opens the next one at once, up to four a day
  goals:
    - {key: weeks, text: "Всем вместе прожить {target} недель", events: [week_lived], target: 10}
    - {key: gigs, text: "Всем вместе выполнить {target} заказов", events: [gig_done], target: 4}
    - {key: deeds, text: "Всем вместе сделать {target} дел из «Досуга» и «Ещё дел»", events: [action_done], target: 8}
    - {key: work, text: "Всем вместе отработать {target} смен", events: [work_hard], target: 6}
    - {key: crime, text: "Всем вместе провернуть {target} преступлений", events: [crime_done], target: 5}
    - {key: events, text: "Всем вместе разобраться с {target} событиями", events: [event_resolved], target: 12}
    - {key: social, text: "Сделать {target} дела с другими игроками («Свои»)", events: [player_gift, player_drink, player_vouch, player_note, player_hookup, player_date, player_duel, player_together, social_time, player_job], target: 3}
    - {key: fights, text: "Всем вместе выиграть {target} боёв", events: [fight_won], target: 4}

backup:                         # PLAN 12: the daily copy of the database (Kyiv time)
  hour: 4                       # after the global tick at 03:00
  keep: 7                       # latest copies kept in data/backups

players:                        # interaction between players (docs/EPIC_PLAYERS.md); all of it goes through the Afterlife mail
  transfer_amounts: [100, 500, 1000, 5000]
  transfer_fee_pct: 10          # the barman keeps this share of a transfer
  transfer_daily_cap: 10000     # eddies one player may send per real day (Kyiv)
  transfer_bond: 1
  drink: {ap: 1, mood: 10, bond: 5}       # one pair once per real day
  vouch: {ap: 1, fixer_rel: 5, bond: 3}   # one pair once per real day; the recipient's district fixer
  note: {max_len: 200, per_day: 5, bond: 1}
  # offers: nothing happens until the other player accepts; one offer of a kind per pair at a time
  hookup: {mood: 15, bond: 8}   # fade to black
  date: {mood: 10, bond: 6}
  child: {bond_need: 20, cost: 500, mood: 10, bond: 10}   # owner request 25.10: a child of two players' characters
  duel: {stakes: [0, 100, 500, 1000], stat: BODY, skill: melee, loser_hp_dice: 1d6, winner_cred: 1, bond: 2}
  offer_ttl_hours: 48
  # a merc from the exchange joins a gig: the checks get max(assist_bonus, merc's stat+skill - yours), a loud fight
  # loses one enemy (the merc takes him), the merc gets a share of the pay and xp by mail
  hire: {shares: [10, 20, 30, 40], assist_bonus: 2, helper_xp: 2, bond: 3}
  proxy:                        # owner request 29.10: a hired player does the employer's gig in his place (services/proxy.py)
    enabled: true
    per_day: 3
    days: [2, 2, 3, 3, 4, 5, 6, 7, 9]   # days of work by gig tier 1..9; the pay is wage a month x days / 30
    fee_min: 100
    retreat_hp_pct: 30
    heal_hp_pct: 45
    max_ticks: 40
    mail_cap: 3
  together:                     # time together: one pair once per real day; the inviter pays; both get the same
    ap: 1
    bond: 4
    train: {cost: 100, mood: 3, xp: 3}   # the inviter picks the skill, both train it
    walk: {cost: 0, mood: 8}
    ride: {cost: 0, mood: 6, xp: 2}      # driving
