hariton:                        # owner request 25.10: the event of the week with the cat Hariton (app/services/hariton.py)
  hour: 12
  min_bet: 100
  max_bet: 50000
  presets: [500, 2000, 10000, 50000]
  recent: 10
  questions:
    - key: why_sad
      text: "Нажмёт ли Харитон на этой неделе кнопку «Почему я грустный?» больше трёх раз?"
      p_yes: 0.6
      yes_text: "Четыре раза подряд, в три часа ночи. Хозяйка проснулась, кнопка нет."
      no_text: "Всего дважды. Видимо, неделя выдалась не такой уж грустной."
    - key: why_cat
      text: "Спросит ли Харитон «Почему я котик?» раньше, чем попросит еды?"
      p_yes: 0.35
      yes_text: "Философия победила голод. Миска стояла пустой целых сорок секунд."
      no_text: "Сначала «есть», потом «есть», потом снова «есть». Вопрос бытия подождёт."
    - key: neon
      text: "Сядет ли Харитон хотя бы раз на подоконник, чтобы смотреть на неон Найт-Сити?"
      p_yes: 0.7
      yes_text: "Сидел до утра, глядя на рекламу Арасаки. Взгляд был тяжёлый."
      no_text: "Шторы задёрнуты, неон не интересен. Диван интереснее."
    - key: new_button
      text: "Выучит ли Харитон новую кнопку за неделю?"
      p_yes: 0.4
      yes_text: "Новая кнопка — «Зачем». Теперь вопросы стали ещё тяжелее."
      no_text: "Новую кнопку Харитон молча сдвинул лапой под диван."
    - key: smile
      text: "Улыбнётся ли Харитон на камеру хотя бы раз?"
      p_yes: 0.15
      yes_text: "Кадр есть. Один. Сеть обсуждает его третий день."
      no_text: "Мордочка та же. Угрюмость — это не настроение, это порода."
    - key: hundred_k
      text: "Наберёт ли новое видео с Харитоном больше миллиона просмотров?"
      p_yes: 0.55
      yes_text: "Миллион за ночь. В комментариях все спрашивают, почему грустные они."
      no_text: "Девятьсот тысяч. Харитону всё равно, он не смотрит статистику."
    - key: box
      text: "Займёт ли Харитон коробку от нового импланта хозяйки?"
      p_yes: 0.75
      yes_text: "Коробка от кибердеки теперь его. Деку положили на полку."
      no_text: "Коробка слишком мала. Харитон посмотрел на неё с осуждением."
    - key: three_words
      text: "Сложит ли Харитон фразу из трёх кнопок подряд?"
      p_yes: 0.45
      yes_text: "«Я. Котик. Почему». Чат молчал минуту."
      no_text: "Только «почему». Остальное слишком очевидно."
    - key: rain
      text: "Будет ли Харитон смотреть на кислотный дождь дольше часа?"
      p_yes: 0.5
      yes_text: "Час и двадцать минут. Потом нажал «грустный» и ушёл спать."
      no_text: "Пять минут — и под одеяло. Дождь его не впечатлил."
    - key: bark
      text: "Нажмёт ли Харитон кнопку «Гулять», хотя гулять не любит?"
      p_yes: 0.3
      yes_text: "Нажал, дошёл до двери, нажал «почему» и вернулся."
      no_text: "Кнопка «Гулять» покрылась пылью. Как и задумано."
    - key: guest
      text: "Позволит ли Харитон гостю себя погладить?"
      p_yes: 0.4
      yes_text: "Позволил ровно один раз. Гость до сих пор рассказывает об этом в баре."
      no_text: "Посмотрел так, что гость сам ушёл. Без единого звука."
    - key: midnight
      text: "Начнёт ли Харитон разговор с кнопками после полуночи хотя бы трижды?"
      p_yes: 0.65
      yes_text: "Ночные монологи стали традицией. Соседи уже записывают."
      no_text: "Всю неделю спал как обычный кот. Подозрительно спокойно."
    - key: mirror
      text: "Задаст ли Харитон кнопками вопрос своему отражению?"
      p_yes: 0.35
      yes_text: "«Почему я котик?» — спросил он у зеркала. Зеркало промолчало."
      no_text: "Отражение было проигнорировано. Харитон выше этого."
    - key: drone
      text: "Попытается ли Харитон поймать дрон доставки за окном?"
      p_yes: 0.5
      yes_text: "Лапа по стеклу, дрон в панике. Заказ доставили на этаж ниже."
      no_text: "Дроны летали мимо. Харитон не снизошёл."
    - key: fan_mail
      text: "Пришлёт ли кто-то из Найт-Сити Харитону подарок на этой неделе?"
      p_yes: 0.6
      yes_text: "Пришла посылка: мягкая кнопка «Ты хороший». Харитон её не нажимает. Пока."
      no_text: "Почтовый ящик пуст. Харитон и не ждал."
    - key: sleep_button
      text: "Уснёт ли Харитон прямо на звуковых кнопках?"
      p_yes: 0.55
      yes_text: "Всю ночь квартира слушала «почему-почему-почему» в такт его дыханию."
      no_text: "Спал рядом, аккуратно. Кнопки для разговоров, а не для сна."

