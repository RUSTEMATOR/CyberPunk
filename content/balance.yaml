  max_rounds: 8               # 1 round = 1 tick, about 3 seconds
  enemy_hp_base: 12           # hp of ONE enemy = 12 + 3 * danger (flat curve: the armor and the packs carry the difficulty)
  enemy_hp_per_danger: 3
  hit_dv_base: 11             # hit dv = 11 + 2 * danger
  hit_dv_per_danger: 2
  enemy_attack_base: 8        # enemy attack = 8 + 2 * danger + d10
  enemy_attack_per_danger: 2
  player_defense_base: 10     # defense = 10 + REF (+cover_bonus)
  cover_bonus: 2
  flee_dv_base: 6             # flee dv = 6 + 2 * danger (+ faction flee_mod); a healthy starter gets away from danger 1-2 in 2 of 3 tries
  flee_dv_per_danger: 2
  unarmed_damage: 1d6
  enemy_damage_by_danger: {1: 2d6, 2: 3d6, 3: 3d6, 4: 3d6, 5: 3d6+2}
  enemy_count_by_danger: {1: 1d2, 2: 1d2+1, 3: 1d3+1, 4: 1d3+2, 5: 1d2+3}
  morale_break_fraction: 0.5
  morale_flee_chance: 0.3
  surrender_gang_eddies_pct: 0.5
  surrender_gang_hp_dice: 1d6
  armor_effect_pct: 0.4       # armor values are RED-like (7-15): this share of them is taken off a hit (balance pass: armor is the main gear lever)
  min_damage: 1               # a hit that got through always does at least this much
  close_range_ticks: 3        # close_range_only weapons (shotgun) deal full damage in the first ticks ...
  far_range_damage_pct: 0.5   # ... and this share of it afterwards
  nonlethal_cyberware: [gorilla_arms]   # melee weapons of these implants knock out instead of killing
  win_xp: 1                   # skill xp for the skill used most in a won fight
  shot_per_tick: 1            # implant shots (rockets) per tick
  faction_rep:                # standing with a faction (-50..50) after a fight or an exit
    kill: -2                  # per enemy killed
    takedown: -1              # per enemy knocked out
    fight_floor: -8           # the loss of one fight stops here
    bribe_ok: 2
    talk_ok: 2
    betray: -10               # extra loss for fighting a faction that was at peace with you
    truce_weeks: 4            # weeks a bribe or a talk counts as a truce

