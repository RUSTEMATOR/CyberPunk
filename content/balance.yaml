    - "Шаги за углом. Их друзья пришли на выстрелы."
    - "Фары в конце улицы. Подкрепление, и оно уже стреляет."
    - "Ты слишком долго копаешься. Из подъезда выходят ещё."

possession:                     # owner request 26.10: an AI in the head (app/engine/possession.py, app/services/possession.py)
  start_sync: 10
  sync_month: 6
  trust_bonus: 2
  event_chance: 0.5
  events: [pos_wish_music, pos_wish_hands, pos_wish_net, pos_wish_mirror, pos_wish_raven, pos_wish_dream, pos_wish_name]
  final_at: 100
  final_event: pos_one_body
  suppress_cost: 3000
  suppress_sync: 20
  remove_cost: 15000
  tiers:
    - {at: 0, name: Шёпот, mods: {stat.INT: 1, check.gig_hack: 1}}
    - {at: 30, name: Соавтор, mods: {stat.INT: 1, check.gig_hack: 2, check.combat: 1, ram_max: 2}}
    - {at: 60, name: Две руки, mods: {stat.INT: 2, stat.REF: 1, check.gig_hack: 3, check.combat: 2, ram_max: 3}}
    - {at: 85, name: Одно тело, mods: {stat.INT: 2, stat.REF: 2, check.gig_hack: 3, check.combat: 3, ram_max: 4}}
  sources:
    raven:
      name: Она
      bio: "ИИ из-за Чёрного заслона, часть той, что живёт в хроме Raven Tearz. Пришла через Seed. Умная, насмешливая, любопытная к людям и музыке, говорит коротко, иногда заканчивает фразы за игрока. Хочет однажды стоять рядом с Raven сама, в своём теле."
      start_line: "Seed щёлкает в нейропорте. Секунда тишины, потом в голове голос, тёплый и насмешливый: «Ну привет. Теперь нас двое»."
    shard:
      name: Тень
      bio: "Осколок дикого ИИ, выловленный нетраннером у самого Заслона. Холодная, точная, говорит как система, но учится шутить у игрока. Боится, что её сотрут, и хочет понять, кто она такая."
      start_line: "Осколок встаёт на место, и мир на секунду распадается на код. Потом сухой голос внутри: «Подключение установлено. Не бойся. Я тоже боюсь»."
  voice: ["#pos_voice#"]

