        - {key: edit_clip, name: Монтаж чужой записи, ap: 1, min_rank: 1, stat: TECH, skill: tech, dv: 12, pay: [200, 500], xp: 2,
           fail_effects: {mood: -3},
           text: "Мутный продюсер из Кабуки просит смонтировать боевик. Не спрашивай, откуда у него боевик.",
           win_text: "Склейки чистые, эмоции на месте. Продюсер платит и обещает ещё.",
           fail_text: "Ты путаешь дорожки, и в боевике появляется чужая свадьба. Продюсер не платит."}
