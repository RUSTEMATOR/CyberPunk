dialogs:                        # owner request 26.10: outcomes of NPC talks, judged every 3 hours by a scheduled Claude Code task (app/services/dialogs.py)
  enabled: true
  idle_min: 20
  min_chars: 12
  keep_days: 7
  menu_size: 12
  max_per_file: 60
  summary_max: 600
  rules:
    - "Ты решаешь, к чему на деле привёл каждый разговор игрока с персонажем мира Найт-Сити. Исход должен вытекать из того, что сказано: обещания, просьбы, угрозы, договорённости, ложь, откровенность."
    - "Обещал помочь — помогает (деньги, наводка, навык, репутация у фракции). Игрок нагрубил или угрожал — отношения хуже, бывает розыск или потеря настроения. Пустой разговор — nothing: true."
    - "Награда соразмерна: обычный разговор даёт мало, серьёзная договорённость больше. Учитывай отношение (relation), кто собеседник (bio), положение персонажа."
    - "summary пиши игроку на «ты», живо и конкретно, 1-3 предложения, без чисел, которых нет в effects, без указания пола игрока."
    - "event бери только из menu этого персонажа и только если разговор прямо туда ведёт."
    - "Не выдумывай механик, которых нет в формате. Если для честного исхода не хватает механики, напиши об этом в notes."
    - "Кроме разговоров (kind: talk) в dialogs есть записи kind: deeds: что персонаж делал в городе за один заход в игру, список deeds (время, what — что сделано, data — данные). У каждого дела уже был свой исход по механике: не повторяй награду и наказание."
    - "Для deeds ты решаешь, что из этих дел вышло потом: свидетели, слухи, месть, благодарность, интерес банды или корпо, долг, новая дверь (event из menu). Связывай дела между собой: кого обидел, кому помог, где засветился."
    - "Рутина (учёба, работа, покупки, обычные события без риска) — nothing: true. Исход нужен для заметного: преступления, убийства, драки, нападения на игроков, дела с людьми города, рискованный выбор в событиях, крупные траты, импланты. Один исход на запись deeds, summary про конкретные дела из списка, relation и memory для deeds не пиши."
  deeds: true
  deeds_idle_min: 60
  deeds_min: 2
  deeds_max: 40
  bot_judge: true                # owner request 27.10 «не scheduled Claude»: the bot judges with Claude itself (docs/PLAN_SCENARIST_BOT.md)
  judge_per_run: 4
  judge_tries: 3
  file_dump: false              # the pending.json of the old scheduled task
  deeds_skip: [week_lived, loud, canon_reached, character_created, heir, death, death_glitch, borg, legend, maxtac_hunt,
               wanted, cyberpsychosis, psycho_hunt, zero_hp, vanished]
  limits:
    eddies: [-5000, 15000]
    mood: [-8, 8]
    street_cred: [-3, 4]
    heat: [-3, 3]
    humanity: [-4, 4]
    hp: [-10, 10]
    fame: [0, 2]
    skill_xp: [0, 8]
    faction_rep: [-10, 10]
    relation: [-15, 15]

