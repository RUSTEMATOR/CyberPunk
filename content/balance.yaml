      - key: psycho_butcher
        name: Мясник с Джиг-Джиг
        text: "В Уотсоне киберпсих с мономолекулярными лезвиями режет всё, что движется. МаксТак застрял на другом конце города. Улица просит помощи у тех, кто умеет держать оружие."
        weak: shoot
        win_text: "Мясник падает посреди улицы, лезвия ещё дёргаются. МаксТак приезжает к шапочному разбору и забирает тело."
        escape_text: "Мясник уходит в канализацию, оставив за собой кровавый след. Его ещё увидят."
      - key: militech_walker
        name: Сбежавший шагоход Militech
        text: "Военный шагоход Militech сорвался с испытаний и бродит по Санто-Доминго, расстреливая машины. Корпорация молчит, NCPD боится подходить."
        weak: hack
        win_text: "Шагоход оседает на колени с выжженным процессором. Militech присылает эвакуатор и делает вид, что ничего не было."
        escape_text: "Militech всё-таки перехватывает управление и уводит шагоход. Награду получат другие."
      - key: scav_nest
        name: Логово мусорщиков
        text: "Под заброшенной клиникой нашли логово мусорщиков: десятки ванн со льдом, пленники, охрана в масках. Нужны все, кто готов спуститься вниз."
        weak: melee
        win_text: "Последний мусорщик сдаётся. Пленников выводят на свет, кто-то из них плачет. Город на одну яму чище."
        escape_text: "Мусорщики сворачивают логово за ночь и уходят. Ванны остаются пустыми."
      - key: drone_swarm
        name: Рой дронов-изгоев
        text: "Над Сити-центром завис рой взломанных дронов. Они сбивают провода, бьют стёкла и гоняют людей по улицам. Кто-то управляет ими из сети."
        weak: hack
        win_text: "Ты и другие находите узел управления, и рой осыпается на асфальт дождём пластика."
        escape_text: "Рой поднимается выше и улетает в сторону Пустошей. Где он появится снова, никто не знает."
      - key: rogue_ai
        name: Рой ИИ из-за Заслона
        text: "Экраны по всему городу показывают одно лицо. Дроны, турели и чужие импланты слушаются его. Где-то в сети прячется ядро: найдите и сотрите."
        weak: hack
        win_text: "Ядро стёрто. Экраны гаснут один за другим, дроны падают с неба. В сети становится тихо."
        escape_text: "Ядро уходит глубже в сеть. ИИ стал сильнее и запомнил каждого, кто бил."
      - key: adam_smasher
        name: Адам Смэшер
        text: "Главный пёс «Арасаки» вышел в город. Полностью стальной, с пушкой вместо руки, он разносит квартал в поисках кого-то, кто посмел перейти дорогу корпорации. NCPD перекрывает улицы и не подходит. Остановить его могут только те, кому нечего терять."
        weak: hack
        win_text: "Стальное тело валится на асфальт и искрит. Через минуту прилетает ави «Арасаки» и забирает его. Все знают: соберут и пришлют снова. Но сегодня город ваш."
        escape_text: "Смэшер уходит к ави «Арасаки», оставив после себя горящий квартал. Он вернётся. Он всегда возвращается."
      - key: gang_convoy
        name: Бронированный конвой банды
        text: "Бронированный конвой банды прорывается через Хейвуд, вывозя краденый хром. Остановить его — значит остановить половину поставок района."
        weak: shoot
        win_text: "Головная машина горит, остальные бросают груз и уходят пешком. Улица делит трофеи."
        escape_text: "Конвой уходит за город. Груз продадут уже к утру."
