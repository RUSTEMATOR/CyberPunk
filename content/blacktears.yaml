# «Чёрные слёзы» (owner request 26.10, docs/PLAN_BLACKTEARS.md): the brotherhood of hired killers whose voice is
# Raven Tearz. The AI beyond the Blackwall (Люси) whispers names and places, he hands out contracts. The player never
# learns what a contract changes until the consequence comes by letter, 20-120 minutes later.
# Each contract: the abstract order (`text`), an optional check, and four consequences: accept_good / accept_bad /
# refuse_good / refuse_bad, each a `text` (what really happened) and `fx` (apply_effects keys).
# Player text avoids gendered past tense.

intro: "«Чёрные слёзы» не дают объявлений. Есть Raven, есть Люси по ту сторону заслона и есть заказы. Что они меняют, знает только Люси. Ты делаешь или отказываешься. Город решит остальное."

contracts:
  - id: lantern
    text: "«Третий фонарь на Джиг-Джиг-стрит. Встань под ним в полночь, досчитай до ста и уйди. Не оборачивайся»."
    check: {stat: COOL, skill: stealth, dv: 12}
    accept_good:
      text: "Пока ты считаешь под фонарём, патрульный дрон NCPD снимает тебя, а не человека в переулке за спиной. Того человека потом не нашли. Его искали за долги Мальстрёму, а нашли пустую квартиру и записку «спасибо». Мальстрём списал долг, полиция — твоё лицо: «просто прохожий»."
      fx: {street_cred: 1, heat: -1, eddies: 800}
    accept_bad:
      text: "Ты стоишь под фонарём, пока за спиной кого-то уводят в фургон. Камеры видят только тебя. Утром детектив NCPD спрашивает, зачем стоять под фонарём в полночь, и ответ «считать до ста» ему не нравится."
      fx: {heat: 2, mood: -4}
    refuse_good:
      text: "Под третьим фонарём в ту ночь никто не стоит. Человек, который ждал там сигнала, уходит домой живым. Через неделю он находит тебя сам и молча кладёт на стол конверт."
      fx: {eddies: 1200, mood: 3}
    refuse_bad:
      text: "Под фонарём никто не встал, и сигнал так и не прозвучал. Сделку, которую он прикрывал, взяли без прикрытия. Двое умерли, и кто-то в Уотсоне теперь знает твоё имя как имя того, кто не пришёл."
      fx: {street_cred: -1, mood: -5}

  - id: umbrella
    text: "«Оставь зонт у двери бара „Посмертие“. Любой. Главное — раскрытый»."
    accept_good:
      text: "Раскрытый зонт у двери — знак для курьера: «чисто». Курьер вынес из бара чип, за которым охотилась Арасака. Ты так и не узнаешь, что на нём было, но на счёт приходит перевод без подписи."
      fx: {eddies: 1500, "faction_rep:arasaka": -3}
    accept_bad:
      text: "Раскрытый зонт значил «чисто», а чисто не было. Курьера взяли прямо у двери. Камера бара сохранила, кто поставил зонт."
      fx: {heat: 1, "faction_rep:arasaka": -5, mood: -3}
    refuse_good:
      text: "Без зонта курьер решил не выходить. Через час у двери «Посмертия» остановился чёрный фургон, постоял и уехал пустым. Бармен потом говорит коротко: «С меня выпивка»."
      fx: {mood: 4, street_cred: 1}
    refuse_bad:
      text: "Курьер ждал знака до утра и вышел без него. Его нашли в Кабуки. Его последнее сообщение отправлено на твой номер: «где ты?»."
      fx: {mood: -6, heat: 1}

  - id: song
    text: "«Включи в такси песню Life in Tears. Громко. Водитель должен услышать последний куплет»."
    accept_good:
      text: "Водитель такси слушает последний куплет и вдруг сворачивает не туда — к больнице, где его ждёт дочь, которую он не видел три года. Она просила передать спасибо незнакомцу с песней."
      fx: {mood: 6, humanity: 1}
    accept_bad:
      text: "Последний куплет был сигналом. Водитель высадил тебя, развернулся и поехал к человеку, которого не должно было стать к утру. Не стало. Песня теперь звучит иначе."
      fx: {mood: -6, humanity: -1, eddies: 1000}
    refuse_good:
      text: "Такси довезло тебя молча. Водитель так и не услышал сигнал, и тот, кто его ждал, прождал зря. Утром в новостях ничего. Иногда «ничего» — лучшая новость."
      fx: {mood: 2}
    refuse_bad:
      text: "Сигнал не прозвучал, и водитель получил его другим способом: пулей в стекло на светофоре. Ты рядом, и осколки стекла режут руку."
      fx: {hp: -6, mood: -3}

  - id: pigeon
    text: "«На крыше мегабашни H10 есть голубятня. Открой клетку номер семь. Только семь»."
    check: {stat: REF, skill: stealth, dv: 13}
    accept_good:
      text: "В клетке номер семь не было голубя. Был дрон-приёмник Militech, который неделю слушал этаж с фиксером Слёз. Открытая клетка — и дрон улетел к хозяевам с пустой записью. Фиксер жив и помнит, кому обязан."
      fx: {eddies: 2000, street_cred: 1, "faction_rep:militech": -3}
    accept_bad:
      text: "Из седьмой клетки вылетел дрон и сел тебе на плечо. Его хозяева из Militech теперь знают, где ты живёшь."
      fx: {heat: 1, "faction_rep:militech": -6}
    refuse_good:
      text: "Седьмую клетку открыл кто-то другой и получил за это то, что предназначалось тебе: охрана Militech ждала на лестнице."
      fx: {mood: 3}
    refuse_bad:
      text: "Клетка осталась закрытой. Запись, которую слушал дрон, ушла к Militech целиком. Среди голосов на ней есть твой."
      fx: {heat: 1, "faction_rep:militech": -4}

  - id: name
    text: "«Скажи своё имя автомату с лапшой на углу Кабуки. Полное. Он запомнит»."
    accept_good:
      text: "Автомат запомнил. Через него Слёзы оплачивают долги своих людей. Твой долг перед кем-то из Кабуки только что закрыт. О нём даже догадок не было, и уже не придётся."
      fx: {eddies: 900, mood: 4}
    accept_bad:
      text: "Автомат запомнил, а через час его вскрыли нетраннеры Тигриных когтей. Теперь твоё имя в их списке людей Слёз."
      fx: {"faction_rep:tyger_claws": -6, mood: -3}
    refuse_good:
      text: "Твоё имя автомат так и не услышал. Тигриные когти вскрыли его в ту же ночь и нашли там список людей Слёз. Тебя в нём нет."
      fx: {mood: 3, "faction_rep:tyger_claws": 2}
    refuse_bad:
      text: "Автомат ждал имя и не дождался. Слёзы платят тем, кто записан. Твоё место в очереди занял кто-то другой, и долг, который могли закрыть, теперь растёт."
      fx: {eddies: -700}

  - id: knife
    text: "«Купи нож. Самый дешёвый. Выброси его в залив у Пасифики, не разворачивая»."
    accept_good:
      text: "Нож в заливе лёг рядом с другим ножом, тем, которым в Пасифике убили человека Вудуистов. Найди полиция один, нашли бы оба. Нашли твой — новый и чистый. Дело закрыто: «нож не тот». Вудуисты знают, кто его бросил."
      fx: {"faction_rep:voodoo_boys": 5, street_cred: 1}
    accept_bad:
      text: "Ныряльщики NCPD вытащили оба ножа. Чек на твой нашёлся в магазине за углом."
      fx: {heat: 2, mood: -3}
    refuse_good:
      text: "Нож так и остался в магазине. В Пасифике дело закрыли без него: у полиции и так хватило улик против кого надо."
      fx: {mood: 2}
    refuse_bad:
      text: "В заливе нашли один нож. Его хозяина взяли. Он назвал тех, с кем пил в ту ночь. Твоё имя там есть."
      fx: {heat: 1, street_cred: -1}

  - id: elevator
    text: "«В корпоративном центре сядь в лифт и нажми все кнопки с 30 по 40. Выйди на первом этаже»."
    check: {stat: COOL, skill: persuasion, dv: 12}
    accept_good:
      text: "Лифт остановился на каждом этаже, и на каждом этаже кто-то ждал не тот лифт. На тридцать седьмом не дождались важного человека Арасаки: он поднялся пешком и опоздал на встречу, на которой его должны были арестовать. В благодарность он платит тому, кто нажал кнопки."
      fx: {eddies: 2500, "faction_rep:arasaka": 3}
    accept_bad:
      text: "Охрана центра смотрит запись: кто-то катался по этажам с тридцатого по сороковой ровно в ту минуту, когда пропал сервер. Кто-то с твоим лицом."
      fx: {heat: 2, "faction_rep:arasaka": -4}
    refuse_good:
      text: "Лифт ходил как обычно. Встреча на тридцать седьмом прошла по плану. Ты ни при чём, и это лучшее место в этом городе."
      fx: {mood: 2}
    refuse_bad:
      text: "Без задержки лифта человек на тридцать седьмом успел. Его арестовали прямо в переговорной. У него в телефоне был номер посредника Слёз, и ему теперь нужно кого-то сдать."
      fx: {heat: 1, mood: -3}

  - id: flowers
    text: "«Отнеси белые цветы на кладбище Пасифики. Положи на любую могилу без имени»."
    accept_good:
      text: "Белые цветы на безымянной могиле — так Слёзы говорят своим: «долг уплачен». Человек, который неделю ждал этого знака, перестал прятаться. Он оставляет тебе свой старый ствол и уезжает из города."
      fx: {mood: 5, humanity: 1, street_cred: 1}
    accept_bad:
      text: "Белые цветы значили «найден». Под безымянной плитой лежал тот, кого искали не только Слёзы. Теперь ищут и того, кто принёс цветы."
      fx: {heat: 1, mood: -4}
    refuse_good:
      text: "Цветы никто не принёс. Человек, который ждал знака «найден», решил, что ошибся, и ушёл. Тот, за кем он охотился, прожил ещё одну ночь и успел уехать."
      fx: {humanity: 1, mood: 3}
    refuse_bad:
      text: "Без цветов человек на кладбище решил, что долг не уплачен, и пришёл за ним сам. Не к тебе. К тем, кто стоял рядом с тобой в баре."
      fx: {mood: -5, street_cred: -1}

  - id: call
    text: "«Позвони на этот номер. Когда ответят — молчи десять секунд и положи трубку»."
    check: {stat: INT, skill: netrunning, dv: 12}
    accept_good:
      text: "Десять секунд тишины — время, которое было нужно Люси, чтобы пройти через чужой лёд. Где-то в Хейвуде у банды Валентинос пропали деньги с трёх счетов. Небольшая часть осела у тебя."
      fx: {eddies: 3000, "faction_rep:valentinos": -3}
    accept_bad:
      text: "Десять секунд хватило, чтобы Люси прошла. И чтобы чужой нетраннер отследил звонок до тебя. Твой терминал сыплет помехами, а в отражении экрана иногда видно женщину, которой нет в комнате."
      fx: {glitches: 1, humanity: -1, mood: -3}
    refuse_good:
      text: "Номер так никто и не набрал. Нетраннер, который ждал на том конце с ловушкой, ушёл ни с чем."
      fx: {mood: 2}
    refuse_bad:
      text: "Люси прошла другим путём: через твой телефон, раз звонка так и не было. Телефон теперь иногда звонит в три ночи и молчит в ответ."
      fx: {glitches: 1, mood: -4}

  - id: coin
    text: "«Брось монету в фонтан у мэрии. Если выпадет орёл, ты знаешь, что делать. Если решка — тоже»."
    accept_good:
      text: "Монета упала в фонтан, и ты так и не узнаешь, что выпало. Но человек, наблюдавший за фонтаном с той стороны улицы, увидел знак, который ждал. Мэрия на этой неделе подписала то, что должна была. Город стал чуть тише."
      fx: {fame: 1, mood: 3}
    accept_bad:
      text: "Монета ушла под воду. Наблюдатель с той стороны улицы получил знак — не тот, которого ждал. На следующее утро в мэрии одним советником меньше. Камеры фонтана хранят твоё лицо."
      fx: {heat: 2, mood: -5}
    refuse_good:
      text: "Фонтан остался без монеты. Наблюдатель ушёл, не дождавшись знака, и советник в мэрии проснулся живым."
      fx: {humanity: 1, mood: 2}
    refuse_bad:
      text: "Без монеты наблюдатель решил сам. Решил не так, как решила бы Люси. Последствия тебе не видны, но Raven теперь смотрит на тебя дольше обычного."
      fx: {mood: -3}

  - id: stray
    text: "«Накорми кошку у мусорных баков в Кабуки. Чёрную. Она будет ждать в шесть утра»."
    accept_good:
      text: "Кошка ест у тебя с руки, и у неё на ошейнике чип. Чип записал отпечаток. Теперь двери Слёз в Кабуки открываются перед тобой сами, и за одной из них лежит конверт."
      fx: {eddies: 1000, mood: 5}
    accept_bad:
      text: "Кошка ест у тебя с руки. Чип на её ошейнике принадлежит не Слёзам, а Тигриным когтям: они так проверяют, кто кормит их кошек. Теперь проверяют тебя."
      fx: {"faction_rep:tyger_claws": -4, mood: -2}
    refuse_good:
      text: "Кошка ушла голодной. Утром её ошейник с чипом нашли у мёртвого курьера Тигриных когтей. Кормить её было опасно."
      fx: {mood: 1}
    refuse_bad:
      text: "Кошку никто не накормил, и в шесть утра она пришла не к бакам, а к твоей двери. Ты не знаешь как. На следующий день у двери три кошки. Raven смеётся, когда слышит об этом, и не объясняет."
      fx: {mood: -2, glitches: 1}

  - id: mirror
    text: "«Посмотри в любое зеркало ровно в 3:33 и скажи: „я слышу“. Больше ничего»."
    accept_good:
      text: "В 3:33 зеркало на секунду показывает не тебя. Люси смотрит оттуда и кивает. Утром ты просыпаешься и понимаешь код, который вчера не понимал никто."
      fx: {"skill_xp:netrunning": 6, humanity: -1}
    accept_bad:
      text: "В 3:33 зеркало показывает Люси, и она не уходит. Неделю в отражениях кто-то стоит за плечом. Это просто глюк имплантов. Наверное."
      fx: {glitches: 2, mood: -6, humanity: -2}
    refuse_good:
      text: "В 3:33 ты спишь. Зеркала в ту ночь пусты. Raven говорит потом: «Правильно. Люси нельзя всех сразу»."
      fx: {humanity: 1, mood: 2}
    refuse_bad:
      text: "В 3:33 ты спишь, а Люси всё равно приходит. Без приглашения ей труднее, и злее. Утром на экране телефона одно слово: «невежливо»."
      fx: {glitches: 1, mood: -4}

  - id: package
    text: "«Возьми свёрток у бармена в „Лизи“. Не открывай. Через два часа отдай первому, кто назовёт тебя по имени»."
    check: {stat: COOL, skill: persuasion, dv: 13}
    accept_good:
      text: "Твоё имя назвал старик в Вестбруке. Свёрток был его страховкой: компромат на того, кто хотел его смерти. Старик жив, его враг — нет. Ты ни при чём. Почти. Старик платит щедро."
      fx: {eddies: 3500, street_cred: 2}
    accept_bad:
      text: "Твоё имя первым назвал детектив NCPD. Свёрток был уликой, которую искали неделю."
      fx: {heat: 3, eddies: -500}
    refuse_good:
      text: "Свёрток остался у бармена. Детектив NCPD, который назвал бы твоё имя первым, прождал у «Лизи» до закрытия."
      fx: {mood: 3}
    refuse_bad:
      text: "Свёрток не дошёл до старика из Вестбрука. Его не стало через два дня. Его люди знают, у кого был шанс помочь."
      fx: {street_cred: -2, mood: -4}

  - id: silence
    text: "«Сегодня ни с кем не говори о Raven. Ни с кем. Даже если спросят прямо»."
    accept_good:
      text: "Тебя спросили прямо. Трижды. Ты молчишь. Те, кто спрашивал, работали на Нетвотч и искали Люси. Не нашли."
      fx: {street_cred: 1, mood: 3}
    accept_bad:
      text: "Ты молчишь, и это заметили. Агент Нетвотч, который спрашивал, теперь уверен, что ты знаешь больше остальных."
      fx: {heat: 1, glitches: 1}
    refuse_good:
      text: "Ты говоришь о Raven с кем хочешь. Ничего страшного: в этот раз никто не слушал."
      fx: {mood: 1}
    refuse_bad:
      text: "Ты говоришь о Raven в баре, и разговор записан. Нетвотч приходит не к тебе, а к нему. Он уходит живым. Но он помнит."
      fx: {mood: -4, street_cred: -1}
