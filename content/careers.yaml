- key: corpo
  name: "Корпорация"
  description: "Офисная карьера в мегакорпорации: стабильная зарплата и быстрый рост для тех, у кого есть ум и выдержка. Деньги чистые, руки не всегда."
  requirements:
    stats: {INT: 5, COOL: 4}
  promotion_check: {stat: INT, skill: persuasion}
  corps: [arasaka, militech, kang_tao, biotechnica]
  ranks:
    - {name: Стажёр,   salary: 400,  promotion_dv: 13, min_weeks: 12}
    - {name: "Младший специалист", salary: 700,  promotion_dv: 15, min_weeks: 26}
    - {name: Менеджер, salary: 1100, promotion_dv: 17, min_weeks: 52}
    - {name: "Старший менеджер", salary: 1800, promotion_dv: 19, min_weeks: 78}
    - {name: "Директор департамента", salary: 3000, promotion_dv: null, min_weeks: 0}

- key: ncpd
