- key: maxtac
  name: "МаксТак"
  description: "Спецподразделение NCPD по борьбе с киберпсихами. Попадают сюда двумя путями: детективом с серьёзным хромом или пойманным киберпсихом, которого проще посадить на поводок, чем пристрелить. Завербованные служат два года без права уйти."
  # Normal route: NCPD detective or higher plus implants worth 20+ PCh (DESIGN.md 7b).
  # Recruited route (grantable_by_recruitment) skips all of these and starts at rank 1.
  requirements:
    stats: {BODY: 5, REF: 6}
    skills: {firearms: 3}
    from_career: {career: ncpd, min_rank: 3}
    min_humanity_lost: 20
  promotion_check: {stat: REF, skill: firearms}
  corps: [ncpd]
  service_weeks: 104            # contract term for the recruited; leaving earlier is desertion (fugitive_psycho again)
  grantable_by_recruitment: true
  ranks:
    - {name: "Боец по контракту", salary: 1400, promotion_dv: 15, min_weeks: 26}
    - {name: Оперативник,       salary: 2000, promotion_dv: 17, min_weeks: 39}
    - {name: Старший оперативник, salary: 2800, promotion_dv: 19, min_weeks: 52}
    - {name: Командир звена,    salary: 3800, promotion_dv: 21, min_weeks: 78}
    - {name: Командир отряда,   salary: 5000, promotion_dv: null, min_weeks: 0}

- key: nomad
  name: Кочевник
  description: "Жизнь клана за городской чертой: конвои, контрабанда, пыльные бури и семья, которая не бросает своих. Денег немного, зато ты свободен, как ни один горожанин."
  requirements:
    stats: {REF: 4}
    skills: {driving: 1}
  promotion_check: {stat: REF, skill: driving}
  corps: null
  ranks:
    - {name: Приблуда,          salary: 250,  promotion_dv: 13, min_weeks: 10}
    - {name: "Водитель конвоя", salary: 500,  promotion_dv: 15, min_weeks: 24}
    - {name: Разведчик,         salary: 850,  promotion_dv: 17, min_weeks: 48}
    - {name: "Глава семьи",     salary: 1400, promotion_dv: 19, min_weeks: 72}
    - {name: "Вожак клана",     salary: 2400, promotion_dv: null, min_weeks: 0}

- key: night_taxi
  name: Ночное такси
  description: "Жёлтые машины без номеров, ночные смены, вежливые пассажиры доезжают домой. Сюда не нанимаются: сюда попадают с дренажным контуром в крови, и уйти нельзя, пока он там."
  requires_flag: vampire
  bound_flag: vampire
  promotion_check: {stat: COOL, skill: driving}
  corps: null
  ranks:
    - {name: Ночной водитель,   salary: 600,  promotion_dv: 13, min_weeks: 8}
    - {name: Водитель с маршрутом, salary: 1000, promotion_dv: 15, min_weeks: 16}
    - {name: Старший смены,     salary: 1600, promotion_dv: 17, min_weeks: 30}
    - {name: Диспетчер парка,   salary: 2400, promotion_dv: 19, min_weeks: 52}
    - {name: Хозяин таксопарка, salary: 3600, promotion_dv: null, min_weeks: 0}
