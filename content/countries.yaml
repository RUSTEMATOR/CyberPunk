  region: asia
  description: "Ворота «Кан Тао» в мир. Небоскрёбы над водой, рынки краденого хрома, уличные кухни до рассвета. Всё продаётся, всё копируется, всё работает до первой поломки. Город отстроили на руинах: в Четвёртую корпоративную биоатака убила Гонконг за неделю."
  flight: 5500
  visa: 1000
  weekly_cost: 450
  max_heat: 3
  smuggle_price: 9000
  mods: {xp.tech: 10, ripper_discount_pct: 10, check.gig_hack: 1, mood_weekly: 1}
  work:
    name: Сборочный цех «Кан Тао»
    button: Смена в цеху
    stat: TECH
    skill: tech
    dv: 13
    pay: [1000, 1900]
    text_ok: "Конвейер умных пистолетов, бригадир-андроид, общежитие при заводе. Платят исправно."
    text_fail: "Бракованная партия, и виноват, конечно, ты. Штраф из зарплаты."
  deeds:
    - key: hk_market
      name: Рынок краденого хрома
      button: Рынок хрома
      ap: 1
      check: {stat: INT, skill: tech, dv: 14}
      success: {text: "В куче ржавых имплантов ты находишь почти новый корпоративный модуль. Перепродаёшь втрое дороже.", effects: {eddies: 3500, skill_xp:tech: 1}}
      fail: {text: "Модуль оказывается подделкой из пластика. Продавец уже исчез в толпе.", effects: {eddies: -800}}
    - key: hk_dimsum
      name: Димсам на крыше
      button: Димсам · 100
      cost: 100
      ap: 0
      success: {text: "Корзинки с пельменями, чай, вид на залив, где корабли стоят до горизонта. Город шумит внизу.", effects: {mood: 4}}

# ======================================================================== the rest of the planet (owner request 23.10:
# «всю планету, хотя бы по паре представителей»). One work and one or two deeds each; events only for the first six.

# -- the Americas
