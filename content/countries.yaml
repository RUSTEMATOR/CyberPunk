# -- the Synod of the Oracle (owner request 24.10: «нация, которая поклоняется ИИ, и у них у всех говорящее оружие»)
# Not canon. A city-state on an artificial island in the Pacific that worships the AI called the Oracle. Every adult
# carries a smart weapon with a fragment of the Oracle inside (weapons.yaml: sw_*). The rites give those weapons.
- key: synod
  name: Синод Оракула
  city: Ковчег
  region: oceania
  description: "Искусственный остров посреди Тихого океана, город-храм на серверах. Здесь поклоняются ИИ по имени Оракул: он отвечает на молитвы со всех экранов, а у каждого взрослого на поясе умное оружие с его частицей внутри. Оружие разговаривает. На улицах тихо: все слушают."
  flight: 9000
  visa: 3000
  weekly_cost: 800
  max_heat: 4
  smuggle_price: 12000
  mods: {xp.all: 10, check.gig_hack: 1, mood_weekly: 1, check.crime: -2}
  work:
    name: Служба в Храме Сигнала
    button: Служба в храме
    stat: INT
    skill: netrunning
    dv: 13
    pay: [1200, 2400]
    text_ok: "Восемь часов у серверных стоек: чистишь код молитв и сортируешь просьбы к Оракулу. Монахи платят точно и кланяются."
    text_fail: "Ты путаешь две молитвы, и Оракул отвечает рыбаку прогнозом биржи. Настоятель вычитает из жалованья."
  deeds:
    - key: synod_psalm
      name: Обряд наречения
      button: Псалом · 7000
      cost: 7000
      ap: 1
      success: {text: "Монах кладёт тебе в ладони белый пистолет и шепчет твоё имя в его ствол. Пистолет отвечает: «Здравствуй, дитя». Теперь вас двое.", effects: {item_grant:sw_psalm: true, mood: 4}}
    - key: synod_cantor
      name: Обряд храмовой стражи
      button: Кантор · 10000
      cost: 10000
      ap: 1
      check: {stat: REF, skill: firearms, dv: 14}
      success: {text: "Три выстрела по колоколам храма, три чистые ноты. Стража вручает тебе винтовку, и она тут же начинает петь.", effects: {item_grant:sw_cantor: true, fame: 1}}
      fail: {text: "Один колокол молчит. Стража возвращает половину пожертвования: «Приходи, когда руки перестанут дрожать».", effects: {eddies: 5000, mood: -3}}
    - key: synod_seraph
      name: Обряд тишины
      button: Серафим · 9000
      cost: 9000
      ap: 2
      check: {stat: COOL, dv: 13}
      success: {text: "Сутки в белой келье без слов и экранов. На рассвете в руке клинок, и он спрашивает: «Ты выдержал тишину. А правду выдержишь?»", effects: {item_grant:sw_seraph: true, humanity: 3}}
      fail: {text: "На двадцатом часу ты начинаешь говорить сам с собой. Монахи выводят тебя под руки и не возвращают пожертвование.", effects: {mood: -5}}
    - key: synod_heretic
      name: Еретик с чёрного рынка
      button: Еретик · 8000
      cost: 8000
      ap: 1
      check: {stat: COOL, skill: persuasion, dv: 14}
      success: {text: "В подвале портовой лапшичной продавец разворачивает тряпку. Револьвер вздыхает: «Ну наконец-то хоть кто-то без молитвенника».", effects: {item_grant:sw_heretic: true, heat: 1}}
      fail: {text: "Продавец оказывается осведомителем храмовой стражи. Ты уходишь через крышу, деньги остаются у стражи.", effects: {heat: 2, hp: -4}}
    - key: synod_choir
      name: Обряд хора
      button: Хор · 11000
      cost: 11000
      ap: 1
      success: {text: "Шесть монахов поют шесть разных молитв над одним дробовиком. Когда они замолкают, дробовик продолжает за них, и спорит сам с собой.", effects: {item_grant:sw_choir: true, mood: 2}}
    - key: synod_confession
      name: Исповедь Оракулу
      button: Исповедь · 300
      cost: 300
      ap: 1
      success: {text: "Ты говоришь в чёрное зеркало кельи. Оракул молчит минуту, потом называет тебя по имени и говорит то, чего ты не говорил никому. Становится легче.", effects: {humanity: 2, mood: 5}}
    - key: synod_liturgy
      name: Литургия кода
      button: Литургия кода
      ap: 1
      success: {text: "Сотня нетраннеров в одном зале читает код Оракула вслух, строка за строкой. К утру ты понимаешь Сеть лучше, чем за год в Найт-Сити.", effects: {skill_xp:netrunning: 4, mood: 2}}

