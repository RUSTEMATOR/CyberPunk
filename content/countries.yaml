  description: "Холодный, вежливый и очень дорогой сосед. Леса, горы, корпоративные башни у залива и бесплатная медицина для тех, у кого есть паспорт."
  flight: 1500
  visa: 1500
  weekly_cost: 650
  max_heat: 2
  smuggle_price: 8000
  mods: {hp_regen: 2, check.heal: 1, mood_weekly: 1, check.crime: -1}
  work:
    name: Лесозаготовка в Британской Колумбии
    button: Смена на лесоповале
    stat: BODY
    dv: 13
    pay: [1000, 1800]
    text_ok: "Харвестер, бензопила, медведь на опушке. Платят честно, кормят от пуза."
    text_fail: "Ствол падает не туда. Каска спасла, премию — нет."
    fail_effects: {hp: -6}
  deeds:
    - key: ca_hockey
      name: Матч НХЛ
      button: Хоккей · 300
      cost: 300
      ap: 1
      success: {text: "Драка на льду, сирена, орущий стадион. Самые вежливые люди мира превращаются в зверей на три периода.", effects: {mood: 5}}

- key: brazil
  name: Бразилия
  city: Рио-де-Жанейро
  region: america
  description: "Фавелы на холмах, корпоративные анклавы на пляже, карнавал, который не прекращается даже во время корпоративных войн. Самбу здесь танцуют даже рипперы. Бразилия вместе с Аргентиной и Чили правит ОАГ; «СовОйл» качает её нефть, а Амазония вырублена до «Амазонских равнин»."
  flight: 3500
  visa: 500
  weekly_cost: 300
  max_heat: 4
  smuggle_price: 4000
  mods: {mood_weekly: 2, check.social: 1, check.bribe: 1, hp_regen: 1}
  work:
    name: Охрана яхт-клуба в Копакабане
    button: Охрана яхт-клуба
    stat: REF
    skill: firearms
    dv: 14
    pay: [1100, 2100]
    text_ok: "Ночь на пирсе с автоматом, мимо проходят яхты олигархов. Ни одного выстрела, полная оплата."
    text_fail: "Ночью угоняют катер прямо у тебя под носом. Из оплаты вычли половину."
  deeds:
    - key: br_carnival
      name: Карнавал
      button: Карнавал
      ap: 1
      success: {text: "Перья, барабаны, миллион людей на улице. Три ночи без сна, и ты не помнишь, где была твоя рубашка.", effects: {mood: 8, hp: -2}}
    - key: br_capoeira
      name: Капоэйра на пляже
      button: Капоэйра
      ap: 1
      check: {stat: REF, skill: melee, dv: 13}
      success: {text: "Мастер показывает пару движений, и ты повторяешь их на песке под беримбау. Толпа одобрительно кричит.", effects: {skill_xp:melee: 2, mood: 3}}
      fail: {text: "Ты пропускаешь удар ногой, медленный и красивый. Песок на зубах.", effects: {hp: -3}}

- key: argentina
  name: Аргентина
  city: Буэнос-Айрес
  region: america
  description: "Танго в старых кварталах, стейки, инфляция, которая съедает зарплату за неделю, и самые красивые закаты над Ла-Платой. Аргентина — одна из трёх держав, что правят Организацией американских государств."
