# The world beyond Night City (owner request 23.10: «добавь весь мир»). A character can fly there, live there (the
# country's mods work while living there, the weekly cost is paid every press), work and do the local deeds.
# While abroad the Night City gigs and places are closed; business, crew and family run remotely.
# Canon of Cyberpunk: Japan (Arasaka's home, real food for those who can pay), the New United States (Militech,
# Washington), the Free States (Texas), Mexico, the European Economic Community, Hong Kong (Kang Tao's China).
# `flags` set while living there: in_<key> (events of the country use flags_all: [in_<key>]).

- key: japan
  name: Япония
  city: Токио
  region: asia
  description: "Родина «Арасаки». Неоновый Токио, тихие храмы, скоростные поезда. Здесь всё ещё едят настоящий рис и настоящую рыбу, а не синтетику из тюбика. Порядок железный: полиция вежливая, но всё видит. В 2077-м Япония — крупнейшая империя планеты, а «Арасака» правит из Токио политикой, полицией и экономикой. Только что умер Сабуро Арасака, и корпорация делит наследство."
  flight: 6000
  visa: 2000
  weekly_cost: 700
  max_heat: 2
  smuggle_price: 15000
  mods: {hp_regen: 2, mood_weekly: 2, check.crime: -2, heat_decay: 1, xp.all: 5}
  work:
    name: Офис корпорации в Синдзюку
    button: Смена в офисе
    stat: INT
    skill: persuasion
    dv: 14
    pay: [1400, 2600]
    text_ok: "Двенадцать часов за терминалом, поклон начальнику, лапша в автомате. Платят точно в срок."
    text_fail: "В отчёте ошибка, и весь отдел сидит до полуночи. Премию урезали всем."
  deeds:
    - key: jp_onsen
      name: Горячий источник в горах
      button: Онсэн · 600
      cost: 600
      ap: 1
      success: {text: "Пар над водой, снег на соснах, тишина. Впервые за годы ничего не болит.", effects: {hp: 10, mood: 6}}
    - key: jp_sushi
      name: Ужин из настоящей рыбы
      button: Настоящие суши · 400
      cost: 400
      ap: 0
      success: {text: "Старик за стойкой режет тунца, который ещё утром плавал в море. После синтетики Найт-Сити вкус почти невыносимый.", effects: {mood: 5, hp: 2}}
    - key: jp_yakuza
      name: Работа на якудза в Кабукитё
      button: Дело якудза
      ap: 2
      check: {stat: COOL, skill: persuasion, dv: 16}
      success: {text: "Ты передаёшь чемодан в патинко-зале, не задавая вопросов. Оябун лично кивает тебе.", effects: {eddies: 5000, street_cred: 2}}
      fail: {text: "Чемодан оказывается не тот. Тебе вежливо, без лишнего шума, ломают два пальца.", effects: {hp: -12, heat: 2}}

- key: nusa
  name: Новые Соединённые Штаты
  city: Вашингтон
  region: america
  description: "Что осталось от старой Америки, собранное заново под флагом «Милитеха». Блокпосты, патриотические плакаты, армейские контракты. Здесь любят дисциплину и не любят вопросы. После Войны за объединение 2069–2070 годов президент Розалинд Майерс собирает страну заново; «Милитех» национализирован, а Свободные штаты не забыли войну."
  flight: 3000
  visa: 1500
  weekly_cost: 500
  max_heat: 1
  smuggle_price: 12000
  mods: {check.combat: 1, check.career: 1, check.social: -1, mood_weekly: -1}
  work:
    name: Контракт «Милитеха»
    button: Армейский контракт
    stat: REF
    skill: firearms
    dv: 15
    pay: [1800, 3200]
    text_ok: "Месяц охраны конвоев на границе со Свободными штатами. Скучно, жарко, хорошо платят."
    text_fail: "Засада на конвой. Контракт выплатили частично, а шрам — полностью."
    fail_effects: {hp: -8}
  deeds:
    - key: us_capitol
      name: Экскурсия по Капитолию
      button: Капитолий
      ap: 1
      success: {text: "Мраморные залы, флаги, охрана в экзоскелетах. Гид рассказывает о величии нации. Ты считаешь турели.", effects: {mood: 2, status: 1}}
    - key: us_lobby
      name: Пролоббировать закон
      button: Лоббизм · 5000
      cost: 5000
      ap: 1
      check: {stat: COOL, skill: persuasion, dv: 17}
      success: {text: "Сенатор голосует как надо. Через месяц поправка приносит твоему бизнесу заказ от армии.", effects: {eddies: 14000, status: 2}}
      fail: {text: "Сенатор берёт деньги и голосует против. В Вашингтоне так тоже бывает.", effects: {mood: -4}}

- key: texas
  name: Свободный штат Техас
  city: Хьюстон
  region: america
  description: "Свободный штат, который не подписался под новыми Штатами. Нефтяные вышки, ранчо, кочевые кланы и оружие у каждого второго. Закон здесь — шериф и то, что у тебя в кобуре. Техас так и не подписал договор после Войны за объединение. Вашингтон бомбит аэропорты Эль-Пасо и Веллингтона, букмекеры дают три к одному на пограничную войну."
  flight: 1500
  visa: 0
  weekly_cost: 300
  max_heat: 4
  smuggle_price: 4000
  mods: {skill.driving: 1, check.escape: 1, check.gig_loud: 1, hp_regen: 1}
  work:
    name: Нефтяная вышка в Пермском бассейне
    button: Смена на вышке
    stat: BODY
    dv: 13
    pay: [900, 1700]
    text_ok: "Две недели на вышке, мазут под ногтями, вечером пиво с бригадой. Деньги честные."
    text_fail: "Трубу сорвало под давлением. Неделя в больнице, а бригадир говорит, что сам виноват."
    fail_effects: {hp: -10}
  deeds:
    - key: tx_rodeo
      name: Механическое родео
      button: Родео
      ap: 1
      check: {stat: REF, dv: 13}
      success: {text: "Ты держишься на кибербыке все восемь секунд. Бар взрывается криком, приз — тысяча и ковбойская шляпа.", effects: {eddies: 1000, mood: 5, fame: 1}}
      fail: {text: "Кибербык сбрасывает тебя на третьей секунде прямо в опилки. Бар аплодирует всё равно.", effects: {hp: -4, mood: 2}}
    - key: tx_bbq
      name: Техасское барбекю
      button: Барбекю · 150
      cost: 150
      ap: 0
      success: {text: "Брискет коптился шестнадцать часов. Говядина настоящая, с ранчо в сорока милях отсюда.", effects: {mood: 4, hp: 3}}

- key: mexico
  name: Мексика
  city: Мехико
  region: america
  description: "Огромный город на дне высохшего озера. Картели, корпоративные анклавы и самые громкие праздники в мире. Здесь дёшево, шумно и все — родня. Самая нестабильная страна Америки: генералы, картели и оружие «Милитеха», которое продают всем сторонам."
  flight: 1200
  visa: 0
  weekly_cost: 200
  max_heat: 4
  smuggle_price: 3000
  mods: {mood_weekly: 2, check.social: 1, check.bribe: 2}
  work:
    name: Курьер картеля
    button: Курьер картеля
    stat: COOL
    skill: driving
    dv: 14
    pay: [1000, 2200]
    text_ok: "Посылка доезжает до Тихуаны без единого вопроса. Люди в шляпах платят наличными."
    text_fail: "На трассе федералы. Посылку пришлось выбросить в кювет, и теперь картель считает долг за тобой."
    fail_effects: {heat: 2, mood: -3}
  deeds:
    - key: mx_dead
      name: День мёртвых
      button: День мёртвых
      ap: 1
      success: {text: "Улицы в бархатцах и свечах, раскрашенные черепа, музыка до утра. Ты ставишь на алтарь фото тех, кого потерял в Найт-Сити.", effects: {mood: 6, humanity: 2}}
    - key: mx_lucha
      name: Луча либре
      button: Выйти на ринг
      ap: 1
      check: {stat: BODY, skill: melee, dv: 14}
      success: {text: "В маске и плаще ты делаешь прыжок с канатов, и арена ревёт. Промоутер предлагает контракт.", effects: {eddies: 1500, fame: 2, mood: 4}}
      fail: {text: "Соперник ловит тебя в воздухе и бросает на настил. Маска цела. Ты — нет.", effects: {hp: -8, mood: 1}}

- key: europe
  name: Франция
  city: Париж
  region: europe
  description: "Европейское экономическое сообщество: старые камни, новые банки, бесплатные клиники для своих. Здесь медленно, дорого и спокойно. Корпорации ведут себя прилично — на людях. Сердце ЕЭС: евродоллар, ЕвроБанк, Совет в Брюсселе, где голоса раздают по богатству, и Европейское космическое агентство, которое держит Лунные города."
  flight: 5000
  visa: 2500
  weekly_cost: 800
  max_heat: 2
  smuggle_price: 14000
  mods: {hp_regen: 2, check.heal: 2, check.social: 1, mood_weekly: 1}
  work:
    name: Мастерская хрома в Берлине
    button: Работа в мастерской
    stat: TECH
    skill: tech
    dv: 14
    pay: [1300, 2400]
    text_ok: "Ты чинишь импланты по европейским стандартам: перчатки, протокол, гарантия. Скучно и очень надёжно."
    text_fail: "Клиент подаёт жалобу в профсоюз. Разбирательство на три недели, зарплата на паузе."
  deeds:
    - key: eu_louvre
      name: Лувр
      button: Лувр
      cost: 200
      ap: 1
      success: {text: "Ты стоишь перед картиной, которой шестьсот лет. Её пережили все войны. Внутри что-то тихо встаёт на место.", effects: {mood: 5, humanity: 2}}
    - key: eu_clinic
      name: Европейская клиника
      button: Клиника · 3000
      cost: 3000
      ap: 1
      success: {text: "Полное обследование, честный риппер, никаких скрытых платежей. Тело как новое.", effects: {hp: 30, mood: 3}}
    - key: eu_bank
      name: Счёт в ЕвроБанке
      button: Вклад · 10000
      cost: 10000
      ap: 0
      success:
        text: "Вклад под скучные, но надёжные европейские проценты. Деньги вернутся через полгода."
        effects:
          later:
            - weeks: 26
              chance: 1.0
              effects: {eddies: 11500}
              text: "ЕвроБанк возвращает вклад с процентами: 11 500. Скучно и надёжно."
              hint: "вклад в ЕвроБанке"

- key: hongkong
  name: Гонконг
