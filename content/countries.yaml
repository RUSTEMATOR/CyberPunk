  city: Богота
  region: america
  description: "Горы, кофе, вечная весна и картели, которые давно стали корпорациями. Здесь лучший кофе мира, и его до сих пор собирают руками. Колумбия выгнала американцев во Второй центральноамериканской войне 2003–2010 годов; в горах до сих пор лежат их невзорвавшиеся дроны."
  flight: 2500
  visa: 0
