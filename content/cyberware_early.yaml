# Early crude implants (2013 and later). Schema: app/content/schemas.py (Cyberware). Guide: docs/CONTENT_GUIDE.md.
# Every record is a rougher, pricier twin of a later model and leaves the catalog the year before that model arrives
# (available_until = twin's available_from - 1). Later models: kiroshi_optics, gorilla_arms, mantis_blades, cyberdeck_paraline,
# reflex_tuner, smartlink_gun, pain_editor, reinforced_skeleton (2030), memory_module (2045), dust_filter, pheromone_gland,
# immune_booster (bioware, 2016). Price and humanity here are base values; the early_chrome era multiplies both again.

