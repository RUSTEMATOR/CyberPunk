# Regeneration chrome (owner request 24.10): wounds close fast, but the body burns: food costs several times more
# (food_x: extra portions) and the character ages faster (age_weeks: extra weeks of age every week). One regeneration core at a time
# (exclusive_group regen_core); the metabolism booster and the nanite colony stack with it.

- key: regen_metabolism
  name: Ускоритель метаболизма
  slot: body
  price: 3200
  humanity_cost: 5
  description: "Насос в брюшной полости гонит питательные вещества к ранам. Царапины затягиваются за ночь, а холодильник пустеет за день."
  tier: street
  category: noncombat
  abilities: [fast_mend]
  build: bioform
  requires: []
  mods: {hp_regen: 3, food_x: 1}

- key: regen_gel
  name: Регенеративный гель-контур
  slot: circulatory
  price: 7500
  humanity_cost: 8
  description: "Вместо части крови течёт розовый гель со стволовыми клетками. Пули выходят из тела сами. Клетки делятся быстрее, и зеркало это замечает."
  tier: mid
  category: noncombat
  abilities: [pink_flow]
  build: medic
  requires: []
  exclusive_group: regen_core
  mods: {hp_regen: 5, food_x: 2, age_weeks: 1}

- key: regen_nanites
  name: Колония наноботов «Ремонт»
  slot: skin
  price: 9000
  humanity_cost: 9
  description: "Миллиарды машин под кожей латают всё, что порвано. Строительный материал они берут из тебя, поэтому ешь ты за троих."
  tier: mid
  category: noncombat
  abilities: [mend]
  build: engineer
  requires: []
  mods: {hp_regen: 6, hp_max: 5, food_x: 2, age_weeks: 1}

- key: regen_hydra
  name: Трансплантат «Гидра»
  slot: spine
  price: 18000
  humanity_cost: 12
  description: "Клетки делятся, как у опухоли, только с пользой. Отрастает почти всё. Седина тоже отрастает, и быстро. Ешь сырое мясо килограммами и всё равно голоден."
  tier: military
  category: noncombat
  abilities: [hydra_regrow]
  build: bioform
  requires: []
  exclusive_group: regen_core
  mods: {hp_regen: 10, hp_max: 10, food_x: 3, age_weeks: 2, mood_weekly: -1}

- key: regen_telomere
  name: Теломерный реактор
  slot: body
  price: 30000
  humanity_cost: 15
  description: "Экспериментальный реактор переписывает теломеры на ходу. Тело почти бессмертно в бою и сгорает за пару лет вне боя. Голод не проходит никогда."
  tier: military
  category: noncombat
  abilities: [young_again]
  build: bioform
  requires: []
  exclusive_group: regen_core
  mods: {hp_regen: 15, hp_max: 15, damage_reduction: 1, food_x: 4, age_weeks: 3, mood_weekly: -2}

