# Corporate and law enemy archetypes: Arasaka, Militech, Kang Tao, NCPD (patrol, detectives, tactical units),
# plus one or two each for Biotechnica, Petrochem, Zetatech and NetWatch.
#
# Periods (inclusive years):
#   crude  2013-2029  first-generation chrome (*_early items that leave the catalog in 2029/2015)
#   early  2013-2044  chrome with no year limit on the shelf (kerenzikov, sandevistan_zetatech, berserk_zetatech)
#   modern 2045-      2045 models (kerenzikov_boosted, sandevistan_dynalar, kiroshi_predator, netdriver)
#   late   2070-      Apogee and power core
# Kang Tao exists from 2050 (corps.yaml), so its single set starts in 2050.
# Every faction has danger 2-5 in each period it exists. Hard references (weapon, armor, cyberware,
# quickhacks) are chosen to exist in all years of the archetype's window.
# Attack and defense follow 8 + 2 * danger and 11 + 2 * danger within +-3.

