# MaxTac (faction ncpd, danger 4-5) and cyberpsychos (faction cyberpsycho).
# Schema: app/content/schemas.py (Enemy). Guide: docs/CONTENT_GUIDE.md, section enemies.yaml.
# Windows: a record's years must sit inside the window of every implant, weapon, armor and quickhack it names
# (strong references). MaxTac is documented from 2010 on cyberpunk.fandom.com, so the squad exists in the 2013 era;
# early_chrome gear ends in 2029, so the early archetypes end there too.
# Danger 4 and 5 for ncpd, danger 3-5 for cyberpsycho: each era has at least one archetype of those levels.
# Cyberpsychos fight brutally: brute AI, explicit hp for the heavy chrome, humanity cost is what they paid.

