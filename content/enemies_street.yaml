# Street factions: iron_sights, bozos, inquisitors, piranhas, scavengers, wraiths, aldecaldos.
# Schema: app/content/schemas.py (Enemy). Guide: docs/CONTENT_GUIDE.md, section enemies.yaml.
#
# Periods (inclusive years, from gangs.yaml windows):
#   early  2013-2029 (piranhas and aldecaldos start later: 2020, 2015): crude first-gen chrome, *_early twins.
#   modern 2030-2044/2049: the 2030 wave (Kiroshi, mantis blades, gorilla arms, Zetatech Sandevistan).
#   late   2045 onward (scavengers, wraiths, aldecaldos only): 2045 wave (Dynalar, NetWatch deck, Monowire, Militech berserk).
# Every period has danger 1, 2, 3. Danger 2 and 3 archetypes are leaders in every period.
# Gear windows: an enemy may use only items that exist in every year of its own window.
#   early   uses windowless items, *_early twins (until 2029) and items from 2016 or earlier (not for 2013-2015 starts).
#   modern  uses items from 2030 or earlier with no end, or with an end of 2044 or later.
#   late    uses items from 2045 or earlier.
# Quickhacks: early has the five street programs; modern adds the 2030 mid programs; late adds the 2045 military ones.
# Inquisitors carry almost no implants: biomonitor only in the early period, bioware (2016) in the modern one.

