# Eras of the world. Schema: app/content/schemas.py (Era). Guide: docs/CONTENT_GUIDE.md.
# Contiguous: each era starts the year after the previous one ends. The last era runs to 2200.
# Year boundaries verified in M1.7a against cyberpunk.fandom.com (Timeline, Fourth_Corporate_War, Time_of_the_Red, Unification_War); see timeline.yaml source_note per event.
# The year ranges here are the source of truth. era.<key> effects sit on the canon events that open an era (datakrash, time_of_red, unification_war, year_2077);
# reconstruction (2050) and free_city (2071) have no event in their first year, so they switch by the table only.
# Boundaries inside a year are approximate: datakrash opens on 3 June 2022, time_of_red on 20 August 2023, year_2077 on April 2077.

- key: early_chrome
  name: Ранний хром
  from_year: 2013
  to_year: 2019
  brief: "2013-2019. Коммерческий хром только вышел на рынок: импланты грубые, дорогие и тяжело бьют по психике. Arasaka, Militech, Biotechnica и мелкие дома делят рынок. В апреле 2013 года Samurai играют у Arasaka Tower, начинается бунт, Альт Каннингем остаётся призраком в Сети. В 2016 году в продаже появляется bioware, в Сети идёт Третья корпоративная война. Найт-Сити растёт, банды мелкие."
  player_text: "Хром только появился на улицах. Он дорогой, грубый и бьёт по психике, но первые, кто рискнул, уже наверху. Чем всё кончится, пока не знает никто."
  chrome_price_mult: 1.5
  chrome_humanity_mult: 1.5
  news_tone: "осторожный, любопытный: новые технологии вызывают восторг и страх"

- key: corporate_wars
  name: Корпоративные войны
  from_year: 2020
  to_year: 2021
  brief: "2020-2021. Канун Четвёртой корпоративной войны. В 2020 году в Найт-Сити Carbon Plague убивает взрослых и оставляет сирот. Tyger's Claw к этому времени держит кусок старого Японтауна на деньги Arasaka. В 2021 году IHAG доведена до банкротства, в ноябре OTEC и CINO сцепились за её активы. По вики война идёт 2021-2025, по основному таймлайну начинается в 2022 и тянется через следующие эпохи."
  player_text: "Корпорации перестали делить рынок и взялись делить людей. Флоты дерутся за океан, а в Джапантауне сбивается стая, которую потом назовут Тигриными когтями."
  chrome_price_mult: 1.3
  chrome_humanity_mult: 1.3
  news_tone: "тревожный, деловой: корпорации говорят о бизнесе, на улицах говорят о трупах"

- key: datakrash
  name: Падение Старой Сети
  from_year: 2022
  to_year: 2022
  brief: "2022. Февральское перемирие OTEC и CINO не касается Arasaka и Militech: 6 марта Arasaka испытывает Soulkiller 2.5 на офицере Militech. 3 июня Рейч Бартмосс погибает при рейде и запускает R.A.B.I.D.S., DataKrash заражает около 78% Сети. С 9 июня война Arasaka и Militech идёт открыто, осенью правительства национализируют их активы."
  player_text: "Сеть рухнула. Не вся, но та, на которой держались банки, больницы и половина города. Старые данные рассыпаются, а корпорации роют себе норы поглубже."
  chrome_price_mult: 1.2
  chrome_humanity_mult: 1.2
  news_tone: "паника, сбои и попытки объяснить, что случилось, пока всё не сгорело"

- key: time_of_red
  name: Время Красного
  from_year: 2023
  to_year: 2049
  brief: "2023-2049. 20 августа 2023 года ядерный заряд разрушает Arasaka Tower и центр Найт-Сити: по Cyberpunk RED погибают сотни тысяч. Небо красное почти два года, красные закаты держатся до конца 2040-х. Кресс национализирует Militech и выгоняет Arasaka, война официально кончается в 2025. Диаспора, Ziggurat и CitiNet с 2030, NetWatch начинает Blackwall в 2044. Время Красного по вики идёт до конца 2040-х."
  player_text: "Небо над Найт-Сити стало красным и не светлеет. Башню Arasaka снесло ядерным взрывом. Выжившие отстраиваются и не спрашивают, кто нажал на кнопку."
  chrome_price_mult: 1.1
  chrome_humanity_mult: 1.1
  news_tone: "мрачный, выжженный: руины, радиация, поиск виноватых и пропавших"

- key: reconstruction
  name: Восстановление
  from_year: 2050
  to_year: 2068
  brief: "2050-2068. Найт-Сити отстраивается поверх руин: мегабашни, новая Corporate Plaza на расчищенной Hot Zone с 2052. 4 июля 2053 года ратифицирована конституция NUSA, Кресс уходит, Уиндэм первый президент. В 2062 году гаитянские беженцы приходят на курортную стройку Пасифики. С января 2065 года президент Розалинд Майерс. В 2067 году после гибели Лиззи Борден образуются Moxes."
  player_text: "Город отстроили поверх руин. Мегабашни тянутся в небо, а внизу уже делят трущобы. Страна снова говорит о единстве, и никто в это не верит."
  chrome_price_mult: 1.0
  chrome_humanity_mult: 1.0
  news_tone: "деловой, с привкусом недоверия: стройки, контракты, новые хозяева районов"

- key: unification_war
  name: Объединительная война
  from_year: 2069
  to_year: 2070
  brief: "2069-2070. В январе 2069 года переизбранная Майерс начинает кампанию против Свободных штатов. 6 июня 2070 разбомблен Сакраменто, 9 июня полковник Хансен отказывается уходить из Пасифики, 12 июня у Del Coronado Bay появляется суперавианосец Arasaka и NUSA отступает. В июне 2070 подписан Договор объединения: Найт-Сити независим, мэр Лусиус Райн, Arasaka возвращается."
  player_text: "НСША пошли войной на Свободные штаты, Сакраменто сровняли с землёй. Найт-Сити уцелел только потому, что к побережью подошёл авианосец Arasaka. За такую помощь ещё придётся платить."
  chrome_price_mult: 1.1
  chrome_humanity_mult: 1.0
  news_tone: "военный, тревожный: колонны, бомбёжки, сводки с фронта без правды"

- key: free_city
  name: Вольный город
  from_year: 2071
  to_year: 2076
  brief: "2071-2076. Найт-Сити живёт как международный вольный город вне законов NUSA и Северной Калифорнии, независимость с июня 2070. Arasaka строит новую башню на месте старой. Пасифика отрезана, там сидят BARGHEST Курта Хансена и бездомные, район позже зовут Догтауном. В 2071 году Valentinos и 6th Street стреляют в Westbrook, в 2072 году Брик Гриффин возглавляет Maelstrom, а Voodoo Boys берут Пасифику. В 2076 году гибнет Дэвид Мартинес."
  player_text: "Найт-Сити больше не принадлежит ни одной стране, поэтому каждый район принадлежит тому, кто успел его взять. Пасифика превратилась в лагерь, и даже днём туда лучше не соваться."
  chrome_price_mult: 0.9
  chrome_humanity_mult: 0.9
  news_tone: "дерзкий, самоуверенный: свобода, которую каждый понимает по-своему"

- key: year_2077
  name: "2077"
  from_year: 2077
  to_year: 2079
  brief: "2077-2079. Игровая эпоха. 1 мая Kujira привозит Сабуро Арасаку, вскоре после налёта на Konpeki Plaza его убивает сын Ёринобу, корпорацию раздирает борьба за власть. Реликвия в центре интриг. Президент NUSA Розалинд Майерс идёт на четвёртый срок, в июне её Space Force One падает в Догтауне. Valentinos и 6th Street воюют, Tyger Claws, около 5500 членов, одна из крупнейших банд города."
  player_text: "Найт-Сити, 2077 год. Корпорации снова хозяйничают в городе, а все, кто чего-то стоит, уже кому-то продались. Здесь начинается твоя история, и закончится она как получится."
  chrome_price_mult: 0.9
  chrome_humanity_mult: 0.8
  news_tone: "злой, циничный, на грани паники: корпорации грызутся, улицы решают сами"

- key: after_canon
  name: "Новые легенды"
  from_year: 2080
  to_year: 2200
  brief: "2080 и далее. Канон заканчивается, Claude пишет историю по сводке прошлого и не спорит с каноном выше. Ориентир: аналитики прогнозировали с вероятностью 74% новую войну NUSA и Свободных штатов к 2080 году. Blackwall по последним упоминаниям канона работает. Крупное событие примерно раз в полгода игрового времени, мелкие новости каждый день."
  player_text: "Старые легенды ушли в прошлое. Дальше историю пишут те, кто ещё жив и помнит, как всё было."
  chrome_price_mult: 0.8
  chrome_humanity_mult: 0.8
  news_tone: "по обстоятельствам: эпоха без канонического тона, держится на последствиях прошлых событий"
