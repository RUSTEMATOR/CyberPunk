# Random weekly events. Schema: app/content/schemas.py (Event). Keys: docs/CONTENT_KEYS.md.

# ---------------------------------------------------------------- street

- id: scav_ambush
  title: Засада Мусорщиков
  category: street
  weight: 3
  conditions:
    districts: [watson, pacifica]
    requires: [has_cyberware]
  faction: scavengers
  text: "В переулке тебя зажимают двое Мусорщиков в масках, у одного шокер. Им нужен твой хром, и вырезать его они готовы прямо здесь."
  choices:
    - label: Драться
      violent: true
      check: {stat: BODY, skill: melee, dv: 15}
      success: {text: "Ты выбиваешь шокер, и он улетает в мусорный бак. Мусорщики убегают, а на районе о тебе начинают говорить.", effects: {street_cred: 1}}
      fail: {text: "Ты пропускаешь удар в рёбра, потом ещё один. Отступать поздно: начинается настоящая драка.", effects: {start_combat: 2}}
    - label: Бежать
      check: {stat: REF, skill: stealth, dv: 13}
      success: {text: "Ты ныряешь в узкий проход между домами, о котором они не знали, и уходишь чисто.", effects: {}}
      fail: {text: "Разряд шокера догоняет тебя в спину. Ты падаешь лицом в лужу, но всё-таки уходишь.", effects: {hp: -6}}
    - label: Откупиться
      check: {stat: COOL, skill: persuasion, dv: 15}
      success: {text: "Мусорщик пересчитывает двести эдди и уходит. Хром остаётся при тебе.", effects: {eddies: -200}}
      fail: {text: "Мусорщик забирает двести, а потом всё равно бьёт тебя шокером под рёбра, на память.", effects: {eddies: -200, hp: -4}}

- id: bar_fight_lizzies
  title: Драка у Лиззи
  category: street
  weight: 2
  conditions:
    districts: [watson]
  text: "В баре у Лиззи двое корпо пристают к барменше, а третий толкает тебя локтем и опрокидывает твой стакан. Ещё минута, и начнётся драка."
  choices:
    - label: Вмешаться
      violent: true
      check: {stat: BODY, skill: melee, dv: 13}
      success: {text: "Один корпо летит головой в бильярдный стол, второй отползает к выходу. Лиззи запомнит, кто за неё вступился.", effects: {street_cred: 2}}
      fail: {text: "Бутылка разбивается о твою бровь. Корпо уходят победителями, а ты сидишь на полу и ждёшь, пока найдут аптечку.", effects: {hp: -5}}
    - label: Заплатить бармену
      check: {stat: COOL, skill: persuasion, dv: 9}
      success: {text: "Бармен берёт полторы сотни, и вышибала выставляет корпо на улицу. Пиво тебе наливают за счёт заведения.", effects: {eddies: -150}}
      fail: {text: "Бармен берёт полторы сотни, но корпо только смеются ему в лицо. Деньги ушли, вечер испорчен.", effects: {eddies: -150, mood: -2}}
    - label: Уйти
      check: {stat: REF, skill: stealth, dv: 9}
      success: {text: "Пока все смотрят на корпо, ты выходишь через кухню. Обошлось без тебя.", effects: {}}
      fail: {text: "У двери тебя замечают, и один из корпо на прощание бьёт тебя в затылок.", effects: {hp: -3, mood: -2}}

- id: tyger_toll
  title: Пошлина Тигриных когтей
  category: street
  weight: 3
  available_from: 2020
  conditions:
    districts: [watson, westbrook]
  text: "Двое из Тигриных когтей перегораживают проход. Говорят, что за проход по их улице теперь надо платить, и как бы невзначай показывают ножи."
  choices:
    - label: Заплатить
      effects: {eddies: -200}
      text: "Ты отсчитываешь двести эдди. Парни вежливо кланяются и пропускают тебя. Вежливость у них дорогая."
    - label: Поговорить
      check: {stat: COOL, skill: persuasion, dv: 15}
      success: {text: "Ты намекаешь, что за тобой стоят люди посерьёзнее. Парни переглядываются и отходят. Ты проходишь бесплатно, и это видят.", effects: {street_cred: 1}}
      fail: {text: "Спорить было ошибкой. Нож полосует тебя по предплечью, и в итоге ты отдаёшь триста вместо двухсот.", effects: {eddies: -300, hp: -3}}
    - label: "Выпустить клинки"
      ability: blades
      effects: {street_cred: 2}
      text: "Щелчок, блеск. Когти переглядываются и вспоминают, что проход сегодня бесплатный."
    - label: "Просто посмотреть"
      ability: menace
      effects: {street_cred: 1}
      text: "Ты поворачиваешься к свету хромом. Они отходят в сторону, не дожидаясь слов."

- id: kabuki_pickpocket
  title: Карманник в Кабуки
  category: street
  weight: 2
  conditions:
    districts: [watson]
  text: "В толпе на рынке Кабуки тебя толкают плечом, и карман вдруг становится лёгким. Худой пацан с татуировкой на шее уходит сквозь толпу с твоей сотней."
  choices:
    - label: Догнать
      check: {stat: REF, skill: stealth, dv: 15}
      success: {text: "Ты ловишь его у стены и выворачиваешь ему карманы. Твоя сотня там, и не только она: всего набирается триста.", effects: {eddies: 300}}
      fail: {text: "Ты поскальзываешься на мокром асфальте, а пацан исчезает в толпе вместе с твоей сотней.", effects: {eddies: -100, hp: -3}}
    - label: Махнуть рукой
      effects: {eddies: -100, mood: -2}
      text: "Сотня ушла вместе с ним. Догонять поздно, и ты идёшь дальше злой."
    - label: "Рывок за ним"
      ability: sprint
      effects: {eddies: 20, street_cred: 1}
      text: "Ты оказываешься перед пацаном раньше, чем он делает третий шаг. Сотня возвращается, и ещё его двадцать сверху."
    - label: "Взять след"
      ability: scent
      effects: {street_cred: 1}
      text: "Запах дешёвого дезодоранта ведёт в подсобку лапшичной. Сотня лежит у него в кармане, пацан отдаёт без споров."

- id: dogtown_box
  title: Коробка для Баргеста
  category: street
  weight: 2
  available_from: 2071
  conditions:
    districts: [dogtown]
  faction: barghest
  text: "Боец Баргеста в маске суёт тебе тяжёлую коробку: надо довезти её до склада за стадионом. Что внутри, лучше не спрашивать."
  choices:
    - label: Отвезти
      check: {stat: REF, skill: stealth, dv: 13}
      success: {text: "Ты довозишь коробку без хвоста. На складе платят наличными и не задают вопросов.", effects: {eddies: 400, street_cred: 1}}
      fail: {text: "У забора тебя перехватывают двое чужих. Коробку ты не отдаёшь, и дело доходит до стрельбы.", effects: {hp: -5, start_combat: 2}}
    - label: Отказаться
      effects: {mood: -1}
      text: "Ты ставишь коробку обратно на землю. Боец не спорит, только кивает, будто так и думал."

- id: heywood_night_race
  title: Ночная гонка в Хейвуде
  category: street
  weight: 2
  available_from: 2037
  conditions:
    districts: [heywood]
  text: "Валентинос устраивают ночную гонку до водонапорной башни. Ставки уже собраны, и в списке гонщиков стоит твоё имя."
  choices:
    - label: Сесть за руль
      bus: [drive]
      check: {stat: REF, skill: driving, dv: 13}
      success: {text: "Ты первым проходишь поворот у башни и забираешь банк. Даже Валентинос одобрительно кивают.", effects: {eddies: 500, street_cred: 1}}
      fail: {text: "У башни машину заносит, и капот врезается в щебень. Ты выбираешься с порезом, а взнос за участие пропал.", effects: {eddies: -200, hp: -6}}
    - label: Сделать ставку
      effects: {eddies: -150}
      text: "Ты ставишь сто пятьдесят на другого гонщика. Он приходит третьим, и твои деньги достаются кому-то ещё."
    - label: "Слиться с машиной"
      ability: rider
      effects: {eddies: 1200, street_cred: 2}
      text: "Машина отвечает раньше мысли. Валентинос впервые проигрывают на своей трассе."

- id: badlands_stash
  title: Схрон в сухом русле
  category: street
  weight: 2
  conditions:
    districts: [badlands]
  faction: wraiths
  text: "В сухом русле под ржавым кузовом лежит брезентовый свёрток. Внутри пистолет, пачка стимов и чей-то паспорт без фото. Хозяин схрона может быть где-то рядом."
  choices:
    - label: Забрать всё
      check: {stat: REF, skill: stealth, dv: 13}
      success: {text: "Ты уносишь свёрток, пока вокруг тихо. В Хейвуде за всё это дают четыреста.", effects: {eddies: 400, "skill_xp:stealth": 1}}
      fail: {text: "Под брезентом растяжка, а из-за кузова выходят двое Рейфов. Разговаривать они не собираются.", effects: {start_combat: 2}}
    - label: Уйти
      check: {stat: REF, skill: stealth, dv: 9}
      success: {text: "Ты отходишь по своим следам и выбираешься из русла. Никто не узнает, что ты здесь был.", effects: {}}
      fail: {text: "Отступая, ты цепляешь ногой растяжку. Осколки секут голень, и из русла ты выбираешься, хромая.", effects: {hp: -3, mood: -1}}

- id: santo_stims
  title: Стимы без маркировки
  category: street
  weight: 2
  conditions:
    districts: [santo_domingo, heywood]
  text: "Уличный торговец шепчет, что у него настоящие стимы из лабораторий Biotechnica. Упаковка вскрыта, зато цена вдвое ниже аптечной."
  choices:
    - label: Купить пачку
      effects: {eddies: -150, mood: 5}
      text: "Ты глотаешь таблетку прямо у тележки. Становится легче, и ты стараешься не думать, из чего она сделана."
    - label: Проверить состав
      check: {stat: TECH, skill: medicine, dv: 13}
      success: {text: "Анализатор показывает чистый состав. Торговец понимает, что ты разбираешься, и отдаёт пачку за пятьдесят.", effects: {eddies: -50, mood: 5}}
      fail: {text: "Твой дешёвый анализатор ничего не находит, и торговец даёт одну таблетку на пробу. Через десять минут тебя скручивает.", effects: {hp: -4, mood: -2}}
    - label: Пройти мимо
      effects: {mood: -1}
      text: "Ты проходишь мимо. Торговец тут же переключается на следующего."
    - label: "Проверить на вкус"
      ability: chem
      effects: {mood: 5}
      text: "Мел и кофеин. Ты называешь торговцу состав, и он отдаёт пачку настоящих из-под прилавка."

- id: watson_fire_rescue
  title: Пожар в Уотсоне
  category: street
  weight: 2
  conditions:
    districts: [watson]
  text: "В жилом блоке горит второй этаж, из окна зовёт на помощь старик. Пожарные не едут: вызов никто не оплатил."
  choices:
    - label: Лезть внутрь
      check: {stat: BODY, dv: 13}
      success: {text: "Ты выводишь старика по задымлённой лестнице. Соседи запомнят, кто не прошёл мимо.", effects: {street_cred: 2, mood: 3}}
      fail: {text: "Обваливается потолок, и балка бьёт тебя по плечу. Старик выбирается сам, а тебя выносят соседи.", effects: {hp: -7}}
    - label: Оплатить вызов
      effects: {eddies: -100}
      text: "Ты платишь сотню за выезд. Машина приезжает через двадцать минут, когда от этажа остаются одни стены. Старика соседи вывели сами."
    - label: Пройти мимо
      effects: {mood: -2}
      text: "Ты отворачиваешься и уходишь. Крик за спиной скоро стихает, а забыть его не получается."
    - label: "Задержать дыхание"
      ability: breath
      effects: {humanity: 2, fame: 1, street_cred: 1}
      text: "Пятнадцать минут без воздуха. Ты проходишь сквозь дым и выносишь старика на руках."
    - label: "Снять из окна"
      ability: fly
      effects: {humanity: 2, fame: 2}
      text: "Ты зависаешь у окна и забираешь старика прямо с подоконника. Внизу кто-то снимает."

- id: pacifica_ghost_resort
  title: Курорт без гостей
  category: street
  weight: 2
  available_from: 2062
  conditions:
    districts: [pacifica]
  faction: voodoo_boys
  text: "Недостроенный курорт на побережье Пасифики завален брошенной техникой. Говорят, Вудуисты прячут там что-то ценное. Охраны не видно, но это ничего не значит."
  choices:
    - label: Обыскать корпус
      check: {stat: REF, skill: stealth, dv: 15}
      success: {text: "Пока часовой дремлет у пустого бассейна, ты находишь в подсобке сейф. Внутри пятьсот эдди наличными.", effects: {eddies: 500}}
      fail: {text: "Срабатывает сигнализация, и из-за бетонных плит выбегают Вудуисты. Бой начинается раньше, чем ты успеваешь достать оружие.", effects: {start_combat: 3}}
    - label: Срезать кабель
      check: {stat: TECH, skill: tech, dv: 9}
      success: {text: "Ты срезаешь медный кабель с обесточенного генератора и сдаёшь его в ломбард за полторы сотни.", effects: {eddies: 150}}
      fail: {text: "Кабель оказывается под напряжением, и тебя отбрасывает к забору.", effects: {hp: -3}}
    - label: Уйти
      check: {stat: REF, skill: stealth, dv: 9}
      success: {text: "Ты тихо уходишь к трассе между бетонными плитами. Тебя никто не заметил.", effects: {}}
      fail: {text: "Часовой у бассейна просыпается и поднимает крик. Ты бежишь к трассе и обдираешь бок о бетон.", effects: {hp: -2, mood: -1}}
    - label: "Пустить дрона"
      ability: drone
      effects: {eddies: 1500}
      text: "Дрон облетает корпус и находит Вудуистов раньше, чем они тебя. Ты забираешь тайник с другой стороны."

- id: braindance_addiction
  title: Тяга к брейндансу
  category: street
  weight: 4
  conditions:
    requires: [is_addicted]
  text: "Третью ночь подряд ты просыпаешься и первым делом тянешься к разъёму. Своя жизнь кажется серой, чужие записи манят. Дилер уже написал: новая партия, первый диск в долг."
  choices:
    - label: Взять в долг
      effects: {debt: 150, mood: 6}
      text: "Диск в слоте, и мир снова яркий. Долг записан на тебя, а тяга стала только сильнее."
    - label: Держаться
      check: {stat: COOL, dv: 15}
      success: {text: "Ты выбрасываешь диски в мусоропровод и сидишь на полу до рассвета. К утру отпускает. Почти.", effects: {mood: -2, humanity: 1}}
      fail: {text: "Через час ты срываешься и покупаешь диски за наличные. К утру нет ни денег, ни сил.", effects: {eddies: -200, mood: -6}}
    - label: Пойти в клинику
      effects: {eddies: -300, mood: 4, humanity: 2}
      text: "Врач в клинике в Кабуки говорит прямо: или ты, или диски. Три часа разговора стоят триста эдди, но дышать становится легче."

# ---------------------------------------------------------------- implants

- id: underground_chrome
  title: Хром из-под полы
  category: implants
  weight: 2
  conditions:
    districts: [watson, westbrook]
    lacks_cyberware: [reinforced_tendons]
  text: "В гараже за прачечной работает риппер без вывески. Сегодня у него усиленные сухожилия для ног: без документов и вдвое дешевле, чем у Виктора Вектора."
  choices:
    - label: Купить
      effects: {eddies: -400, humanity: -3, "cyberware_grant:reinforced_tendons": true}
      text: "Наличные, пластиковый стол, полчаса под скальпелем. Новые сухожилия работают, но ноги ощущаются чужими."
    - label: Торговаться
      check: {stat: COOL, skill: persuasion, dv: 13}
      success: {text: "Риппер сбрасывает цену до двухсот и ставит сухожилия за полчаса. Из гаража ты выходишь пружинящим шагом.", effects: {eddies: -200, humanity: -3, "cyberware_grant:reinforced_tendons": true}}
      fail: {text: "Риппер не любит, когда торгуются. Ты платишь полную цену, сухожилия встают, а небрежный скальпель оставляет тебе порез на плече.", effects: {eddies: -400, humanity: -3, hp: -2, "cyberware_grant:reinforced_tendons": true}}
    - label: Уйти
      effects: {mood: -1}
      text: "Ты выходишь на свет. Риппер кричит вслед, что завтра будет дороже."

- id: scav_bathtub
  title: Ванна со льдом
  category: implants
  weight: 1
  conditions:
    districts: [watson, pacifica]
    requires: [has_cyberware]
  text: "Ты приходишь в себя в ванне со льдом, без телефона и документов. Под рёбрами грубый свежий шов, а на зеркале записка от Мусорщиков: «Ты нам должен»."
  choices:
    - label: Выбраться тихо
      check: {stat: REF, skill: stealth, dv: 15}
      success: {text: "Пока Мусорщики спорят у машины, ты уходишь через пожарный выход. Весь хром на месте.", effects: {}}
      fail: {text: "У выхода тебя ловят. Нож вскрывает шов, и один из твоих имплантов уходит в чужую сумку.", effects: {remove_random_cyberware: true, hp: -4}}
    - label: Заплатить
      effects: {eddies: -500}
      text: "Ты переводишь пятьсот на номер из записки. Через минуту приходит ответ: «Живи». Больше тебя не трогают."
    - label: Вызвать Trauma Team
      effects: {eddies: -200, hp: 3}
      text: "Trauma Team забирает тебя через сорок минут. Шов переделывают как следует, а счёт на двести приходит сразу."

- id: chrome_whispers
  title: Хром шепчет
  category: implants
  weight: 2
  conditions:
    requires: [has_cyberware]
    max_humanity: 60
  text: "Ночью твой хром начинает подстраиваться под пульс. Сначала это похоже на зуд, потом появляется голос, который знает твоё имя."
  choices:
    - label: Отключить импланты
      check: {stat: COOL, dv: 13}
      success: {text: "Ты отключаешь импланты на десять минут и сидишь в темноте. Голос пропадает, в голове становится тихо.", effects: {humanity: 2}}
      fail: {text: "Перезагрузка не помогает. Голос звучит в такт сердцу, и ты засыпаешь с чувством, что тебя кто-то слушает.", effects: {mood: -5, glitches: 1}}
    - label: Напиться
      effects: {eddies: -100, mood: 4}
      text: "Бутылка глушит голос до утра. Утром тихо, и ты стараешься не думать почему."
    - label: Сходить к Виктору
      effects: {eddies: -300, humanity: 1}
      text: "Виктор проверяет прошивку, называет тебя параноиком и всё равно выставляет счёт на триста. Голос больше не возвращается."

- id: ripper_scan
  title: Скан за пятьсот
  category: implants
  weight: 1
  conditions:
    districts: [watson, westbrook]
  text: "Виктор Вектор предлагает проверить, сколько хрома ты ещё выдержишь. Скан стоит пятьсот: дороже, чем у других рипперов, зато Виктор не врёт."
  choices:
    - label: Заплатить
      effects: {eddies: -500, mood: 2, scan_tolerance: true}
      text: "Скан идёт двадцать минут. Ответ честный, и из клиники ты выходишь спокойнее, чем входил."
    - label: Торговаться
      check: {stat: COOL, skill: persuasion, dv: 15}
      success: {text: "Ты уговариваешь Виктора на триста, и он показывает результат без лишних слов.", effects: {eddies: -300, mood: 2, scan_tolerance: true}}
      fail: {text: "Виктор молча делает скан и возвращается из подсобки с результатом и счётом на пятьсот. Торговаться он не будет.", effects: {eddies: -500, mood: -1, scan_tolerance: true}}
    - label: Отказаться
      effects: {mood: -2}
