  text: "Кибердека сама подключается к сети и выводит адрес в Бэдлендсе. Под ним подпись: «Ты следующий»."
  choices:
    - label: Закрыть порт
      check: {stat: INT, skill: netrunning, dv: 13}
      success: {text: "Ты рвёшь соединение за секунду. Адрес остаётся в логах, дека молчит.", effects: {}}
      fail: {text: "Порт не закрывается. В голову на секунду врываются чужие воспоминания, и ты падаешь на пол.", effects: {humanity: -2, hp: -3}}
    - label: К механику
      effects: {eddies: -100}
      text: "Ты выдёргиваешь питание и несёшь деку механику. Он молча чистит её за сотню и только качает головой."
    - label: Ответить
      bus: [hack]
      check: {stat: INT, skill: netrunning, dv: 17}
      success: {text: "Ты отслеживаешь отправителя и взламываешь его первым. На его счетах чужие деньги, и шестьсот из них теперь твои.", effects: {eddies: 600}}
      fail: {text: "Вместе с ответом в деку пролезает червь. Импланты начинают сбоить один за другим.", effects: {glitches: 2, hp: -2}}

