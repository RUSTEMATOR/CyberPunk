  text: "Кожа вокруг импланта покраснела и дурно пахнет. Клиника Фингерса в Вестбруке принимает без записи и не задаёт лишних вопросов."
  choices:
    - label: К Фингерсу
      effects: {eddies: -300, hp: 3}
      text: "Фингерс чистит шов, колет антибиотики и берёт триста вместе с наценкой за срочность. Болит, но заживает."
    - label: Лечить самому
      check: {stat: TECH, skill: medicine, dv: 15}
      success: {text: "Ты сам вычищаешь гной и заклеиваешь шов. Вышло аккуратно, и больно не так, как ты боялся.", effects: {hp: 2}}
      fail: {text: "Рука дрогнула, игла пошла не туда, и инфекция расползается дальше.", effects: {infection: true, hp: -4}}
    - label: Потерпеть
      effects: {hp: -2, mood: -2}
      text: "Ты ждёшь, что пройдёт само. Не проходит: держится жар, ночами не уснуть."

- id: deck_stranger_address
  title: Чужой адрес в деке
  category: implants
