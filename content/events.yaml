      fail: {text: "Хозяйка смеётся и за спор добавляет ещё пятьдесят. Теперь ты платишь на полторы сотни больше.", effects: {eddies: -150}}
    - label: "Прочитать хозяйку"
      ability: read
      effects: {mood: 2}
