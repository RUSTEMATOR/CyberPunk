  category: money
  weight: 3
  available_from: 2040
  conditions:
    districts: [watson]
    requires: [debt_overdue]
  text: "У твоей капсулы ждут двое из Мальстрёма с распечаткой долга. Говорят, что ждать больше не будут, и бьют ладонью в дверь."
  choices:
    - label: Заплатить
      effects: {eddies: -500, debt: -500, debt_grace: true}
      text: "Ты отдаёшь пятьсот, и на распечатке появляется отметка. Долг стал меньше, кошелёк легче, а коллекторы пока уходят."
    - label: Договориться
      check: {stat: COOL, skill: persuasion, dv: 17}
      success: {text: "Коллекторы соглашаются подождать, если ты прямо сейчас дашь сотню сверху. Пропущенные платежи они вычёркивают.", effects: {eddies: -100, debt_grace: true}}
      fail: {text: "Слушать тебя не стали. Один впечатывает тебя плечом в косяк, второй дописывает к долгу триста.", effects: {hp: -5, debt: 300}}
    - label: Уйти дворами
      check: {stat: REF, skill: stealth, dv: 13}
      success: {text: "Пока они стучат в дверь, ты уходишь через задний двор. Долг никуда не делся, но сегодня обошлось.", effects: {}}
      fail: {text: "Тебя ловят у мусорных баков и бьют по рёбрам. За беспокойство долг вырастает на двести.", effects: {hp: -6, debt: 200}}
    - label: "Показать хром"
      ability: menace
      effects: {debt_grace: true, street_cred: 1}
      text: "Ты открываешь дверь и просто стоишь в проёме. Коллекторы решают, что долг подождёт ещё месяц."
    - label: "Уйти через окно вверх"
      ability: fly
      effects: {mood: 3}
      text: "Окно, карниз, крыша. Коллекторы стучат в пустую капсулу до вечера."

