  choices:
    - label: Сесть за стол
      check: {stat: LUCK, dv: 13}
      success: {text: "Карта идёт, и ты забираешь банк в шестьсот. Дилер улыбается, будто знал, что так будет.", effects: {eddies: 600}}
      fail: {text: "Ты проигрываешь четыреста и выходишь на улицу с пустыми карманами.", effects: {eddies: -400}}
    - label: Посмотреть
      effects: {mood: -1}
      text: "Ты берёшь пиво у стойки и смотришь, как чужие эдди переходят из рук в руки. Немного завидно."

- id: capsule_rent_gouge
  title: Аренда подорожала
  category: money
  weight: 2
  conditions:
    districts: [watson]
  text: "Хозяйка капсульного отеля в Кабуки поднимает тебе аренду на сотню. Говорит, что решение не её, а управляющей компании."
