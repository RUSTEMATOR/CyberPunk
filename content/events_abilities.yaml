# Scenes of the chrome abilities (owner request 26.10, docs/PLAN_CHROME.md). Forced only: «⚙️ Возможности хрома» plays
# one of them when an ability is used (balance.chrome_abilities.<key>.events). The choice with `ability:` is the
# payoff of the chrome; the others are there for the cautious. Player text avoids gendered past tense.

# ---------------------------------------------------------------- listen
- id: ab_listen_1
  title: Голоса за стеной
  category: street
  weight: 1
  forced_only: true
  conditions: {abilities: [listen]}
  text: "Ночь, тонкие стены мегабашни. За стеной двое шепчутся: «…груз в контейнере у восьмого пирса, охрана сменится в три»."
  choices:
    - label: Дослушать до конца
      ability: listen
      effects: {eddies: 1800, heat: 1}
      text: "Номер контейнера, время, пароль охраны. Утром ты приходишь раньше хозяев. Контейнер пустеет на треть."
    - label: Продать фиксеру
      effects: {eddies: 600, street_cred: 1}
      text: "Фиксер слушает пересказ и кивает. «Хорошее ухо стоит денег»."
    - label: Не лезть
      effects: {mood: 1}
      text: "Ты включаешь музыку погромче. Чужие дела пусть остаются чужими."

- id: ab_listen_2
  title: Шаги за спиной
  category: street
  weight: 1
  forced_only: true
  conditions: {abilities: [listen]}
  text: "Ты идёшь домой и слышишь за два квартала: три пары ботинок, щелчок предохранителя, шёпот «это точно он»."
  choices:
    - label: Обойти засаду
      ability: listen
      effects: {street_cred: 1, skill_xp:stealth: 4}
      text: "Ты сворачиваешь в переулок, о котором они не знают, и выходишь им за спины. Они ждут до утра. Тебя там нет."
    - label: Встретить их
      violent: true
      effects: {start_combat: 3}
      text: "Ты разворачиваешься первым. Они не ожидали, что их услышат."
    - label: Переждать в баре
      effects: {eddies: -60, mood: 2}
      text: "Пара часов в баре, и шаги уходят искать кого-то другого."

# ---------------------------------------------------------------- read
- id: ab_read_1
  title: Слишком гладкая сделка
  category: money
  weight: 1
  forced_only: true
  conditions: {abilities: [read]}
  text: "Корпоратив в дорогом костюме предлагает вложиться в «верное дело». Улыбка широкая, руки спокойные. Слишком спокойные."
  choices:
    - label: Прочитать его
      ability: read
      effects: {eddies: 1500, street_cred: 1}
      text: "Зрачки дёргаются на слове «гарантия», пульс прыгает на сумме. Ты называешь его вслух мошенником, он платит за молчание."
    - label: Вложиться
      check: {stat: COOL, skill: persuasion, dv: 16}
      success: {text: "Дело и правда выгорает. Удивлены оба.", effects: {eddies: 2000}}
      fail: {text: "Через неделю его номер не отвечает. Деньги тоже.", effects: {eddies: -1500}}
    - label: Отказаться
      effects: {}
      text: "Ты вежливо уходишь. Через месяц его лицо крутят в новостях."

- id: ab_read_2
  title: Кто из них врёт
  category: work
  weight: 1
  forced_only: true
  conditions: {abilities: [read]}
  text: "Фиксер просит помочь на допросе: трое подозреваемых, один сдал склад полиции. «Ты же видишь людей насквозь, говорят»."
  choices:
    - label: Найти крысу
      ability: read
      effects: {eddies: 2200, street_cred: 1}
      text: "Двое потеют от страха, третий — от вины. Разница видна в микродвижениях век. Фиксер платит двойную ставку."
    - label: Угадать
      effects: {eddies: 300, mood: -3}
      text: "Ты показываешь на кого-то наугад. Фиксер платит, но смотрит странно."
    - label: Не участвовать
      effects: {}
      text: "Ты не в этом бизнесе. Фиксер пожимает плечами."

# ---------------------------------------------------------------- zoom
- id: ab_zoom_1
  title: Окно напротив
  category: street
  weight: 1
  forced_only: true
  conditions: {abilities: [zoom]}
  text: "В башне напротив, двадцатый этаж, кто-то оставил на столе открытый ноутбук с банковским терминалом."
  choices:
    - label: Приблизить экран
      ability: zoom
      effects: {eddies: 2500, heat: 1}
      text: "Пароль вводят прямо у тебя на глазах. Через час часть чужих эдди уже твоя."
    - label: Позвонить в его банк
      effects: {street_cred: 1, mood: 2}
      text: "Ты анонимно предупреждаешь банк. Странное чувство: быть хорошим человеком."
    - label: Отвернуться
      effects: {}
      text: "Не твоё окно."

- id: ab_zoom_2
  title: Снайпер на крыше
  category: street
  weight: 1
  forced_only: true
  conditions: {abilities: [zoom]}
  text: "На встрече с клиентом ты замечаешь блик на крыше в трёх кварталах. Оптика подтверждает: прицел, и смотрит он на тебя."
  choices:
    - label: Сорвать засаду
      ability: zoom
      effects: {street_cred: 3}
      text: "Ты сдвигаешь встречу за колонну и отправляешь координаты охране клиента. Снайпера снимают раньше выстрела."
    - label: Сбежать
      effects: {mood: -3}
      text: "Ты уходишь не прощаясь. Клиент обижен, зато жив кто-то из вас."
    - label: Сделать вид, что не заметно
      effects: {hp: -12}
      text: "Пуля проходит по касательной. Хорошо, что ты успеваешь наклониться."

# ---------------------------------------------------------------- thermal
- id: ab_thermal_1
  title: Заложники в фургоне
  category: ncpd
  weight: 1
  forced_only: true
  conditions: {abilities: [thermal]}
  text: "Копы окружили фургон, банда внутри грозит заложниками. Никто не знает, сколько там людей и где кто сидит."
  choices:
    - label: Посмотреть сквозь стенки
      ability: thermal
      effects: {eddies: 1500, street_cred: 2, faction_rep:ncpd: 3}
      text: "Четыре силуэта: двое с оружием у кабины, двое связанных сзади. Ты показываешь сержанту. Штурм занимает девять секунд."
    - label: Отойти подальше
      effects: {}
      text: "Ты слышишь выстрелы уже из-за угла."
    - label: Снять на камеру
      effects: {fame: 1}
      text: "Видео набирает просмотры. Чем всё кончилось, знают только копы."

- id: ab_thermal_2
  title: Кто-то в подъезде
  category: street
  weight: 1
  forced_only: true
  conditions: {abilities: [thermal]}
  text: "Темнота лестничной клетки. Тепловизор показывает силуэт за мусоропроводом, тёплый ствол в руке."
  choices:
    - label: Обойти и обезоружить
      ability: thermal
      effects: {street_cred: 1, item_grant:pistol: true}
      text: "Он не понимает, как ты оказываешься сзади. Пистолет остаётся у тебя, он убегает без него."
    - label: Подняться на лифте
      effects: {eddies: -20}
      text: "Лифт едет вечность, но едет мимо засады."
    - label: Идти как обычно
      violent: true
      effects: {start_combat: 2}
      text: "Он выходит из-за мусоропровода. Ты к этому готов."

# ---------------------------------------------------------------- night
- id: ab_night_1
  title: Блэкаут
  category: street
  weight: 1
  forced_only: true
  conditions: {abilities: [night]}
  text: "Квартал гаснет целиком. Где-то бьют витрины, кто-то кричит, а ты видишь всё, как днём."
  choices:
    - label: Вывести людей
      ability: night
      effects: {street_cred: 2, mood: 4, humanity: 1}
      text: "Ты ведёшь соседей по тёмной лестнице, обходя мародёров. Утром старушка с пятого этажа приносит пирог."
    - label: Тоже помародёрствовать
      ability: night
      effects: {eddies: 2000, heat: 2, humanity: -1}
      text: "В темноте никто не видит, кто выносит кассу из ломбарда. Кроме тебя самого."
    - label: Переждать дома
      effects: {}
      text: "Свечи, тишина, далёкие сирены."

- id: ab_night_2
  title: Тоннели метро
  category: street
  weight: 1
  forced_only: true
  conditions: {abilities: [night]}
  text: "Старый тоннель метро, заброшенный со времён Красного. Говорят, там тайник контрабандистов. Говорят, там никто не возвращается."
  choices:
    - label: Спуститься без фонаря
      ability: night
      effects: {eddies: 3000, skill_xp:stealth: 4}
      text: "Растяжки, ловушки, спящий охранник. Ты видишь их раньше, чем они тебя. Тайник лёгкий, но не пустой."
    - label: Пойти с фонарём
      check: {stat: REF, skill: stealth, dv: 16}
      success: {text: "Ты проходишь, но тайник уже выпотрошен. Остаётся пара сотен.", effects: {eddies: 300}}
      fail: {text: "Растяжка, вспышка, звон в ушах. Ты выползаешь обратно.", effects: {hp: -15}}
    - label: Не ходить
      effects: {}
      text: "Пусть легенды остаются легендами."

# ---------------------------------------------------------------- fly
- id: ab_fly_1
  title: Вид сверху
  category: rare
  weight: 1
  forced_only: true
  conditions: {abilities: [fly]}
  text: "Крыша мегабашни, ветер, город под ногами. Отсюда можно уйти куда угодно, и никто не поймёт, откуда ты взялся."
  choices:
    - label: Пролететь над Сити-центром
      ability: fly
      effects: {mood: 12, fame: 2}
      text: "Ты проходишь между башнями Арасаки и Милитеха. Кто-то снимает тебя на видео, к утру ролик смотрит полгорода."
    - label: Доставка по воздуху
      ability: fly
      effects: {eddies: 2500, heat: 1}
      text: "Посылка от фиксера, крыша к крыше, мимо блокпостов. Быстрее любого АВ и без вопросов."
    - label: Просто посидеть
      effects: {mood: 4}
      text: "Ветер, неон, тишина. Иногда этого достаточно."

- id: ab_fly_2
  title: Погоня
  category: ncpd
  weight: 1
  forced_only: true
  conditions: {abilities: [fly]}
  text: "Сирены, прожектор дрона, патруль перекрывает улицу с двух сторон. Это по твою душу, и ты знаешь за что."
  choices:
    - label: Уйти вверх
      ability: fly
      effects: {heat: -2, mood: 5}
      text: "Два шага, толчок, и улица внизу. Копы задирают головы. Дрон отстаёт на третьем повороте."
    - label: Сдаться и договориться
      effects: {eddies: -800, heat: -1}
      text: "Сержант берёт конверт и делает вид, что ты не тот, кого искали."
    - label: Бежать дворами
      check: {stat: REF, skill: driving, dv: 15}
      success: {text: "Ты уходишь через три двора и чужую кухню.", effects: {}}
      fail: {text: "Тупик. Наручники. Долгая ночь в участке.", effects: {heat: 1, eddies: -500}}

# ---------------------------------------------------------------- leap
- id: ab_leap_1
  title: Третий этаж
  category: street
  weight: 1
  forced_only: true
  conditions: {abilities: [leap]}
  text: "Окно третьего этажа открыто, внизу лестницы нет. Внутри, по слухам, склад банды, а охрана стоит у двери."
  choices:
    - label: Запрыгнуть в окно
      ability: leap
      effects: {eddies: 2000, heat: 1}
      text: "Один толчок, хват за подоконник, и ты внутри. Охрана у двери так и не узнает, куда делась половина товара."
    - label: Лезть по трубе
      check: {stat: BODY, skill: stealth, dv: 15}
      success: {text: "Труба держит. Ты берёшь немного и уходишь.", effects: {eddies: 700}}
      fail: {text: "Труба срывается. Падение, шум, бег.", effects: {hp: -10, heat: 1}}
    - label: Пройти мимо
      effects: {}
      text: "Не сегодня."

- id: ab_leap_2
  title: Крыши Кабуки
  category: street
  weight: 1
  forced_only: true
  conditions: {abilities: [leap]}
  text: "Паркурщики Кабуки бросают вызов: пробежка по крышам на время, ставки уже приняты."
  choices:
    - label: Прыгать через улицы
      ability: leap
      effects: {eddies: 1500, street_cred: 2, mood: 6}
      text: "Ты перепрыгиваешь улицы, которые они обегают. Ставки сгорают, твоя — нет."
    - label: Поставить на другого
      effects: {eddies: 200}
      text: "Ты ставишь на местного чемпиона и немного выигрываешь."
    - label: Отказаться
      effects: {}
      text: "Пусть бегают без тебя."

# ---------------------------------------------------------------- climb
- id: ab_climb_1
  title: Стена корпоративного склада
  category: money
  weight: 1
  forced_only: true
  conditions: {abilities: [climb]}
  text: "Гладкая бетонная стена, камеры смотрят на ворота, на стену никто не смотрит. Наверху вентиляция."
  choices:
    - label: Подняться по стене
      ability: climb
      effects: {eddies: 2400, heat: 1, skill_xp:stealth: 3}
      text: "Когти входят в бетон, как в масло. Вентиляция ведёт прямо к складу. Утром охрана ищет предателя среди своих."
    - label: Подкупить охранника
      effects: {eddies: -500, mood: -1}
      text: "Охранник берёт деньги и ничего не делает. Классика."
    - label: Уйти
      effects: {}
      text: "Стена остаётся стеной."

- id: ab_climb_2
  title: Кошка на карнизе
  category: relationships
  weight: 1
  forced_only: true
  conditions: {abilities: [climb]}
  text: "Девочка внизу плачет: её кошка застряла на карнизе седьмого этажа. Пожарные не приедут, это Найт-Сити."
  choices:
    - label: Снять кошку
      ability: climb
      effects: {mood: 8, humanity: 2, street_cred: 1}
      text: "Ты поднимаешься по стене, кошка шипит, царапает и всё равно цепляется за тебя. Девочка смотрит, как на супергероя."
    - label: Дать денег на дрон
      effects: {eddies: -100, mood: 2}
      text: "Через час кошку снимает арендный дрон. Девочка машет тебе вслед."
    - label: Пройти мимо
      effects: {mood: -2}
      text: "Плач слышен ещё полквартала."

# ---------------------------------------------------------------- dive
- id: ab_dive_1
  title: Затонувший АВ
  category: rare
  weight: 1
  forced_only: true
  conditions: {abilities: [dive]}
  text: "В заливе у Пасифики лежит корпоративный АВ, сбитый во время войны. Говорят, его так и не подняли."
  choices:
    - label: Нырнуть к обломкам
      ability: dive
      effects: {eddies: 4000, skill_xp:tech: 3}
      text: "Двадцать метров, мутная вода, кабина в иле. Сейф чёрного ящика открывается твоими руками. Внутри старые, но рабочие чипы."
    - label: Продать координаты
      effects: {eddies: 800}
      text: "Кочевники платят за координаты и не спрашивают, откуда они у тебя."
    - label: Забыть
      effects: {}
      text: "Пусть лежит."

- id: ab_dive_2
  title: Коллекторы под Уотсоном
  category: street
  weight: 1
  forced_only: true
  conditions: {abilities: [dive]}
  text: "Затопленные коллекторы под Уотсоном: путь из района, который не перекроет ни одна банда и ни один блокпост."
  choices:
    - label: Проложить маршрут
      ability: dive
      effects: {eddies: 1800, street_cred: 2, heat: -1}
      text: "Ты проходишь коллектор под водой и продаёшь маршрут контрабандистам. Теперь у тебя свой путь, о котором знают немногие."
    - label: Пройти по верху
      check: {stat: BODY, dv: 14}
      success: {text: "Грязно, долго, но выходишь.", effects: {mood: -2}}
      fail: {text: "Ты проваливаешься в люк и долго отмываешься.", effects: {hp: -6, mood: -4}}
    - label: Не лезть
      effects: {}
      text: "Канализация может подождать."

# ---------------------------------------------------------------- force
- id: ab_force_1
  title: Запертая дверь
  category: street
  weight: 1
  forced_only: true
  conditions: {abilities: [force]}
  text: "За стальной дверью кто-то кричит о помощи. Ключ у банды, банда ушла."
  choices:
    - label: Выломать дверь
      ability: force
      effects: {humanity: 2, street_cred: 2, mood: 5}
      text: "Петли сдаются с третьего удара. Внутри двое пленников банды. Они уходят своими ногами и запоминают твоё лицо."
    - label: Вызвать NCPD
      effects: {faction_rep:ncpd: 1}
      text: "Копы приезжают через два часа. Дверь открывают болгаркой."
    - label: Уйти
      effects: {humanity: -1}
      text: "Крики стихают за спиной."

- id: ab_force_2
  title: Банкомат на колёсах
  category: money
  weight: 1
  forced_only: true
  conditions: {abilities: [force]}
  text: "Инкассаторский фургон заглох посреди улицы. Охрана ушла за эвакуатором. Борт, кажется, тонкий."
  choices:
    - label: Вскрыть борт руками
      ability: force
      effects: {eddies: 3500, heat: 2}
      text: "Металл рвётся, как фольга. Пачка эдди, ещё одна. Сирены уже где-то рядом, но ты уже где-то не здесь."
    - label: Посторожить за деньги
      effects: {eddies: 300, street_cred: 1}
      text: "Охранник возвращается и платит тебе за то, что ты стоял рядом."
    - label: Пройти мимо
      effects: {}
      text: "Слишком много камер."

# ---------------------------------------------------------------- blades
- id: ab_blades_1
  title: Разговор в переулке
  category: street
  weight: 1
  forced_only: true
  conditions: {abilities: [blades]}
  text: "Трое ганг-сосунков требуют «налог за проход». Ножи у них кухонные."
  choices:
    - label: Показать лезвия
      ability: blades
      effects: {street_cred: 2, mood: 3}
      text: "Щелчок, блеск, и они вспоминают, что у них есть дела в другом районе. Один роняет нож."
    - label: Заплатить
      effects: {eddies: -100}
      text: "Сто эдди за спокойствие."
    - label: Драться
      violent: true
      effects: {start_combat: 1}
      text: "Ты не в настроении торговаться."

- id: ab_blades_2
  title: Мастер-класс
  category: work
  weight: 1
  forced_only: true
  conditions: {abilities: [blades]}
  text: "Клуб боевых искусств ищет того, кто покажет ученикам бой с имплантными клинками. Платят хорошо."
  choices:
    - label: Провести занятие
      ability: blades
      effects: {eddies: 1500, skill_xp:melee: 5, street_cred: 1}
      text: "Два часа демонстраций. Ученики смотрят с открытыми ртами. Тренер просит прийти ещё."
    - label: Посмотреть со стороны
      effects: {skill_xp:melee: 2}
      text: "Ты учишься, глядя, как учатся другие."
    - label: Отказаться
      effects: {}
      text: "Клинки не для шоу."

# ---------------------------------------------------------------- cloak
- id: ab_cloak_1
  title: Совет директоров
  category: money
  weight: 1
  forced_only: true
  conditions: {abilities: [cloak]}
  text: "Мелкая корпорация собирает закрытый совет. Конкурент заплатит за запись того, что там скажут."
  choices:
    - label: Войти невидимым
      ability: cloak
      effects: {eddies: 4500, skill_xp:stealth: 4}
