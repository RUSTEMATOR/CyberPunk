# Story arcs (owner request, 23.10.2026): multi-week stories with branches and a real reward at the end.
# The first step is an ordinary random event with `flags_none: [arc_<name>]`: it happens once per life.
# Every next step is `forced_only` and comes with the next week (effect `queue_event:<id>`), or later (`later`).
# The character flag `arc_<name>` is set by the first choice, so the arc never starts twice.

# ======================================================================== «Пропавшая сестра» (Уотсон)

- id: arc_sister_1
  title: Фото на автомате
  category: street
  weight: 3
  conditions:
    districts: [watson]
    flags_none: [arc_sister]
  text: "У автомата с лапшой девчонка лет семнадцати суёт прохожим фото. На нём её сестра: пропала три дня назад, последний раз её видели у клиники без вывески на соседней улице. Все отворачиваются, а она уже не плачет, просто протягивает фото дальше."
  choices:
    - label: Взяться за поиски
      effects: {flag_set:arc_sister: true, queue_event:arc_sister_2: true, mood: 2}
      text: "Ты забираешь фото и говоришь, что посмотришь. Девчонка записывает твой номер дрожащими пальцами. Клиника без вывески никуда не денется до следующей недели."
    - label: Дать на объявления
      effects: {flag_set:arc_sister: true, eddies: -100, mood: 2}
      text: "Ты отдаёшь сотню на печать объявлений. Больше ты ничего не обещаешь, и она это понимает. Благодарит всё равно."
    - label: Пройти мимо
      effects: {flag_set:arc_sister: true, mood: -2}
      text: "Ты проходишь мимо, как и все. Фото ещё долго стоит перед глазами."

- id: arc_sister_2
  title: Клиника без вывески
  category: street
  weight: 1
  forced_only: true
  text: "Клиника на первом этаже жилого блока. Окна заклеены, у двери скучает охранник с шокером, изнутри тянет антисептиком. Девчонка пишет каждый час: «Есть новости?»"
  choices:
    - label: Пробраться тихо
      check: {stat: REF, skill: stealth, dv: 15}
      success: {text: "Через чёрный ход, мимо подсобки, к терминалу регистратуры. В журнале её сестра: «донор, передана партнёрам». Партнёры — мусорщики из подвала на Джиг-Джиг.", effects: {skill_xp:stealth: 2, queue_event:arc_sister_3: true}}
      fail: {text: "Охранник оказывается не таким сонным. Шокер, пинок, асфальт. Пока ты лежишь, он хвастается напарнику: «Ещё одну мусорщикам сдали». Теперь ты знаешь, куда идти.", effects: {hp: -5, heat: 1, queue_event:arc_sister_3: true}}
    - label: Разговорить медсестру
      check: {stat: EMP, skill: persuasion, dv: 14}
      success: {text: "Медсестра курит у мусорных баков и явно ненавидит свою работу. Пара минут разговора, и она тихо называет адрес: подвал мусорщиков на Джиг-Джиг.", effects: {skill_xp:persuasion: 2, queue_event:arc_sister_3: true}}
      fail: {text: "Медсестра говорит только за деньги. Две сотни, и ты получаешь адрес подвала, куда клиника сдаёт «доноров».", effects: {eddies: -200, queue_event:arc_sister_3: true}}
    - label: Бросить это
      effects: {mood: -6}
      text: "Ты пишешь девчонке, что ничего не вышло. Она отвечает одним словом: «Понятно». Больше она не пишет."

- id: arc_sister_3
  title: Подвал со льдом
  category: street
  weight: 1
  forced_only: true
  faction: scavengers
  text: "Подвал, ванны со льдом, гудит генератор. Сестра жива: лежит под капельницей, её готовят к разделке. Мусорщиков трое, и они ещё тебя не заметили."
  choices:
    - label: Ворваться
      violent: true
      check: {stat: REF, skill: firearms, dv: 16}
      success: {text: "Три выстрела, три тела. Ты отключаешь капельницу и выносишь девушку на воздух. Она дышит.", effects: {street_cred: 2, faction_rep:scavengers: -10, queue_event:arc_sister_4: true}}
      fail: {text: "Первый выстрел уходит в трубу, и подвал взрывается криками. Драка выходит грязной, но девушку ты всё-таки вытаскиваешь.", effects: {start_combat: 2, queue_event:arc_sister_4: true}}
    - label: Выкупить её
      effects: {eddies: -800, queue_event:arc_sister_4: true}
      text: "Ты спускаешься с поднятыми руками и пачкой эдди. Мусорщики — деловые люди: восемьсот, и «товар» твой. Девушку ты уносишь на руках."
    - label: Вызвать NCPD
      check: {stat: COOL, skill: persuasion, dv: 13}
      success: {text: "Ты описываешь всё так, что патруль приезжает через десять минут. Мусорщики разбегаются, девушку забирает скорая. Копы даже говорят спасибо.", effects: {heat: -1, queue_event:arc_sister_4: true}}
      fail: {text: "Патруль приезжает через час. Подвал пуст, ванны слиты. Девушку увезли. Ты стоишь у входа и не знаешь, что написать её сестре.", effects: {mood: -12}}

- id: arc_sister_4
  title: Должок
  category: relationships
  weight: 1
  forced_only: true
  text: "Сёстры приходят вдвоём. Младшая обнимает тебя, старшая ещё бледная, но держится. Их дядя — риппер в Кабуки, и семья хочет отплатить. Они спрашивают, что тебе нужно."
  choices:
    - label: Деньги
      effects: {eddies: 1200, mood: 5}
      text: "Конверт с двенадцатью сотнями. Ты знаешь, что для них это много. Они настаивают."
    - label: Имплант от дяди
      effects: {cyberware_grant:subdermal_armor: true, mood: 5}
      text: "Дядя ставит тебе подкожную броню и не берёт ни эдди. «Чтобы в следующий раз тебя не продырявили», — говорит он, зашивая."
    - label: Просто дружбу
      effects: {add_npc:friend: true, mood: 12, street_cred: 1}
      text: "Ты отказываешься от всего. Теперь у тебя в Уотсоне есть люди, которые откроют дверь в любое время. По району быстро расходится, кто вытащил девушку из подвала."

# ======================================================================== «Чужой шард»

- id: arc_shard_1
  title: Чужой шард
  category: money
  weight: 2
  conditions:
    flags_none: [arc_shard]
  text: "После давки в метро ты находишь в кармане куртки чужой шард. Корпоративная печать, защитный корпус, кто-то сбросил его на тебя, уходя от хвоста."
  choices:
    - label: Вскрыть
      check: {stat: INT, skill: netrunning, dv: 15}
      success: {text: "Защита сыплется на третьей минуте. Внутри — список агентов Militech, внедрённых в Arasaka. Такое не держат в кармане долго: через день тебе пишут обе стороны.", effects: {flag_set:arc_shard: true, skill_xp:netrunning: 3, queue_event:arc_shard_2: true}}
      fail: {text: "Защита бьёт обратной связью, перед глазами белый шум. Шард превращается в кусок пластика. Ты так и не узнаешь, что в нём было.", effects: {flag_set:arc_shard: true, hp: -4, mood: -3}}
    - label: Продать барыге
      effects: {flag_set:arc_shard: true, eddies: 300}
      text: "Барыга на рынке даёт триста, не глядя. По его лицу видно, что он переплатил бы и вдвое. Поздно."
    - label: Выбросить
      effects: {flag_set:arc_shard: true, mood: 1}
      text: "Шард летит в канал. Чем меньше знаешь, тем дольше живёшь."

- id: arc_shard_2
  title: Два покупателя
  category: money
  weight: 1
  forced_only: true
  text: "Два сообщения с разницей в час. Arasaka предлагает две тысячи и забыть. Militech — столько же и «дружбу». Есть и третий вариант: слить всё журналистам, и тогда список увидит весь город."
  choices:
    - label: Продать Arasaka
      effects: {eddies: 2000, faction_rep:arasaka: 10, faction_rep:militech: -15, queue_event:arc_shard_3: true}
      text: "Встреча в подземном паркинге, вежливый человек в сером. Две тысячи на счёт. Он не говорит, что будет с людьми из списка. Ты не спрашиваешь."
    - label: Продать Militech
      effects: {eddies: 2000, faction_rep:militech: 10, faction_rep:arasaka: -15, queue_event:arc_shard_3: true}
      text: "Militech платит быстро и обещает помнить. Своих агентов они вывезут сегодня ночью. Arasaka узнает, кто помог, чуть позже."
    - label: Слить журналистам
      effects: {fame: 4, heat: 2, faction_rep:arasaka: -10, faction_rep:militech: -10, mood: 5}
      text: "К утру список во всех лентах. Обе корпорации в бешенстве, а ты впервые видишь своё имя в новостях — пока только как «анонимный источник»."

- id: arc_shard_3
  title: Хвост
  category: street
  weight: 1
  forced_only: true
  text: "Сделка закрыта, но кто-то с другой стороны не забыл. Неделю за тобой ходит одна и та же машина с тонированными стёклами. Сегодня она останавливается рядом."
  choices:
    - label: Уйти дворами
      check: {stat: REF, skill: stealth, dv: 15}
      success: {text: "Ты ныряешь в подворотню, потом в чужой подъезд и выходишь на другой улице. Машина ещё час кружит по кварталу. Больше ты её не видишь.", effects: {skill_xp:stealth: 2, heat: -1}}
      fail: {text: "Тебя догоняют у забора. Бьют профессионально, без лишней злости, и уезжают. Сообщение понятно.", effects: {hp: -10, mood: -5}}
    - label: Встретить их
      violent: true
      effects: {start_combat: 3, street_cred: 2}
      text: "Ты не бежишь. Двери машины открываются одновременно."
    - label: Откупиться
      effects: {eddies: -1000, mood: -2}
      text: "Ты сам подходишь к машине и отдаёшь тысячу. Опускается стекло, кто-то берёт деньги и кивает. Счёт закрыт."

# ======================================================================== «Лапшичная»

- id: arc_noodle_1
  title: Разбитая витрина
  category: street
  weight: 3
  conditions:
    flags_none: [arc_noodle]
  text: "Старик Хо, у которого ты обедаешь последние месяцы, сметает с порога стекло. Местная шпана берёт с него за «защиту», а на этой неделе он задержал платёж. Хо делает вид, что всё в порядке."
  choices:
    - label: Вступиться
      check: {stat: COOL, skill: persuasion, dv: 14}
      success: {text: "Ты находишь их у соседнего ларька и объясняешь, что Хо теперь под тобой. Они уходят, переглядываясь. Хо молча ставит перед тобой двойную порцию.", effects: {flag_set:arc_noodle: true, street_cred: 1, queue_event:arc_noodle_2: true}}
      fail: {text: "Разговор заканчивается ударом в челюсть. Шпана смеётся, но запоминает твоё лицо. Хо качает головой и прикладывает к тебе лёд.", effects: {flag_set:arc_noodle: true, hp: -4, queue_event:arc_noodle_2: true}}
    - label: Оплатить витрину
      effects: {flag_set:arc_noodle: true, eddies: -150, mood: 3, queue_event:arc_noodle_2: true}
      text: "Ты оставляешь на стойке полторы сотни на стекло. Хо долго отказывается, потом берёт. Шпана видит, что у старика появились друзья."
    - label: Не лезть
      effects: {flag_set:arc_noodle: true, mood: -2}
      text: "Ты доедаешь лапшу и уходишь. Через месяц лапшичная закрывается."

- id: arc_noodle_2
  title: Шпана возвращается
  category: street
  weight: 1
  forced_only: true
  text: "Они приходят вшестером, со старшим: шрам через всю щёку, хромированные костяшки. Хо стоит за стойкой и смотрит на тебя. Старший говорит, что ты лезешь не в своё дело."
  choices:
    - label: Драться
      violent: true
      effects: {start_combat: 2, queue_event:arc_noodle_3: true}
      text: "Ты встаёшь из-за стола. Хо выключает свет в зале."
    - label: Договориться
      check: {stat: COOL, skill: persuasion, dv: 16}
      success: {text: "Ты предлагаешь старшему сделку: он обходит лапшичную стороной, а ты иногда берёшь для его людей заказы. Он думает долго, потом протягивает руку.", effects: {skill_xp:persuasion: 3, queue_event:arc_noodle_3: true}}
      fail: {text: "Сделки не выходит. Отступные за Хо — три сотни. Старший забирает деньги и обещает, что больше они не придут. Почему-то ты ему веришь.", effects: {eddies: -300, queue_event:arc_noodle_3: true}}
    - label: Нанять охрану
      effects: {eddies: -500, queue_event:arc_noodle_3: true}
      text: "Ты заранее зовёшь двух ребят из бара. Шпана видит их у двери, считает и уходит без разговоров."

- id: arc_noodle_3
  title: Предложение Хо
  category: money
  weight: 1
  forced_only: true
  text: "Хо закрывает лапшичную пораньше, наливает два стакана и говорит прямо: детей у него нет, сил всё меньше. Он хочет, чтобы ты вошёл в долю."
  choices:
    - label: Войти в долю
      effects:
        eddies: -1000
        mood: 5
        later:
          - weeks: 4
            chance: 0.85
            text: "Лапшичная Хо: твоя доля за месяц."
            fail_text: "Санинспекция закрыла лапшичную Хо. Доля пропала."
            hint: доля лапшичной
            effects:
              eddies: 450
              later:
                - weeks: 4
                  chance: 0.85
                  text: "Лапшичная Хо: ещё месяц в плюсе."
                  fail_text: "Хо слёг, лапшичная закрылась. Больше выплат не будет."
                  hint: доля лапшичной
                  effects:
                    eddies: 450
                    later:
                      - {weeks: 4, chance: 0.85, text: "Лапшичная Хо: доля за третий месяц.", fail_text: "Аренду подняли, лапшичная закрылась.", hint: доля лапшичной, effects: {eddies: 450}}
      text: "Ты отдаёшь тысячу и получаешь бумагу, написанную от руки. Хо улыбается впервые за всё время."
    - label: Кормиться бесплатно
      effects: {mood: 15, hp: 10}
      text: "Ты отказываешься от доли, но соглашаешься обедать у него до конца жизни. Хо смеётся и ставит на стол всё, что есть в меню."
    - label: Попросить знакомства
      effects: {add_npc:contact: true, mood: 4}
      text: "У Хо полрайона в должниках. Он звонит одному человеку и говорит: «Это свой». Теперь у тебя новый контакт."

# ======================================================================== «Голос в эфире»

- id: arc_voice_1
  title: Голос в эфире
  category: rare
  weight: 2
  conditions:
    flags_none: [arc_voice]
  text: "Посреди ночи твой экран включается сам. Помехи, потом голос, искажённый до металла. Голос называет тебя по имени и просит не выключать."
  choices:
    - label: Ответить
      effects: {flag_set:arc_voice: true, queue_event:arc_voice_2: true}
      text: "Ты говоришь: «Слушаю». Голос замолкает, будто не ожидал. Потом обещает, что выйдет на связь через неделю."
    - label: Отследить сигнал
      check: {stat: INT, skill: netrunning, dv: 16}
      success: {text: "Сигнал прыгает по десятку узлов, но ты держишь его до конца. Источник где-то в Санто-Доминго, в старом жилом блоке. Голос замечает тебя и смеётся: «Хорошо. Ты подходишь».", effects: {flag_set:arc_voice: true, skill_xp:netrunning: 3, queue_event:arc_voice_2: true}}
      fail: {text: "Сигнал уходит в никуда, а тебя бьёт обратной волной. В голове ещё сутки звенит. Голос обещает вернуться.", effects: {flag_set:arc_voice: true, hp: -3, glitches: 1, queue_event:arc_voice_2: true}}
    - label: Вырубить всё
      effects: {flag_set:arc_voice: true, mood: -2}
      text: "Ты выдёргиваешь шнур из розетки и до утра сидишь в темноте. Голос больше не появляется."

- id: arc_voice_2
  title: Просьба
  category: rare
  weight: 1
  forced_only: true
  text: "Голос рассказывает о себе. Это нетраннер, который ушёл слишком глубоко и не смог вернуться. Его тело третий год лежит в капсуле в Санто-Доминго, оплата за аренду кончается. Он просит забрать его, пока капсулу не вскрыли."
  choices:
    - label: Поехать
      check: {stat: TECH, skill: tech, dv: 15}
      success: {text: "Ты взламываешь замок капсульного отеля и находишь нужный номер. Внутри ледяной туман и человек в проводах. Мониторы ещё показывают пульс.", effects: {skill_xp:tech: 2, queue_event:arc_voice_3: true}}
      fail: {text: "Охрана отеля ловит тебя у лифта. Пара синяков и пятьсот за «аренду номера» — и ты всё-таки внутри.", effects: {hp: -6, eddies: -500, queue_event:arc_voice_3: true}}
    - label: Продать координаты
      effects: {eddies: 700, humanity: -2}
      text: "Ты продаёшь адрес капсулы тем, кто собирает старые деки и чужие тела. Голос больше не выходит на связь."
    - label: Отказаться
      effects: {mood: -3}
      text: "Ты говоришь, что не можешь. Голос молчит, потом желает тебе удачи. Экран гаснет."

- id: arc_voice_3
  title: Тело в капсуле
  category: rare
  weight: 1
  forced_only: true
  text: "Человек в капсуле худой, как скелет, но сердце бьётся. Отключить его от сети можно только аккуратно: одно неверное движение, и сознание останется там навсегда."
  choices:
    - label: Отключать аккуратно
      check: {stat: TECH, skill: medicine, dv: 16}
      success: {text: "Провод за проводом, по его подсказкам из динамика. Последний разъём, вздох, и он открывает глаза. В благодарность он отдаёт тебе свою деку: «Мне она больше не нужна».", effects: {skill_xp:medicine: 3, cyberware_grant:cyberdeck_street_garage: true, add_npc:contact: true, mood: 10}}
      fail: {text: "Пульс срывается на третьем разъёме. Мониторы пищат, потом замолкают. Голос в динамике обрывается на полуслове.", effects: {mood: -12, humanity: -2}}
    - label: Скопировать его данные
      effects: {eddies: 1500, humanity: -5}
      text: "Ты сливаешь всё, что он накопил за три года в сети, и продаёшь кусками. Хватает надолго. Капсулу ты не открываешь."
    - label: Оплатить капсулу и уйти
      effects: {eddies: -400, mood: 4}
      text: "Ты продлеваешь аренду ещё на год. Голос благодарит. Может быть, однажды он найдёт дорогу обратно сам."

# ======================================================================== «Охотник»

- id: arc_hunter_1
  title: Цена на твою голову
  category: street
  weight: 2
  conditions:
    min_street_cred: 5
    flags_none: [arc_hunter]
  text: "Бармен передаёт тебе визитку. На ней твоё лицо, имя и сумма. Кто-то заказал тебя, и охотник уже в городе."
  choices:
    - label: Выяснить, кто
      check: {stat: COOL, skill: persuasion, dv: 15}
      success: {text: "Пара звонков, пара должков. Охотника зовут Резак, работает один, берёт только заказы с предоплатой. Ты знаешь, где он остановился.", effects: {flag_set:arc_hunter: true, queue_event:arc_hunter_2: true}}
      fail: {text: "Никто ничего не знает, или делает вид. Ты ходишь по городу и оглядываешься.", effects: {flag_set:arc_hunter: true, mood: -4, queue_event:arc_hunter_2: true}}
    - label: Залечь на дно
      effects:
        flag_set:arc_hunter: true
        heat: -1
        mood: -5
        later:
          - {weeks: 3, text: "Охотник не ушёл. Он ждал.", hint: охотник не уйдёт просто так, effects: {queue_event:arc_hunter_2: true}}
      text: "Ты не выходишь из квартиры, еду заказываешь через соседа. Охотник ждёт тебя где-то снаружи."
    - label: Нанять охрану
      effects: {flag_set:arc_hunter: true, eddies: -600, queue_event:arc_hunter_2: true}
      text: "Двое крепких ребят теперь ходят за тобой по пятам. Шестьсот за неделю. Встреча всё равно будет."

- id: arc_hunter_2
  title: Резак
  foe: "Резак, охотник за головами"
  foe_faction: scavengers
  category: street
  weight: 1
  forced_only: true
  text: "Подземная парковка, мигает лампа. Он стоит у твоей машины: длинный плащ, клинок за спиной. Охотник говорит, что ничего личного."
  choices:
    - label: Драться
      violent: true
      effects: {start_combat: 3, queue_event:arc_hunter_3: true}
      text: "Ты не отвечаешь. Он улыбается и тянется за клинком."
    - label: Перекупить контракт
      effects: {eddies: -1500, mood: 5}
      text: "Полторы тысячи — и он рвёт контракт у тебя на глазах. «Заказчику скажу, что ты уехал из города». Он уходит, не оборачиваясь."
    - label: Поговорить
      check: {stat: COOL, skill: persuasion, dv: 17}
      success: {text: "Ты говоришь о заказчике больше, чем знает он сам. Охотник понимает, что его используют втёмную. Он опускает клинок и оставляет тебе номер: «Если понадобится помощь — звони».", effects: {add_npc:contact: true, street_cred: 2}}
      fail: {text: "Он слушает минуту, потом качает головой: «Хорошая попытка». Клинок выходит из ножен.", effects: {start_combat: 3, queue_event:arc_hunter_3: true}}

- id: arc_hunter_3
  title: Имя заказчика
  category: street
  weight: 1
  forced_only: true
  text: "После той ночи на парковке у тебя остаются его клинок и шард с перепиской. Заказчик — мелкий корпорат, которому ты когда-то перешёл дорогу. Он живёт в тихом районе и думает, что всё уже кончено."
  choices:
    - label: Нанести визит
      violent: true
      check: {stat: REF, skill: stealth, dv: 16}
      success: {text: "Ты проходишь мимо его охраны и ждёшь в гостиной. Корпорат возвращается домой и видит тебя. Через десять минут он переводит тебе две тысячи и клянётся забыть твоё имя.", effects: {eddies: 2000, street_cred: 3, item_grant:katana: true}}
      fail: {text: "Охрана оказывается умнее, чем казалось. Ты уходишь через окно, с порезами и розыском на хвосте.", effects: {hp: -10, heat: 2, item_grant:katana: true}}
    - label: Продать имя конкурентам
      effects: {eddies: 800, item_grant:katana: true}
      text: "Переписка уходит конкурентам корпората за восемьсот. Что с ним будет дальше, тебя уже не касается. Клинок охотника остаётся у тебя."
    - label: Оставить себе клинок и забыть
      effects: {item_grant:katana: true, mood: 6}
      text: "Ты выбрасываешь шард в канал. Клинок вешаешь на стену. Хватит с тебя этой истории."
