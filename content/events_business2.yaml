# Business troubles (owner request 24.10: running a business was too easy). Stories of one owned business
# (`business:`, "{biz}" = its name). The first block comes when a resource is low (services/business.py TROUBLES);
# the tax audit when a week's business net is big; the rest join the random business stories. A wrong call costs:
# money, a level, weeks of slump, or the business itself. Effects biz_stock / biz_staff / biz_cond move the resources.
# Player text avoids gendered past tense.

# ======================================================================== low stock

- id: biz_supplier_shady
  title: Поставщик с чёрного хода
  category: money
  weight: 1
  business: []
  text: "Склад {biz} почти пуст. В подсобку заходит улыбчивый тип: целая фура товара за треть цены. Накладных нет, этикетки переклеены, некоторые банки вздутые. «Бери, пока дают»."
  choices:
    - label: Взять всё за треть цены
      effects: {eddies: -800, biz_stock: 60, later: [{weeks: 3, chance: 0.6, text: "Товар от улыбчивого типа оказался тухлым. Посетители {biz} травятся, санинспекция закрывает заведение на месяц, юристы пострадавших звонят каждый день.", effects: {eddies: -6000, biz_slump: 4, biz_cond: -20}, fail_text: "Тухлые банки ушли незамеченными. Повезло.", hint: "товар с чёрного хода"}]}
      text: "Фура разгружена за ночь. Склад полон, касса цела. Запах из пары коробок лучше не замечать."
    - label: Проверить товар
      check: {stat: TECH, skill: tech, dv: 13}
      success: {text: "Ты вскрываешь пару коробок и выкидываешь гнильё. Остальное берёшь со скидкой: тип рад, что ты не позвал копов.", effects: {eddies: -1200, biz_stock: 40}}
      fail: {text: "Всё выглядит прилично. Через неделю выясняется, что половина товара просрочена ещё до Объединения.", effects: {eddies: -1200, biz_stock: 15, biz_slump: 2}}
    - label: Заказать у нормального поставщика
      effects: {eddies: -3000, biz_stock: 50}
      text: "Дорого, долго, но с накладными и холодильником. Склад полон, совесть чиста."

- id: biz_stock_empty
  title: Пустые полки
  category: money
  weight: 1
  business: []
  text: "В {biz} кончился товар. Постоянные клиенты уходят к конкурентам через дорогу, кто-то фотографирует пустые полки и выкладывает в сеть с подписью «всё, приехали»."
  choices:
    - label: Срочно закупить втридорога
      effects: {eddies: -4000, biz_stock: 60}
      text: "Курьеры везут всё, что есть в городе, с наценкой за срочность. К вечеру полки полны, а кошелёк заметно тоньше."
    - label: Закрыться до поставки
      effects: {biz_slump: 2, biz_staff: -10}
      text: "Табличка «Учёт». Персонал сидит без работы и без чаевых, клиенты привыкают ходить в другое место."
    - label: Торговать тем, что есть
      check: {stat: COOL, skill: persuasion, dv: 15}
      success: {text: "Ты превращаешь пустые полки в фишку: «последний вечер старого меню», скидки, музыка. Народ приходит посмотреть.", effects: {biz_stock: 10, fame: 1}}
      fail: {text: "Клиенты не впечатлены. Отзыв «приходил за едой, ушёл с мемом» собирает тысячу лайков.", effects: {biz_slump: 4}}

# ======================================================================== low staff

- id: biz_staff_theft
  title: Касса не сходится
  category: money
  weight: 1
  business: []
  text: "Третью неделю подряд касса {biz} не сходится. Персонал, которому давно не платили премий, отводит глаза. Кто-то ворует. Возможно, все понемногу."
  choices:
    - label: Уволить всех и набрать новых
      effects: {eddies: -2500, biz_staff: 40, biz_slump: 2}
      text: "Новые люди честные, но ничего не умеют. Две недели всё валится из рук. Зато касса сходится."
    - label: Найти вора
      check: {stat: INT, skill: stealth, dv: 14}
      success: {text: "Камера в подсобке, меченые купюры, разговор в переулке. Вор один, остальные прикрывали. Уволен он, остальные получают премию и понимают намёк.", effects: {eddies: -800, biz_staff: 25}}
      fail: {text: "Ты устраиваешь допрос не тому человеку. Лучшая официантка уходит, хлопнув дверью, и уводит с собой ещё двоих.", effects: {biz_staff: -20, biz_slump: 3}}
    - label: Закрыть глаза
      effects: {eddies_pct: -8}
      text: "Ты делаешь вид, что ничего не видно. Воровство становится традицией."

- id: biz_strike
  title: Забастовка
  category: work
  weight: 1
  business: []
  text: "Персонал {biz} не вышел на смену. У входа плакаты: «Премии, а не обещания». Профсоюз докеров обещает поддержку. Двери закрыты, клиенты уходят."
  choices:
    - label: Выполнить требования
      effects: {eddies: -3500, biz_staff: 45}
      text: "Премии, график, кофемашина в подсобке. Люди возвращаются довольными и работают как никогда."
    - label: Нанять штрейкбрехеров
      effects: {eddies: -1500, biz_staff: -15, heat: 1, later: [{weeks: 2, chance: 0.5, text: "Бастующие запомнили. Ночью у {biz} разбиты витрины и подожжён мусорный бак у входа.", effects: {biz_cond: -30, eddies: -2000}, fail_text: "Бастующие разошлись по другим работам. Обошлось.", hint: "обиженный персонал"}]}
      text: "Новые люди проходят сквозь пикет под свист и плевки. Заведение работает, но атмосфера как в тюрьме."
    - label: Договориться
      check: {stat: EMP, skill: persuasion, dv: 15}
      success: {text: "Ты садишься с людьми и говоришь честно. Половина требований, но сразу и без обмана. Через час все на смене.", effects: {eddies: -1500, biz_staff: 35}}
      fail: {text: "Переговоры срываются на крик. Забастовка идёт ещё две недели.", effects: {biz_slump: 4, biz_staff: -10}}

- id: biz_manager_quits
  title: Управляющий уходит
  category: work
  weight: 1
  business: []
  text: "Управляющий {biz}, который тянул на себе всё, кладёт ключи на стойку. Конкурент предложил ему вдвое больше, а ты не появлялся неделями. «Без обид. Просто бизнес»."
  choices:
    - label: Перебить предложение
      effects: {eddies: -5000, biz_staff: 30}
      text: "Ты кладёшь сверху цифру побольше. Он берёт ключи обратно и впервые улыбается."
    - label: Отпустить и рулить самому
      effects: {biz_staff: -10, biz_slump: 3, mood: -3}
      text: "Ты встаёшь за стойку сам. Три недели без сна, ошибки в заказах, сгоревший суп. Но теперь ты знаешь своё заведение."
    - label: Пригрозить ему
      check: {stat: COOL, skill: persuasion, dv: 16}
      success: {text: "Ты напоминаешь, что знаешь, куда уходила часть выручки. Он остаётся. Без улыбки, но остаётся.", effects: {biz_staff: 10, humanity: -1}}
      fail: {text: "Он смеётся и уходит к конкуренту, прихватив базу постоянных клиентов.", effects: {biz_slump: 4, biz_staff: -15, biz_level: -1}}

# ======================================================================== low condition

- id: biz_inspection_hard
  title: Санинспекция
  category: ncpd
  weight: 1
  business: []
  text: "В {biz} приходит инспекция: трое в белых халатах и один в сером костюме. Проводка искрит, вентиляция гудит, в подсобке плесень. Инспектор что-то пишет и не поднимает глаз."
  choices:
    - label: Заплатить штраф и сделать ремонт
      effects: {eddies: -4000, biz_cond: 35}
      text: "Штраф, неделя работ, новые справки. Дорого, но теперь к тебе не придерёшься."
    - label: Сунуть конверт
      check: {stat: COOL, skill: persuasion, dv: 14}
      success: {text: "Инспектор не замечает плесени и уходит с конвертом. До следующего раза.", effects: {eddies: -1500}}
      fail: {text: "Человек в сером костюме оказался из корпоративной безопасности. Взятка записана. Штраф в пять раз больше, заведение закрыто на месяц.", effects: {eddies: -8000, biz_slump: 4, heat: 1}}
    - label: Спорить с инспектором
      effects: {biz_slump: 4, biz_cond: -5}
      text: "Ты требуешь начальство и ссылаешься на права. Инспектор пожимает плечами и вешает на дверь пломбу. Месяц без работы."

- id: biz_ceiling
  title: Обвал потолка
  category: street
  weight: 1
  business: []
  text: "В разгар вечера в {biz} падает кусок потолка. Двое гостей в крови, один в дорогом пиджаке и уже звонит адвокату. Все остальные снимают на камеры."
  choices:
    - label: Оплатить лечение и молчание
      effects: {eddies: -6000, biz_cond: 20}
      text: "Ты оплачиваешь Trauma Team, лечение и компенсацию. Пиджак подписывает бумагу о неразглашении. Потолок чинят за ночь."
    - label: Судиться
      check: {stat: INT, skill: persuasion, dv: 16}
      success: {text: "Твой юрист доказывает, что пиджак был пьян и сам повис на люстре. Суд отклоняет иск.", effects: {eddies: -1500, biz_cond: 10}}
      fail: {text: "Суд на стороне пострадавших. Компенсация, судебные расходы, и газеты на неделю.", effects: {eddies: -12000, biz_slump: 4}}
    - label: Вывести гостей и закрыться
      effects: {biz_level: -1, biz_cond: 30}
      text: "Капитальный ремонт съедает второй этаж и половину зала. {biz} откроется заново, но меньше."

- id: biz_wiring_fire
  title: Проводка горит
  category: street
  weight: 1
  business: []
  text: "Ночью в {biz} загорается старая проводка. Сигнализация сработала, но пожарные едут сорок минут. Охранник звонит тебе: «Тушить самим или ждать?»"
  choices:
    - label: Ехать тушить
      check: {stat: BODY, skill: null, dv: 14}
      success: {text: "Огнетушители, мокрые куртки, дым в лёгких. Огонь сбит до приезда пожарных. Зал закопчён, но цел.", effects: {hp: -6, biz_cond: -10}}
      fail: {text: "Дым валит из всех щелей, сознание уплывает прямо у двери. Охранник вытаскивает тебя за ноги. Сгорела половина зала.", effects: {hp: -15, biz_cond: -40, biz_level: -1}}
    - label: Ждать пожарных
      effects: {biz_cond: -35, biz_slump: 2}
      text: "Пожарные приезжают, когда горит уже крыша. Здание стоит, но ремонта на месяц."
    - label: Не мешать огню
      effects: {biz_lost: true, eddies: 9000, heat: 2}
      text: "Ты велишь охраннику уйти. Страховка платит, следователь качает головой. {biz} больше нет, а вопросы останутся."

# ======================================================================== big money

- id: biz_tax_audit
  title: Налоговая проверка
  category: ncpd
  weight: 1
  business: []
  text: "Город заметил, сколько приносит {biz}. Двое аудиторов садятся за твой стол и просят все книги за год. Половина операций шла наличными, без чеков."
  choices:
    - label: Заплатить всё честно
      effects: {eddies_pct: -12, status: 1}
      text: "Ты оплачиваешь налоги за год с пенями. Больно. Зато аудиторы жмут руку и больше не придут."
    - label: Подчистить книги
      check: {stat: INT, skill: tech, dv: 16}
      success: {text: "Бухгалтерия переписана за ночь. Аудиторы находят пару мелочей, штраф символический.", effects: {eddies: -2000}}
      fail: {text: "Аудиторы замечают свежие правки в файлах. Уклонение от налогов: штраф, арест счёта, розыск.", effects: {eddies_pct: -25, heat: 3, biz_slump: 4}}
    - label: Договориться с аудиторами
      check: {stat: COOL, skill: persuasion, dv: 15}
      success: {text: "Ужин в хорошем ресторане и конверт под тарелкой. Проверка заканчивается ничем.", effects: {eddies: -5000}}
      fail: {text: "Один из аудиторов оказался принципиальным. Попытка подкупа добавлена в протокол.", effects: {eddies_pct: -20, heat: 2}}

# ======================================================================== random stories

- id: biz_gang_turf
  title: Две крыши
  category: street
  weight: 2
  business: []
  text: "За неделю к {biz} приходят две банды. Каждая требует платить только ей и обещает разобраться с теми, кто платит другой."
  choices:
    - label: Платить обеим
      effects: {eddies: -3000, biz_staff: -5}
      text: "Ты платишь обеим и молишься, чтобы они не встретились у тебя в зале. Персонал нервничает."
    - label: Выбрать одну
      check: {stat: COOL, skill: persuasion, dv: 14}
      success: {text: "Ты выбираешь сильнейшую, и она сама объясняет конкурентам, где их место. Крыша надёжная.", effects: {eddies: -1500, street_cred: 1}}
      fail: {text: "Ты ставишь не на ту лошадь. Проигравшие ночью разносят витрины и бьют охранника.", effects: {eddies: -1500, biz_cond: -30, biz_staff: -15}}
    - label: Послать обеих
      violent: true
      effects: {start_combat: 3, biz_cond: -15, street_cred: 2}
      text: "Ты встречаешь гостей у входа со стволом. Разговор короткий."

- id: biz_viral
  title: Вирусный отзыв
  category: money
  weight: 2
  business: []
  text: "Стример с миллионом зрителей ведёт эфир из {biz}. Еда ему не нравится, персонал грубит, а камера крупно показывает трещину в стене. Чат пишет быстрее, чем ты читаешь."
  choices:
    - label: Выйти в кадр и всё исправить
      check: {stat: COOL, skill: persuasion, dv: 14}
      success: {text: "Ты угощаешь его за счёт заведения, шутишь, показываешь кухню. Чат взрывается сердечками. Очередь до угла на месяц.", effects: {biz_boost: 4, fame: 2}}
      fail: {text: "Ты выходишь в кадр и говоришь что-то не то. Нарезка «хозяин теряет лицо» набирает десять миллионов.", effects: {biz_slump: 6, mood: -4}}
    - label: Выставить стримера
      effects: {biz_slump: 4, street_cred: 1}
      text: "Стример уходит, ведя эфир на ходу. Его фанаты неделю пишут гадости в отзывах."
    - label: Сделать вид, что ничего не происходит
      effects: {biz_slump: 2}
      text: "Ты прячешься в подсобке. Отзыв живёт своей жизнью, пару недель людей меньше."

- id: biz_partner_embezzle
  title: Компаньон с деньгами
  category: money
  weight: 1
  business: []
  text: "Старый знакомый предлагает войти в {biz} долей: принесёт деньги, связи, новых клиентов. Глаза бегают, документы он предлагает подписать «потом, между своими»."
  choices:
    - label: Взять в долю
      effects: {eddies: 8000, later: [{weeks: 6, chance: 0.55, text: "Компаньон исчез вместе с выручкой {biz} за три месяца и половиной поставщиков. Твоя подпись стоит на его долгах.", effects: {eddies: -18000, biz_level: -1, biz_stock: -40}, fail_text: "Компаньон оказался честнее, чем выглядел. Доля работает.", hint: "компаньон в доле"}]}
      text: "Он приносит деньги наличными в спортивной сумке. Говорит, что это «на развитие»."
    - label: Проверить его через фиксера
      check: {stat: INT, skill: persuasion, dv: 13}
      success: {text: "Фиксер присылает досье: три обанкроченных заведения, два иска. Ты вежливо отказываешь и угощаешь его за счёт заведения.", effects: {eddies: -300}}
      fail: {text: "Фиксер ничего не находит. Пока ты думаешь, знакомый находит другого партнёра.", effects: {mood: -1}}
    - label: Отказать сразу
      effects: {mood: 1}
      text: "«Между своими» у тебя только кредиты. Знакомый пожимает плечами и уходит."

- id: biz_cyberpsycho_guest
  title: Киберпсих в зале
  category: street
  weight: 1
  business: []
  foe: Киберпсих
  text: "В {biz} гость с хромированными руками начинает кричать и ломать мебель. Глаза пустые, руки дрожат. МаксТак в двадцати минутах."
  choices:
    - label: Остановить его самому
      violent: true
      effects: {start_combat: 3, biz_cond: -10, street_cred: 2}
      text: "Ты встаёшь между ним и гостями. Остальные прячутся за стойкой."
    - label: Вывести гостей и ждать МаксТак
      effects: {biz_cond: -35, biz_slump: 2}
      text: "Гости выбегают через кухню. Пока МаксТак едет, зал превращается в руины."
    - label: Уговорить его
      check: {stat: EMP, skill: persuasion, dv: 16}
      success: {text: "Ты говоришь тихо и долго. Он садится на пол и плачет. МаксТак увозит его живым. Город говорит о тебе.", effects: {humanity: 2, fame: 2, biz_cond: -5}}
      fail: {text: "Он не слышит. Хромированная рука отправляет тебя через барную стойку.", effects: {hp: -15, biz_cond: -30}}

- id: biz_hostile_takeover
  title: Враждебное поглощение
  category: money
  weight: 1
  business: []
  text: "Корпорация скупает квартал. Юрист в идеальном костюме оставляет на стойке {biz} папку: аренда помещения выкуплена, новая цена втрое выше. «Или вы продаёте нам бизнес. Сегодня»."
  choices:
    - label: Продать
      effects: {biz_lost: true, eddies: 15000}
      text: "Цена ниже рыночной, но это лучше, чем ничего. Вывеску снимают на следующий день."
    - label: Платить новую аренду
      effects: {eddies: -8000, biz_slump: 2}
      text: "Ты платишь. Корпорация удивлена. В следующем месяце она пришлёт новую папку."
    - label: Найти компромат на юриста
      check: {stat: INT, skill: netrunning, dv: 17}
      success: {text: "В его почте находится то, что совету директоров лучше не видеть. Папка возвращается с извинениями и старой ценой.", effects: {street_cred: 2, heat: 1}}
      fail: {text: "Лёд корпорации отвечает. Аренда растёт ещё вдвое, а у тебя теперь враги наверху.", effects: {eddies: -12000, heat: 2, biz_level: -1}}
