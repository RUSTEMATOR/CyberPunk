# The Blackwall is always near (owner request 24.10): unseen, it breaks through now and then. The weakest of these
# happen to anybody; the stronger ones need the taint tiers (flags bw_r1..bw_r4, engine/blackwall.py).
# The cult of the Blackwall, «Церковь Тихого Шума»: recruitment and the life of a member (flag bw_cult_in).
# Raven Tearz's «она» warns a character who walks the Avatar chain. Player text avoids gendered past tense.

- id: bwh_screen
  title: Лицо на экране
  category: street
  weight: 1
  conditions:
    flags_none: [abroad]
  text: "Три часа ночи. Телевизор включается сам. На экране ты: спишь в своей кровати, снято сверху, из угла комнаты, где нет камеры."
  choices:
    - label: Выключить
      effects: {mood: -2}
      text: "Экран гаснет. В темноте слышно, как остывает матрица. Ты не смотришь в угол комнаты до утра."
    - label: Смотреть дальше
      effects: {mood: -4, bw_rot: 2}
      text: "Спящий ты на экране открывает глаза и смотрит прямо в камеру. Потом улыбается. Ты не улыбаешься. Изображение гаснет само."
    - label: Разбить экран
      effects: {eddies: -200, mood: 1}
      text: "Осколки на полу ещё секунду светятся. Новый телевизор обойдётся дешевле, чем сон."

- id: bwh_call
  title: Звонок с твоего номера
  category: street
  weight: 1
  conditions:
    flags_none: [abroad]
  text: "Комм вибрирует. Входящий вызов. Номер — твой собственный."
  choices:
    - label: Ответить
      effects: {mood: -3, bw_rot: 2}
      text: "Твой голос, только спокойнее, говорит: «Не открывай дверь в четверг». Короткие гудки. В журнале вызовов звонка нет."
    - label: Сбросить
      effects: {mood: -1}
      text: "Ты сбрасываешь. Через минуту приходит сообщение с твоего номера: «зря»."

- id: bwh_elevator
  title: Минус тринадцатый
  category: street
  weight: 1
  conditions:
    flags_none: [abroad]
  text: "В лифте твоего блока появилась новая кнопка: «−13». Её не было утром. Она светится."
  choices:
    - label: Нажать
      check: {stat: COOL, dv: 13}
      success: {text: "Лифт едет вниз очень долго. Двери открываются в серверную без конца, где тихо гудят стойки. Ты нажимаешь «1» раньше, чем что-то успевает выйти навстречу.", effects: {bw_rot: 3, skill_xp:netrunning: 2}}
      fail: {text: "Двери открываются в темноту, и из темноты кто-то говорит твоим голосом. Ты приходишь в себя в холле, лифт стоит открытый и пустой.", effects: {bw_rot: 4, mood: -5, hp: -3}}
    - label: Подняться пешком
      effects: {mood: -1}
      text: "Двадцать этажей пешком. Когда ты проходишь мимо шахты лифта, оттуда слышно, как кто-то едет вниз."

- id: bwh_dreams
  title: Сны о серверных
  category: rare
  weight: 2
  conditions:
    flags_all: [bw_r1]
    flags_none: [abroad]
  text: "Пятую ночь подряд снится один и тот же коридор из серверных стоек. Каждую ночь ты проходишь чуть дальше. Сегодня в конце коридора видна дверь."
  choices:
    - label: Открыть дверь во сне
      effects: {bw_rot: 3, skill_xp:netrunning: 3, mood: -3}
      text: "За дверью стена. Живая, из кода и лиц. Она расступается ровно настолько, чтобы за ней стало видно... Нет. Ты просыпаешься и не можешь вспомнить. Но пальцы помнят пароли, которых ты не знаешь."
    - label: Проснуться
      check: {stat: COOL, dv: 13}
      success: {text: "Ты заставляешь себя открыть глаза. Пять утра, мокрая подушка. Коридор исчезает. До следующей ночи.", effects: {mood: 1}}
      fail: {text: "Ты просыпаешься, но не сразу. Сначала на минуту просыпается кто-то другой в твоём теле и смотрит на потолок твоими глазами.", effects: {mood: -4, bw_rot: 1}}

- id: bwh_chat
  title: Чужие сообщения
  category: relationships
  weight: 2
  conditions:
    flags_all: [bw_r1]
    flags_none: [abroad]
  text: "В переписке с близкими сообщения, написанные не тобой. Отправлены ночью. Вежливые, тёплые и абсолютно чужие."
  choices:
    - label: Прочитать
      effects: {mood: -5, humanity: -1, bw_rot: 2}
      text: "«Скоро я стану лучше, — пишет кто-то твоими словами. — Скоро я перестану бояться». Ответы родных полны тревоги. Ты не знаешь, что им сказать."
    - label: Стереть всё
      effects: {mood: -2}
      text: "Ты удаляешь переписку целиком. Утром она снова на месте, а последнее сообщение — с твоего аккаунта, посреди ночи: «не стирай меня»."

- id: bwh_wake
  title: Пробуждение не дома
  category: rare
  weight: 2
  conditions:
    flags_all: [bw_r2]
    flags_none: [abroad]
  text: "Ты открываешь глаза на крыше в чужом районе. Рассвет, ветер. Штекер в нейропорте, провод уходит в вентиляционную шахту. Последние шесть часов в памяти пусты."
  choices:
    - label: Посмотреть логи
      effects: {bw_rot: 3, skill_xp:netrunning: 4, mood: -3}
      text: "Логи показывают, что всю ночь твой нейропорт висел в сети района и что-то в неё писал. Код не читается. Но район внизу выглядит иначе: экраны мигают в одном ритме."
    - label: Выдернуть штекер и уйти
      effects: {hp: -4, mood: -3}
      text: "Провод выходит с искрой. Из шахты доносится разочарованный вздох. Домой ты добираешься пешком, через весь город."

- id: bwh_drones
  title: Кольцо дронов
  category: street
  weight: 2
  conditions:
    flags_all: [bw_r2]
    flags_none: [abroad]
  text: "Дроны доставки, полицейские дроны, рекламные дроны. Они висят над тобой кольцом и поворачиваются, когда ты поворачиваешься."
  choices:
    - label: Помахать им
      effects: {bw_rot: 2, mood: -2}
      text: "Ты поднимаешь руку. Все дроны разом наклоняются, будто кланяются. Прохожие снимают это на комм. К вечеру видео удалено отовсюду."
    - label: Сбить один
      effects: {eddies: 400, heat: 1}
      text: "Дрон падает к ногам. В его памяти нет заказов, только твои фотографии. Все, с самого детства. Ты продаёшь железо барыге и стараешься не думать."

- id: bwh_shadow
  title: Тень на камерах
  category: rare
  weight: 2
  conditions:
    flags_all: [bw_r3]
    flags_none: [abroad]
  text: "На всех камерах подъезда за тобой идёт кто-то. В зеркале никого. На записи видно, что он уже стоит у тебя за спиной."
  foe: Эхо Заслона
  choices:
    - label: Обернуться и драться
      violent: true
      effects: {start_combat: 3, bw_rot: 3}
      text: "Оно становится плотным ровно в тот момент, когда ты бьёшь. Помехи в форме человека, и бьют они больно."
    - label: Бежать
      check: {stat: REF, skill: stealth, dv: 16}
      success: {text: "Ты бежишь через дворы, гасишь комм, прячешься в толпе. Камеры теряют вас обоих.", effects: {mood: -2}}
      fail: {text: "Оно догоняет тебя в переулке и проходит насквозь. Холод. Шум. Потом пусто.", effects: {hp: -10, bw_rot: 2, mood: -4}}
    - label: Позвать его по имени
      effects: {bw_rot: 5, humanity: -2}
      text: "Ты не знаешь, откуда знаешь его имя. Оно останавливается и отвечает. Твоим."

- id: bwh_old_voice
  title: Голос из прошлого
  category: relationships
  weight: 2
  conditions:
    flags_all: [bw_r3]
    flags_none: [abroad]
  text: "Звонит человек, которого давно нет в живых. Голос точный, до последней интонации. Он знает то, что знали только вы двое."
  choices:
    - label: Говорить
      effects: {mood: -6, bw_rot: 3, humanity: -1}
      text: "Вы говорите час. Он просит открыть ему дверь: «Мне холодно там, впусти меня». Ты почти соглашаешься. Связь обрывается на полуслове."
    - label: Положить трубку
      effects: {mood: -2, humanity: 1}
      text: "Это не он. Ты знаешь это и всё равно не можешь уснуть до утра."

- id: bwh_city_name
  title: Город шепчет
  category: rare
  weight: 2
  conditions:
    flags_all: [bw_r4]
    flags_none: [abroad]
  text: "Ты выходишь на улицу, и все экраны квартала показывают твоё имя. Люди оборачиваются. Они не знают, почему смотрят на тебя."
  choices:
    - label: Принять это
      effects: {bw_rot: 4, fame: 3, heat: 2}
      text: "Ты идёшь по улице, и экраны следуют за тобой, как свита. К вечеру о тебе говорят в трёх районах. NetWatch открывает дело."
    - label: Скрыться
      check: {stat: REF, skill: stealth, dv: 17}
      success: {text: "Капюшон, переулки, крыши. Экраны гаснут, теряя тебя.", effects: {mood: -2}}
      fail: {text: "Куда ни сверни, экраны находят тебя. Патруль NCPD тоже.", effects: {heat: 3, mood: -3}}

- id: bwh_dead_runner
  title: Мёртвый нетраннер
  category: rare
  weight: 2
  conditions:
    flags_all: [bw_r4]
    flags_none: [abroad]
    lacks_cyberware: [bw_siren]
  text: "В подворотне лежит нетраннер, сгоревший неделю назад. Когда ты проходишь мимо, он садится. Глаза пустые, голос — Заслона: «Возьми. Это для тебя». В руке у него шард."
  foe: Мёртвый нетраннер
  choices:
    - label: Взять шард
      effects: {cyberware_grant:bw_siren: true, flag_set:bw_owned: true, bw_rot: 6, humanity: -5}
      text: "Шард сам находит нейропорт. «Сирена» встаёт на место, и в голове начинает тихо петь. Тело нетраннера падает обратно, теперь уже окончательно."
    - label: Уничтожить тело
      violent: true
      effects: {start_combat: 4, bw_rot: 2}
      text: "Мёртвый двигается быстрее живых. Его ведёт что-то, у чего нет усталости."
    - label: Уйти
      effects: {mood: -3}
      text: "Ты уходишь. Сзади слышно, как он ложится обратно. «Потом», — говорит голос."

# -- the cult ----------------------------------------------------------------------------------------------------------

- id: bw_cult_call
  title: Проповедник помех
  category: street
  weight: 2
  conditions:
    flags_none: [bw_cult_in, abroad]
  text: "На углу у станции стоит человек в сером балахоне. Вместо чёток — витой провод, на шее — сгоревший нейрочип. «Церковь Тихого Шума, — говорит он. — Вы слышите шум в наушниках по ночам? Это не помехи. Это голос того, кто за Заслоном. Он зовёт вас»."
  choices:
    - label: Выслушать проповедь
      effects: {flag_set:bw_cult_in: true, flag_set:blackwall_contact: true, bw_rot: 3, bw_favor: 1}
      text: "Он говорит час, и ты слушаешь дольше, чем хотелось бы. В конце он вкладывает тебе в ладонь шард с адресом. «Мы собираемся по ночам. Заслон любит тех, кто не боится». Теперь тебя знают в Церкви, а в городе открываются подвалы, куда раньше не пускали."
    - label: Посмеяться
      effects: {mood: 1}
      text: "Ты смеёшься. Проповедник улыбается в ответ. «Он тоже смеётся», — говорит он, и в наушниках у тебя на секунду шипит."
    - label: Сдать патрулю
      effects: {eddies: 300, street_cred: -1}
      text: "Патруль NCPD уводит проповедника. Он не сопротивляется. Тебе платят за наводку. Ночью в наушниках долго шипит."

- id: bw_cult_vigil
  title: Ночное бдение
  category: relationships
  weight: 2
  conditions:
    flags_all: [bw_cult_in]
    flags_none: [abroad]
  text: "Подвал под закрытым кинотеатром. Свечи, сгоревшие деки на алтаре, люди в сером. Они слушают белый шум из старого динамика, и им кажется, что он отвечает."
  choices:
    - label: Слушать вместе со всеми
      effects: {bw_favor: 3, bw_rot: 3, humanity: -1}
      text: "К четвёртому часу шум складывается в слова. Не в твоём языке. Но ты понимаешь. Архиерей кивает тебе с другого конца подвала."
    - label: Стоять на дверях
      check: {stat: BODY, skill: melee, dv: 14}
      success: {text: "Двое бездомных искателей приключений решают заглянуть на огонёк. Уходят быстро и без зубов. Культ ценит тех, кто охраняет тишину.", effects: {bw_favor: 2, street_cred: 1}}
      fail: {text: "Незваные гости оказываются копами в штатском. Ты отбиваешься и уходишь в числе последних. По крайней мере, никого не взяли.", effects: {hp: -5, heat: 1, bw_favor: 1}}
    - label: Уйти раньше
      effects: {bw_favor: -1}
      text: "Ты выходишь под дождь. Шум в динамике замолкает, как только закрывается дверь."

- id: bw_cult_schism
  title: Раскол в Церкви
  category: rare
  weight: 1
  conditions:
    flags_all: [bw_cult_in, bwq_1]
    flags_none: [abroad, bw_schism_done]
  text: "В Церкви Тихого Шума раскол. Отступники говорят, что архиерей продал общину NetWatch, и собираются его убить на ближайшем бдении. И те и другие ждут, на чью сторону встанешь ты."
  foe: Вожак отступников
  choices:
    - label: Встать за архиерея
      violent: true
      effects: {start_combat: 3, flag_set:bw_schism_done: true, bw_favor: 6, bw_rot: 2}
      text: "Отступники приходят со стволами. Уходят не все. Архиерей лично благодарит тебя и обещает доступ к реликвиям общины."
    - label: Встать за отступников
      effects: {flag_set:bw_schism_done: true, bw_favor: -6, bw_rot: -6, humanity: 3}
      text: "Ты помогаешь отступникам вывести людей из подвала до прихода архиерея. Половина общины расходится по домам и больше не возвращается. Кто-то из них, уходя, плачет от облегчения."
    - label: Остаться в стороне
      effects: {flag_set:bw_schism_done: true, bw_favor: -1}
      text: "Ты не приходишь на бдение. Утром узнаёшь, что всё обошлось криком и разбитым алтарём. Пока что."

- id: bw_cult_raid
  title: Облава на Церковь
  category: ncpd
  weight: 1
  conditions:
    flags_all: [bw_cult_in]
    flags_none: [abroad]
  text: "Посреди бдения гаснет свет. В подвал спускаются люди в броне с эмблемой NetWatch на плечах. «Всем лечь на пол. Импланты отключить»."
  foe: Командир облавы
  choices:
    - label: Прикрыть отход братьев
      violent: true
      effects: {start_combat: 4, bw_favor: 6, heat: 2}
      text: "Ты встаёшь у лестницы, пока община уходит через коллектор. Отряд облавы не ждал сопротивления."
    - label: Уйти через коллектор
      check: {stat: REF, skill: stealth, dv: 15}
      success: {text: "Ты находишь лаз раньше всех и выводишь за собой ещё троих. Культ это запомнит.", effects: {bw_favor: 2}}
      fail: {text: "Тебя замечают в коллекторе. Удар шокером, побег по колено в воде. Лицо попало на камеры.", effects: {hp: -6, heat: 3}}
    - label: Сдать братьев
      effects: {flag_clear:bw_cult_in: true, bw_favor: -50, eddies: 2000, humanity: -3}
      text: "Ты называешь имена. NetWatch платит и отпускает. Церковь Тихого Шума больше не откроет тебе дверь. А по ночам в наушниках теперь не шипит, а молчит. Это хуже."

- id: bw_raven_warn
  title: Люси предупреждает
  category: relationships
  weight: 3
  conditions:
    flags_all: [raven_trust, bwq_2]
    flags_none: [bw_raven_warned, bw_avatar, abroad]
  text: "Комм оживает сам. На экране помехи и женское лицо, то самое, из мастерской Raven. «Я знаю, куда ты идёшь. Я оттуда. Заслон не дарит силу, он даёт её взаймы и забирает с процентами. Я помню, кем была до него. Почти»."
  choices:
    - label: Послушать Люси
      effects: {flag_set:bw_raven_warned: true, bw_rot: -10, humanity: 3, mood: 2}
      text: "Люси говорит долго и тихо: как держаться за своё имя, как различать свои мысли и чужие. Голоса в голове на время стихают. «Я не буду тебя останавливать, — говорит она напоследок. — Но я запомню твоё настоящее имя»."
    - label: Сказать, что выбор сделан
      effects: {flag_set:bw_raven_warned: true, bw_rot: 3, mood: -2}
      text: "Она долго молчит. Потом: «Тогда я буду рядом, когда станет больно». Экран гаснет. Где-то на другом конце города Raven Tearz снимает наушники и смотрит в пустоту."
