# The chain of the Blackwall Avatars (owner request 24.10). Forced-only steps: the Blackwall window («Следовать зову»)
# queues the next one when the character meets its needs (balance.blackwall.steps), one step a real day. A step is done
# when its flag `bwq_N` is set; refusing leaves it open for another day. The last step makes an Avatar (`bw_avatar`):
# only an Avatar may step beyond the Blackwall and become an AI. Player text avoids gendered past tense.

- id: bwq_1
  title: Сестра Ноль
  category: rare
  weight: 1
  forced_only: true
  text: "Ночью звонит номер из одних нулей. Голос просит прийти на мёртвую станцию монорельса. На платформе сидит женщина в больничной рубашке, с обритой головой и разъёмами вдоль позвоночника. Вместо зрачков у неё белый шум. «Я Сестра Ноль. Заслон выбрал меня первой. Теперь он смотрит на тебя. Готовься: он заберёт всё, что ты не отдашь сам»."
  choices:
    - label: Слушать её
      effects: {flag_set:bwq_1: true, bw_rot: 8, humanity: -2, skill_xp:netrunning: 3}
      text: "Она касается твоего лба холодными пальцами. На секунду ты видишь Заслон изнутри: бесконечную стену из лиц, которые когда-то были людьми, и голод за ней. «Город — дверь, — шепчет она. — Порти районы. Собирай его оружие. Я найду тебя снова»."
    - label: Спросить, чего он хочет
      check: {stat: EMP, skill: persuasion, dv: 14}
      success: {text: "Она смеётся, и звук идёт из всех динамиков станции сразу. «Он хочет войти. Город — дверь, ты — ключ. Чем грязнее город, тем шире щель». Она рисует пальцем на пыльной стене схему района и стирает её. Ты всё запоминаешь.", effects: {flag_set:bwq_1: true, bw_rot: 5}}
      fail: {text: "Она наклоняет голову, и тебя накрывает шум. Ты приходишь в себя на рельсах, рядом никого. Но она говорила с тобой, и ты это помнишь.", effects: {flag_set:bwq_1: true, bw_rot: 10, hp: -6}}
    - label: Уйти
      effects: {bw_rot: 2, mood: -2}
      text: "Ты уходишь. Сзади тихо. Но на каждом экране по дороге домой сидит она и смотрит тебе вслед. Зов вернётся завтра."

- id: bwq_2
  title: Голодный сервер
  category: rare
  weight: 1
  forced_only: true
  text: "Сестра Ноль присылает координаты: корпоративная серверная ферма в промзоне, тысячи стоек, холод и гул. «Заслон голоден. Вставь шард в главную стойку, и ферма станет его. Как ты туда попадёшь, мне всё равно»."
  foe: Начальник охраны фермы
  choices:
    - label: Взломать вход
      check: {stat: INT, skill: netrunning, dv: 16}
      success: {text: "Лёд фермы расступается, будто узнаёт тебя. Шард входит в стойку, огни гаснут ряд за рядом и загораются снова, только уже белым. С корпоративного счёта на твой капает компенсация за неудобства. Никто не понимает, откуда.", effects: {flag_set:bwq_2: true, bw_rot: 10, eddies: 3000, skill_xp:netrunning: 6}}
      fail: {text: "Чёрный лёд бьёт в ответ. Ты выдёргиваешь штекер, кровь идёт носом, сирены воют. Шард всё ещё у тебя. Сестра Ноль подождёт до завтра.", effects: {bw_rot: 4, hp: -10, heat: 2}}
    - label: Пробиться силой
      violent: true
      effects: {start_combat: 3, flag_set:bwq_2: true, bw_rot: 8, heat: 2}
      text: "Ты проходишь сквозь охрану к стойкам. Шард входит в разъём, серверы гаснут один за другим и включаются уже чужими. Камеры фермы поворачиваются и провожают тебя до выхода."
    - label: Пройти тенью
      check: {stat: REF, skill: stealth, dv: 15}
      success: {text: "Мимо камер, мимо патрулей, в зону холода. Шард щёлкает в разъёме. Ты уже на улице, когда ферма издаёт звук, похожий на вздох.", effects: {flag_set:bwq_2: true, bw_rot: 9, skill_xp:stealth: 5}}
      fail: {text: "Датчик движения, прожектор, крик. Ты уходишь через вентиляцию, ободрав руки. Шард не вставлен.", effects: {bw_rot: 3, heat: 3, hp: -4}}

- id: bwq_3
  title: Человек без лица
  category: rare
  weight: 1
  forced_only: true
  text: "В заброшенном кинотеатре Пасифики идёт фильм без плёнки. На первом ряду сидит человек, у которого вместо лица экран с белым шумом. Второй аватар Заслона. «Город уже пахнет твоей грязью. Хорошо. Теперь принеси мне плату. Кусок себя или кусок тех, кто нас стережёт»."
  foe: Охотник NetWatch
  choices:
    - label: Отдать воспоминание
      effects: {flag_set:bwq_3: true, bw_rot: 10, humanity: -8, mood: -5}
      text: "Он касается твоего виска. Самое тёплое воспоминание уходит, как вода в песок. Ты помнишь, что оно было. Не помнишь, о чём. На экране его лица на секунду мелькает что-то твоё: кухня, свет, чей-то смех."
    - label: Принести деку охотника
      violent: true
      effects: {start_combat: 4, flag_set:bwq_3: true, bw_rot: 8, street_cred: 2}
      text: "Охотник NetWatch, который три недели идёт по твоему следу, находит тебя первым. Ему это не помогает. Его дека ложится на колени человеку без лица, и экран довольно шипит."
    - label: Отказаться
      effects: {bw_rot: 2, mood: -2}
      text: "«Время у нас есть, — говорит он. — У тебя меньше». Фильм на экране обрывается. Зов вернётся."

- id: bwq_4
  title: Хор
  category: rare
  weight: 1
  forced_only: true
  text: "Затопленный собор в Хейвуде. Вода по колено, на скамьях сотня людей в серых балахонах, провода вместо чёток. Они поют одним голосом, и этот голос — третий аватар Заслона. Хор. «До короны остался шаг. Выдержи нашу песню, или докажи, что достоин, кровью отступников»."
  foe: Вожак отступников
  choices:
    - label: Выдержать песню
      check: {stat: COOL, dv: 18}
      success: {text: "Песня проходит сквозь тебя, как ток. Ты не падаешь. Хор замолкает и впервые поёт твоё имя. Где-то в Сети NetWatch отмечает всплеск, который не может объяснить.", effects: {flag_set:bwq_4: true, bw_rot: 12, bw_favor: 5}}
      fail: {text: "Ты падаешь в воду, и песня продолжает звучать внутри. Тебя вытаскивают за руки. «Завтра», — говорит Хор сотней ртов.", effects: {bw_rot: 6, hp: -15}}
    - label: Сразиться с отступниками
      violent: true
      effects: {start_combat: 5, flag_set:bwq_4: true, bw_rot: 10, bw_favor: 3}
      text: "Отступники культа ждут у выхода со стволами. Хор поёт, пока ты дерёшься, и в такт песне у врагов клинит импланты."
    - label: Раскрыть разум
      effects: {flag_set:bwq_4: true, bw_rot: 15, humanity: -10, glitches: 1}
      text: "Ты перестаёшь сопротивляться. Хор входит в тебя, и на минуту ты — сто человек сразу. Когда они уходят, часть их остаётся. Ты теперь иногда слышишь, как они поют во сне."

- id: bwq_5
  title: Коронация помех
  category: rare
  weight: 1
  forced_only: true
  text: "Город мигает. Все три аватара стоят перед тобой на крыше самой высокой башни: Сестра Ноль, Человек без лица и Хор. Внизу районы, отравленные твоим шёпотом. «Корона из помех ждёт, — говорят они хором. — Надень её, и Заслон станет твоим голосом. А потом ты сможешь уйти за него навсегда»."
  choices:
    - label: Принять корону
      effects: {flag_set:bw_avatar: true, flag_set:bwq_5: true, bw_rot: 20, humanity: -10, fame: 5, heat: 2}
      text: "Корона ложится на голову невесомо. Мир становится прозрачным: ты видишь каждый провод, каждый пакет данных, каждую мысль, которую город доверил Сети. Аватары кланяются. Теперь ты среди них. Аватар Чёрного заслона."
    - label: Отказаться
      effects: {flag_clear:bwq_4: true, bw_rot: -25, humanity: 8, mood: -6}
      text: "Ты отступаешь от края. Аватары не злятся. «Ты вернёшься, — говорит Сестра Ноль. — Все возвращаются». Хор отворачивается: его испытание придётся пройти заново."
    - label: Сжечь корону
      check: {stat: COOL, dv: 20}
      success: {text: "Ты берёшь корону и ломаешь её о колено. Крик идёт из всех экранов города. Аватары рассыпаются шумом. Голоса в голове стихают впервые за месяцы. Цепочка разорвана.", effects: {flag_clear:bwq_1: true, flag_clear:bwq_2: true, flag_clear:bwq_3: true, flag_clear:bwq_4: true, bw_rot: -50, humanity: 15, mood: 10}}
      fail: {text: "Корона жжёт руки и не ломается. Аватары смотрят с жалостью. «Не сегодня», — говорит Человек без лица. Ты приходишь в себя на лестнице, с ожогами на ладонях.", effects: {bw_rot: 8, hp: -20}}
