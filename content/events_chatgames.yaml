      effects: {eddies: 1200, humanity: -1, later: [{weeks: 2, chance: 0.4, effects: {hp: -6, mood: -5}, text: "Ночью кто-то стучит в окно три раза. Утром на подоконнике мокрые следы. Ты плохо спишь неделю.", fail_text: "Никто не пришёл. Наверное, просто записка."}]}
      text: "Тысяча двести эдди и детская фотография. Фотографию ты выбрасываешь в залив. Деньги оставляешь."
    - label: Бросить обратно в воду
      effects: {mood: 1}
      text: "Пусть найдёт тот, кому она нужнее. Бутылка уплывает к Пасифике."
