# Events of the chat games (owner request): a note in a bottle from the fishing.

- id: fish_bottle_note
  title: Записка в бутылке
  category: rare
  weight: 1
  forced_only: true
  text: "Записка в бутылке написана карандашом: «Если найдёте это — под третьей сваей пирса 13 мой тайник. Отдайте половину дочери, она живёт в Уотсоне. Не оставляйте всё себе. Я узнаю»."
  choices:
    - label: Найти тайник и отдать половину
