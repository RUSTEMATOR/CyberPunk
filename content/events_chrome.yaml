# Events of M6: the humanity warnings. DESIGN.md 7.
# Both are `forced_only`: services/followups.py puts them in the week's queue when humanity crosses
# balance.cyber.warn_humanity_low / warn_humanity_critical on its way down.

- id: humanity_warning_low
  title: Чужое лицо в зеркале
  category: implants
  weight: 1
  forced_only: true
  text: "Утром ты долго смотришь в зеркало и не узнаёшь собственное лицо. Разговоры с людьми давно стали работой, а руки всё делают сами. Сколько тебя ещё осталось под хромом, сказать трудно."
  choices:
    - label: Позвонить старому другу
      effects: {humanity: 2, mood: 3}
      text: "Час разговора ни о чём: старые глупости, общие знакомые, смех в трубке. После звонка в голове становится тише."
    - label: Сеанс у риппера
      effects: {humanity: 4, eddies: -300}
      text: "Риппер подключает тебя к терапевтической стойке и просит рассказать, что ты чувствуешь. Говорить трудно, но после сеанса дышится легче. Триста эдди — дешевле, чем потом разгребать последствия."
    - label: Отмахнуться
      effects: {mood: -2}
      text: "Ты надеваешь куртку и уходишь, больше не глядя в зеркало. Настроение испорчено на весь день."

- id: humanity_warning_critical
  title: Красный шум
  category: implants
  weight: 1
  forced_only: true
  text: "Среди ночи в ушах поднимается тонкий красный шум. Ты просыпаешься с ножом в руке и не помнишь, откуда он взялся. Ещё один срыв, и решать за тебя будет хром."
  choices:
    - label: Лечь в клинику
      effects: {humanity: 6, eddies: -800, mood: -1}
      text: "Сутки под капельницей, ремни на запястьях и врач, который говорит с тобой как с человеком. На выписке советуют не ставить новый хром, пока не придёшь в норму. Счёт — восемьсот эдди."
    - label: Выпить и переждать
      effects: {humanity: 1, mood: -3, eddies: -100}
      text: "Бутылка и тишина. К утру шум стихает, только бутылка тут ни при чём: ночь просто закончилась. Сто эдди за выпивку и пустая голова."
    - label: Не думать
      effects: {mood: -5}
      text: "Ты убираешь нож в ящик и ложишься обратно. Уснуть так и не удаётся, а утром дрожат руки."
