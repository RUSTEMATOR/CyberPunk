# District life (owner request: more variety where the group lives). Ordinary random events bound to a district.

# -- Вестбрук ----------------------------------------------------------------------------------------------------------

- id: dist_westbrook_onsen
  title: Онсэн в Японтауне
  category: rare
  weight: 2
  conditions:
    districts: [westbrook]
  text: "Старый онсэн в Японтауне: горячая вода, тишина и табличка «С имплантами не входить, вода портит электронику». Хозяйка смотрит на тебя оценивающе."
  choices:
    - label: Отмокать час (100)
      effects: {eddies: -100, hp: 6, mood: 6}
      text: "Горячая вода вытягивает из тела весь город. Ты выходишь другим человеком, хотя бы до вечера."
    - label: Поговорить с хозяйкой
      check: {stat: EMP, skill: persuasion, dv: 12}
      success: {text: "Хозяйка рассказывает о якудза, которые держат квартал, и о том, кому в этом районе лучше не переходить дорогу. Полезные сплетни.", effects: {add_npc:contact: true}}
      fail: {text: "Хозяйка вежливо улыбается и ничего не говорит. Это тоже ответ.", effects: {}}

- id: dist_westbrook_yakuza_debt
  title: Долг перед якудза
  category: money
  weight: 2
  conditions:
    districts: [westbrook]
  text: "Человек в идеальном костюме кланяется и протягивает конверт: сосед задолжал его хозяевам, а ты значишься поручителем. Такой подписи ты не помнишь. Вроде бы."
  choices:
    - label: Заплатить (500)
      effects: {eddies: -500}
      text: "Человек кланяется ещё раз. Через неделю сосед приносит тебе бутылку саке и половину суммы."
    - label: Объясниться
      check: {stat: COOL, skill: persuasion, dv: 15}
      success: {text: "Ты спокойно показываешь, что подпись не твоя. Человек в костюме долго смотрит, потом извиняется. Якудза ценят точность.", effects: {street_cred: 1}}
      fail: {text: "Он вежливо выслушивает и так же вежливо ломает тебе два пальца. Платить всё равно придётся.", effects: {hp: -5, eddies: -500}}

- id: dist_westbrook_pachinko
  title: Патинко
  category: money
  weight: 2
  conditions:
    districts: [westbrook]
  text: "Зал патинко гремит тысячей стальных шариков. Говорят, один автомат в углу подкручен и иногда сыплет джекпот."
  choices:
    - label: Найти тот автомат (100)
      check: {stat: LUCK, dv: 13}
      success: {text: "Шарики сыплются рекой. Менеджер подходит с кислым лицом и выдаёт призовые жетоны, которые меняют на деньги в окошке за углом.", effects: {eddies: 700, mood: 5}}
      fail: {text: "Автомат съедает сотню и мигает «Попробуй ещё».", effects: {eddies: -100}}
    - label: Просто смотреть
      effects: {mood: 1}
      text: "Сотни людей, стальные шарики и гипнотический шум. Странное место, чтобы успокоиться, но работает."

# -- Хейвуд ------------------------------------------------------------------------------------------------------------

- id: dist_heywood_quince
  title: Кинсеаньера
  category: relationships
  weight: 2
  conditions:
    districts: [heywood]
  text: "У соседей кинсеаньера: дочери пятнадцать, весь квартал гуляет на улице. Тебя тоже зовут к столу, отказываться невежливо."
  choices:
    - label: Прийти с подарком (150)
      effects: {eddies: -150, mood: 8, humanity: 1, add_npc:friend: true}
      text: "Ты танцуешь с бабушкой именинницы и ешь тамалес до утра. Квартал теперь здоровается с тобой первым."
    - label: Зайти ненадолго
      effects: {mood: 3}
      text: "Ты выпиваешь стопку за именинницу и уходишь. Музыка играет до рассвета."

- id: dist_heywood_lowrider
  title: Лоурайдеры
  category: street
  weight: 2
  conditions:
    districts: [heywood]
  text: "Воскресенье, парк: лоурайдеры прыгают на гидравлике, музыка, жареная кукуруза. Ребята из гаража спорят, чья тачка подпрыгнет выше."
  choices:
    - label: Помочь с гидравликой
      check: {stat: TECH, skill: tech, dv: 13}
      success: {text: "Ты подкручиваешь клапан, и тачка взлетает выше всех. Гараж угощает тебя пивом и зовёт приходить ещё.", effects: {skill_xp:tech: 2, street_cred: 1, mood: 4}}
      fail: {text: "Клапан лопается, масло летит на зрителей. Тебя прогоняют под общий смех.", effects: {mood: -2}}
    - label: Просто отдыхать
      effects: {mood: 5}
      text: "Солнце, музыка и кукуруза с перцем. Хороший день."

- id: dist_heywood_church
  title: Церковь на углу
  category: rare
  weight: 1
  conditions:
    districts: [heywood]
  text: "Старый падре в церкви на углу кормит всех, кто зайдёт, и не спрашивает, кто ты и что сделал. Сегодня ему не хватает рук на кухне."
  choices:
    - label: Помочь
      effects: {humanity: 2, mood: 4}
      text: "Ты режешь лук три часа. Падре благословляет тебя и не спрашивает, нужно ли тебе это."
    - label: Оставить пожертвование (200)
      effects: {eddies: -200, humanity: 1}
      text: "Падре благодарит и говорит, что двести эдди — это сорок обедов. Ты думаешь об этом весь вечер."

# -- Санто-Доминго -----------------------------------------------------------------------------------------------------

- id: dist_sd_factory
  title: Ночная смена на заводе
  category: work
  weight: 3
  conditions:
    districts: [santo_domingo]
  text: "Завод Petrochem ищет людей на ночную смену: вредно, громко, платят наличными в конце смены."
  choices:
    - label: Отработать
      check: {stat: BODY, dv: 12}
      success: {text: "Двенадцать часов у пресса. Руки гудят, в лёгких химия, в кармане деньги.", effects: {eddies: 450, hp: -2}}
      fail: {text: "Под утро тебя задевает конвейером. Мастер платит половину и вычитает за бинты.", effects: {eddies: 200, hp: -7}}
    - label: Не губить лёгкие
      effects: {}
      text: "Ты смотришь на трубы, дымящие в небо, и идёшь искать другой заработок."

- id: dist_sd_scrapyard
  title: Свалка роботов
  category: money
  weight: 2
  conditions:
    districts: [santo_domingo]
  text: "За заводами огромная свалка списанных промышленных роботов. Охраны нет, только бродячие собаки и мусорщики."
  choices:
    - label: Покопаться
      check: {stat: TECH, skill: tech, dv: 13}
      success: {text: "В брюхе старого манипулятора целые сервоприводы. Барыга платит за них неплохо.", effects: {eddies: 600, skill_xp:tech: 1}}
      fail: {text: "Ты режешь руку о ржавый лист и уходишь ни с чем. Нужен укол от столбняка.", effects: {hp: -4, eddies: -50}}
    - label: Не связываться с мусорщиками
      effects: {}
      text: "Ты видишь у забора силуэты с фонарями и разворачиваешься."

- id: dist_sd_union
  title: Забастовка
  category: work
  weight: 2
  conditions:
    districts: [santo_domingo]
  text: "Рабочие завода бастуют: корпорация урезала зарплату. У ворот пикет, а к заводу едут автобусы со штрейкбрехерами и охраной."
  choices:
    - label: Встать в пикет
      check: {stat: BODY, dv: 13}
      success: {text: "Автобусы разворачиваются. Через три дня корпорация возвращает зарплаты. Рабочие запоминают твоё лицо.", effects: {street_cred: 2, humanity: 1, faction_rep:petrochem: -3}}
      fail: {text: "Охрана разгоняет пикет дубинками. Ты уходишь с разбитой бровью, но дух не сломлен.", effects: {hp: -6, street_cred: 1}}
    - label: Наняться штрейкбрехером
      effects: {eddies: 500, humanity: -2, faction_rep:petrochem: 2}
      text: "Ты проходишь сквозь пикет под плевки. Деньги платят, но обедать в этом районе теперь неуютно."

# -- Сити-центр --------------------------------------------------------------------------------------------------------

- id: dist_cc_lunch
  title: Обед с корпоратом
  category: work
  weight: 2
  conditions:
    districts: [city_center]
  text: "В кафе у башни к тебе подсаживается младший менеджер: ему нужен «уличный консультант», чтобы понять, чего хотят люди в районах. Платит за час."
  choices:
    - label: Рассказать правду
      effects: {eddies: 300, status: 1}
      text: "Ты рассказываешь про аренду, хром в долг и копов. Менеджер всё записывает и выглядит потрясённым. Возможно, что-то изменится. Скорее нет."
    - label: Наговорить ерунды
      effects: {eddies: 300, mood: 3}
      text: "Ты сочиняешь, что районы мечтают о корпоративной форме для детей. Он записывает с серьёзным лицом."

- id: dist_cc_glass_elevator
  title: Стеклянный лифт
  category: rare
  weight: 1
  conditions:
    districts: [city_center]
  text: "Стеклянный лифт застрял между этажами корпоративной башни. Внутри ты и старший вице-президент, который боится высоты."
  choices:
    - label: Успокоить его
      check: {stat: EMP, skill: persuasion, dv: 12}
      success: {text: "Сорок минут разговоров о рыбалке. Когда лифт трогается, вице-президент протягивает визитку: «Если что-то понадобится»", effects: {status: 2, add_npc:contact: true}}
      fail: {text: "Он паникует ещё сильнее и обвиняет тебя в том, что лифт застрял. Охрана внизу ведёт себя неприятно.", effects: {heat: 1}}
    - label: Молчать
      effects: {}
      text: "Ты смотришь на город внизу. Он смотрит в пол. Лифт едет дальше, будто ничего не было."

- id: dist_cc_protest
  title: Протест у башни
  category: ncpd
  weight: 2
  conditions:
    districts: [city_center]
  text: "У подножия корпоративной башни протест против принудительного хрома для рабочих. Полиция строится в шеренгу."
  choices:
    - label: Снимать на камеру
      check: {stat: REF, skill: stealth, dv: 13}
      success: {text: "Твоё видео, как полиция бьёт безоружных, разлетается по городу. Медиа покупают его за хорошие деньги.", effects: {eddies: 800, fame: 2, heat: 1}}
      fail: {text: "Коп выбивает камеру из рук и топчет её. Тебя оттаскивают в фургон.", effects: {heat: 2, jail_weeks: 1}}
    - label: Обойти стороной
      effects: {}
      text: "Ты сворачиваешь на соседнюю улицу. Сирены воют до вечера."

# -- Бэдлендс ----------------------------------------------------------------------------------------------------------

- id: dist_badlands_dust_storm
  title: Пыльная буря
  category: street
  weight: 2
  conditions:
    districts: [badlands]
  text: "С запада идёт стена пыли. Видимость падает до метра, связь пропадает. В такую бурю пропадают машины и люди."
  choices:
    - label: Укрыться в заправке
      effects: {mood: -1, add_npc:contact: true}
      text: "Ты пережидаешь бурю с тремя кочевниками и старым механиком. К утру у тебя новые знакомые и полная голова историй."
    - label: Ехать сквозь бурю
      check: {stat: REF, skill: driving, dv: 15}
      success: {text: "Ты ведёшь по памяти и чутью. Когда пыль оседает, ты уже у цели, раньше всех.", effects: {skill_xp:driving: 3, street_cred: 1}}
      fail: {text: "Машина вязнет в песке. Тебя откапывают кочевники и берут за это канистру воды.", effects: {hp: -5, eddies: -150}}

- id: dist_badlands_solar_farm
  title: Солнечная ферма
  category: money
  weight: 2
  conditions:
    districts: [badlands]
  text: "Брошенная солнечная ферма корпорации: тысячи панелей, никакой охраны. Кочевники говорят, что сюда раз в месяц приезжает проверка."
  choices:
    - label: Снять панели
      check: {stat: TECH, skill: tech, dv: 12}
      success: {text: "Панели уходят на чёрном рынке за хорошие деньги. Кочевники берут свою долю за то, что не мешали.", effects: {eddies: 900, heat: 1}}
      fail: {text: "Проверка приезжает раньше срока. Ты бросаешь всё и уходишь пешком через пустыню.", effects: {hp: -6, heat: 1}}
    - label: Оставить кочевникам
      effects: {faction_rep:aldecaldos: 2}
      text: "Ты рассказываешь о ферме клану. Они благодарят: им электричество нужнее, чем тебе деньги."

- id: dist_badlands_drive_in
  title: Кинотеатр под открытым небом
  category: rare
  weight: 1
  conditions:
    districts: [badlands]
  text: "Кочевники натянули экран между двух грузовиков и крутят старое кино. Попкорн из настоящей кукурузы, звёзды над головой."
  choices:
    - label: Остаться до конца
      effects: {mood: 8, humanity: 1}
      text: "Старый фильм о людях, которые ещё верили в будущее. Кочевники рядом подпевают песням из фильма."
    - label: Продавать напитки
      effects: {eddies: 250}
      text: "Ты торгуешь холодной водой из багажника. В пустыне это лучший бизнес."
