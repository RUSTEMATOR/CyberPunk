# Life of the new districts (owner request: more districts). Ordinary random events bound to a district, three each.

# -- Нортсайд ----------------------------------------------------------------------------------------------------------

- id: dist_ns_foundry_shift
  title: Ночная смена в литейке
  category: work
  weight: 3
  conditions:
    districts: [northside]
  text: "Литейному цеху «Всё для фронта» не хватает рук: заболела половина смены. Мастер платит наличными за ночь у печи. Жарко, громко и опасно."
  choices:
    - label: Отработать смену
      check: {stat: BODY, dv: 12}
      success: {text: "Двенадцать часов у печи. Мастер отсчитывает триста и зовёт приходить ещё.", effects: {eddies: 300, skill_xp:tech: 1}}
      fail: {text: "Брызги металла прожигают рукав. Мастер платит половину и даёт мазь от ожогов.", effects: {eddies: 150, hp: -5}}
    - label: Отказаться
      effects: {}
      text: "Ты слушаешь гул цеха из окна и засыпаешь под него."

- id: dist_ns_totentanz
  title: Клуб «Тотентанц»
  category: street
  weight: 2
  conditions:
    districts: [northside]
  text: "Вышибала клуба «Тотентанц» с красными линзами вместо глаз пропускает тебя внутрь. Хром блестит в стробоскопах, у стойки продают импланты прямо с подноса."
  choices:
    - label: Выпить и смотреть
      effects: {eddies: -60, mood: 5, street_cred: 1}
      text: "Ты пьёшь что-то синее и смотришь, как Мальстрёмовцы танцуют. Тебя запомнили. Надеешься, что по-хорошему."
    - label: Купить хром с подноса
      effects: {eddies: -400, cyberware_grant:knuckle_spikes: true, humanity: -1}
      text: "Риппер у стойки ставит шипы на костяшки за десять минут, между двумя коктейлями."
    - label: Уйти, пока не поздно
      effects: {}
      text: "Ты выходишь на свежий воздух. Свежим он кажется только по сравнению с клубом."

- id: dist_ns_robot_scrapyard
  title: Свалка роботов
  category: money
  weight: 2
  conditions:
    districts: [northside]
  text: "На свалке за железной дорогой списанные заводские роботы лежат горами. Сторож пускает покопаться за пятьдесят эдди."
  choices:
    - label: Копаться в железе
      check: {stat: TECH, skill: tech, dv: 13}
      success: {text: "Из трёх роботов собираются рабочие сервоприводы. Скупщик даёт за них семьсот.", effects: {eddies: 650, skill_xp:tech: 2}}
      fail: {text: "Робот, который казался мёртвым, дёргает манипулятором. Ты уходишь с синяком и без добычи.", effects: {eddies: -50, hp: -3}}
    - label: Не тратить время
      effects: {}
      text: "Горы железа остаются ждать кого-то другого."

# -- Портовый район ----------------------------------------------------------------------------------------------------

- id: dist_wf_container
  title: Контейнер без пломбы
  category: money
  weight: 3
  conditions:
    districts: [waterfront]
  text: "На терминале стоит контейнер с сорванной пломбой. Охранник курит в другую сторону уже десять минут. Внутри темно и что-то поблёскивает."
  choices:
    - label: Заглянуть внутрь
      check: {stat: LUCK, dv: 12}
      success: {text: "Внутри коробки с бронежилетами для армии какой-то далёкой страны. Один теперь твой, ещё два уходят скупщику.", effects: {item_grant:kevlar_hoodie: true, eddies: 400, heat: 1}}
      fail: {text: "Внутри мороженая рыба. И охранник, который как раз докурил.", effects: {heat: 1, mood: -2}}
    - label: Пройти мимо
      effects: {}
      text: "Через час контейнер увозят. Ты так и не узнаешь, что в нём было."
    - label: "Посмотреть сквозь стенку"
      ability: thermal
      effects: {eddies: 700}
      text: "Внутри двое спят на ящиках с оружием. Ты продаёшь эту информацию охране порта."
    - label: "Зайти невидимым"
      ability: cloak
      effects: {eddies: 1500, heat: 1}
      text: "Ты проходишь мимо охранника и выходишь с ящиком. Он так и курит в другую сторону."

- id: dist_wf_fish_market
  title: Рыбный рынок на рассвете
  category: relationships
  weight: 2
  conditions:
    districts: [waterfront]
  text: "На рыбном рынке в пять утра торгуют всем, что выловили ночью: рыбой, крабами и иногда утопленным хромом. Старая торговка зовёт помочь с ящиками."
  choices:
    - label: Помочь с ящиками
      effects: {mood: 4, add_npc:friend: true, hp: 1}
      text: "Ты таскаешь ящики до восьми утра. Торговка кормит тебя ухой и рассказывает про мужа-капитана."
    - label: Купить утопленный хром
      effects: {eddies: -300, later: [{weeks: 2, chance: 0.5, effects: {eddies: 900}, text: "Риппер чистит находку и выкупает её втрое дороже.", fail_text: "Хром проржавел насквозь. Риппер смеётся и выбрасывает его в ведро."}]}
      text: "Торговка заворачивает в газету непонятный имплант, весь в водорослях. «Повезёт — разбогатеешь»."

- id: dist_wf_smugglers
  title: Ночная лодка
  category: work
  weight: 2
  conditions:
    districts: [waterfront]
  text: "У пирса 13 швартуется лодка без огней. Капитан Рук машет тебе: нужен ещё один человек, чтобы быстро перетащить груз на берег. Платит сразу."
  choices:
    - label: Таскать груз
      check: {stat: COOL, skill: stealth, dv: 13}
      success: {text: "Двадцать ящиков за двадцать минут. Рук отдаёт пятьсот и не говорит, что было внутри.", effects: {eddies: 500, street_cred: 1}}
      fail: {text: "На пирс въезжает патрульная машина. Все разбегаются, ты — с ящиком в руках и полицейским на хвосте.", effects: {heat: 2}}
    - label: Отказаться
      effects: {}
      text: "Лодка уходит в туман так же тихо, как пришла."

# -- Маленькая Европа --------------------------------------------------------------------------------------------------

- id: dist_le_opera
  title: Вечер в опере
  category: relationships
  weight: 3
  conditions:
    districts: [little_europe]
  text: "У оперного театра продают последние билеты на «Тоску». Публика в мехах и смокингах, у входа охрана корпораций и пара туристов из НСША."
  choices:
    - label: Купить билет (200)
      effects: {eddies: -200, mood: 8, humanity: 2, status: 1}
      text: "Ты не понимаешь ни слова по-итальянски, но в третьем акте у тебя мокрые глаза. В антракте с тобой заговаривает корпоратка из Biotechnica."
    - label: Подработать в гардеробе
      effects: {eddies: 150, add_npc:contact: true}
      text: "Ты принимаешь шубы и слушаешь разговоры в фойе. Один из гостей оставляет визитку вместо чаевых."

- id: dist_le_antiques
  title: Антикварный ряд
  category: money
  weight: 2
  conditions:
    districts: [little_europe]
  text: "Старик в антикварной лавке продаёт вещи из довоенной Европы: часы, книги, пистолеты в бархатных коробках. Торгуется он с удовольствием."
  choices:
    - label: Торговаться за пистолет
      check: {stat: COOL, skill: persuasion, dv: 14}
      success: {text: "Старик сдаётся и отдаёт старый револьвер за полцены: «Вы торгуетесь, как мой отец»", effects: {eddies: -600, item_grant:heavy_revolver: true}}
      fail: {text: "Старик не уступает ни эдди. Ты уходишь с открыткой с видом Вены, которую он подарил из жалости.", effects: {mood: 1}}
    - label: Продать ему что-нибудь
      check: {stat: INT, dv: 12}
      success: {text: "Твоя старая зажигалка оказывается коллекционной. Старик платит триста и долго её разглядывает.", effects: {eddies: 300}}
      fail: {text: "Старик вежливо объясняет, что это китайская подделка. Понятно без слов.", effects: {mood: -1}}

- id: dist_le_lawyer
  title: Адвокат из кафе «Вена»
  category: ncpd
  weight: 2
  conditions:
    districts: [little_europe]
    min_heat: 1
  text: "В кафе «Вена» к тебе подсаживается человек в дорогом костюме: адвокат, который «случайно» знает о твоих проблемах с полицией. Предлагает их решить. Не бесплатно."
  choices:
    - label: Нанять адвоката (800)
      effects: {eddies: -800, heat: -2}
      text: "Через неделю твоё дело теряется в архиве. Адвокат присылает открытку с благодарностью за сотрудничество."
    - label: Отказаться
      effects: {}
      text: "Адвокат допивает эспрессо и оставляет визитку. «Если передумаете». Ты чувствуешь, что передумаешь."

# -- Норт-Оук ----------------------------------------------------------------------------------------------------------

- id: dist_no_garden_party
  title: Приём в саду
  category: relationships
  weight: 3
  conditions:
    districts: [north_oak]
  text: "Соседи-корпораты устраивают приём в саду: шампанское, струнный квартет и разговоры о слиянии компаний. Тебя приглашают, видимо, по ошибке."
  choices:
    - label: Пойти и держаться уверенно
      check: {stat: COOL, skill: persuasion, dv: 14}
      success: {text: "Ты пьёшь шампанское и шутишь про биржу так, что вице-президент Arasaka смеётся. Утром на почте приглашение на собеседование.", effects: {status: 2, add_npc:contact: true}}
      fail: {text: "Ты путаешь вилки, а потом имена. Хозяйка улыбается тебе так, что хочется исчезнуть.", effects: {mood: -4}}
    - label: Не ходить
      effects: {}
      text: "Ты смотришь на фейерверк над садом с балкона. Отсюда даже красивее."

- id: dist_no_security
  title: Частная охрана
  category: ncpd
  weight: 2
  conditions:
    districts: [north_oak]
  text: "Патруль частной охраны останавливает тебя на улице и требует объяснить, что ты делаешь в районе. Вежливо. С оружием наготове."
  choices:
    - label: Объясниться
      check: {stat: COOL, skill: persuasion, dv: 13}
      success: {text: "Охранник проверяет адрес и извиняется. Через неделю тот же патруль кивает тебе как знакомому.", effects: {mood: 1}}
      fail: {text: "Тебя продержали два часа в будке, пока не дозвонились до хозяина дома. Унизительно.", effects: {mood: -5}}
    - label: Показать деньги
      effects: {eddies: -200}
      text: "Двести эдди решают вопрос быстрее любых объяснений. Охранник желает тебе приятного вечера."

- id: dist_no_columbarium
  title: Колумбарий на холме
  category: relationships
  weight: 2
  conditions:
    districts: [north_oak]
  text: "В колумбарии Норт-Оук хранят прах богатейших семей города. Сторож предлагает экскурсию по ночам — за небольшую плату и обещание не трогать урны."
  choices:
    - label: Ночная экскурсия (100)
      effects: {eddies: -100, mood: 3, humanity: 1}
      text: "Имена основателей корпораций на мраморе. Все они в итоге поместились в одну нишу размером с коробку из-под обуви."
    - label: Поискать тайник
      check: {stat: INT, skill: stealth, dv: 15}
      success: {text: "За табличкой одного магната — ниша с флешкой. На ней компромат на половину совета директоров. Продаётся дорого.", effects: {eddies: 3000, heat: 1, humanity: -1}}
      fail: {text: "Сторож ловит тебя у чужой урны. Штраф и проклятие на латыни.", effects: {eddies: -300, mood: -3}}

# -- Глен --------------------------------------------------------------------------------------------------------------

- id: dist_glen_jury
  title: Повестка в суд
  category: ncpd
  weight: 2
  conditions:
    districts: [the_glen]
  text: "Тебе приходит повестка: присяжный заседатель на процессе по делу Валентинос. Суд длится три дня. Адвокаты обеих сторон очень хотят с тобой поговорить."
  choices:
    - label: Честно отсидеть процесс
      effects: {status: 1, humanity: 1, eddies: 150}
      text: "Три дня в душном зале. Ты голосуешь по совести, город платит суточные. Валентинос кивают тебе на улице. Или это угроза."
    - label: Поговорить с адвокатом защиты
      effects: {eddies: 1200, humanity: -2, faction_rep:valentinos: 2}
      text: "Адвокат передаёт конверт под столом в кафе. Подсудимый выходит на свободу, ты — с деньгами и тяжёлой головой."

- id: dist_glen_lowriders
  title: Воскресенье лоурайдеров
  category: relationships
  weight: 3
  conditions:
    districts: [the_glen]
  text: "Каждое воскресенье на Глен-авеню лоурайдеры показывают машины: прыгающие подвески, хром, музыка из багажников. Пахнет жареным мясом."
  choices:
    - label: Гулять и есть тако
      effects: {mood: 7, eddies: -30}
      text: "Ты ешь пять тако подряд и смотришь, как кадиллак подпрыгивает выше крыши. Лучшее воскресенье за месяц."
    - label: Помочь с подвеской
      check: {stat: TECH, skill: tech, dv: 12}
      success: {text: "Ты чинишь гидравлику, и машина побеждает в прыжках. Хозяин зовёт тебя на семейный ужин.", effects: {skill_xp:tech: 2, add_npc:friend: true}}
      fail: {text: "Гидравлика плюётся маслом тебе в лицо. Вся улица смеётся, но по-доброму.", effects: {mood: 2}}

- id: dist_glen_city_hall
  title: Очередь в мэрии
  category: work
  weight: 2
  conditions:
    districts: [the_glen]
  text: "В мэрии раздают городские подряды: уборка, ремонт, охрана избирательных участков. Очередь до улицы, а клерк у окна берёт «на чай»."
  choices:
    - label: Отстоять очередь
      effects: {eddies: 250, mood: -2}
      text: "Четыре часа в очереди, и тебе достаётся подряд на покраску забора. Деньги честные, спина болит."
    - label: Дать клерку «на чай»
      effects: {eddies: 400, humanity: -1}
      text: "Пятьдесят эдди на стойку — и ты получаешь хороший подряд без очереди. В этом городе так работает всё."

# -- Боевая зона -------------------------------------------------------------------------------------------------------

- id: dist_cz_water_day
  title: День воды
  category: street
  weight: 3
  conditions:
    districts: [combat_zone]
  text: "Сегодня банда открывает колонку: вода по талонам, очередь с оружием. У старухи впереди отбирают канистру."
  choices:
    - label: Заступиться за старуху
      check: {stat: BODY, skill: melee, dv: 14}
      success: {text: "Грабитель уходит без канистры и без зуба. Старуха благодарит и зовёт к себе на чай. Очередь смотрит с уважением.", effects: {street_cred: 2, humanity: 1}}
      fail: {text: "Грабитель оказывается не один. Канистру ты отбиваешь, но цена — разбитое лицо.", effects: {hp: -8, humanity: 1}}
    - label: Стоять в своей очереди
      effects: {mood: -2}
      text: "Ты получаешь свою воду и не оглядываешься. Здесь так выживают."

- id: dist_cz_arena
  title: Арена в кинотеатре
  category: street
  weight: 2
  conditions:
    districts: [combat_zone]
  text: "В бывшем кинотеатре бои без правил: на экране крутят старые боевики, в зале дерутся по-настоящему. Приз — патроны и еда на неделю."
  choices:
    - label: Выйти на арену
      check: {stat: BODY, skill: melee, dv: 15}
      success: {text: "Ты кладёшь соперника под финальные титры фильма. Зал ревёт. Приз и уважение района твои.", effects: {eddies: 400, street_cred: 2, hp: -3}}
      fail: {text: "Соперник опытнее. Ты лежишь на полу и смотришь, как на экране побеждает герой.", effects: {hp: -10}}
    - label: Ставить на бойцов
      check: {stat: LUCK, dv: 12}
      success: {text: "Твой боец выигрывает. Двести эдди за десять минут.", effects: {eddies: 200}}
      fail: {text: "Твой боец ложится в первом раунде. Подозрительно быстро.", effects: {eddies: -150}}

- id: dist_cz_rooftop_market
  title: Рынок на крышах
  category: money
  weight: 2
  conditions:
    districts: [combat_zone]
  text: "По доскам между крышами ходят торговцы: патроны, антибиотики, оружие без номеров. Внизу стреляют, наверху торгуются."
  choices:
    - label: Купить обрез (300)
      effects: {eddies: -300, item_grant:sawed_off: true}
      text: "Обрез без номера, приклад обмотан изолентой. Торговец клянётся, что он стрелял всего один раз."
    - label: Купить антибиотики
      effects: {eddies: -150, hp: 6}
      text: "Таблетки с просроченной этикеткой, но работают. Через день кашель проходит."
    - label: Просто посмотреть
      effects: {mood: 2}
      text: "Ты смотришь на город с крыши. Отсюда Боевая зона почти красивая."

# -- Университетский район ---------------------------------------------------------------------------------------------

- id: dist_uni_lecture
  title: Открытая лекция
  category: work
  weight: 3
  conditions:
    districts: [university]
  text: "В большой аудитории NCU открытая лекция о нейроинтерфейсах. Вход свободный, профессор известен тем, что после лекции раздаёт студентам подработку."
  choices:
    - label: Сидеть в первом ряду
      effects: {skill_xp:netrunning: 2, mood: 2}
      text: "Профессор рисует схемы на доске два часа. Половина прошла мимо, вторая пригодится."
    - label: Подойти после лекции
      check: {stat: INT, dv: 13}
      success: {text: "Профессор впечатлён твоим вопросом и предлагает подработку в лаборатории.", effects: {eddies: 400, add_npc:contact: true}}
      fail: {text: "Профессор отвечает на твой вопрос одним словом и уходит к студентам.", effects: {mood: -1}}

- id: dist_uni_experiment
  title: Добровольцы для эксперимента
  category: implants
  weight: 2
  conditions:
    districts: [university]
  text: "Лаборатория Biotechnica в кампусе ищет добровольцев для тестирования нового стимулятора. Платят хорошо, побочные эффекты «маловероятны»."
  choices:
    - label: Стать добровольцем
      check: {stat: BODY, dv: 13}
      success: {text: "Неделя под наблюдением, анализы и восемьсот эдди. Побочный эффект один: всё время хочется петь.", effects: {eddies: 800, mood: 3}}
      fail: {text: "На третий день у тебя трясутся руки и двоится в глазах. Лаборатория платит и просит подписать бумагу о неразглашении.", effects: {eddies: 800, hp: -6, glitches: 1}}
    - label: Отказаться
      effects: {}
      text: "Через месяц в новостях: «Biotechnica отзывает экспериментальный препарат». Хорошо, что без тебя."

- id: dist_uni_dorm_party
  title: Вечеринка в «Улье»
  category: relationships
  weight: 2
  conditions:
    districts: [university]
