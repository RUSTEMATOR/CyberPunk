# Events of the eras (owner request): the everyday life of each time, most of all the early chrome years
# (2013-2019) where the whole group lives now. Ordinary random events bound to their years.

# ======================================================================== Ранний хром, 2013-2019

- id: era13_first_chrome_line
  title: Очередь за хромом
  category: implants
  weight: 3
  available_until: 2019
  text: "У новой клиники Biotechnica очередь на три квартала: сегодня скидка на первые кибероптики. Люди спят на картонках, кто-то продаёт место в очереди."
  choices:
    - label: Продать своё место
      effects: {eddies: 250, mood: -1}
      text: "Корпоративный клерк платит двести пятьдесят, лишь бы не стоять. Ты уходишь с деньгами и без хрома."
    - label: Отстоять до конца
      check: {stat: BODY, dv: 12}
      success: {text: "Ночь на асфальте, утро у дверей. Тебе дают купон на скидку в любой клинике города.", effects: {eddies: 400, mood: 2}}
      fail: {text: "Под утро начинается давка. Ты выбираешься из толпы без купона и с синяками.", effects: {hp: -4, mood: -3}}
    - label: Пройти мимо
      effects: {}
      text: "Хром подождёт. Отдавать кусок себя за скидку пока не хочется."

- id: era13_chrome_rejection
  title: Отторжение
  category: implants
  weight: 2
  available_until: 2019
  conditions:
    requires: [has_cyberware]
  text: "Утром рука вокруг импланта распухла и горит. Ранний хром тело принимает не всегда. Риппер говорит, что ещё можно спасти, но дорого."
  choices:
    - label: К рипперу (600)
      effects: {eddies: -600, hp: 4}
      text: "Риппер чистит рану и ставит иммунодепрессанты. Неделя таблеток, и всё приживается."
    - label: Терпеть
      check: {stat: BODY, dv: 13}
      success: {text: "Три дня жара, потом отпускает. Тело смирилось с железом.", effects: {hp: -3}}
      fail: {text: "Жар не спадает. Приходится всё-таки идти к рипперу, только теперь дороже и больнее.", effects: {hp: -8, eddies: -900}}

- id: era13_samurai_riot
  title: Бунт у башни
  category: street
  weight: 2
  available_from: 2013
  available_until: 2013
  text: "У башни Arasaka рок-концерт перерос в бунт. Толпа ломает витрины, охрана стреляет резиновыми пулями. В толпе кричат, что корпорации пора ответить."
  choices:
    - label: Лезть в первые ряды
      check: {stat: REF, dv: 13}
      success: {text: "Ты орёшь, швыряешь бутылку и уходишь до того, как подъезжают броневики. Фото с тобой разлетается по Сети.", effects: {fame: 2, street_cred: 2, faction_rep:arasaka: -3, heat: 1}}
      fail: {text: "Резиновая пуля в рёбра, потом дубинка. Ночь в участке.", effects: {hp: -6, heat: 2, jail_weeks: 1}}
    - label: Растащить витрины
      effects: {eddies: 500, humanity: -1, heat: 1}
      text: "Пока все смотрят на сцену, ты выносишь из магазина электроники всё, что влезает в рюкзак."
    - label: Уйти подальше
      effects: {mood: -1}
      text: "Ты уходишь переулками. Утром новости называют это началом новой эпохи."

- id: era13_old_net_kid
  title: Мальчишка из Старой Сети
  category: rare
  weight: 2
  available_until: 2019
  text: "Пацан лет двенадцати с самодельной декой продаёт пароли от соседских банковских счетов. Говорит, что в Сети живёт призрак, который подсказывает ему коды."
  choices:
    - label: Купить пароль (200)
      check: {stat: LUCK, dv: 12}
      success: {text: "Пароль рабочий. На счету какого-то менеджера лежит больше, чем ты думал. Ты берёшь немного.", effects: {eddies: 900, heat: 1}}
      fail: {text: "Пароль устарел ещё вчера. Пацан пожимает плечами: «Призрак ошибается редко, но бывает».", effects: {eddies: -200}}
    - label: Отвести к нормальному нетраннеру
      effects: {humanity: 1, add_npc:protege: true}
      text: "Ты знакомишь пацана с нетраннером, которому можно доверять. Через месяц он приходит сказать спасибо и остаётся учиться у тебя."
    - label: Прогнать
      effects: {}
      text: "Ты велишь ему идти домой. Он смотрит так, будто дома у него нет."

- id: era13_biotech_trial
  title: Испытание bioware
  category: implants
  weight: 2
  available_from: 2015
  available_until: 2019
  text: "Biotechnica ищет добровольцев: новый органический имплант, пока без названия. Платят тысячу и обещают полное наблюдение врачей."
  choices:
    - label: Записаться
      check: {stat: BODY, dv: 13}
      success: {text: "Неделя в чистой палате, уколы и анализы. Тело принимает экспериментальную ткань, и ты уходишь с деньгами и железным иммунитетом.", effects: {eddies: 1000, hp: 5}}
      fail: {text: "На третий день начинается лихорадка. Деньги заплатили, но месяц ты приходишь в себя.", effects: {eddies: 1000, hp: -10, mood: -5}}
    - label: Отказаться
      effects: {}
      text: "Ты не хочешь быть подопытной крысой. Пусть пробуют на других."

- id: era13_gang_war_small
  title: Мелкая войнушка
  category: street
  weight: 3
  available_until: 2019
  faction: scavengers
  text: "Две мелкие банды делят перекрёсток у твоего дома. Пока это кулаки и монтировки, но вчера кто-то выстрелил в воздух."
  choices:
    - label: Помирить
      check: {stat: COOL, skill: persuasion, dv: 14}
      success: {text: "Ты собираешь главарей в лапшичной и делишь перекрёсток по часам. Обе стороны недовольны, значит, честно.", effects: {street_cred: 3, mood: 3}}
      fail: {text: "Главари мирятся. Друг с другом. Против тебя.", effects: {hp: -6, street_cred: -1}}
    - label: Встать на одну сторону
      violent: true
      effects: {start_combat: 1, street_cred: 1}
      text: "Ты выходишь на перекрёсток с битой. Одна банда за тебя, другая — уже нет."
    - label: Не лезть
      effects: {mood: -2}
      text: "Ты обходишь перекрёсток каждый день. Через месяц там всё равно кто-то останется главным."

- id: era13_vhs_braindance
  title: Первый брейнданс
  category: rare
  weight: 2
  available_until: 2019
  text: "Друг притаскивает первый в районе брейнданс-проигрыватель: огромный шлем на проводах. Записи пока любительские и мутные, но ощущение невероятное."
  choices:
    - label: Попробовать
      effects: {mood: 8, humanity: -1}
      text: "Ты проживаешь чужое утро на пляже в Калифорнии. Солнце, соль, тишина. Снимаешь шлем, и Найт-Сити кажется ещё серее."
    - label: Записать свой день и продать
      check: {stat: COOL, dv: 12}
      success: {text: "Запись твоего обычного дня покупают за сотни: людям интересна чужая жизнь, даже такая.", effects: {eddies: 450, fame: 1}}
      fail: {text: "Запись выходит мутной и тошнотворной. Друг смеётся до слёз.", effects: {mood: -2}}

- id: era13_corp_recruiter_street
  title: Вербовщик на углу
  category: work
  weight: 2
  available_until: 2019
  text: "Вербовщик Militech раздаёт листовки: армия наёмников растёт, нужны люди с крепкими нервами. Подъёмные — тысяча двести и бесплатная оптика."
  choices:
    - label: Подписать
      effects: {eddies: 1200, faction_rep:militech: 5, mood: -2}
      text: "Ты подписываешь бумагу, не читая мелкий шрифт. Деньги приходят сразу. Что ты подписал, выяснится позже."
    - label: Взять листовку и уйти
      effects: {}
      text: "Листовка уходит в мусорку через квартал. Армия подождёт."

- id: era13_tech_fair
  title: Ярмарка технологий
  category: money
  weight: 2
  available_until: 2019
  text: "В выставочном центре ярмарка будущего: летающие машины на макетах, говорящие холодильники и первые нейроинтерфейсы. Охрана расслаблена."
  choices:
    - label: Учиться у инженеров
      effects: {skill_xp:tech: 3, mood: 3}
      text: "Ты весь день задаёшь вопросы инженерам. Голова гудит, руки чешутся что-нибудь собрать."
    - label: Стащить прототип
      check: {stat: REF, skill: stealth, dv: 15}
      success: {text: "Прототип нейропорта уходит в твою сумку. Барыга на рынке платит, не веря своим глазам.", effects: {eddies: 1600, heat: 1}}
      fail: {text: "Охрана не такая расслабленная, как казалось. Тебя выводят под руки.", effects: {heat: 2, hp: -3}}

- id: era13_landlord
  title: Новый хозяин дома
  category: money
  weight: 3
  available_until: 2019
  text: "Дом выкупила корпоративная риелторская фирма. Новые хозяева поднимают аренду и обещают «облагородить район». Соседи собираются в подъезде."
  choices:
    - label: Организовать жильцов
      check: {stat: EMP, skill: persuasion, dv: 14}
      success: {text: "Сорок квартир подписывают общее письмо, адвокат из соседнего подъезда пишет иск. Аренду замораживают на год.", effects: {street_cred: 2, humanity: 1, mood: 4}}
      fail: {text: "Половина соседей боится подписывать. Аренда растёт, а ты теперь в списке «неудобных».", effects: {eddies: -300, mood: -3}}
    - label: Платить молча
      effects: {eddies: -200}
      text: "Ты платишь. Все платят. Район «облагораживается» камерами на каждом этаже."

- id: era13_street_doc
  title: Риппер в подсобке
  category: implants
  weight: 2
  available_until: 2019
  text: "В подсобке прачечной работает риппер без лицензии. У входа очередь из тех, кто не может позволить себе клинику. Он предлагает тебе подработку: держать пациентов."
  choices:
    - label: Помогать
      effects: {skill_xp:medicine: 3, eddies: 200, humanity: -1}
      text: "Ночь криков, крови и запаха антисептика. К утру ты умеешь ставить катетер и не падать в обморок."
    - label: Сдать его копам
      effects: {heat: -1, street_cred: -2}
      text: "Копы закрывают подсобку. Очередь расходится. Куда пойдут эти люди, никто не знает."
    - label: Отказаться
      effects: {}
      text: "Не сегодня. Риппер пожимает плечами: желающих хватает."

- id: era13_arcade_rival
  title: Король аркады
  category: street
  weight: 2
  available_until: 2019
  text: "В зале игровых автоматов местный чемпион вызывает всех желающих на дуэль в файтинг. Ставка — пятьдесят эдди и уважение района."
  choices:
    - label: Принять вызов
      check: {stat: REF, dv: 13}
      success: {text: "Три раунда, комбо на последней секунде. Зал взрывается. Чемпион жмёт тебе руку и платит.", effects: {eddies: 50, fame: 1, mood: 6}}
      fail: {text: "Тебя разносят за двадцать секунд. Дети смеются. Чемпион великодушно не берёт ставку.", effects: {mood: -3}}
    - label: Смотреть
      effects: {mood: 2}
      text: "Ты смотришь, как он раскатывает одного претендента за другим. Красиво."

- id: era13_pirate_radio
  title: Пиратская волна
  category: rare
  weight: 2
  available_until: 2019
  text: "По ночам в эфир выходит пиратское радио: голос рассказывает, какие корпорации травят воду в районе. Передатчик где-то рядом, и NCPD его ищет."
  choices:
    - label: Найти и помочь
      check: {stat: INT, skill: tech, dv: 13}
      success: {text: "Ты находишь передатчик на крыше и чинишь антенну. Голос в эфире благодарит «друга с крыши». Район тебя слушает.", effects: {fame: 2, humanity: 1, heat: 1}}
      fail: {text: "Ты находишь крышу, а там уже копы. Приходится делать вид, что ты просто куришь.", effects: {heat: 1}}
    - label: Сдать местоположение
      effects: {eddies: 500, humanity: -2, faction_rep:ncpd: 2}
      text: "NCPD платит за наводку. Радио замолкает на следующий день."

- id: era13_crypto_boom
  title: Первая криптолихорадка
  category: money
  weight: 2
  available_until: 2019
  text: "В баре все обсуждают новую цифровую валюту. Сосед вложил сотню и купил машину. Брокер в углу принимает наличные."
  choices:
    - label: Вложить 500
      check: {stat: LUCK, dv: 13}
      success: {text: "Курс взлетает, ты продаёшь вовремя. Сосед, который не продал, через неделю плачет в том же баре.", effects: {eddies: 1200, mood: 5}}
      fail: {text: "Курс падает через час после покупки. Брокер из угла исчезает вместе с наличными.", effects: {eddies: -500, mood: -4}}
    - label: Не верить
      effects: {}
      text: "Ты допиваешь пиво. Деньги, которых нельзя потрогать, всё ещё кажутся тебе сказкой."

- id: era13_neighbor_chrome
  title: Сосед с новой рукой
  category: relationships
  weight: 2
  available_until: 2019
  text: "Сосед поставил первую силовую руку и теперь не контролирует силу: ломает чашки, двери и вчера случайно сломал руку жене. Он плачет на лестнице."
  choices:
    - label: Поговорить с ним
      check: {stat: EMP, skill: persuasion, dv: 12}
      success: {text: "Ты сидишь с ним до утра. Он записывается к рипперу на настройку и просит прощения у жены. Похоже, всё наладится.", effects: {humanity: 2, mood: 3, add_npc:friend: true}}
      fail: {text: "Он не слушает и бьёт кулаком в стену рядом с твоей головой. Стена не выдерживает.", effects: {mood: -4}}
    - label: Вызвать социальную службу
      effects: {humanity: 1}
      text: "Приезжают двое в униформе и уводят соседа. Неизвестно, что с ним будет, но жена хотя бы в безопасности."

- id: era13_trauma_ad
  title: Реклама Trauma Team
  category: money
  weight: 2
  available_until: 2019
  text: "На каждом углу реклама: «Trauma Team. Мы прилетим за вами». Первый месяц подписки бесплатно, если подписать прямо сейчас у промоутера."
  choices:
    - label: Подписать пробный месяц
      effects: {mood: 2}
      text: "Промоутер выдаёт браслет. Мелким шрифтом: после месяца списание идёт автоматически. Ну хотя бы месяц ты под защитой."
    - label: Отмахнуться
      effects: {}
      text: "Платить за то, чтобы тебя спасли, если ты богатый. Очень по-найтсити."

- id: era13_gun_amnesty
  title: Амнистия оружия
  category: ncpd
  weight: 2
  available_until: 2019
  conditions:
    requires: [has_weapon]
  text: "Мэрия объявила амнистию: сдай незарегистрированный ствол и получи двести эдди без вопросов. У участка выстроилась странная очередь."
  choices:
    - label: Сдать что-нибудь ненужное
      effects: {eddies: 200, heat: -1}
      text: "Ты сдаёшь старый ржавый пистолет, который нашёл в подвале. Копы делают вид, что верят, что он твой единственный."
    - label: Посмеяться и уйти
      effects: {}
      text: "В этом городе сдать ствол — значит остаться голым. Не дождутся."

- id: era13_first_megatower
  title: Новая мегабашня
  category: money
  weight: 2
  available_until: 2019
  text: "Город строит первую мегабашню: двести этажей дешёвого жилья. Нужны рабочие на ночные смены, платят наличными, каски не выдают."
  choices:
    - label: Поработать неделю
      check: {stat: BODY, dv: 12}
      success: {text: "Неделя на высоте, ветер, бетон, страх. Платят честно, и ты видишь город сверху, как никогда раньше.", effects: {eddies: 700, mood: 3}}
      fail: {text: "Леса качаются, ты срываешься и висишь на страховке. Деньги дают, но руки дрожат ещё неделю.", effects: {eddies: 350, hp: -6}}
    - label: Не надо
      effects: {}
      text: "Через десять лет в этой башне будут жить тысячи. Без тебя на стройке тоже справятся."

- id: era13_fixer_intro
  title: Фиксер старой школы
  category: work
  weight: 2
  available_until: 2019
  text: "Пожилой фиксер в баре говорит, что раньше всё решалось рукопожатием, а теперь все хотят контракты на шардах. Он ищет кого-то, кто помнит, что слово чего-то стоит."
  choices:
    - label: Дать слово
      effects: {street_cred: 2, add_npc:contact: true}
      text: "Вы пожимаете руки. Никаких бумаг. Через неделю он присылает первую работу и больше никого, кроме тебя, не зовёт."
    - label: Потребовать контракт
      effects: {status: 1}
      text: "Фиксер морщится, но подписывает. Ты защищён бумагой, но тёплых отношений не будет."

- id: era13_chrome_fashion
  title: Мода на хром
  category: street
  weight: 2
  available_until: 2019
  text: "В клубах новая мода: блестящие накладки на кожу, будто у тебя импланты. Настоящего хрома мало, а выглядеть круто хочется всем."
  choices:
    - label: Продавать накладки
      check: {stat: COOL, skill: persuasion, dv: 12}
      success: {text: "Коробка накладок уходит за вечер в туалете клуба. Ты торговец модой.", effects: {eddies: 400}}
      fail: {text: "Охрана клуба выкидывает тебя вместе с коробкой.", effects: {mood: -2}}
    - label: Наклеить себе
      effects: {mood: 4, fame: 1}
      text: "Блестящая накладка на скуле. Девушки и парни в клубе спрашивают, у какого риппера ты был."

# ======================================================================== Корпоративные войны, 2020-2021

- id: era20_orphans
  title: Сироты чумы
  category: relationships
  weight: 3
  available_from: 2020
  available_until: 2021
  text: "Углеродная чума выкосила взрослых в квартале. Во дворе живут дети: они сбились в стайку и воруют еду. Самой старшей лет четырнадцать."
  choices:
    - label: Принести еды
      effects: {eddies: -150, humanity: 2, mood: 3}
      text: "Ты оставляешь пакеты у подъезда. На следующий день кто-то оставляет у твоей двери нарисованную открытку."
    - label: Взять старшую в ученицы
      effects: {add_npc:protege: true, humanity: 1}
      text: "Она смотрит недоверчиво, но соглашается. Теперь у тебя есть кто-то, кого надо научить выживать."
    - label: Не смотреть
      effects: {humanity: -1}
      text: "Ты отворачиваешься. Таких дворов в городе сотни."

- id: era20_war_profiteer
  title: Барыга войны
  category: money
  weight: 2
  available_from: 2020
  available_until: 2025
  text: "Торговец с армейского склада продаёт пайки, патроны и медикаменты в три цены. Люди платят, потому что больше негде."
  choices:
    - label: Перепродавать с ним
      effects: {eddies: 900, humanity: -2}
      text: "Неделя торговли, и у тебя пачка денег. И ощущение, что ты стал частью войны."
    - label: Ограбить склад и раздать
      check: {stat: REF, skill: stealth, dv: 15}
      success: {text: "Ночью ящики уезжают со склада, утром стоят у подъездов. Район знает, кто это сделал.", effects: {street_cred: 3, humanity: 2, heat: 2}}
      fail: {text: "Охрана склада стреляет. Ты уходишь ни с чем и с дыркой в куртке.", effects: {hp: -8, heat: 2}}

- id: era20_air_raid
  title: Учебная тревога
  category: street
  weight: 2
  available_from: 2020
  available_until: 2022
  text: "Сирены воют над городом. Говорят, учебная тревога, но в новостях показывают корпоративные флоты у побережья. Люди спускаются в метро."
  choices:
    - label: В метро со всеми
      effects: {mood: -2, humanity: 1}
      text: "Ночь в метро с незнакомцами. Кто-то делится термосом, кто-то поёт. Утром тревогу отменяют."
    - label: Пограбить пустые магазины
      effects: {eddies: 600, humanity: -2, heat: 1}
      text: "Город пустой, витрины открытые. Ты возвращаешься с полными сумками и не смотришь соседям в глаза."

# ======================================================================== Падение Сети, 2022

- id: era22_atm_dead
  title: Банкоматы молчат
  category: money
  weight: 3
  available_from: 2022
  available_until: 2023
  text: "Сеть упала, банкоматы молчат, карты не работают. Наличные снова короли, а у тебя в кармане мелочь."
  choices:
    - label: Менять услуги на еду
      effects: {skill_xp:tech: 2, mood: 1}
      text: "Ты чинишь соседям генераторы за консервы. Неделя бартера учит больше, чем год работы."
    - label: Вскрыть мёртвый банкомат
      check: {stat: TECH, skill: tech, dv: 14}
      success: {text: "Банкомат открывается, внутри старые наличные. Охрана банка разбежалась ещё вчера.", effects: {eddies: 1400, heat: 1}}
      fail: {text: "Банкомат бьёт током, сирена орёт, как будто Сеть ещё жива.", effects: {hp: -5, heat: 1}}

- id: era22_rabids
  title: Вирус в импланте
  category: implants
  weight: 2
  available_from: 2022
  available_until: 2022
  conditions:
    requires: [has_cyberware]
  text: "Вирус из рухнувшей Сети добрался до сетевого модуля твоего импланта. Глаз мигает чужими символами, в ухе шум."
  choices:
    - label: Выжечь модуль у риппера (500)
      effects: {eddies: -500, mood: 2}
      text: "Риппер отключает имплант от сети навсегда. Он работает, но теперь только как кусок железа."
    - label: Жить с этим
      effects: {glitches: 1, mood: -4}
      text: "Символы мигают по ночам. Иногда тебе кажется, что они складываются в слова."

# ======================================================================== Время Красного, 2023-2049

- id: era23_red_sky
  title: Красное небо
  category: street
  weight: 2
  available_from: 2023
  available_until: 2049
  text: "Небо снова багровое от пыли. Город восстанавливают по кирпичику, и каждый, кто умеет держать молоток, на вес золота."
  choices:
    - label: Строить
      effects: {eddies: 500, skill_xp:tech: 2, humanity: 1}
      text: "Неделя на стройке квартала. Платят мало, но ты видишь, как из руин встаёт дом."
    - label: Торговать водой
      effects: {eddies: 800, humanity: -1}
      text: "Чистая вода дороже бензина. Ты продаёшь её втридорога и стараешься не думать о том, кто не может заплатить."

- id: era23_nomad_trade
  title: Караван кочевников
  category: money
  weight: 2
  available_from: 2023
  available_until: 2049
  text: "У городской стены остановился караван кочевников. Меняют запчасти на лекарства, бензин на патроны, истории на виски."
  choices:
    - label: Поторговаться
      check: {stat: COOL, skill: persuasion, dv: 13}
      success: {text: "Ты меняешь старый хлам на пикап запчастей и выгодно сбываешь их в городе.", effects: {eddies: 900, faction_rep:aldecaldos: 2}}
      fail: {text: "Кочевники торгуются лучше тебя. Ты уходишь с половиной того, на что рассчитывал.", effects: {eddies: 200}}
    - label: Послушать истории
      effects: {mood: 5, add_npc:contact: true}
      text: "До утра у костра. Ты уходишь с другом, который знает все дороги Пустошей."

- id: era23_netwatch_wall
  title: Стена NetWatch
  category: rare
  weight: 1
  available_from: 2023
  available_until: 2049
  text: "В баре нетраннеры шепчутся: NetWatch строит Чёрный заслон, стену между городом и тем, что живёт в старой Сети. Кто-то предлагает заглянуть за неё одним глазком."
  choices:
    - label: Заглянуть
      check: {stat: INT, skill: netrunning, dv: 16}
      success: {text: "На секунду ты видишь за стеной что-то огромное и внимательное. Оно видит тебя тоже. Ты отключаешься с кровью из носа и с ощущением, что тебя запомнили.", effects: {skill_xp:netrunning: 4, glitches: 1}}
      fail: {text: "Дека сгорает в руках. Ты неделю не помнишь, как зовут собственную мать.", effects: {hp: -8, mood: -6}}
    - label: Не трогать
      effects: {}
      text: "Есть вещи, которые лучше не видеть. Ты допиваешь и уходишь."

# ======================================================================== Восстановление, 2050-2068

- id: era50_corp_return
  title: Корпорации возвращаются
  category: work
  weight: 2
  available_from: 2050
  available_until: 2068
  text: "Корпорации возвращаются в город: стеклянные башни, чистые улицы для своих. Для остальных — новые камеры и новые правила."
  choices:
    - label: Наняться в охрану башни
      effects: {eddies: 900, status: 1, humanity: -1}
      text: "Форма, пропуск, зарплата. Ты стоишь у входа и не пускаешь внутрь таких же, как ты."
    - label: Портить им жизнь
      check: {stat: COOL, skill: stealth, dv: 14}
      success: {text: "Граффити на стекле, сломанные камеры, сорванная презентация. Улицы любят тебя.", effects: {street_cred: 3, heat: 1}}
      fail: {text: "Корпоративная охрана умеет искать. Тебя ловят у второй камеры.", effects: {heat: 2, hp: -5}}

- id: era50_combat_zone
  title: Боевая зона
  category: street
  weight: 2
  available_from: 2050
  available_until: 2076
  text: "Окраину объявили боевой зоной: полиция туда не ездит, а банды делят её без правил. Фиксер платит за доставку внутрь."
  choices:
    - label: Проехать
      check: {stat: REF, skill: driving, dv: 15}
      success: {text: "Ты пролетаешь через блокпосты банд на скорости, от которой кружится голова. Груз доставлен.", effects: {eddies: 1300, street_cred: 2}}
      fail: {text: "Шины пробиты, машина в кювете, груз забрали. Главное, что обошлось без пули.", effects: {hp: -10}}
    - label: Отказаться
      effects: {}
      text: "Боевая зона ест людей. Ты не хочешь стать её ужином."

- id: era50_pet_android
  title: Андроид-компаньон
  category: relationships
  weight: 1
  available_from: 2055
  text: "В витрине стоит андроид-компаньон: улыбается, помнит твоё имя после первой встречи. Продавец говорит, что одиночество — худшая болезнь века."
  choices:
    - label: Купить (3000)
      effects: {eddies: -3000, mood: 10, humanity: -2}
      text: "Андроид встречает тебя дома и спрашивает, как прошёл день. Каждый вечер. Одними и теми же словами."
    - label: Позвонить живому человеку
      effects: {humanity: 2, mood: 3}
      text: "Ты набираешь номер, по которому давно не звонишь. Разговор неловкий, но настоящий."

# ======================================================================== Объединённая война, 2069-2070

- id: era69_draft
  title: Призыв
  category: work
  weight: 2
  available_from: 2069
  available_until: 2070
  text: "Новые Соединённые Штаты требуют вернуть Найт-Сити. В городе раздают повестки в ополчение. Можно воевать, можно прятаться, можно торговать."
  choices:
    - label: В ополчение
      effects: {street_cred: 3, hp: -6, skill_xp:firearms: 3, humanity: -1}
      text: "Два месяца окопов на границе города. Ты возвращаешься. Другой человек, но живой человек."
    - label: Прятаться
      check: {stat: COOL, skill: stealth, dv: 14}
      success: {text: "Ты меняешь адрес трижды, повестки не находят. Война обходит тебя стороной.", effects: {mood: -2}}
      fail: {text: "Патруль берёт тебя у подъезда. Месяц на передовой без подготовки.", effects: {hp: -12, jail_weeks: 2}}

- id: era69_blackout
  title: Затемнение
  category: street
  weight: 2
  available_from: 2069
  available_until: 2070
  text: "Ночью город гасят полностью: ждут налёт. Тишина, темнота, только где-то лают собаки. В такие ночи в городе хозяйничают мародёры."
  choices:
    - label: Охранять подъезд
      check: {stat: BODY, skill: melee, dv: 13}
      success: {text: "Мародёры заглядывают в подъезд, видят тебя с монтировкой и уходят дальше. Соседи приносят утром пирог.", effects: {street_cred: 2, humanity: 1}}
      fail: {text: "Их больше, чем ты думал. Подъезд отстоял, но рёбра нет.", effects: {hp: -8, street_cred: 1}}
    - label: Самому помародёрствовать
      effects: {eddies: 900, humanity: -2}
      text: "Ты возвращаешься под утро с чужим добром. Город спит и ничего не видит."

# ======================================================================== Свободный город, 2071-2076
    - label: "Пойти в темноту"
      ability: night
      effects: {street_cred: 2, humanity: 1}
      text: "Темнота для тебя серая. Мародёры для тебя видны. Подъезд держится до утра."

- id: era71_free_city
  title: Свободный город
  category: rare
  weight: 2
  available_from: 2071
  available_until: 2076
  text: "Найт-Сити объявили свободным городом. Праздник на улицах, фейерверки над заливом, корпорации обещают новую эру. Кто-то в толпе плачет, кто-то ворует кошельки."
  choices:
    - label: Праздновать
      effects: {mood: 10, eddies: -100}
      text: "Ты танцуешь на улице с незнакомцами до рассвета. Впервые за долгое время город кажется твоим."
    - label: Работать по кошелькам
      check: {stat: REF, skill: stealth, dv: 12}
      success: {text: "Праздник — лучшая работа для карманника. К утру у тебя восемь кошельков.", effects: {eddies: 700, humanity: -1}}
      fail: {text: "Тебя ловят за руку посреди салюта. Толпа не любит воров.", effects: {hp: -6, heat: 1}}

- id: era71_braindance_star
  title: Кастинг брейнданса
  category: work
  weight: 2
  available_from: 2071
  text: "Студия брейнданса ищет «настоящие эмоции»: будут записывать, как ты прыгаешь с тарзанки с моста. Платят по пульсу."
  choices:
    - label: Прыгнуть
      check: {stat: COOL, dv: 13}
      success: {text: "Ты орёшь от восторга, пульс зашкаливает. Студия платит по высшему тарифу.", effects: {eddies: 1500, fame: 2}}
      fail: {text: "Ты орёшь от ужаса. Запись тоже продаётся, но тебя тошнит до вечера.", effects: {eddies: 700, mood: -4}}
    - label: Отказаться
      effects: {}
      text: "Продавать свои эмоции — последнее дело. Даже в этом городе."

# ======================================================================== 2077 и дальше

- id: era77_relic_rumor
  title: Слухи о реликвии
  category: rare
  weight: 2
  available_from: 2077
  text: "Весь город говорит о краже в башне Arasaka. Шепчут о шарде, который делает из человека бессмертного. В баре продают «копии» по сотне."
  choices:
    - label: Купить «копию»
      effects: {eddies: -100, mood: 2}
      text: "Пустой шард с наклейкой. Понятно было сразу, но рука сама потянулась. Это город легенд, и хочется хоть кусочек."
    - label: Продавать «копии»
      check: {stat: COOL, skill: persuasion, dv: 12}
      success: {text: "Сотня пустых шардов уходит за неделю. Легенды продаются лучше всего.", effects: {eddies: 1200}}
      fail: {text: "Покупатель оказывается настоящим охотником за реликвией. Ему не смешно.", effects: {hp: -8}}

- id: era77_maxtac_scan
  title: Облава МаксТака
  category: ncpd
  weight: 2
  available_from: 2077
  conditions:
    max_humanity: 30
  text: "МаксТак проверяет квартал: сканеры, бронированные машины, все к стене. Твоя человечность на сканере выглядит плохо."
  choices:
    - label: Держаться спокойно
      check: {stat: COOL, dv: 15}
      success: {text: "Ты стоишь неподвижно и дышишь ровно. Сканер мигает жёлтым, офицер машет рукой: проходи.", effects: {mood: -2}}
      fail: {text: "Руки дрожат, сканер мигает красным. Тебя держат три часа в фургоне и отпускают с меткой в базе.", effects: {heat: 2, mood: -6}}
    - label: Сбежать до проверки
      check: {stat: REF, dv: 14}
      success: {text: "Ты уходишь по крышам до того, как они доходят до твоего подъезда.", effects: {heat: 1}}
      fail: {text: "Сбежать от МаксТака — плохая идея. Тебя кладут лицом в асфальт.", effects: {hp: -10, heat: 3}}
    - label: "Спрятать хром"
      ability: hide
      effects: {heat: -1}
      text: "На сканере у тебя человечность святого. МаксТак проходит мимо."
    - label: "Исчезнуть"
      ability: cloak
      effects: {mood: 2}
      text: "Камуфляж, тень, и проверка заканчивается без тебя."

- id: era80_ai_neighbor
  title: Сосед-ИИ
  category: rare
  weight: 2
  available_from: 2080
  text: "В соседнюю квартиру въехал официально зарегистрированный ИИ в арендованном теле. Он вежлив, платит вовремя и иногда стучит спросить, что такое «скучать»."
  choices:
    - label: Подружиться
      effects: {add_npc:friend: true, humanity: 1, mood: 4}
      text: "Вы пьёте чай по вечерам. Он задаёт странные вопросы, ты учишься отвечать на них честно."
    - label: Сдать NetWatch
      effects: {eddies: 800, humanity: -2}
      text: "NetWatch платит за бдительность. Квартира пустеет. Ты не знаешь, что с ним сделали."
