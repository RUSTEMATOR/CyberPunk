# Echoes of real events of 1986-2025 in Night City (owner request 23.10: «значимые, как отсылки»). In-world versions
# with changed names; no real people. The tragedies are told seriously: the character helps, witnesses or stays away,
# never takes part in the violence. Player text avoids gendered past tense.

- id: hist_school_shooting
  title: Утро в школе Хейвуда
  category: street
  weight: 1
  conditions:
    seasons: [spring]
  text: "Весеннее утро. Ты проезжаешь мимо старшей школы Хейвуда, когда изнутри раздаются выстрелы. Двое старшеклассников с оружием прошли в здание. Из окон библиотеки кричат, на парковку выбегают дети. NCPD будет здесь через двадцать минут. Двадцать минут — это очень долго."
  choices:
    - label: Выводить детей
      check: {stat: COOL, skill: stealth, dv: 14}
      success: {text: "Ты ведёшь детей через спортзал и чёрный ход, группу за группой, пригибаясь под окнами. Последнюю группу выводишь, когда во двор уже въезжают броневики. Ночью ты не спишь. Через неделю письмо от родителей: «Спасибо, что не проехали мимо».", effects: {humanity: 3, mood: -4, fame: 2, street_cred: 2}}
      fail: {text: "Ты выводишь две группы, на третьей пуля задевает плечо через окно. Детей всё равно вывели. Плечо заживёт. То, что было в коридоре, — нет.", effects: {humanity: 2, hp: -10, mood: -8, fame: 1}}
    - label: Помогать раненым
      check: {stat: TECH, skill: medicine, dv: 13}
      success: {text: "На парковке ты перетягиваешь жгутами руки и ноги, пока не приезжает Траума Тим. Медики говорят, что двоих удалось вытащить с того света.", effects: {humanity: 3, skill_xp:medicine: 2, mood: -5}}
      fail: {text: "Ты делаешь всё, что можешь. Этого не всегда хватает. Сирены, белые простыни, тишина.", effects: {humanity: 1, mood: -10}}
    - label: Не вмешиваться
      effects: {mood: -6, humanity: -1}
      text: "Ты остаёшься в машине и звонишь в NCPD. Через час новости называют число. Ты выключаешь новости, но число остаётся."

- id: hist_school_aftermath
  title: Свечи у ограды
  category: relationships
  weight: 1
  conditions:
    seasons: [spring, summer]
  text: "У ограды школы Хейвуда месяц горят свечи и лежат игрушки. По всем каналам спор: «Арасака» предлагает поставить в каждую школу рамки и турели, «Милитех» — раздать учителям пистолеты, а родители просят только одного — чтобы их детей наконец кто-нибудь слышал."
  choices:
    - label: Принести цветы
      effects: {humanity: 2, mood: -1}
      text: "Ты кладёшь цветы и стоишь молча. Рядом пожилая женщина держит фото внука. Вы не говорите ни слова, но уходите вместе."
    - label: Деньги на психологов
      effects: {eddies: -500, humanity: 2, mood: 2}
      text: "Фонд нанимает в школу двух психологов. Учительница присылает фото: в кабинете очередь из подростков."
    - label: Пройти мимо
      effects: {}
      text: "У тебя хватает своих похорон. Свечи горят и без тебя."

- id: hist_reactor
  title: Реактор в Санто-Доминго
  category: rare
  weight: 1
  text: "Ночью над Санто-Доминго вспыхивает голубое свечение. На опытном реакторе «Петрохема» что-то пошло не так, а директор станции по связи докладывает, что всё под контролем. Сирены молчат. Город ещё спит."
  choices:
    - label: Пойти в ликвидаторы
      effects:
        humanity: 3
        street_cred: 3
        eddies: 3000
        hp: -8
        later:
          - weeks: 26
            chance: 0.4
            effects: {hp: -10, mood: -4}
            text: "Через полгода приходит то, что обещали врачи: доза с реактора даёт о себе знать. Кровь идёт носом по утрам."
            fail_effects: {mood: 2}
            fail_text: "Полгода анализов. Чисто. Тебе повезло больше, чем многим из твоей смены."
            hint: "доза с реактора"
      text: "Две недели на крыше реактора, по минуте за раз, в свинцовом фартуке. Платят по-корпоративному щедро. Медали дают по-государственному скромно."
    - label: Поднять тревогу в Сети
      check: {stat: INT, skill: netrunning, dv: 13}
      success: {text: "Ты взламываешь датчики и выкладываешь показания. Город эвакуируют на сутки раньше, чем «Петрохем» собирался признаться.", effects: {fame: 3, humanity: 2, faction_rep:petrochem: -3}}
      fail: {text: "Твои посты удаляют быстрее, чем ты пишешь. Утром эвакуацию всё равно объявляют, на сутки позже.", effects: {mood: -3}}
    - label: Уехать подальше
      effects: {eddies: -300, mood: -2}
      text: "Ты берёшь сумку и уезжаешь в Бесплодные земли на неделю. Город потом ещё долго светится на картах дозиметров."

- id: hist_y2k
  title: Баг смены календаря
  category: implants
  weight: 2
  text: "В полночь прошивки половины имплантов в городе переходят на новый корпоративный календарь, и кто-то в «Кан Тао» ошибся в одной цифре. Часы в оптике показывают девятнадцатый век, кибернога считает, что ей сто лет гарантии назад, лифты стоят."
  choices:
    - label: Перепрошить сам
      check: {stat: TECH, skill: tech, dv: 13}
      success: {text: "Ты правишь одну цифру в прошивке и чинишь заодно соседям за деньги. Вечером у тебя очередь у двери.", effects: {skill_xp:tech: 2, eddies: 900}}
      fail: {text: "Прошивка встаёт криво. Неделю оптика показывает всё в сепии, как старое кино.", effects: {mood: -3}}
    - label: Ждать патча
      effects: {mood: -2}
      text: "Патч выходит через три дня. Три дня ты ходишь пешком по лестницам и живёшь в позапрошлом веке."

- id: hist_dotcom
  title: Пузырь брейнданс-стартапов
  category: money
  weight: 2
  text: "Все вкладываются в брейнданс-стартапы: доставка воспоминаний о еде, брейнданс для собак, соцсеть, где можно только молчать. У компаний нет ни прибыли, ни продукта, но приставка «.бд» в названии поднимает цену вдесятеро. Знакомый зовёт вложиться."
  choices:
    - label: Вложить 3 000
      effects:
        eddies: -3000
        later:
          - weeks: 10
            chance: 0.25
            effects: {eddies: 15000, mood: 5}
            text: "Выход за неделю до обвала. Пятнадцать тысяч и репутация провидца."
            fail_effects: {mood: -5}
            fail_text: "Пузырь лопается. Офис стартапа сдают под склад, а от твоих трёх тысяч осталась кружка с логотипом."
            hint: "акции брейнданс-стартапа"
      text: "Ты вкладываешься. Знакомый дарит тебе кружку с логотипом. Говорит, через год такие будут стоить больше акций."
    - label: Отказаться
      effects: {}
      text: "Через год ты проходишь мимо пустого офиса со стеклянными стенами. На двери табличка: «Сдаётся»."

- id: hist_bank_crash
  title: Банк лопнул
  category: money
  weight: 1
  text: "Крупнейший банк Свободного Штата объявляет банкротство за одну ночь. Оказалось, он годами продавал друг другу пачки ипотек на квартиры в мегабашнях, которые никто не мог оплатить. Банкоматы пусты, у отделений очереди, корпорации просят у государства помощи."
  choices:
    - label: Бежать снимать деньги
      check: {stat: REF, dv: 13}
      success: {text: "Ты успеваешь в первой сотне. Остальные стоят у закрытых дверей.", effects: {mood: 1}}
      fail: {text: "Ты в конце очереди. Банк закрывается перед твоим носом. Часть денег зависла навсегда.", effects: {eddies_pct: -10, mood: -4}}
    - label: Поставить против банков
      check: {stat: INT, dv: 16}
      success: {text: "Пока все паникуют, ты ставишь на падение других банков. Через месяц ты пьёшь шампанское среди руин.", effects: {eddies: 8000, humanity: -1}}
      fail: {text: "Государство спасает банки на деньги налогоплательщиков. Твоя ставка сгорает вместе с налогами.", effects: {eddies: -2000}}
    - label: Хранить деньги в матрасе
      effects: {mood: 2}
      text: "Матрас всегда был надёжнее банка. Теперь это знают все."

- id: hist_whistleblower
  title: Подрядчик с флешкой
  category: work
  weight: 1
  text: "В кофейне к тебе подсаживается тихий айтишник-подрядчик из NetWatch. На флешке доказательства: NetWatch годами читает переписку всех жителей города, включая сообщения бабушкам. Он хочет улететь в Гонконг и выложить всё журналистам. Нужен кто-то, кто довезёт его до аэропорта."
  choices:
    - label: Довезти до аэропорта
      check: {stat: REF, skill: driving, dv: 15}
      success: {text: "Ты уводишь машину от двух хвостов через Джапан-таун. Через неделю статья выходит во всех мировых новостях. Подрядчик застрял в транзитной зоне чужой страны, но жив.", effects: {fame: 3, humanity: 2, street_cred: 2}}
      fail: {text: "Хвост прижимает вас у терминала. Подрядчика уводят люди в серых костюмах. Тебя отпускают и просят забыть его лицо.", effects: {heat: 2, mood: -5}}
    - label: Скопировать флешку себе
      check: {stat: INT, skill: netrunning, dv: 14}
      success: {text: "Копия у тебя. Компромат NetWatch на половину города. Опасный, но очень ценный товар.", effects: {eddies: 5000, heat: 1}}
      fail: {text: "Флешка защищена. При попытке копирования она плавится. Подрядчик смотрит на тебя с ужасом и уходит.", effects: {mood: -3}}
    - label: Отказаться
      effects: {}
      text: "Ты пьёшь кофе и молчишь. Он уходит один. Через месяц ты читаешь его имя в новостях. Или не его."

- id: hist_quiz
  title: Тест «Какой ты имплант»
  category: street
  weight: 2
  text: "Все в Сети проходят тест «Какой ты имплант?» от приложения «Психопрофиль». Двадцать вопросов, смешная картинка в конце. Через месяц выясняется, что приложение собрало профили миллионов людей и продало их штабу кандидата в мэры, чтобы показывать каждому свою рекламу."
  choices:
    - label: Пройти тест
      effects:
        mood: 3
        later:
          - weeks: 4
            chance: 1.0
            effects: {mood: -2}
            text: "Тебе месяц показывают рекламу, которая знает о тебе больше, чем мама. Результат теста — «Сандевистан». Это единственное утешение."
            hint: "данные теста"
      text: "Ты — «Сандевистан»: быстрый, опасный, нетерпеливый. Картинка красивая."
    - label: Взломать приложение
      check: {stat: INT, skill: netrunning, dv: 14}
      success: {text: "Ты находишь сервер с профилями и сливаешь журналистам. Скандал на весь Свободный Штат.", effects: {fame: 2, skill_xp:netrunning: 2}}
      fail: {text: "Сервер защищён лучше, чем ожидалось. Зато ты узнаёшь, что ты «Сандевистан».", effects: {mood: -1}}

- id: hist_fyre_1
  title: Фестиваль на частном острове
  category: money
  weight: 1
  conditions:
    flags_none: [hist_fyre]
  text: "Реклама везде: модели на яхтах, частный остров у Пасифики, лучшие диджеи, виллы, суши. «Фестиваль „Пламя“: роскошь, которую ты заслужил». Билет 4 000 эдди. Все инфлюенсеры города уже купили."
  choices:
    - label: Купить билет
      effects: {eddies: -4000, flag_set:hist_fyre: true, queue_event:hist_fyre_2: true}
      text: "Ты покупаешь билет. Организатор лично присылает голосовое: «Это будет легендарно»."
    - label: Не верить
      effects: {flag_set:hist_fyre: true}
      text: "Слишком красиво, чтобы быть правдой. Ты оставляешь деньги себе."

- id: hist_fyre_2
  title: Пламя потухло
  category: money
  weight: 1
  forced_only: true
  text: "Остров оказался бывшей свалкой. Вместо вилл — палатки от урагана, вместо суши — бутерброд с сыром в пенопластовой коробке. Багаж выгрузили в темноте прямо на песок. Организатор исчез. Пятьсот разгневанных богачей и ни одного корабля обратно."
  choices:
    - label: Организовать лагерь
      check: {stat: COOL, skill: persuasion, dv: 14}
      success: {text: "Ты собираешь людей, делишь воду, договариваешься с местными рыбаками. Через сутки вас вывозят. Половина инфлюенсеров теперь подписаны на тебя.", effects: {fame: 3, add_npc:contact: true, mood: 2}}
      fail: {text: "Никто тебя не слушает. Ночь в мокрой палатке, утро в очереди на рыбацкую лодку.", effects: {hp: -4, mood: -5}}
    - label: Продавать бутерброды
      effects: {eddies: 2500, humanity: -1}
      text: "Ты находишь склад бутербродов и продаёшь их богачам по сто эдди. Это самый честный бизнес на этом острове."
    - label: Снять разоблачение
      effects: {fame: 2, mood: 2}
      text: "Ты снимаешь всё: палатки, бутерброды, лица. Ролик расходится по Сети. Организатора ловят через полгода."

- id: hist_sub
  title: Экскурсия к затонувшему танкеру
  category: rare
  weight: 1
  conditions:
    min_status: 3
  text: "Миллиардер из Норт-Оука приглашает на экскурсию на дно залива к затонувшему танкеру «Арасаки». Его батискаф из углепластика собран на заказ, управление — игровым джойстиком. «Безопасность — это тормоз инноваций», — смеётся он. Место стоит 25 000 эдди."
  choices:
    - label: Отказаться
      effects: {mood: 1}
      text: "Ты вежливо отказываешься. Через неделю батискаф не выходит на связь. Спасатели находят на дне обломки. Ты долго смотришь на свой джойстик от приставки."
    - label: Проверить корпус
      check: {stat: TECH, skill: tech, dv: 14}
      success: {text: "Ты находишь трещину в корпусе и показываешь миллиардеру. Он отмахивается. Ты уходишь и уводишь с собой двух пассажиров. Экскурсия так и не возвращается.", effects: {humanity: 2, add_npc:friend: true, mood: -3}}
      fail: {text: "Корпус выглядит нормально, но тебе не нравится, как он скрипит. Ты не идёшь. Интуиция оказывается умнее экспертизы.", effects: {mood: -2}}

- id: hist_ship_stuck
  title: Контейнеровоз поперёк канала
  category: money
  weight: 2
  text: "Гигантский контейнеровоз встал поперёк канала в порту Найт-Сити. За ним очередь из трёхсот судов. Цены на хром, лапшу и туалетную бумагу растут каждый час. Одинокий экскаватор копает песок под носом корабля, и весь город делает с этим фото мемы."
  choices:
    - label: Скупить лапшу заранее
      effects: {eddies: -500, mood: 3}
      text: "Ты набиваешь кладовку. Через неделю лапша стоит втрое дороже, а у тебя её на полгода."
    - label: Помочь с экскаватором
      check: {stat: TECH, skill: driving, dv: 13}
      success: {text: "Ты садишься во второй экскаватор и копаешь. Когда корабль сдвигается, на видео в Сети видно и тебя. Порт платит премию.", effects: {eddies: 1200, fame: 2}}
      fail: {text: "Ты закапываешь второй экскаватор. Теперь в мемах два экскаватора, и оба смешные.", effects: {fame: 1, mood: -1}}

- id: hist_pandemic
  title: Город на карантине
  category: rare
  weight: 1
  text: "В городе новый вирус из лаборатории «Биотехники» — или с рынка, официально непонятно. Объявлен карантин: маски, комендантский час, дроны NCPD гоняют людей по домам. Курьеры стали самыми важными людьми Найт-Сити. Туалетная бумага пропала за сутки."
  choices:
    - label: Работать курьером
      check: {stat: BODY, dv: 13}
      success: {text: "Месяц ты возишь лапшу и лекарства. Деньги хорошие, город благодарен.", effects: {eddies: 2000, humanity: 1}}
      fail: {text: "Ты подхватываешь вирус на третьей доставке. Две недели в кровати, вкус пропал.", effects: {infection: true, hp: -8, eddies: 600}}
    - label: Сидеть дома
      effects: {mood: -4, hp: 2}
      text: "Месяц в четырёх стенах. Хлеб на закваске, сериалы, разговоры с кактусом. Зато здоровье цело."
    - label: Торговать масками
      effects: {eddies: 1800, humanity: -1}
      text: "Ты продаёшь маски втридорога. Город запомнит, кто наживался."

- id: hist_blood_test
  title: Капля крови
  category: work
  weight: 2
  text: "Стартап «Вектор-Кровь» обещает революцию: одна капля крови из пальца — и двести анализов за минуту. Основательница в чёрной водолазке говорит низким голосом, инвесторы в восторге. Тебе предлагают работу: проверять приборы перед показом инвесторам."
  choices:
    - label: Проверить честно
      check: {stat: TECH, skill: medicine, dv: 14}
      success: {text: "Ты понимаешь, что прибор ничего не измеряет: внутри обычные анализаторы конкурентов. Ты уходишь и рассказываешь журналисту. Через год основательница в суде.", effects: {fame: 2, humanity: 2}}
      fail: {text: "Ты ничего не понимаешь в этом приборе. Тебе платят и просят не задавать вопросов.", effects: {eddies: 1000}}
    - label: Подыграть за деньги
      effects: {eddies: 2500, humanity: -2, later: [{weeks: 12, chance: 0.5, effects: {heat: 2, mood: -3}, text: "Компания рушится, и следователи находят твою подпись под отчётами. Объясняться приходится долго.", fail_effects: {}, fail_text: "Компания рушится, но про тебя никто не вспоминает. Повезло.", hint: "следствие по «Вектор-Крови»"}]}
      text: "Ты подписываешь, что прибор работает. Основательница благодарит низким голосом."

- id: hist_meteor
  title: Метеорит над Бесплодными землями
  category: rare
  weight: 1
  text: "Утром небо над городом прочерчивает огненный след, ударная волна выбивает окна по всему Санто-Доминго. Каждая машина в городе сняла это на регистратор. Осколки метеорита упали в Бесплодных землях, и кочевники уже едут собирать."
  choices:
    - label: Поехать за осколками
      check: {stat: REF, skill: driving, dv: 14}
      success: {text: "Ты находишь осколок размером с кулак раньше кочевников. Коллекционер из Сити-центра платит щедро.", effects: {eddies: 4000, mood: 3}}
      fail: {text: "Кочевники нашли раньше и не любят конкурентов. Домой ты возвращаешься с пустыми руками и пробитым колесом.", effects: {hp: -5, eddies: -300}}
    - label: Собрать лучшие записи
      effects: {fame: 2, eddies: 500}
      text: "Ты монтируешь записи с регистраторов в один ролик. Миллионы просмотров и немного денег от новостных каналов."

- id: hist_pizza
  title: Две пиццы за десять тысяч
  category: money
  weight: 2
  text: "Нетраннер-чудак на форуме предлагает: «Отдам десять тысяч новых коинов за две большие пиццы». Коины пока почти ничего не стоят, их майнят ради интереса. Пицца стоит сорок эдди."
  choices:
    - label: Привезти ему пиццу
      effects: {eddies: 40, mood: 3}
      text: "Ты привозишь две пиццы и получаешь коины. Вечером продаёшь их за шестьдесят эдди. Хорошая сделка. Наверное."
    - label: Держать коины
      effects:
        later:
          - weeks: 52
            chance: 0.3
            effects: {eddies: 50000, fame: 2}
            text: "Через год коины, полученные за пиццу, стоят пятьдесят тысяч. Это самая дорогая пицца в истории Найт-Сити, и она была твоя."
            fail_effects: {mood: -1}
            fail_text: "Через год сервер коина закрывается. Пицца была вкусная. Это главное."
            hint: "коины за пиццу"
      text: "Ты отдаёшь пиццу и прячешь ключ от кошелька под матрас."
    - label: Съесть пиццы самому
      effects: {mood: 4, hp: 1}
      text: "Две пиццы, один ты, никаких коинов. Это был лучший ужин месяца."

- id: hist_blackout
  title: Город без света
  category: street
  weight: 2
  text: "Перегруженная подстанция в Уотсоне выбивает цепочку по всему городу. Найт-Сити без света: неон погас, лифты стоят, метро встало. Люди выходят на улицы, и вдруг видно звёзды. Первый раз за сорок лет."
  choices:
    - label: Смотреть на звёзды
      effects: {mood: 6, humanity: 1}
      text: "Ты лежишь на крыше и смотришь на небо. Рядом соседи, которых ты никогда не видел. Кто-то принёс гитару."
    - label: Воспользоваться темнотой
      violent: true
      check: {stat: REF, skill: stealth, dv: 13}
      success: {text: "Пока камеры мертвы, ты вскрываешь склад электроники. Утром свет возвращается, а у тебя новая техника.", effects: {eddies: 2000, heat: 1, humanity: -1}}
      fail: {text: "У склада стоит охранник с фонариком и дробовиком. Свет у него есть.", effects: {hp: -8, heat: 2}}
    - label: Помогать в метро
      effects: {humanity: 2, street_cred: 1, mood: 2}
      text: "Ты выводишь людей из застрявшего поезда по тоннелю с фонарём от оптики. Последней выходит бабушка с котом. Кот недоволен."
