# Events of the leisure deeds (owner request: every activity has something of its own).
# Most are forced_only: an outcome in content/actions_leisure.yaml plays them right away (`event:`), or the next
# week (`queue_event:`). The cat events are ordinary random events for those who took the cat home (flag has_cat).

# -- karaoke ---------------------------------------------------------------------------------------------------------

- id: leisure_producer
  title: Визитка продюсера
  category: work
  weight: 1
  forced_only: true
  text: "Человек в дорогих очках представляется продюсером лейбла. Он слышал, как ты поёшь, и хочет записать одну песню. Студия в Японтауне, запись за твой счёт, прибыль пополам. Или он просто выкупит у тебя этот номер для своей звезды."
  choices:
    - label: Записать трек (300)
      effects: {eddies: -300, queue_event:leisure_track: true, mood: 3}
      text: "Ночь в студии, двадцать дублей, охрипший голос. Продюсер говорит, что релиз через неделю, и обещает позвонить."
    - label: Продать песню
      effects: {eddies: 700, fame: -1}
      text: "Он переводит деньги сразу. Через месяц ты слышишь «свою» песню из каждого такси, но в другом исполнении."
    - label: Отказаться
      effects: {street_cred: 1}
      text: "Ты возвращаешь визитку. В «Лиззи» тебя за это уважают: здесь не продаются."

- id: leisure_track
  title: Релиз
  category: work
  weight: 1
  forced_only: true
  text: "Сегодня выходит твой трек. Продюсер прислал ссылку и смайлик. Счётчик прослушиваний пока стоит на нуле."
  choices:
    - label: Раскрутить самому
      check: {stat: COOL, skill: persuasion, dv: 15}
      success: {text: "Ты рассылаешь трек всем знакомым диджеям, и один ставит его в эфир. К вечеру он в топе района. Деньги с прослушиваний капают целую неделю.", effects: {eddies: 1500, fame: 3, mood: 6}}
      fail: {text: "Трек тонет среди тысячи других. Двести прослушиваний, и половина из них — твои собственные.", effects: {eddies: 60, mood: -4}}
    - label: Ждать и надеяться
      check: {stat: LUCK, dv: 14}
      success: {text: "Трек случайно попадает в брейнданс-ролик со взрывом, и ролик разлетается по всей Сети. Вместе с ним и ты.", effects: {eddies: 2200, fame: 4}}
      fail: {text: "Ничего не происходит. Продюсер больше не звонит.", effects: {mood: -3}}

- id: leisure_mic_fight
  title: Чужая песня
  category: street
  weight: 1
  forced_only: true
  faction: scavengers
  text: "Здоровяк с кибер-рукой вырывает у тебя микрофон: «Это моя песня. Я пел её своей покойной жене». Бар затихает. У него за спиной двое дружков."
  choices:
    - label: Спеть дуэтом
      check: {stat: EMP, skill: persuasion, dv: 14}
      success: {text: "Ты предлагаешь спеть вместе. Он плачет на втором куплете, ты тоже. Весь бар поёт припев. Он покупает тебе выпить и называет братом.", effects: {mood: 8, fame: 1, add_npc:friend: true}}
      fail: {text: "Ты начинаешь петь, он не подхватывает, а бьёт. Кибер-рукой. Ты просыпаешься на улице.", effects: {hp: -8, mood: -4}}
    - label: Врезать первым
      violent: true
      effects: {start_combat: 1}
      text: "Ты бьёшь его микрофоном в челюсть. Музыка продолжает играть."
    - label: Уступить сцену
      effects: {mood: -3}
      text: "Ты отдаёшь микрофон. Он поёт ужасно, но с таким чувством, что никто не смеётся."

# -- standup ---------------------------------------------------------------------------------------------------------

- id: leisure_corp_joke
  title: Шутка дошла
  category: work
  weight: 1
  forced_only: true
  text: "После выступления к тебе подсаживается человек в сером костюме Arasaka. «Смешно. Очень смешно. Мой начальник тоже посмеётся, когда посмотрит запись». Он не улыбается."
  choices:
    - label: Извиниться публично
      effects: {fame: -2, status: 1, faction_rep:arasaka: 2}
      text: "На следующий день ты записываешь видео с извинениями. Зал тебя презирает, корпорация вычёркивает тебя из списка проблем."
    - label: Повторить шутку ему в лицо
      effects: {fame: 3, street_cred: 2, faction_rep:arasaka: -5, heat: 1}
      text: "Ты рассказываешь шутку ещё раз, громче. Бар аплодирует. Человек в костюме встаёт и уходит. Теперь за тобой иногда ездит одна и та же чёрная машина."
    - label: Предложить писать им шутки
      effects: {eddies: 900, humanity: -1}
      text: "Ты предлагаешь писать шутки для корпоративной вечеринки. Человек думает секунду и называет сумму. Ты больше не смешной, но богатый."

- id: leisure_heckler
  title: Мусорщик на сцене
  category: street
  weight: 1
  forced_only: true
  faction: scavengers
  text: "Мусорщик с ожерельем из зубов поднимается на сцену и встаёт рядом. «Давай, рассмеши меня. Не рассмешишь — возьму себе твои глаза»."
  choices:
    - label: Высмеять его
      check: {stat: COOL, skill: persuasion, dv: 15}
      success: {text: "Ты проходишься по его ожерелью, его стрижке и его маме. Зал воет. Мусорщик уходит со сцены под свист, его друзья ржут над ним громче всех.", effects: {fame: 2, street_cred: 2, faction_rep:scavengers: -3}}
      fail: {text: "Шутка выходит вялой. Мусорщик не смеётся и бьёт тебя головой в лицо. Глаза, к счастью, остаются при тебе.", effects: {hp: -7, mood: -4}}
    - label: Драться
      violent: true
      effects: {start_combat: 2}
      text: "Ты бросаешь микрофон и бьёшь без предупреждения. Зал думает, что это часть номера."
    - label: Уйти со сцены
      effects: {mood: -5, street_cred: -1}
      text: "Ты уходишь. Вслед несётся смех, и смеются не над ним."

# -- yoga ------------------------------------------------------------------------------------------------------------

- id: leisure_yoga_cult
  title: Полночная практика
  category: implants
  weight: 1
  forced_only: true
  text: "В полночь на крыше горят свечи. Ученики сидят в кругу, у каждого на коленях лежит что-то металлическое. Инструктор говорит тихо: «Хром держит тебя в клетке. Отдай одну деталь, и станешь свободнее»."
  choices:
    - label: Отдать имплант
      effects: {remove_random_cyberware: true, humanity: 6, mood: 4}
      text: "Риппер-ученик вынимает имплант прямо на крыше, под мантры. Больно, странно и почему-то легко. В голове становится тихо."
    - label: Помедитировать с ними
      effects: {humanity: 2, mood: 3}
      text: "Ты просто сидишь в кругу до рассвета. Ничего не отдаёшь, но уходишь спокойнее, чем пришёл."
    - label: Уйти
      effects: {}
      text: "Секта есть секта, даже с хорошей растяжкой. Ты спускаешься по пожарной лестнице."

# -- lottery ---------------------------------------------------------------------------------------------------------

- id: leisure_ticket_collector
  title: Бракованный билет
  category: money
  weight: 1
  forced_only: true
  text: "Кассир шепчет, что такие опечатки ищут коллекционеры. Не успеваешь выйти из киоска, как тебе пишет незнакомый номер: «Куплю билет. Назови цену»."
  choices:
    - label: Торговаться
      check: {stat: COOL, skill: persuasion, dv: 13}
      success: {text: "Ты поднимаешь цену трижды. Коллекционер стонет, но платит. Тысяча двести за бумажку.", effects: {eddies: 1200}}
      fail: {text: "Ты пережимаешь, и коллекционер пропадает. Через день он присылает последнее предложение: двести.", effects: {eddies: 200}}
    - label: Оставить себе
      effects: {mood: 3, luck_pool: 1}
      text: "Ты вклеиваешь билет под стекло телефона. Талисман. Почему-то кажется, что теперь везёт больше."

- id: leisure_jackpot
  title: Все хотят твои деньги
  category: money
  weight: 1
  forced_only: true
  text: "Через час после выигрыша у тебя сорок пропущенных. Родственники, о которых ты не слышал. Фонды помощи. И одно сообщение без подписи: «Поделись, и с тобой ничего не случится»."
  choices:
    - label: Раздать часть
      effects: {eddies: -5000, mood: 8, humanity: 2, street_cred: 2}
      text: "Ты отдаёшь пять тысяч на район: соседке на лечение, пацанам на мастерскую. На улице тебе кивают даже незнакомые."
    - label: Заплатить «налог»
      effects: {eddies: -3000}
      text: "Ты переводишь три тысячи на анонимный счёт. Больше тебе не пишут. Ты так и не узнаешь, кто это был."
    - label: Залечь на дно
      check: {stat: COOL, skill: stealth, dv: 14}
      success: {text: "Ты меняешь номер, неделю ночуешь у знакомых и тихо переводишь деньги на новый счёт. Тебя теряют.", effects: {mood: 2}}
      fail: {text: "Тебя находят у подъезда. Двое в масках, нож у горла, перевод на чужой счёт. Половина выигрыша уходит за минуту.", effects: {eddies: -9000, hp: -6, mood: -10}}

# -- robot fights ----------------------------------------------------------------------------------------------------

- id: leisure_robot_build
  title: Свой робот
  category: money
  weight: 1
  forced_only: true
  text: "Корпус робота-бойца с гнутой бронёй и одной рабочей рукой. Механик просит восемьсот. «Руки приложишь — будет зверь. Не приложишь — будет тостер»."
  choices:
    - label: Купить и собрать
      check: {stat: TECH, skill: tech, dv: 12}
      success: {text: "Три ночи с паяльником, и робот встаёт. Ты называешь его «Сосед». Теперь его можно выставлять на бои.", effects: {eddies: -800, flag_set:robot_owner: true, skill_xp:tech: 3}}
      fail: {text: "Ты что-то путаешь в проводке, и робот загорается. Механик молча возвращает половину денег.", effects: {eddies: -400, skill_xp:tech: 1, mood: -3}}
    - label: Не покупать
      effects: {}
      text: "Ты не берёшь. Механик говорит, что место в гараже ещё будет."

- id: leisure_robot_rigged
  title: Договорные бои
  category: street
  weight: 1
  forced_only: true
  text: "Ты замечаешь, как организатор боёв передаёт пульт мужику у стены. Фаворит падает по команде, а мужик забирает все ставки. Он видит, что ты видишь."
  choices:
    - label: Потребовать долю
      check: {stat: COOL, skill: persuasion, dv: 14}
      success: {text: "Ты тихо говоришь, что всё видел. Мужик ухмыляется и отсчитывает пятьсот: «За молчание. Приходи ещё»", effects: {eddies: 500, humanity: -1}}
      fail: {text: "Мужик кивает, а потом двое его охранников провожают тебя на улицу. Больно провожают.", effects: {hp: -6}}
    - label: Сдать NCPD
      effects: {heat: -2, faction_rep:ncpd: 2, street_cred: -1}
      text: "Ты шлёшь анонимку в полицию. Через день гаражи закрывают. Робо-бои переезжают, и тебя туда уже не зовут."
    - label: Промолчать
      effects: {}
      text: "Ты отворачиваешься. В этом городе честных боёв не бывает."

# -- pigeons ---------------------------------------------------------------------------------------------------------

- id: leisure_pigeon_returns
  title: Голубь вернулся
  category: rare
  weight: 1
  forced_only: true
  text: "На подоконник садится голубь с обгоревшим ранцем. Тот самый, что улетел в Сити-центр. К лапке примотан шард с логотипом Arasaka."
  choices:
    - label: Продать фиксеру
      effects: {eddies: 1500, heat: 1}
      text: "Фиксер смотрит на шард, потом на голубя, потом на тебя. Платит полторы тысячи и просит больше никогда так не делать."
    - label: Вскрыть шард
      check: {stat: INT, skill: netrunning, dv: 15}
      success: {text: "На шарде — список подкупленных копов с суммами. Ты сливаешь его в Сеть. Город гудит, копы в ярости, но твоего имени нет нигде.", effects: {fame: 2, skill_xp:netrunning: 2, faction_rep:ncpd: -3}}
      fail: {text: "Шард стирает себя и выжигает тебе порт. Глаз дёргается до утра.", effects: {hp: -4, glitches: 1}}
    - label: Вернуть Arasaka
      effects: {eddies: 300, faction_rep:arasaka: 3}
      text: "Охранник на ресепшене принимает шард и голубя без единого вопроса. Голубя, кстати, оставляют себе."

- id: leisure_pigeon_heir
  title: Старик и голубятня
  category: relationships
  weight: 1
  forced_only: true
  text: "На крыше голубятня из старых кондиционеров. Старик показывает серую птицу с хромированной лапкой: «Её зовут Ракета. Я старый, а она быстрая. Возьмёшь?»"
  choices:
    - label: Взять Ракету (300)
      effects: {eddies: -300, flag_set:pigeon_owner: true, mood: 6, add_npc:friend: true}
      text: "Ракета садится тебе на плечо. Старик отворачивается, чтобы ты не видел его глаз. Теперь у тебя есть свой голубь для гонок."
    - label: Отказаться
      effects: {mood: -1}
      text: "Ты говоришь, что не умеешь с птицами. Старик кивает: «Никто не умеет, пока не начнёт»."

# -- pizza -----------------------------------------------------------------------------------------------------------

- id: leisure_wrong_package
  title: Посылка Рейфов
  category: street
  weight: 1
  forced_only: true
  faction: wraiths
  text: "В брезенте обрез и пачка патронов. Через десять минут в дверь стучат: двое Рейфов, у одного в руках та самая пицца. «Нам кажется, это перепутали»."
  choices:
    - label: Вернуть посылку
      effects: {faction_rep:wraiths: 3, mood: 2}
      text: "Ты отдаёшь свёрток, они отдают пиццу. Пицца холодная. Рейфы хлопают тебя по плечу и запоминают адрес. В хорошем смысле. Наверное."
    - label: Оставить себе
      check: {stat: COOL, skill: persuasion, dv: 15}
      success: {text: "Ты делаешь честные глаза: никаких посылок не было. Они уходят. Обрез остаётся у тебя.", effects: {item_grant:sawed_off: true, faction_rep:wraiths: -2}}
      fail: {text: "Они не верят и проходят в квартиру без приглашения. Свёрток забирают, тебе на память оставляют фингал.", effects: {hp: -6, faction_rep:wraiths: -3}}
    - label: Открыть огонь
      violent: true
      effects: {start_combat: 2}
      text: "Ты хватаешь обрез из свёртка. Плохая идея, но уже поздно."

# -- date ------------------------------------------------------------------------------------------------------------

- id: leisure_date_corpo
  title: Свидание с корпо
  category: relationships
  weight: 1
  forced_only: true
  text: "Человек напротив работает в Militech. Говорит о квартальных отчётах так, будто это стихи. В конце вечера спрашивает: «Хочешь, познакомлю с нужными людьми?»"
  choices:
    - label: Ради чувств
      effects: {add_npc:partner: true, mood: 8}
      text: "Ты говоришь, что тебе не нужны нужные люди. Вам обоим смешно. Вы встречаетесь снова."
    - label: Ради связей
      effects: {status: 2, add_npc:contact: true, humanity: -1}
      text: "Через неделю ты на закрытом приёме Militech, жмёшь руки, раздаёшь визитки. Романтика кончилась, а связи остались."
    - label: Сбежать
      effects: {mood: -1}
      text: "Ты вспоминаешь, сколько твоих знакомых погибло из-за Militech, и уходишь, не допив."

- id: leisure_date_trap
  title: Свидание с риппером
  category: street
  weight: 1
  forced_only: true
  faction: scavengers
  text: "Твоё «свидание» так и не приходит. Вместо него дверь запирают двое в фартуках, а третий раскладывает на стойке инструменты. Это мусорщики, и твой хром им очень нравится."
  choices:
    - label: Бежать через кухню
      check: {stat: REF, skill: stealth, dv: 14}
      success: {text: "Ты перемахиваешь через стойку, ныряешь в кухню и вываливаешься в переулок. Сзади ругаются. Номер из приложения ты блокируешь.", effects: {mood: -3, skill_xp:stealth: 1}}
      fail: {text: "Тебя ловят у задней двери. Ты отбиваешься, но они успевают полоснуть скальпелем.", effects: {hp: -10, start_combat: 2}}
    - label: Драться
      violent: true
      effects: {start_combat: 2}
      text: "Ты переворачиваешь стол и хватаешь бутылку. Свидание будет запоминающимся."
    - label: Откупиться
      effects: {eddies: -600}
      text: "Ты предлагаешь деньги. Мусорщики переглядываются: живые эдди лучше, чем возня с хромом. Отпускают."

# -- tattoo ----------------------------------------------------------------------------------------------------------

- id: leisure_tattoo_gang
  title: Не тот узор
  category: street
  weight: 1
  forced_only: true
  faction: scavengers
  text: "Оказывается, узор на твоей руке — метка Мусорщиков. Свои принимают тебя за своего и машут при встрече. Чужие принимают тебя за мусорщика."
  choices:
    - label: Подыграть
      effects: {faction_rep:scavengers: 4, street_cred: 1, humanity: -1}
      text: "Ты киваешь в ответ. Через неделю тебе уже передают «приветы» и мелкие поручения. Хотелось ли этого, уже непонятно."
    - label: Перебить узор (200)
      effects: {eddies: -200, mood: 2}
      text: "Мастер за двести перебивает узор на летящего карпа. Теперь ты просто человек с карпом."
    - label: Гордо носить
      effects: {fame: 1, mood: 1}
      text: "Ты решаешь, что узор красивый, а остальное — проблемы других. Вечером на тебя косо смотрит патрульный."

# -- stream ----------------------------------------------------------------------------------------------------------

- id: leisure_stream_crime
  title: Снятое убийство
  category: ncpd
  weight: 1
  forced_only: true
  text: "На записи видно лицо убийцы: это патрульный NCPD. Он оглядывается прямо в объектив. Запись уже провисела в Сети двадцать минут, и у неё есть просмотры."
  choices:
    - label: Отдать журналистам
      effects: {eddies: 1500, fame: 4, faction_rep:ncpd: -6, heat: 2}
      text: "Новостной канал платит щедро и показывает запись в прайм-тайм. Патрульного отстраняют. Его друзья запоминают твоё имя."
    - label: Шантажировать копа
      check: {stat: COOL, skill: persuasion, dv: 16}
      success: {text: "Патрульный приходит на встречу один, бледный. Платит две тысячи и обещает, что твой розыск будет теряться в бумагах.", effects: {eddies: 2000, heat: -3, humanity: -2}}
      fail: {text: "Патрульный приходит не один. Тебя бьют долго и профессионально, а запись удаляют с твоего же телефона.", effects: {hp: -12, heat: 2}}
    - label: Удалить запись
      effects: {mood: -4}
      text: "Ты удаляешь стрим и долго сидишь в темноте. Кто-то, наверное, успел скачать."

# -- noodles ---------------------------------------------------------------------------------------------------------

- id: leisure_spicy_championship
  title: Чемпионат «Адское пламя»
  category: street
  weight: 1
  forced_only: true
  text: "Подвал ресторана, двенадцать участников, судья в противогазе. Призовой фонд — две тысячи. Лапша светится оранжевым, от неё плавится пластиковая ложка."
  choices:
    - label: Есть до конца
      check: {stat: BODY, dv: 17}
      success: {text: "За столом остаёшься только ты. Судья поднимает твою руку, твоё лицо горит, и это лучший момент в твоей жизни.", effects: {eddies: 2000, fame: 3, hp: -6, mood: 10}}
      fail: {text: "Тебя выносят на носилках после пятой миски. Риппер говорит, что желудок можно было и не жечь. Счёт за врача — твой.", effects: {hp: -14, eddies: -300, fame: 1}}
    - label: Ставить на других
      check: {stat: LUCK, dv: 12}
      success: {text: "Ты ставишь на тихую бабушку из Кабуки. Она съедает всё и просит чай. Твоя ставка утраивается.", effects: {eddies: 600}}
      fail: {text: "Твой фаворит падает лицом в миску после первой ложки. Ставка сгорает, как и он.", effects: {eddies: -200}}

# -- arcade ----------------------------------------------------------------------------------------------------------

- id: leisure_arcade_backdoor
  title: Автомат помнит Сеть
  category: rare
  weight: 1
  forced_only: true
  text: "Под заставкой старой гонки спрятан терминал. Кто-то до Краха Сети оставил здесь вход в чей-то банковский архив. Курсор мигает и ждёт."
  choices:
    - label: Взломать
      check: {stat: INT, skill: netrunning, dv: 15}
      success: {text: "Архив банка, который давно обанкротился. На забытых счетах висят копейки, но копеек много. Ты переводишь тысячу восемьсот и стираешь следы.", effects: {eddies: 1800, skill_xp:netrunning: 3}}
      fail: {text: "Старый ЛЁД ещё живой. Он бьёт по нейропорту так, что ты падаешь со стула. Хозяин аркады выносит тебя на улицу.", effects: {hp: -6, glitches: 1}}
    - label: Продать адрес фиксеру
      effects: {eddies: 600, street_cred: 1}
      text: "Фиксер платит шестьсот, не торгуясь. Через неделю автомат исчезает из аркады."
    - label: Сыграть в гонку
      effects: {skill_xp:driving: 2, mood: 4}
      text: "Ты закрываешь терминал и просто ставишь новый рекорд. Иногда игра — это просто игра."

# -- cat cafe --------------------------------------------------------------------------------------------------------

- id: leisure_cat_follows
  title: Кот выбрал тебя
  category: relationships
  weight: 1
  forced_only: true
  text: "Чёрный кот идёт за тобой три квартала и садится у твоей двери. Хозяйка кафе пишет: «Это Шрам. Он сам выбирает людей. Забирай, если не против»."
  choices:
    - label: Забрать Шрама
      effects: {flag_set:has_cat: true, humanity: 2, mood: 8}
      text: "Шрам обходит квартиру, выбирает лучшее место на кровати и засыпает. Теперь у тебя есть кот."
    - label: Отнести обратно
      effects: {mood: -2}
      text: "Ты относишь Шрама в кафе. Он смотрит на тебя с презрением, на какое способны только коты."

- id: leisure_cat_drone
  title: Добыча Шрама
  category: rare
  weight: 2
  conditions:
    flags_all: [has_cat]
  text: "Шрам притаскивает домой подбитого дрона-курьера размером с голубя. Дрон ещё мигает. В грузовом отсеке что-то есть."
  choices:
    - label: Открыть отсек
      check: {stat: TECH, skill: tech, dv: 12}
      success: {text: "Внутри кредчип на пятьсот эдди и записка: «За молчание». Чьё молчание — непонятно. Шрам требует свою долю тунцом.", effects: {eddies: 500, mood: 3}}
      fail: {text: "Дрон бьёт током. Шрам смотрит на тебя как на идиота и уходит спать.", effects: {hp: -2}}
    - label: Похвалить кота
      effects: {mood: 5, humanity: 1}
      text: "Ты чешешь Шрама за ухом. Дрон отправляется в утилизатор. Охотник доволен."

- id: leisure_cat_gas
  title: Шрам не спит
  category: rare
  weight: 1
  conditions:
    flags_all: [has_cat]
  text: "Посреди ночи Шрам орёт и царапает тебе лицо. Ты просыпаешься злым и чувствуешь запах газа: у соседей прорвало трубу."
  choices:
    - label: Будить соседей
      effects: {mood: 6, humanity: 2, street_cred: 1}
      text: "Ты выбиваешь соседскую дверь и вытаскиваешь двоих детей на лестницу. Утром весь этаж приносит Шраму еду."
    - label: Хватать кота и бежать
      effects: {mood: 2}
      text: "Ты выскакиваешь на улицу с котом под мышкой. Пожарные приезжают через двадцать минут. Шрам смотрит на тебя с одобрением."

# -- fortune teller --------------------------------------------------------------------------------------------------

- id: leisure_prophecy
  title: Человек из пророчества
  category: rare
  weight: 1
  forced_only: true
  text: "На пороге человек в мокром плаще. Он не представляется. Говорит, что гадалка велела ему найти тебя, и протягивает запечатанный конверт: «Открой, если хочешь. Обратно уже не закроешь»."
  choices:
    - label: Открыть конверт
      check: {stat: LUCK, dv: 13}
      success: {text: "Внутри кредчип на две тысячи и одна строчка: «Ты помог мне, когда я был никем. Теперь я помогаю тебе». Ты не помнишь этого человека. Он тебя помнит.", effects: {eddies: 2000, mood: 6, luck_pool: 1}}
      fail: {text: "Внутри фотография тебя, спящего, сделанная прошлой ночью. Без подписи. Неделю ты спишь с пистолетом под подушкой.", effects: {mood: -8, heat: 1}}
    - label: Отказаться
      effects: {luck_pool: 1}
      text: "Ты закрываешь дверь. Человек не стучит второй раз. Почему-то тебе кажется, что ты прошёл какую-то проверку."

- id: leisure_dog_adopt
  title: Пёс выбрал тебя
  category: relationships
  weight: 1
  forced_only: true
  text: "Пёс с кибер-челюстью сидит у твоих ног и смотрит снизу вверх. Волонтёр протягивает поводок: «Его зовут Танк. Он охраняет лучше любой двери»."
  choices:
    - label: Забрать Танка
      effects: {flag_set:has_dog: true, humanity: 2, mood: 8}
      text: "Танк занимает полквартиры и всю кровать. Зато к тебе больше никто не ломится без спроса."
    - label: Приходить в гости
      effects: {mood: 3}
      text: "Ты обещаешь приходить по выходным. Танк, кажется, понимает."

- id: dog_guard
  title: Танк на страже
  category: street
  weight: 2
  conditions:
    flags_all: [has_dog]
  text: "Ночью в дверь кто-то скребётся. Танк встаёт, рычит так, что звенят стёкла. За дверью топот убегающих ног."
  choices:
    - label: Наградить Танка
      effects: {eddies: -50, mood: 5}
      text: "Лучший стейк в районе для лучшего охранника. Утром соседи рассказывают, что на этаже вскрыли две квартиры. Твою — нет."
    - label: Выйти посмотреть
      check: {stat: COOL, dv: 12}
      success: {text: "На лестнице валяется брошенный ломик и кошелёк. Воры торопились.", effects: {eddies: 300, item_grant:crowbar: true}}
      fail: {text: "Ты спотыкаешься о Танка в темноте и летишь с лестницы.", effects: {hp: -4}}
    - label: "Прислушаться"
      ability: listen
      effects: {street_cred: 1, mood: 3}
      text: "Ты слышишь, как они договариваются вернуться завтра в три. Завтра в три их ждёт сюрприз."

- id: dog_park
  title: Собачья площадка
  category: relationships
  weight: 2
  conditions:
    flags_all: [has_dog]
  text: "На собачьей площадке Танк знакомится с пуделем. Хозяйка пуделя смеётся и предлагает выпить кофе, пока собаки бегают."
  choices:
    - label: Кофе
      effects: {add_npc:friend: true, mood: 6}
      text: "Кофе превращается в разговор на два часа. Собаки к концу спят в обнимку."
    - label: Тренировать Танка
      effects: {skill_xp:persuasion: 1, mood: 3}
      text: "Танк учится давать лапу за десять минут. Ты учишься терпению чуть дольше."
