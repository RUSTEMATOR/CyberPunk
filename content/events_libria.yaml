# The «Equilibrium» crossover (owner request 23.10): events of Libria. They come only to those who have been there
# (flag libria_visit), some only to clerics (libria_cleric) or to the Underground (libria_rebel). Player text avoids
# gendered past tense.

- id: libria_father
  title: Голос Отца
  category: street
  weight: 2
  conditions:
    flags_all: [libria_visit]
  text: "На площади Либрии гигантский экран. Отец говорит ровным голосом: «Мы победили войну, отказавшись от причины войны — от чувства». Тысячи людей в серых пальто стоят и слушают. Ни один не моргает лишний раз."
  choices:
    - label: Слушать вместе со всеми
      effects: {mood: -2, humanity: -1}
      text: "Голос Отца ровный, как Прозиум. Через десять минут ты ловишь себя на том, что киваешь в такт."
    - label: Найти источник сигнала
      check: {stat: INT, skill: netrunning, dv: 15}
      success: {text: "Сигнал идёт из архива. Отец — запись. Человек на экране умер много лет назад, а Совет продолжает говорить его лицом. Эта правда стоит дороже любых денег.", effects: {skill_xp:netrunning: 2, flag_set:libria_truth: true, mood: 3}}
      fail: {text: "Сигнал защищён на совесть. Ты только привлекаешь внимание патруля.", effects: {heat: 1}}

- id: libria_puppy
  title: Щенок
  category: relationships
  weight: 2
  conditions:
    flags_all: [libria_cleric]
  text: "Плановая зачистка в Пустошах за стеной. Отряд выносит из развалин нарушителей и всё, что они прятали. Среди вещей коробка, в ней щенок. Приказ однозначный: животные — источник чувств. Уничтожить."
  choices:
    - label: Спрятать щенка
      check: {stat: COOL, skill: stealth, dv: 14}
      success: {text: "Ты говоришь, что разберёшься лично, и уносишь коробку в машину. Щенок спит у тебя на коленях всю дорогу. Ты не знаешь, что делать с этим теплом.", effects: {humanity: 3, mood: 5}}
      fail: {text: "Напарник видит, как ты гладишь щенка, и делает пометку в планшете. Щенка забирают у тебя из рук.", effects: {humanity: 1, mood: -6, heat: 1}}
    - label: Выполнить приказ
      effects: {humanity: -3, eddies: 300}
      text: "Ты выполняешь приказ. Отряд кивает. Вечером почему-то не получается уснуть даже на Прозиуме."

- id: libria_music_box
  title: Музыкальная шкатулка
  category: rare
  weight: 1
  conditions:
    flags_all: [libria_visit]
  text: "В конфискате на складе Тетраграмматона ты находишь музыкальную шкатулку. Крышка открывается, и в мёртвой тишине склада звучит мелодия. Охранник у двери медленно поворачивает голову."
  choices:
    - label: Закрыть крышку
      effects: {mood: -1}
      text: "Тишина возвращается. Охранник отворачивается. Мелодия звучит у тебя в голове ещё неделю."
    - label: Дослушать до конца
      check: {stat: COOL, skill: persuasion, dv: 14}
      success: {text: "Ты дослушиваешь. Охранник стоит не шевелясь, и по его щеке течёт слеза. Он ничего не скажет. Он тоже пропустил дозу.", effects: {humanity: 3, mood: 6, add_npc:friend: true}}
      fail: {text: "Охранник нажимает тревожную кнопку. Ты уходишь через вентиляцию, шкатулка остаётся на полу.", effects: {heat: 2, mood: 2}}

- id: libria_neighbor
  title: Соседка без дозы
  category: relationships
  weight: 2
  conditions:
    flags_all: [libria_visit]
  text: "Женщина из квартиры напротив каждое утро выливает Прозиум в раковину. Ты слышишь через стену, как она тихо поёт. Если это услышит кто-то ещё, её сожгут вместе с квартирой."
  choices:
    - label: Предупредить её
      effects: {humanity: 2, flag_set:libria_rebel: true}
      text: "Ты стучишь и говоришь: «Пойте тише. Стены тонкие». Она смотрит долго, потом кивает. Через неделю под дверью тебя ждёт засушенная роза."
    - label: Донести
      effects: {eddies: 1000, humanity: -4}
      text: "Ты пишешь донос. Утром её уводят. Тетраграмматон переводит награду. Через стену больше никто не поёт."
    - label: Ничего не делать
      effects: {}
      text: "Ты делаешь вид, что не слышишь. Она поёт ещё месяц. Потом перестаёт. Ты не знаешь почему."

- id: libria_nether
  title: Пустоши за стеной
  category: street
  weight: 2
  conditions:
    flags_all: [libria_rebel]
  text: "Связной Подполья ведёт тебя в Пустоши — руины старого города за стеной Либрии. В подвале разрушенного собора спрятан целый музей: картины, статуи, тысячи книг. Подполью нужны деньги, чтобы перевезти коллекцию, пока клирики не нашли."
  choices:
    - label: Пожертвовать 2 000
      effects: {eddies: -2000, humanity: 3, street_cred: 2}
      text: "Коллекцию вывозят ночью на грузовиках с водой. Через месяц тебе присылают фото: картины висят в подземном зале, и у каждой стоят люди."
    - label: Продать пару картин
      effects: {eddies: 6000, humanity: -2}
      text: "Коллекционеры из Норт-Оука платят щедро. Подполье считает, что картины сгорели при облаве. Ты не поправляешь."
    - label: Охранять перевозку
      check: {stat: REF, skill: firearms, dv: 15}
      success: {text: "Патруль клириков выходит на колонну, но ты держишь мост, пока грузовики не уходят. Подполье запоминает тебя.", effects: {street_cred: 3, fame: 2, humanity: 1}}
      fail: {text: "Клирики быстрее. Один грузовик сгорает вместе с картинами. Ты уходишь, перевязывая руку.", effects: {hp: -12, mood: -4}}

- id: libria_withdrawal
  title: Первое утро без Прозиума
  category: relationships
  weight: 2
  conditions:
    flags_all: [libria_visit]
  text: "Утро. Инжектор лежит на столе. Ты не колешь дозу. Через час солнце на стене кажется невыносимо ярким, кофе — невыносимо вкусным, а память о прошлом — невыносимо тяжёлой. Хочется плакать и смеяться одновременно."
  choices:
    - label: Выйти и почувствовать
      effects: {mood: 4, humanity: 2}
      text: "Ты идёшь под дождём без зонта. Это самое страшное и самое живое утро за долгое время."
    - label: Уколоться и забыть
      effects: {mood: -2}
      text: "Щелчок инжектора. Мир снова серый и ровный. Безопасно. Пусто."
