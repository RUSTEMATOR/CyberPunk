# Looksmaxxing (owner request 24.10): mewing, mogging, canthal tilt, "it's over / we're so back" in Night City.
# Implants in cyberware_looks.yaml. Player text avoids gendered past tense.

- id: lm_coach
  title: Лукс-коуч из Кабуки
  category: street
  weight: 2
  conditions:
    flags_none: [abroad]
  text: "Парень с челюстью, как у бульдозера, ловит тебя у лапшичной. «Чумба, у тебя потенциал. Слабый кантальный наклон, но это лечится. Курс мьюинга, план по жевательной смоле, гайд по моггингу. Две тысячи, и через месяц ты асцендишь»."
  choices:
    - label: Купить курс · 2000
      effects: {eddies: -2000, mood: 4, skill_xp:persuasion: 2}
      text: "Месяц прижимаешь язык к нёбу на каждой встрече. Челюсть не меняется, но уверенности почему-то больше. Коуч пишет в чат: «Ты почти асцендил, брат, нужен продвинутый курс за пять»."
    - label: Спросить его PSL
      check: {stat: COOL, skill: persuasion, dv: 13}
      success: {text: "«А сам-то на сколько тянешь?» Он зависает, достаёт телефон, считает пропорции и уходит, не попрощавшись. Прохожие хлопают.", effects: {mood: 5, street_cred: 1}}
      fail: {text: "Он мгновенно называет свой балл, твой балл и балл твоей матери. Все три числа обидные.", effects: {mood: -4}}
    - label: Пройти мимо
      effects: {}
      text: "Он кричит вслед: «Это конец для тебя!» Ты не оборачиваешься. Но вечером всё-таки смотришь на себя в профиль."

- id: lm_mog
  title: Тебя моггают в клубе
  category: relationships
  weight: 2
  conditions:
    flags_none: [abroad]
  text: "В «Посмертии» у стойки встаёт корпорат с хромированной челюстью, ростом под два метра и глазами, которые сами наводят резкость. Девушка, с которой ты говоришь, смотрит уже не на тебя. Ты в зоне моггинга."
  choices:
    - label: Моггнуть в ответ
      check: {stat: COOL, skill: persuasion, dv: 15}
      success: {text: "Ты выпрямляешься, смотришь ему прямо в оптику и рассказываешь такую историю, что бар слушает тебя, а не его. Корпорат допивает и уходит. Мы вернулись.", effects: {mood: 8, fame: 1}}
      fail: {text: "Он просто улыбается. Титановые зубы ловят свет стробоскопа. Это конец.", effects: {mood: -6}}
    - label: Угостить его
      effects: {eddies: -300, add_npc:friend: true, mood: 2}
      text: "Оказывается, он неплохой мужик и ненавидит свою челюсть: она ноет к дождю. Вы пьёте до закрытия и обмениваетесь контактами."
    - label: Уйти домой
      effects: {mood: -2}
      text: "Дома открываешь каталог риппера на странице «Лицо». Закрываешь. Открываешь снова."

- id: lm_bonesmash
  title: Боун-смешинг на крыше
  category: street
  weight: 1
  conditions:
    flags_none: [abroad]
  text: "На крыше соседней многоэтажки подросток бьёт себя молотком по скулам и снимает это для ленты. Говорит, кость нарастёт толще и лицо станет «острее». Под видео тысяча лайков."
  choices:
    - label: Отобрать молоток
      check: {stat: EMP, skill: persuasion, dv: 12}
      success: {text: "Ты садишься рядом и долго говоришь. Про то, что лицо — не рейтинг, а кость так не растёт. Он отдаёт молоток и плачет. Видео он удаляет.", effects: {humanity: 3, mood: 4}}
      fail: {text: "Он обзывает тебя «копиумщиком» и уходит с молотком. Через неделю в ленте его видео с гипсом на лице. Лайков ещё больше.", effects: {mood: -4}}
    - label: Отвести к рипперу
      effects: {eddies: -500, humanity: 2}
      text: "Риппер смотрит на синяки, потом на тебя, потом опять на синяки. «Скулы ставлю за полторы, без молотка». Пацан уходит со скидкой и рассказывает всем, что знает тебя."
    - label: Не лезть
      effects: {humanity: -1}
      text: "Удары молотка слышно ещё полчаса. Город такой."

- id: lm_mirror
  title: Утро. Зеркало. Оценка
  category: implants
  weight: 2
  conditions:
    flags_none: [abroad]
  text: "Умное зеркало в ванной обновилось и теперь по утрам ставит оценку лицу. Сегодня у тебя 4,5 из 10. Внизу мелким шрифтом: «Рекомендуем клинику „Новое лицо“, скидка 15%»."
  choices:
    - label: Записаться в клинику · 4500
      effects: {eddies: -4500, cyberware_grant:looks_jaw: true}
      text: "Через неделю зеркало показывает 7,8. Челюсть ноет при каждом слове, зато соседи по лестнице здороваются первыми."
    - label: Перепрошить зеркало
      check: {stat: TECH, skill: tech, dv: 12}
      success: {text: "Теперь зеркало каждое утро говорит «десять из десяти, легенда». Кофе вкуснее.", effects: {mood: 6}}
      fail: {text: "Зеркало зависает на оценке 2,1 и больше не меняет её. Выбрасывать жалко.", effects: {mood: -5}}
    - label: Лицо как лицо
      effects: {mood: 3, humanity: 1}
      text: "Ты выключаешь оценку в настройках и чистишь зубы. Лицо как лицо. Живое."

- id: lm_height
  title: Подпольный хайтмаксинг
  category: implants
  weight: 1
  conditions:
    flags_none: [abroad]
  text: "Объявление на столбе: «Рост — это не приговор. Телескопические голени, плюс пятнадцать сантиметров, за одну ночь». Ниже фото довольного клиента, который упирается головой в потолок."
  choices:
    - label: Лечь на операцию · 7000
      effects: {eddies: -7000, cyberware_grant:looks_legs: true, mood: 3}
      text: "Ночь в кресле, утро на костылях, вечер — метр восемьдесят с хвостиком. В анкетах теперь не надо врать. Брюки придётся покупать новые."
    - label: Стельки за 50
      effects: {eddies: -50, mood: 2}
      text: "Плюс четыре сантиметра и минус удобство. Никто не замечает. Ты замечаешь каждый шаг."
    - label: Рост — конструкт
      effects: {mood: 1}
      text: "Ты фотографируешь объявление и отправляешь другу с подписью «до чего дошёл город». Друг отвечает, что уже записался."

- id: lm_neighbor
  title: Сосед на софтмаксинге
  category: relationships
  weight: 1
  conditions:
    flags_none: [abroad]
  text: "Сосед по этажу третий месяц на софтмаксинге: увлажнитель, гуаша, сон на спине, солнцезащитный крем в подъезде без окон. Сегодня у него собеседование, и он боится, что «недоасцендил»."
  choices:
    - label: Помочь с собеседованием
      check: {stat: EMP, skill: persuasion, dv: 12}
      success: {text: "Полчаса репетиции, и он понимает, что спросят про опыт, а не про скулы. Вечером стучит в дверь с бутылкой: взяли.", effects: {add_npc:friend: true, humanity: 2, mood: 4}}
      fail: {text: "Ты учишь его держать паузу, он держит её слишком долго. Не взяли. Зато кожа у него действительно отличная.", effects: {mood: -2}}
    - label: Одолжить крем
      effects: {mood: 2}
      text: "Крем пахнет огурцом и стоит как твоя аренда. Кожа и правда мягче. Это ничего не значит. Наверное."
    - label: Закрыть дверь
      effects: {}
      text: "Через стенку слышно, как он репетирует улыбку перед зеркалом."
