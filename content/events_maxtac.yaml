# MaxTac service and the life of a fugitive psycho. DESIGN.md 7b, PLAN.md 6.6a / 6.6b / 1.7f.
# Duty events fire for the `maxtac` career; fugitive events need the flag fugitive_psycho
# (condition flag `is_fugitive_psycho`, set by the engine and by `flag_set:fugitive_psycho`).
# Effects stay modest: the heavy things (the hunt itself, the surrender screen) are engine flows.

# ---------------------------------------------------------------- MaxTac duty

- id: maxtac_duty_block_call
  title: Вызов в жилой блок
  category: ncpd
  weight: 4
  conditions:
    careers: [maxtac]
  faction: cyberpsycho
  text: "Сирена в шесть утра. Мегабашня, четвёртый этаж: киберпсих пробил стену и держит заложника. Отряд уже у лифта, а ингибитор в затылке чуть теплеет и ждёт твоего решения."
  choices:
    - label: Штурмовать
      violent: true
      check: {stat: REF, skill: firearms, dv: 17}
      success: {text: "Дверь, светошумовая, две секунды. Заложник жив, киберпсих лежит лицом в бетон. Командир кивает один раз, и этого достаточно.", effects: {street_cred: 2, eddies: 300}}
      fail: {text: "Он ждал у двери. Первая очередь уходит в потолок, вторая в твой бронежилет, и штурм превращается в бой.", effects: {hp: -5, start_combat: 4}}
    - label: Уговорить
      check: {stat: EMP, skill: persuasion, dv: 19}
      success: {text: "Ты называешь его по имени, которое прочитал в карточке минуту назад. Он слушает. Сначала выходит заложник, потом он сам, с поднятыми руками.", effects: {street_cred: 1, mood: 2}}
      fail: {text: "Он слышит в твоём голосе полицейский тон и стреляет через дверь. Осколок бетона рассекает тебе бровь, и отряд берёт квартиру силой.", effects: {hp: -4, mood: -2}}
    - label: Не идти первым
      effects: {hp: -7, mood: -3, street_cred: -1}
      text: "Приказ повторяют дважды. В третий раз приказывает ингибитор: разряд от затылка до пяток, ты прокусываешь губу. В лифт ты заходишь последним, но заходишь."

- id: maxtac_duty_known_face
  title: Знакомое имя в списке
  category: ncpd
  weight: 3
  conditions:
    careers: [maxtac]
    min_street_cred: 3
  faction: cyberpsycho
  text: "На планшете имя цели, и ты узнаёшь его сразу: вы вместе пили у Лиззи, когда у обоих ещё не было хрома. Теперь он беглый киберпсих и прячется на крыше недостроенной башни. Командир отводит взгляд."
  choices:
    - label: Взять живым
      check: {stat: EMP, skill: persuasion, dv: 19}
      success: {text: "Ты идёшь без оружия и зовёшь его так же, как раньше. Он смеётся, плачет и отдаёт нож рукоятью вперёд. В изолятор он поедет живым, а ты потом долго не можешь уснуть.", effects: {mood: 2, street_cred: 1, rel_npc:friend: 5}}
      fail: {text: "Увидев тебя, он срывается окончательно. Короткая схватка на краю крыши, и отряд забирает уже тело.", effects: {hp: -6, mood: -4}}
    - label: Ликвидировать
      violent: true
      effects: {mood: -5, humanity: -2, eddies: 500, street_cred: 1}
      text: "Один выстрел с дальней дистанции, чтобы не видеть лица. Премия приходит в тот же день, но тратить её не хочется."
    - label: Взять отвод
      effects: {mood: -2, eddies: -300}
      text: "Командир подписывает рапорт не читая и удерживает из жалованья штраф. Цель передают другому звену. Что с ним стало, тебе не говорят."

- id: maxtac_duty_leash_glitch
  title: Ингибитор сбоит
  category: ncpd
  weight: 3
  conditions:
    careers: [maxtac]
    requires: [has_cyberware]
  text: "Посреди смены ингибитор срабатывает сам по себе. В ушах звенит, всё вокруг краснеет, а рука тянется к кобуре. Разряд должен идти только по приказу командира, но приказа не было."
  choices:
    - label: К техникам
      check: {stat: TECH, skill: tech, dv: 15}
      success: {text: "Техник отряда ворчит над каждым чипом, но перепрошивает ингибитор. Звон проходит. Ты чувствуешь себя собакой после ветеринара, зато здоровой.", effects: {mood: 1, skill_xp:tech: 1}}
      fail: {text: "Калибровка срывается, и ингибитор бьёт тебя током. Техник разводит руками: партия бракованная, замены нет.", effects: {hp: -5, mood: -2}}
    - label: Перетерпеть
      check: {stat: COOL, dv: 17}
      success: {text: "Ты считаешь удары сердца, пока красное не отступает. Смена проходит тихо. Командир ничего не замечает или делает вид.", effects: {mood: -1}}
      fail: {text: "К концу смены ты уже не слышишь рацию. Тебя уводят под руки, а в рапорте появляется пометка о нестабильности.", effects: {mood: -4, street_cred: -1}}
    - label: К рипперу
      effects: {eddies: -600, mood: 1}
      text: "Подпольный риппер смотрит на ингибитор, присвистывает и берёт шестьсот вперёд. Сбой он убирает, а сам ингибитор не трогает: на это никто не решится."

- id: maxtac_duty_way_out
  title: Предложение уйти
  category: ncpd
  weight: 2
  conditions:
    careers: [maxtac]
  text: "В «Посмертии» к тебе подсаживается человек, которого ты когда-то брал живым. Он знает риппера, который снимает ингибиторы, и предлагает уйти этой же ночью. Это дезертирство: утром за тобой пошлют твой же отряд."
  choices:
    - label: Сбежать
      effects: {career_clear: true, flag_set:fugitive_psycho: true, heat: 5, mood: -3}
      text: "Ты кладёшь жетон на стойку и выходишь через кухню. С утра ты в розыске, и за тобой идёт отряд, который ещё вчера прикрывал тебе спину."
    - label: Отказаться
      check: {stat: COOL, skill: persuasion, dv: 13}
      success: {text: "Ты говоришь, что контракт есть контракт. Он пожимает плечами, допивает и уходит.", effects: {mood: 1}}
      fail: {text: "Он не отстаёт, и разговор затягивается. Ингибитор ловит каждую твою интонацию и под конец больно щёлкает в затылке.", effects: {mood: -2, hp: -2}}
    - label: Доложить
      effects: {eddies: 500, street_cred: 1, mood: -2}
      text: "Через час бар оцеплен, человека выводят в наручниках. Командир кладёт перед тобой премию и не смотрит в глаза."

# ---------------------------------------------------------------- fugitive psycho

- id: psycho_fugitive_old_friend
  title: Ночлег у знакомого
  category: street
  weight: 4
  conditions:
    requires: [is_fugitive_psycho]
  text: "Старый знакомый открывает дверь с третьего звонка. Он знает, кто ты, и всё равно впускает: кофе, раскладушка, плотные шторы. Но за окном уже висит дрон."
  choices:
    - label: Остаться до утра
      check: {stat: COOL, skill: stealth, dv: 15}
      success: {text: "Ты спишь четыре часа, и красная пелена не приходит. Утром на столе записка и пакет еды. Дрон улетел, никого не позвав.", effects: {hp: 5, mood: 3}}
      fail: {text: "Ночью в подъезд заходит патруль. Знакомый врёт, но неубедительно, и тебе приходится прыгать из окна второго этажа.", effects: {hp: -4, heat: 1, rel_npc:friend: -10}}
    - label: Поесть и уйти
      effects: {hp: 2, mood: 1}
      text: "Ты пьёшь кофе стоя, забираешь пакет с едой и уходишь через чёрный ход. Знакомый молча смотрит тебе вслед."
    - label: Отнять деньги
      violent: true
      check: {stat: BODY, skill: melee, dv: 13}
      success: {text: "Он отдаёт всё, что есть в доме, и больше не смотрит тебе в глаза. Дружбе конец.", effects: {eddies: 400, rel_npc:friend: -20, mood: -2}}
      fail: {text: "Он оказывается проворнее, чем выглядит: хлопает дверь, на лестнице кто-то кричит. Ты убегаешь с порванным рукавом, а соседи уже звонят в полицию.", effects: {hp: -5, heat: 1, rel_npc:friend: -20}}

- id: psycho_fugitive_drone_sweep
  title: Дроны над кварталом
  category: street
  weight: 4
  conditions:
    requires: [is_fugitive_psycho]
  text: "Над крышами поднимаются дроны с тепловизорами и прочёсывают квартал окно за окном. Это ещё не МаксТак, но всё, что они найдут, достанется ему. До угла двадцать метров."
  choices:
    - label: В коллектор
      check: {stat: REF, skill: stealth, dv: 17}
      success: {text: "Ты лежишь в тёплой жиже и считаешь дронов по звуку. Они пролетают мимо. Одежду теперь только выбросить.", effects: {mood: -1}}
      fail: {text: "Один дрон всё-таки ловит тепло. Ты вылезаешь из люка и бежишь дальше, так и не отдохнув.", effects: {hp: -3, heat: 1}}
    - label: По крышам
      check: {stat: REF, dv: 15}
      success: {text: "Ты бежишь по кровлям и перепрыгиваешь проулки, пока дроны не теряют тебя среди вентиляционных шахт.", effects: {skill_xp:stealth: 1, mood: 1}}
      fail: {text: "Нога соскальзывает с мокрого рубероида, и ты падаешь на балкон этажом ниже. Дроны это слышат.", effects: {hp: -6, heat: 1}}
    - label: Купить глушилку
      effects: {eddies: -400, mood: 1}
      text: "Барыга берёт четыреста не считая и достаёт глушилку из обувной коробки. Работает она час, потом сгорает, но часа хватает, чтобы уйти за два квартала."

- id: psycho_fugitive_red_hour
  title: Красный час
  category: street
  weight: 3
  conditions:
    requires: [is_fugitive_psycho]
  text: "Мысли тонут в шуме. Прохожие кажутся мишенями, хотя ты помнишь, что это просто люди. Руки дрожат, и через минуту либо отпустит, либо нет."
  choices:
    - label: Удержаться
      check: {stat: COOL, dv: 17}
      success: {text: "Ты вцепляешься в перила и считаешь ступени. На сороковой красное отступает, и мир возвращает цвета. Ты ничего не сломал.", effects: {mood: 1, street_cred: 1}}
      fail: {text: "Красное накрывает с головой. Ты приходишь в себя в чужом подъезде с разбитыми костяшками и не помнишь, что было.", effects: {hp: -5, mood: -4, heat: 1}}
    - label: Купить стабилизатор
      effects: {eddies: -500, hp: 3, mood: 2}
      text: "Подпольный врач колет тебе в шею что-то холодное и не спрашивает имени. Красное отступает на несколько дней, дольше он не обещает."
    - label: Дать волю
      violent: true
      effects: {start_combat: 3, mood: -3, heat: 1}
      text: "Ты перестаёшь сопротивляться. Первые секунды это даже приятно, потом вокруг начинают кричать, и в переулке ты уже не один."
