- id: meme_thisisfine
  title: Всё нормально
  category: street
  weight: 2
  text: "В твоём доме загорается проводка. Комната медленно наполняется дымом, по потолку ползёт огонь. Сосед за стеной громко говорит в пустоту: «Всё нормально. Всё хорошо»."
  choices:
    - label: Сесть и допить кофе
      effects: {hp: -6, mood: 4}
      text: "Ты сидишь, пьёшь кофе и повторяешь: «Всё нормально». Пожарные выносят тебя вместе с кружкой. Кружку ты не отпускаешь."
    - label: Потушить самому
      check: {stat: TECH, skill: tech, dv: 13}
      success: {text: "Ты выдёргиваешь пробки и душишь огонь одеялом. Сосед аплодирует через стену.", effects: {skill_xp:tech: 1, mood: 2}}
      fail: {text: "Одеяло тоже горит. Приходится бежать на лестницу в одном ботинке.", effects: {hp: -4, eddies: -300}}
    - label: Выбежать сразу
      effects: {eddies: -500}
      text: "Ты выбегаешь. Пожар тушат, но счёт за ремонт приходит тебе."

