      check: {stat: EMP, skill: persuasion, dv: 13}
      success: {text: "Ты говоришь о нём просто и честно. Вдова плачет и обнимает тебя. После церемонии к тебе подходят его старые друзья.", effects: {add_npc:contact: true, mood: 3}}
      fail: {text: "Ты сбиваешься на второй фразе. Голограмма услужливо подсказывает: «Нажмите F».", effects: {mood: -2}}

- id: meme_coffin_dance
  title: Танец с гробом
  category: relationships
  weight: 2
  text: "Похоронное бюро в Хейвуде предлагает услугу «с огоньком»: шестеро носильщиков в костюмах танцуют с гробом под электронный бит. По городу ходит шутка: кто доиграет с киберпсихами, получит такие похороны."
  choices:
    - label: Заказать заранее
      effects: {eddies: -800, mood: 5}
