  text: "Ночью ты просыпаешься от ощущения, что на тебя смотрят. На подоконнике сидит тот самый кот. Голограмма-рот светится в темноте. «Я тебя нашёл. Я тебя не обижу. Давай будем смотреть друг другу в глаза. Ты не хочешь? Почему?»"
  choices:
    - label: Смотреть до утра
      check: {stat: COOL, dv: 15}
      success: {text: "Вы смотрите друг на друга до рассвета. С первым лучом голограмма гаснет, и на подоконнике остаётся просто кот. Он мурлычет, спрыгивает тебе на колени и больше никуда не уходит. Иван потом заходит его погладить.", effects: {mood: 8, humanity: 2, flag_set:meme_cat_friend: true}}
      fail: {text: "К трём часам ночи веки закрываются сами. Утром кота нет. На стекле с той стороны отпечаток широкой улыбки.", effects: {mood: -6, glitches: 1}}
