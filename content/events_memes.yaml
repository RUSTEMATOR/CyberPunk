# Memes of the Old Net and of today, reborn in Night City (owner request 23.10: «мемные ивенты», Reddit, 4chan, 2ch,
# trollface and everything from 2000 on). In-world parodies: no lyrics, no copypasta verbatim, no real people's names.
# Story chains: the first step is a random event, the next ones are forced_only and come with the next month
# (`queue_event`). Player text avoids gendered past tense.

# ======================================================================== chain: Тролльфейс (rickroll + trollface)

- id: meme_rickroll_1
  title: Песня, от которой не отвертеться
  category: street
  weight: 2
  conditions:
    flags_none: [meme_troll]
  text: "Фиксер присылает шард: «Чертежи прототипа „Милитеха“, срочно, дорого». Вставляешь в деку — и вместо чертежей на всю оптику играет древний клип с рыжим парнем в плаще, который клянётся никогда тебя не бросать. Клип не закрывается. В углу экрана ухмыляется нарисованная рожа с подписью: «Проблемы?»"
  choices:
    - label: Досмотреть до конца
      effects: {mood: 3, flag_set:meme_troll: true, queue_event:meme_rickroll_2: true}
      text: "Три с половиной минуты. Нога сама отбивает ритм. В самом конце на экране мелькает адрес сервера. Тролль оставил след — или приглашение."
    - label: Вычистить вирус
      check: {stat: INT, skill: netrunning, dv: 13}
      success: {text: "Ты выдираешь клип из деки по байту. В коде подпись: «ТРОЛЛЬ-77. Город будет петь». Это не последняя встреча.", effects: {skill_xp:netrunning: 1, flag_set:meme_troll: true, queue_event:meme_rickroll_2: true}}
      fail: {text: "Клип размножается. Неделю он включается в оптике каждый раз, когда ты моргаешь дважды. Соседи слышат, как ты подпеваешь.", effects: {mood: -3, flag_set:meme_troll: true, queue_event:meme_rickroll_2: true}}
    - label: Предъявить фиксеру
      effects: {flag_set:meme_troll: true, eddies: 200}
      text: "Фиксер ржёт в трубку так, что слышно щелчок челюсти: его самого развели тем же шардом. За моральный ущерб он кидает двести эдди. Больше ты про тролля не слышишь."

- id: meme_rickroll_2
  title: Город поёт
  category: street
  weight: 1
  forced_only: true
  text: "Вечером все рекламные щиты Найт-Сити разом переключаются на тот самый клип. На мосту стоит пробка: водители высовываются из окон и подпевают. NCPD в эфире ругается матом. Сервер, мелькнувший в конце клипа, всё ещё онлайн."
  choices:
    - label: Выследить тролля
      check: {stat: INT, skill: netrunning, dv: 15}
      success: {text: "Ты идёшь по следу через три прокси, кофейню в Кабуки и детский форум про пони. Логово тролля — квартира над прачечной в Уотсоне.", effects: {skill_xp:netrunning: 2, queue_event:meme_rickroll_3: true}}
      fail: {text: "След обрывается на сервере, где тебе тоже включают клип. Но адрес в Уотсоне всё же мелькает в логах.", effects: {mood: -2, queue_event:meme_rickroll_3: true}}
    - label: Записать вирусный ролик
      effects: {fame: 2, mood: 4}
      text: "Ты снимаешь, как полгорода поёт в пробке, и выкладываешь. Ролик набирает миллионы. Тролль, кажется, остаётся доволен."
    - label: Продать NCPD наводку
      check: {stat: COOL, skill: persuasion, dv: 13}
      success: {text: "Детектив платит за адрес сервера и просит никому не говорить, что в полиции тоже подпевали.", effects: {eddies: 800}}
      fail: {text: "Детектив отвечает, что у полиции есть дела поважнее. Через минуту в его кабинете тоже играет клип.", effects: {mood: 1}}

- id: meme_rickroll_3
  title: Логово тролля
  category: street
  weight: 1
  forced_only: true
  text: "Квартира над прачечной. Внутри пятнадцатилетний пацан в худи сидит среди трёх мониторов и банок энергетика. На стене плакат с той самой ухмыляющейся рожей. «Ну и чё? — говорит он. — Город был слишком серьёзным»."
  choices:
    - label: Взять его в ученики
      effects: {add_npc:protege: true, skill_xp:netrunning: 1, mood: 4}
      text: "Пацан фыркает, но соглашается. Через месяц он шлёт тебе мемы чаще, чем фиксер шлёт заказы. Иногда это полезные мемы."
    - label: Сдать корпорации
      effects: {eddies: 3000, humanity: -2, mood: -3}
      text: "«Милитех» платит за тролля три тысячи. Пацана увозят в чёрном фургоне. Неделю спустя все щиты корпорации показывают тот же клип: у него остались друзья."
    - label: Заключить договор
      effects: {eddies: 1000, fame: 1}
      text: "Он больше не трогает твою оптику, а ты не знаешь его адрес. На прощание он переводит тебе тысячу «за вдохновение» с чужого корпоративного счёта."

# ======================================================================== chain: Штурм Зоны (Area 51 raid)

- id: meme_area_1
  title: Нас всех не остановить
  category: street
  weight: 2
  conditions:
    flags_none: [meme_area]
  text: "В Сети вирусится шутка: «Штурмуем закрытую базу „Милитеха“ в Бесплодных землях, бежим по-наруто, руки назад. Всех не остановят». Под постом два миллиона отметок «пойду». Кочевники уже продают футболки."
  choices:
    - label: Записаться на штурм
      effects: {flag_set:meme_area: true, mood: 3, queue_event:meme_area_2: true}
      text: "Ты жмёшь «пойду». Друг присылает видео, как правильно бегать с руками за спиной. Ты тренируешься в коридоре."
    - label: Продавать футболки
      check: {stat: COOL, skill: persuasion, dv: 12}
      success: {text: "Футболки уходят быстрее, чем их печатают. На шутке зарабатывают все, кроме тех, кто её придумал.", effects: {flag_set:meme_area: true, eddies: 1200}}
      fail: {text: "Партия футболок с опечаткой: «Нас всех не остоновить». Продаётся хуже, зато становится отдельным мемом.", effects: {flag_set:meme_area: true, eddies: 200}}
    - label: Пролистать
      effects: {flag_set:meme_area: true}
      text: "Ты листаешь дальше. Через месяц новости покажут, как это было."

- id: meme_area_2
  title: Фестиваль у забора
  category: street
  weight: 1
  forced_only: true
  faction: militech
  text: "У забора базы пять тысяч человек, хотя «пойду» жали два миллиона. Пиво, кочевники, музыка, кто-то в костюме пришельца. Охрана «Милитеха» смотрит через прицелы. Кто-то кричит: «На счёт три бежим!»"
  choices:
    - label: Бежать по-наруто
      check: {stat: REF, skill: stealth, dv: 16}
      success: {text: "Пока охрана ловит парня в костюме пришельца, ты проскальзываешь в ангар. Внутри ящики с маркировкой, которую лучше не видеть.", effects: {skill_xp:stealth: 2, queue_event:meme_area_3: true}}
      fail: {text: "Ты бежишь красиво, руки назад, ровно до первого шокового дрона. Очнуться приходится в автозаке.", effects: {hp: -6, heat: 2, mood: 2}}
    - label: Остаться на фестивале
      effects: {mood: 6, add_npc:friend: true}
      text: "Штурм так и не начинается. Зато всю ночь музыка, костры и самые странные люди Бесплодных земель. Утром у тебя новый друг и чужая шляпа."
    - label: Пойти на прорыв с оружием
      violent: true
      effects: {start_combat: 4}
      text: "Шутки кончились. У охраны тоже."

- id: meme_area_3
  title: Что прятали в ангаре
  category: rare
  weight: 1
  forced_only: true
  text: "В ящиках не пришельцы. Там прототипы оптики, которые видят сквозь стены, и терминал с отчётом: «Проект свернут, образцы списать». Сирена завывает над базой."
  choices:
    - label: Унести образец
      check: {stat: REF, skill: stealth, dv: 15}
      success: {text: "Ты уходишь через дренажную трубу с коробкой под курткой. Риппер в Кабуки даёт за неё столько, что хватит на полгода.", effects: {eddies: 6000, heat: 1, fame: 2}}
      fail: {text: "Коробку приходится бросить у забора. Уходишь с пустыми руками и простреленной курткой.", effects: {hp: -8, heat: 2}}
    - label: Слить отчёт в Сеть
      effects: {fame: 4, street_cred: 2, faction_rep:militech: -3}
      text: "Отчёт расходится по всем форумам. «Милитех» отрицает. Над базой снова вешают баннер: «Здесь ничего нет»."
    - label: Тихо уйти
      effects: {mood: 2}
      text: "Ты уходишь. Иногда лучшее знание — то, которого у тебя нет."

# ======================================================================== chain: Алмазные руки (WallStreetBets / GameStop)

- id: meme_stonks_1
  title: Акции только вверх
  category: money
  weight: 2
  conditions:
    flags_none: [meme_stonks]
  text: "На форуме «Ставки с Уолл-стрит» анонимы решили спасти умирающую сеть магазинов «Игропорт». Хедж-фонды поставили на её банкротство, анонимы скупают акции. На аватарках алмазы и ракеты. Акция уже выросла в двадцать раз."
  choices:
    - label: Войти на 5 000 эдди
      effects: {eddies: -5000, flag_set:meme_stonks: true, queue_event:meme_stonks_2: true}
      text: "Ты покупаешь на самом верху, как и положено настоящему участнику форума. На аватарку ставишь алмаз."
    - label: Посмеяться и пройти мимо
      effects: {flag_set:meme_stonks: true, mood: 1}
      text: "Через месяц в новостях: кто-то стал миллионером, кто-то продал почку. Ты остаёшься при своих."

- id: meme_stonks_2
  title: Алмазные руки
  category: money
  weight: 1
  forced_only: true
  text: "Акция «Игропорта» скачет как пульс киберпсиха. Сегодня твои пять тысяч стоят двадцать, через час — три. Брокерское приложение «заботливо» отключило кнопку покупки. Форум кричит: «Держим! Алмазные руки!»"
  choices:
    - label: Продать сейчас
      check: {stat: COOL, dv: 14}
      success: {text: "Ты продаёшь на пике и ловишь самое красивое число в своей жизни. Форум называет тебя «бумажными руками». Плевать.", effects: {eddies: 18000, mood: 5}}
      fail: {text: "Пока жмёшь кнопку, график падает. Выходишь в ноль, с седыми висками.", effects: {eddies: 5000, mood: -2}}
    - label: Держать до луны
      effects:
        later:
          - weeks: 8
            chance: 0.35
            effects: {eddies: 40000, fame: 2}
            text: "Через два месяца вторая волна. Держать стоило: продаёшь в сорок тысяч. Форум ставит тебе памятник из пикселей."
            fail_effects: {mood: -4}
            fail_text: "Через два месяца «Игропорт» стоит как бутерброд. Зато руки у тебя алмазные."
            hint: "акции «Игропорта»"
      text: "Ты держишь. Алмазные руки. На луну или в бездну."

# ======================================================================== single memes

- id: meme_leeroy
  title: Он побежал первым
  category: work
  weight: 2
  text: "Группа из пяти наёмников две недели планирует налёт на склад «Тигриных когтей»: схема, тайминги, кто кого прикрывает. Шестой, новенький, только что вернулся из бара с курицей в руке. Он слушает пять секунд, кричит своё имя и бежит в ворота."
  choices:
    - label: Бежать за ним
      check: {stat: REF, skill: firearms, dv: 15}
      success: {text: "Каким-то чудом это работает. Когти не ждали такого идиотизма. Склад ваш, а новичок ещё неделю всем рассказывает, что так и задумано.", effects: {eddies: 1500, street_cred: 2}}
      fail: {text: "Это не работает. Пять выживших сидят в канаве и молча перевязываются. Новичок говорит: «Ну хотя бы у меня есть курица».", effects: {hp: -12, mood: -3}}
    - label: Остаться по плану
      effects: {mood: 2}
      text: "Ты смотришь, как он исчезает в воротах. Через три минуты крики, ещё через пять — тишина. План уже не нужен."
    - label: Снять на видео
      effects: {fame: 2, mood: 3}
      text: "Ролик с его воплем расходится по всему городу. Через неделю его кричат на каждой вечеринке."

- id: meme_over9000
  title: Больше девяти тысяч
  category: implants
  weight: 2
  text: "Новый сканер боевой оценки в клинике риппера считывает «уровень угрозы» пациентов. Риппер смотрит на цифры на твоей шкале, снимает тактические очки, давит их рукой и орёт на всю клинику, что там больше девяти тысяч."
  choices:
    - label: Так и есть
      effects: {street_cred: 2, mood: 3}
      text: "Через день половина Кабуки знает, что ты зашкаливаешь. Никто не уточняет, что сканер просто сломан."
    - label: Перемерить
      effects: {eddies: -100}
      text: "Повторный замер стоит сотню. Показывает «восемь». Риппер разочарованно надевает новые очки."

- id: meme_allyourbase
  title: Вся ваша база
  category: street
  weight: 2
  text: "Ночью все экраны башни корпорации в Сити-центре переключаются на кривой перевод с японского: «Вся ваша база принадлежать нас. Вы на пути к разрушению». Корпораты бегают по этажам. Ты стоишь внизу с кофе."
  choices:
    - label: Сфотографировать
      effects: {mood: 3, fame: 1}
      text: "Фото с кофе на фоне башни становится обложкой ночных новостей. Ничего не приносит, но смешно."
    - label: Вынести что-то из лобби
      check: {stat: REF, skill: stealth, dv: 14}
      success: {text: "Пока охрана смотрит наверх, ты уходишь с дорогим кофейным автоматом из лобби. Он варит лучший кофе в твоей жизни.", effects: {eddies: 900, mood: 2}}
      fail: {text: "Охрана как раз решила, что виноват кто-то внизу. Ты подходишь.", effects: {heat: 1, hp: -4}}

- id: meme_doge
  title: Такой коин, очень рост
  category: money
  weight: 2
  text: "Новая криптовалюта «Собакоин» с мордой улыбающегося шиба-ину на логотипе. Создатели честно пишут: «Это шутка». Курс за неделю вырос в сорок раз, потому что один корпоративный миллиардер написал «гав»."
  choices:
    - label: Купить на 1 000
      effects:
        eddies: -1000
        later:
          - weeks: 4
            chance: 0.45
            effects: {eddies: 6000, mood: 4}
            text: "Миллиардер снова написал «гав». Твоя тысяча стала шестью. Такой рост. Очень вау."
            fail_effects: {mood: -2}
            fail_text: "Миллиардер написал «мяу». «Собакоин» стоит дешевле, чем сам шиба-ину."
