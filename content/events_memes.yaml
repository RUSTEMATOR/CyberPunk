  weight: 2
  text: "На похоронах знакомого наёмника вдова оплатила «интерактивную церемонию». Над гробом висит голограмма: «Нажмите F, чтобы отдать дань уважения». Сорок человек с каменными лицами нажимают F."
  choices:
