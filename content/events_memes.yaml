      fail: {text: "На повороте гроб едет не туда. Покойнику всё равно, а родственникам нет.", effects: {mood: -3, hp: -3}}

- id: meme_navy_copypasta
  title: Триста подтверждённых
  category: street
  weight: 2
  text: "Тебе приходит длинное гневное сообщение от незнакомца: он лучший в своём выпуске, участвовал в сотне секретных рейдов на «Арасаку», у него триста подтверждённых убийств, он обучен убивать голыми руками семисот способами и уже отслеживает твой IP. По стилю ему лет четырнадцать."
  choices:
    - label: Ответить мемом
      effects: {mood: 4}
      text: "Ты отвечаешь картинкой с ухмыляющейся рожей. Он пишет ещё два экрана текста и блокирует тебя."
    - label: Найти его по IP в ответ
      check: {stat: INT, skill: netrunning, dv: 12}
      success: {text: "Через пять минут ты пишешь ему название его школы и что у него пятёрка по физкультуре. Он извиняется и удаляет аккаунт.", effects: {skill_xp:netrunning: 1, mood: 3}}
      fail: {text: "Пацан оказывается не таким уж плохим нетраннером. Неделю твой холодильник показывает его угрозы.", effects: {mood: -2}}

- id: meme_greentext
  title: Будь мной
  category: street
  weight: 2
  text: "На анонимной борде «Двач-77» кто-то выкладывает историю в зелёных строчках: «>будь мной >идёшь за лапшой >встречаешь самого странного чумбу в районе». Описание подозрительно похоже на тебя. Под постом сто ответов «скинь фото»."
  choices:
    - label: Ответить в треде
      check: {stat: COOL, skill: persuasion, dv: 12}
      success: {text: "Ты пишешь: «>будь мной >читаешь тред про себя». Тред взрывается. Анонимы признают тебя своим.", effects: {fame: 2, mood: 4}}
      fail: {text: "Анонимы вычисляют, что это ты, и делают с твоего лица набор стикеров. Стикеры смешные. Это хуже всего.", effects: {fame: 1, mood: -3}}
    - label: Найти автора
      check: {stat: INT, skill: netrunning, dv: 13}
      success: {text: "Автор — продавец лапши. Он бесплатно кормит тебя месяц, лишь бы ты никому не сказал.", effects: {skill_xp:netrunning: 1, eddies: 300}}
      fail: {text: "Ты ищешь три часа и находишь только другие треды про себя.", effects: {mood: -2}}
    - label: Не читать комментарии
      effects: {mood: 1}
      text: "Главное правило Сети, и ты его соблюдаешь."

- id: meme_legion
  title: Мы — легион
  category: work
  weight: 2
  text: "Хактивисты в белых масках с усами объявили войну «Биотехнике» из-за цены на инсулин. Они ищут помощника, чтобы занести вирус в здание: «Мы не прощаем. Мы не забываем. Ждите нас»."
  choices:
    - label: Пронести флешку
      check: {stat: COOL, skill: stealth, dv: 14}
      success: {text: "Ты оставляешь флешку в принтере на ресепшене. Вечером на сайте «Биотехники» танцует маска, а инсулин в аптеках внезапно дешевеет.", effects: {street_cred: 2, humanity: 1, faction_rep:biotechnica: -2}}
      fail: {text: "Охрана находит флешку. Тебя запоминают на камеру, и через неделю приходят из службы безопасности.", effects: {heat: 2, faction_rep:biotechnica: -3}}
    - label: Сдать их корпорации
      effects: {eddies: 2000, humanity: -2, faction_rep:biotechnica: 2}
      text: "«Биотехника» платит. Через день на всех форумах твоё лицо и подпись: «Легион не забывает»."
    - label: Отказаться
      effects: {}
      text: "Маска кивает и растворяется в толпе. Ещё секунду назад их было трое."

- id: meme_distracted
  title: Отвлечённый взгляд
  category: relationships
  weight: 2
  text: "Вы идёте по улице вдвоём, и твой спутник оборачивается вслед прохожему с хромированной рукой так, что чуть не сворачивает шею. Ты замираешь с тем самым выражением лица. Кто-то с другой стороны улицы уже снимает."
  choices:
    - label: Устроить сцену
      effects: {rel_npc:partner: -6, mood: -2, fame: 1}
      text: "Сцена удаётся. Видео расходится по Сети с подписями. Вечер испорчен, зато ты теперь шаблон."
    - label: Обернуться самому
      effects: {mood: 3, rel_npc:partner: -2}
      text: "Ты тоже оборачиваешься. Рука и правда шикарная. Вы смеётесь и спорите, где её ставили."
    - label: Сделать вид, что всё ок
      effects: {rel_npc:partner: 2}
      text: "Ты молчишь и берёшь спутника под руку. Вечер спасён. Шаблона не будет."

- id: meme_amogus
  title: Среди нас предатель
  category: work
  weight: 2
  text: "На смене в доках бригада из десяти человек. Пропал контейнер с имплантами, на камерах помехи. Бригадир собирает всех в круг: «Кто-то среди нас — предатель». Кто-то тихо говорит: «Ну вы видели, как Красный крутился у вентиляции. Подозрительно»."
  choices:
    - label: Голос против Красного
      check: {stat: INT, dv: 13}
      success: {text: "Красный и правда вылезает из вентиляции с контейнером. Бригадир выдаёт тебе премию за бдительность.", effects: {eddies: 700, mood: 3}}
      fail: {text: "Красного выгоняют. Импланты пропадают снова на следующей неделе. Предатель всё ещё среди вас, и он смотрит на тебя.", effects: {mood: -3}}
    - label: Пропустить голосование
      effects: {mood: -1}
      text: "Ты жмёшь «пропустить». Выгоняют того, кто громче всех кричал. Справедливость по-докерски."
    - label: Признаться, что это ты
      effects: {heat: 1, mood: 4, eddies: -200}
      text: "Это была шутка. Никто не смеётся. Штраф за срыв смены — двести эдди."

- id: meme_skibidi
  title: Головы в унитазах
  category: relationships
  weight: 2
  text: "Новый брейнданс-сериал для подростков: огромные головы поют из унитазов и воюют с людьми, у которых вместо голов камеры. Сюжета нет, смысла нет, у сериала миллиард просмотров. Соседский ребёнок пересказывает его тебе сорок минут."
  choices:
    - label: Посмотреть серию
      effects: {mood: -2, glitches: 1}
      text: "Ты смотришь серию. Потом вторую. Потом ловишь себя на том, что напеваешь. Это не прошло даром."
    - label: Это мозговая гниль
      check: {stat: EMP, skill: persuasion, dv: 14}
      success: {text: "Ребёнок задумывается и уходит читать. Его мама благодарит тебя пирогом.", effects: {mood: 3, humanity: 1}}
      fail: {text: "Ребёнок смотрит на тебя как на динозавра и говорит: «Ок, бумер».", effects: {mood: -3}}

- id: meme_brainrot_toys
  title: Акула в кроссовках
  category: money
  weight: 2
  text: "Школьники сходят с ума по коллекционным фигуркам «брейнрот-зверей»: акула в кроссовках, деревянный барабанщик с битой, кофейная балерина. Самую редкую, «Крокодил-бомбардировщик», перепродают за безумные деньги."
  choices:
    - label: Скупить партию
      effects:
        eddies: -1500
        later:
          - weeks: 6
            chance: 0.5
            effects: {eddies: 4500}
            text: "Мода дошла до пика, и ты продаёшь партию втрое дороже. Школьники платят деньгами родителей."
            fail_effects: {}
            fail_text: "Мода прошла за неделю. Коробка фигурок стоит у тебя в углу и смотрит."
            hint: "мода на брейнрот-зверей"
      text: "Ты закупаешься ящиком фигурок. Акула в кроссовках смотрит на тебя пустыми глазами."
    - label: Пройти мимо
      effects: {}
      text: "Ты ничего не понимаешь в этих зверях. Наверное, это и есть старость."

- id: meme_six_seven
  title: Шесть-семь
  category: street
  weight: 2
  text: "Весь город повторяет одно и то же: «Шесть-семь!» — и качает ладонями, как весами. Никто не знает, что это значит. Сегодня номер твоего заказа у фиксера — 67. Фиксер смотрит на него и молча качает ладонями."
  choices:
    - label: Покачать в ответ
      effects: {mood: 3}
      text: "Ты качаешь ладонями в ответ. Фиксер довольно кивает. Вы поняли друг друга, хотя никто ничего не понял."
    - label: Спросить, что это значит
      effects: {mood: -1}
      text: "Фиксер долго объясняет, путается и в итоге говорит: «Это шесть-семь». Ты стареешь прямо на глазах."

- id: meme_clanker
  title: Железяка
  category: street
  weight: 2
  text: "У станции метро митинг против роботов и ИИ: плакаты «Кланкеры, вон!», кто-то пинает доставочного дрона. Один из митингующих замечает твой хром и тычет пальцем: «А это кто? Тоже железяка?»"
  choices:
    - label: Спрятать хром
      effects: {mood: -2}
      text: "Ты натягиваешь рукав пониже и уходишь. Обидно, что приходится прятаться в собственном городе."
    - label: Произнести речь о хроме
      check: {stat: COOL, skill: persuasion, dv: 14}
      success: {text: "Ты говоришь, что хром — это не робот, а человек, который захотел больше. Половина толпы аплодирует. Вторая половина покупает себе импланты.", effects: {fame: 2, street_cred: 1}}
      fail: {text: "В тебя летит пустая банка. Митинг решает, что ты — подсадной кланкер.", effects: {hp: -3, mood: -3}}
    - label: Показать им силу хрома
      violent: true
      effects: {heat: 1, street_cred: 2, hp: -4}
      text: "Хромированный кулак убеждает быстрее любой речи. Митинг расходится, NCPD записывает тебя в протокол."

- id: meme_aura
  title: Фарм ауры
  category: street
  weight: 2
  text: "Новый тренд: «фармить ауру». Нужно встать на крыше машины на фоне неона, плащ по ветру, взгляд вдаль, и ни в коем случае не улыбаться. Подростки на парковке ждут, кто выдаст самую сильную ауру."
  choices:
    - label: Выдать ауру
      check: {stat: COOL, dv: 13}
      success: {text: "Плащ, неон, взгляд в никуда. Подростки молчат от уважения. Видео с тобой становится образцом.", effects: {fame: 2, mood: 5}}
      fail: {text: "Ветер задирает плащ тебе на голову. Аура уходит в минус. Видео тоже становится образцом.", effects: {fame: 1, mood: -2}}
    - label: Аура не фармится
      effects: {mood: 1}
      text: "«Настоящая аура не фармится», — говоришь ты и уходишь не оглядываясь. Это была самая сильная аура вечера."

- id: meme_chicken_jockey
  title: Курица-наездник
  category: street
  weight: 2
  text: "В кинотеатре на премьере брейнданс-фильма по кубической игре зал сходит с ума: на одной реплике толпа кричит, швыряет попкорн и поднимает над головой живую курицу. Охрана кинотеатра в замешательстве."
  choices:
    - label: Кричать вместе со всеми
      effects: {mood: 5, heat: 1}
      text: "Ты кричишь, швыряешь попкорн и на минуту чувствуешь себя частью чего-то большого. NCPD выписывает штраф всему ряду."
    - label: Продавать попкорн у входа
      check: {stat: COOL, skill: persuasion, dv: 11}
      success: {text: "Попкорн покупают не для еды, а для броска. Выручка отличная.", effects: {eddies: 700}}
      fail: {text: "Твой попкорн бросают в тебя. Бесплатно.", effects: {mood: -2}}

- id: meme_doakes
  title: Знаю, но доказать не могу
  category: ncpd
  weight: 2
  conditions:
    min_heat: 1
  text: "Сержант NCPD стоит через улицу, руки в карманах, и смотрит на тебя. Просто смотрит. Каждый день, третью неделю подряд. Он знает. Ты это видишь. Доказать он не может."
  choices:
    - label: Помахать ему
      effects: {mood: 2, heat: 1}
      text: "Ты машешь. Он не машет в ответ. Взгляд становится тяжелее. В протоколе появляется ещё одна строчка."
    - label: Залечь на неделю
      effects: {heat: -1, mood: -2}
      text: "Ты сидишь дома неделю. Сержант стоит под окнами ещё два дня, потом уходит к кому-то другому."
    - label: Подсунуть другого
      check: {stat: INT, skill: persuasion, dv: 15}
      success: {text: "Сержант переключается на кого-то из Мальстрёма. Свобода. Пока что.", effects: {heat: -2}}
      fail: {text: "Сержант понимает, что ты его подставляешь. Теперь он знает ещё больше и всё ещё не может доказать.", effects: {heat: 2}}

- id: meme_gigachad
  title: Сигма-курс
  category: money
  weight: 2
  text: "Коуч с квадратной челюстью продаёт курс «Сигма-путь»: подъём в четыре утра, ледяной душ, никаких эмоций, крипта и брейнданс медитации. Курс стоит 2 000 эдди. На парковке у него три одинаковые машины, все в аренде."
  choices:
    - label: Купить курс
      effects:
        eddies: -2000
        later:
          - weeks: 4
            chance: 0.3
            effects: {mood: 6, skill_xp:persuasion: 2}
            text: "Удивительно, но подъём в четыре и ледяной душ работают. Теперь получается продать людям что угодно. Даже курсы."
            fail_effects: {mood: -4}
            fail_text: "Через месяц ты встаёшь в четыре утра, мёрзнешь в душе и понимаешь, что тебя развели."
            hint: "сигма-путь"
      text: "Ты покупаешь курс. Коуч жмёт руку так, будто подписал контракт с душой."
    - label: Разоблачить коуча
      check: {stat: INT, skill: persuasion, dv: 13}
      success: {text: "Ты при всех спрашиваешь про аренду машин. Ученики требуют деньги назад. Коуч уходит пешком.", effects: {fame: 1, mood: 4}}
      fail: {text: "Коуч говорит, что ты бета и завидуешь. Ученики смеются над тобой.", effects: {mood: -3}}

- id: meme_doomer
  title: Четыре утра
  category: street
  weight: 2
  conditions:
    max_mood: 0
  text: "Четыре утра. Ты стоишь на балконе в чёрной шапке и куришь, глядя на огни Сити-центра. В наушниках медленный пост-панк. Всё бессмысленно. Где-то внизу стоит ещё один такой же, в такой же шапке, и смотрит на тебя."
  choices:
    - label: Помахать ему
      effects: {mood: 4, add_npc:friend: true}
      text: "Он машет в ответ. Утром вы пьёте кофе в забегаловке на углу. Всё всё ещё бессмысленно, но уже вдвоём."
    - label: Лечь спать
      effects: {mood: 2, hp: 2}
      text: "Ты просто ложишься спать. Иногда это лучший ответ на экзистенциальный кризис."

- id: meme_okboomer
  title: Ок, бумер
  category: relationships
  weight: 2
  text: "Ты объясняешь подростку из соседней квартиры, что в твоё время импланты ставили в подвале без наркоза и это закаляло характер. Он не поднимает глаз от оптики и говорит: «Ок, бумер»."
  choices:
    - label: Обидеться
      effects: {mood: -3}
      text: "Ты обижаешься. Это и делает тебя бумером. Ты понимаешь это и обижаешься ещё больше."
    - label: Показать старые шрамы
      effects: {street_cred: 1, mood: 2}
      text: "Подросток смотрит на шрамы, бледнеет и впервые убирает оптику. «Ладно, — говорит он, — это жёстко»."

- id: meme_zhdun
  title: Ждун
  category: implants
  weight: 2
  text: "В приёмной муниципальной клиники стоит статуя: серое существо с лицом моржа сложило руки на огромном животе и ждёт. Очередь к рипперу — четыре часа. Пациенты гладят статую на удачу."
  choices:
    - label: Погладить и ждать
      effects: {mood: 2, hp: 3}
      text: "Ты гладишь Ждуна и ждёшь. Через четыре часа тебя принимают и даже лечат бесплатно. Работает."
    - label: Пролезть без очереди
      check: {stat: COOL, skill: persuasion, dv: 13}
      success: {text: "«У меня срочно, у меня рука отваливается». Тебя пропускают. Ждун смотрит с укором.", effects: {hp: 3}}
      fail: {text: "Очередь не верит. Тебя отправляют в конец. Ждун ждёт вместе с тобой.", effects: {mood: -3}}

- id: meme_preved
  title: Превед, медвед
  category: street
  weight: 2
  text: "На заборе в Уотсоне свежее граффити: медведь с поднятыми лапами выходит к паре в лесу, подпись на олбанском: «ПРЕВЕД!». Рядом приписка: «Аффтар жжот, выпей йаду». Местные рипперы спорят, кто это нарисовал."
  choices:
    - label: Дописать «Йа креведко»
      effects: {mood: 3, street_cred: 1}
      text: "Ты дописываешь креветку в углу. Граффити становится локальной достопримечательностью. Туристы фотографируются."
    - label: Найти художника
      check: {stat: INT, dv: 12}
      success: {text: "Художник — старик из Старой Сети. Он рассказывает про времена, когда люди спорили из-за орфографии, а не из-за хрома.", effects: {add_npc:contact: true, mood: 2}}
      fail: {text: "Художника не найти. Зато ты узнаёшь, что «кросафчег» — это комплимент.", effects: {mood: 1}}

- id: meme_fiasco
  title: Это фиаско, братан
  category: work
  weight: 2
  text: "Напарник по делу всё продумал: подкоп под банк в Пасифике, три недели работы лопатой. Сегодня вы прорвались наверх. Вокруг кафель, писсуары и охранник с газетой. Это не банк. Это туалет на заправке."
  choices:
    - label: Сказать ему всё как есть
      effects: {mood: 3}
      text: "Ты кладёшь руку ему на плечо: «Это фиаско, братан». Охранник откладывает газету и предлагает вам кофе."
    - label: Ограбить заправку
      violent: true
      check: {stat: COOL, skill: firearms, dv: 12}
      success: {text: "Касса заправки — не банк, но три недели копания надо как-то окупить.", effects: {eddies: 800, heat: 2}}
      fail: {text: "Охранник оказывается бывшим копом. Вы уходите обратно в тоннель без денег и без лопаты.", effects: {hp: -6, heat: 1}}

- id: meme_its_different
  title: Это другое
  category: ncpd
  weight: 2
  text: "Патрульный NCPD штрафует тебя за неправильную парковку. Рядом в трёх метрах на тротуаре стоит машина корпората. Ты показываешь на неё пальцем. Патрульный пожимает плечами: «Это другое»."
  choices:
    - label: Заплатить штраф
      effects: {eddies: -150}
      text: "Ты платишь. Корпорат выходит, садится и уезжает с тротуара. Патрульный отдаёт ему честь."
    - label: Спорить
      check: {stat: COOL, skill: persuasion, dv: 15}
