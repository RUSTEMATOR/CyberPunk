# ======================================================================== chain: Кот, который не моргает (owner request 24.10)

- id: meme_cat_1
  title: Иван испугался
  category: street
  weight: 2
  conditions:
    flags_none: [meme_cat, abroad]
  text: "Из подворотни вылетает Иван, мальчишка из соседнего блока, белый как бумага. Он прячется за тебя и тычет пальцем в темноту. Там на мусорном баке сидит рыжий кот-андроид с дешёвой рекламной голограммой вместо морды: человеческий рот, слишком широкий, слишком живой. Кот не моргает. «Бу. Испугался? Не бойся, я друг»."
  choices:
    - label: Смотреть ему в глаза
      check: {stat: COOL, dv: 14}
      success: {text: "«Давай будем смотреть друг другу в глаза, пока они не устанут», — говорит рот. Ты смотришь. Минута, две. Кот первым отводит взгляд, голограмма мигает и выдаёт рекламу кошачьего корма. Иван смотрит на тебя как на героя.", effects: {mood: 4, street_cred: 1, flag_set:meme_cat: true, queue_event:meme_cat_2: true}}
      fail: {text: "«Почему ты отводишь глаза? Что-то не так?» Ты моргаешь. Рот улыбается шире, чем позволяет голограмма. Иван тянет тебя за рукав прочь, и вы бежите, не оглядываясь.", effects: {mood: -4, flag_set:meme_cat: true, queue_event:meme_cat_2: true}}
    - label: Выдернуть голограмму
      check: {stat: TECH, skill: tech, dv: 12}
      success: {text: "Ты ловишь кота и отщёлкиваешь проектор. Под ним обычная кошачья морда, сонная и недовольная. Иван выдыхает. Проектор ты продаёшь барыге, а кот уходит по своим делам.", effects: {eddies: 150, mood: 2, flag_set:meme_cat: true}}
      fail: {text: "Кот оказывается быстрее. Он сидит уже на крыше и смотрит оттуда. «Не уходи. Иди ко мне, сядь рядом». Голос звучит из всех домофонов улицы сразу.", effects: {mood: -3, flag_set:meme_cat: true, queue_event:meme_cat_2: true}}
    - label: Увести Ивана домой
      effects: {humanity: 1, mood: -1, flag_set:meme_cat: true, queue_event:meme_cat_2: true}
      text: "Ты отводишь Ивана до двери его квартиры. Мать благодарит и запирает три замка. Уходя, ты чувствуешь взгляд в спину. Он не моргает."

- id: meme_cat_2
  title: Не бойся, я друг
  category: rare
  weight: 1
