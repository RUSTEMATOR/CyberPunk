# Dark weeks (owner request: the mood matters). Forced by the week when the mood is below the second tier.

- id: mood_dark_room
  title: Четыре стены
  category: relationships
  weight: 1
  forced_only: true
  text: "Неделю ты не выходишь из квартиры. Шторы задёрнуты, лапша кончилась, телефон молчит. Просто встать с кровати — уже подвиг."
  choices:
    - label: Позвонить кому-нибудь
      check: {stat: EMP, dv: 12}
      success: {text: "Старый знакомый приезжает с пиццей и не задаёт вопросов. Через пару часов ты смеёшься впервые за месяц.", effects: {mood: 15}}
      fail: {text: "Гудки. Никто не берёт. Ты кладёшь телефон экраном вниз.", effects: {mood: -3}}
    - label: Записаться к терапевту (500)
      effects: {eddies: -500, mood: 12, humanity: 1}
      text: "Терапевт в Уотсоне берёт дорого, но слушает по-настоящему. На выходе дышится легче, чем на входе."
    - label: Лежать дальше
      effects: {hp: -3, mood: -2}
      text: "Ещё одна неделя проходит мимо. Город за окном не замечает."

- id: mood_dark_bottle
  title: Дно стакана
  category: relationships
  weight: 1
  forced_only: true
  text: "Бармен «Лиззи» уже не спрашивает, что тебе налить. Третью ночь подряд ты сидишь у стойки и смотришь в одну точку."
  choices:
    - label: Пить до утра
      effects: {eddies: -200, mood: 6, hp: -5}
      text: "К утру становится легче. К обеду — намного хуже."
    - label: Уйти в брейнданс
      effects: {eddies: -150, mood: 10, humanity: -1}
      text: "Чужая жизнь на час: солнце, море, кто-то, кто тебя любит. Выход обратно — как удар."
    - label: Поговорить с барменом
      effects: {mood: 8, add_npc:friend: true}
      text: "Бармен наливает воду вместо виски и рассказывает, как сам выбирался. Ты сидишь до закрытия, но без единой рюмки."

- id: mood_dark_roof
  title: Крыша мегабашни
  category: relationships
  weight: 1
  forced_only: true
  text: "Ночью ты поднимаешься на крышу мегабашни подышать. Внизу весь город в огнях. Кто-то уже сидит у края с термосом: соседка с сорокового этажа."
  choices:
    - label: Сесть рядом
      effects: {mood: 12, add_npc:friend: true}
      text: "Она наливает чай из термоса и молчит вместе с тобой. До рассвета вы говорите обо всём, кроме главного. И этого хватает."
    - label: Уйти обратно
      effects: {mood: 2}
      text: "Ты киваешь ей и спускаешься. Свежий воздух всё-таки помог. Немного."
