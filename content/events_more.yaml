# More variety for the weekly draw (owner request, 23.10.2026). Era-neutral unless a window is given.

# ---------------------------------------------------------------- street

- id: vending_jackpot
  title: Сломанный автомат
  category: street
  weight: 3
  text: "Торговый автомат на углу глючит: после удара сбоку он выплёвывает банки и мелочь. Вокруг уже собираются местные."
  choices:
    - label: Влезть первым
      check: {stat: REF, dv: 12}
      success: {text: "Ты успеваешь раньше всех: полные карманы мелочи и пара банок синтокофе.", effects: {eddies: 120, mood: 3}}
      fail: {text: "Кто-то толкает тебя локтем в висок. Пока ты встаёшь, автомат уже пуст.", effects: {hp: -2, mood: -2}}
    - label: Позвать владельца
      effects: {eddies: 60, mood: 2}
      text: "Владелец ларька прибегает с ключом и в благодарность суёт тебе шестьдесят эдди."
    - label: Пройти мимо
      effects: {mood: 0}
      text: "Ты не связываешься. Через минуту там уже драка."

- id: street_racer_bet
  title: Ночная гонка
  category: street
  weight: 2
  conditions:
    districts: [santo_domingo, badlands, heywood]
  text: "На пустой трассе собираются гонщики. Один не явился, и ему ищут замену за рулём: ставка сотня, победителю пятьсот."
  choices:
    - label: Сесть за руль
      check: {stat: REF, skill: driving, dv: 15}
      success: {text: "Ты приходишь первым, обогнав всех на последнем повороте. Пятьсот и уважение трассы.", effects: {eddies: 400, street_cred: 1, skill_xp:driving: 2}}
      fail: {text: "На повороте машину заносит, и ты заканчиваешь гонку в отбойнике. Сотня ушла, лоб разбит.", effects: {eddies: -100, hp: -5, skill_xp:driving: 1}}
    - label: Поставить на фаворита
      check: {stat: LUCK, dv: 12}
      success: {text: "Фаворит берёт гонку. Ты удваиваешь сотню.", effects: {eddies: 100, mood: 2}}
      fail: {text: "Фаворит вылетает с трассы на первом круге. Сотня ушла.", effects: {eddies: -100}}
    - label: Просто посмотреть
      effects: {mood: 4}
      text: "Рёв моторов, запах резины, огни. Лучшее шоу недели и бесплатно."

- id: street_preacher
  title: Уличный проповедник
  category: street
  weight: 2
  text: "На перекрёстке проповедник кричит, что хром ворует душу. Толпа свистит, кто-то кидает в него банку. Он смотрит прямо на тебя."
  choices:
    - label: Послушать
      effects: {mood: 3, humanity: 1}
      text: "Ты стоишь до конца. Половина бред, но что-то в его словах цепляет. Уходишь задумчивым."
    - label: Заступиться за него
      check: {stat: COOL, dv: 13}
      success: {text: "Ты встаёшь между ним и толпой. Свист стихает, люди расходятся. Проповедник благодарит и крестит тебя на прощание.", effects: {mood: 4, fame: 1}}
      fail: {text: "Вторая банка прилетает уже тебе. Толпа смеётся.", effects: {hp: -2, mood: -3}}
    - label: Уйти
      effects: {mood: 0}
      text: "Ты уходишь. Крики проповедника ещё долго слышны за спиной."

- id: lost_drone
  title: Потерянный дрон
  category: street
  weight: 2
  text: "К твоим ногам падает доставочный дрон с треснувшим корпусом. Посылка цела, на ней адрес и логотип курьерской службы."
  choices:
    - label: Доставить посылку
      effects: {eddies: 150, mood: 3}
      text: "Адрес в двух кварталах. Получатель так рад, что даёт сто пятьдесят на чай."
    - label: Вскрыть посылку
      check: {stat: LUCK, dv: 13}
      success: {text: "Внутри — новенький медкомплект. Пригодится.", effects: {hp: 10, mood: 2}}
      fail: {text: "Внутри — кукла-антистресс. Курьерская служба уже ищет пропажу по камерам.", effects: {heat: 1, mood: -1}}
    - label: Разобрать дрон на детали
      check: {stat: TECH, skill: tech, dv: 13}
      success: {text: "Аккумулятор и сервоприводы уходят барыге за двести пятьдесят.", effects: {eddies: 250, skill_xp:tech: 1}}
      fail: {text: "Аккумулятор вспыхивает у тебя в руках.", effects: {hp: -4}}

- id: graffiti_artist
  title: Райтер
  category: street
  weight: 2
  text: "Ночью в переулке парень заканчивает огромную роспись на стене корпоративного склада. Камера наверху мигает красным: дрон охраны уже летит."
  choices:
    - label: Предупредить
      effects: {mood: 4, street_cred: 1}
      text: "Ты свистишь, он хватает баллоны, и вы вместе исчезаете в подворотне. На прощание он обещает нарисовать и тебя."
    - label: Отвлечь дрон
      check: {stat: TECH, skill: tech, dv: 14}
      success: {text: "Ты закидываешь дрону помехи. Он кружит на месте, пока райтер дорисовывает. Утром о стене пишут в новостях.", effects: {fame: 1, mood: 5}}
      fail: {text: "Дрон замечает уже тебя и фотографирует. Розыск добавился.", effects: {heat: 1}}
    - label: Не вмешиваться
      effects: {mood: -1}
      text: "Дрон прилетает, райтера уводят. Роспись к утру закрашивают серым."

# ---------------------------------------------------------------- money

- id: pawn_shop_find
  title: Ломбард
  category: money
  weight: 2
  text: "В ломбарде на витрине лежит старый механический хронометр. Продавец не знает, сколько он стоит, и просит двести. Ты знаешь, что коллекционеры дают больше."
  choices:
    - label: Купить и перепродать
      check: {stat: INT, dv: 13}
      success: {text: "Коллекционер в Вестбруке платит семьсот, не торгуясь.", effects: {eddies: 500, mood: 3}}
      fail: {text: "Часы оказываются подделкой. Двести ушли в никуда.", effects: {eddies: -200, mood: -2}}
    - label: Сказать продавцу
      effects: {mood: 3, eddies: 50}
      text: "Старик долго смотрит на часы, потом на тебя. Он даёт полсотни за честность."
    - label: Не связываться
      effects: {mood: 0}
      text: "Ты выходишь из ломбарда. Часы так и лежат на витрине."

- id: crypto_tip
  title: Наводка на биржу
  category: money
  weight: 2
  text: "Знакомый в баре шепчет: через неделю одна мелкая компания объявит о контракте, и её бумаги взлетят. Говорит, что сам вложил всё."
  choices:
    - label: Вложить пятьсот
      effects:
        eddies: -500
        later:
          - {weeks: 2, chance: 0.55, text: "Контракт объявили, бумаги выросли втрое.", fail_text: "Контракта не было. Бумаги обнулились.", hint: наводка на биржу, effects: {eddies: 1400}}
      text: "Ты переводишь пятьсот брокеру из подворотни. Остаётся ждать."
    - label: Вложить сотню
      effects:
        eddies: -100
        later:
          - {weeks: 2, chance: 0.55, text: "Наводка сработала: сотня превратилась в три.", fail_text: "Наводка оказалась пустой.", hint: наводка на биржу, effects: {eddies: 280}}
      text: "Сотню не жалко. Посмотрим."
    - label: Не верить
      effects: {mood: 0}
      text: "Такие истории тут рассказывают каждую неделю. Ты допиваешь и уходишь."

- id: lost_wallet
  title: Чужой кошелёк
  category: money
  weight: 3
  text: "В вагоне метро под сиденьем лежит кошелёк. Внутри четыреста эдди наличными и удостоверение сотрудника Biotechnica."
  choices:
    - label: Вернуть владельцу
      effects: {mood: 5, status: 1, eddies: 100}
      text: "Ты звонишь по номеру из удостоверения. Женщина в деловом костюме забирает кошелёк, благодарит и оставляет сотню."
    - label: Забрать деньги
      effects: {eddies: 400, humanity: -1}
      text: "Деньги в карман, кошелёк обратно под сиденье. Удостоверение пусть ищет сам."
    - label: Продать удостоверение
      check: {stat: COOL, dv: 14}
      success: {text: "Пропуск в Biotechnica стоит дороже денег: барыга даёт девятьсот.", effects: {eddies: 1300, heat: 1}}
      fail: {text: "Барыга оказывается подсадным. Удостоверение изымают, тебя отпускают с предупреждением.", effects: {eddies: 400, heat: 2}}

- id: loan_shark_offer
  title: Лёгкие деньги
  category: money
  weight: 2
  text: "Улыбчивый парень предлагает тысячу прямо сейчас, без бумаг. Вернуть через месяц полторы. «Все так делают», — говорит он."
  choices:
    - label: Взять тысячу
      effects:
        eddies: 1000
        later:
          - {weeks: 4, text: "Улыбчивый парень пришёл за своими полутора тысячами.", hint: вернуть полторы тысячи, effects: {eddies: -1500}}
      text: "Тысяча на руках. Через месяц он придёт за полутора, и улыбаться будет уже не так широко."
    - label: Отказаться
      effects: {mood: 1}
      text: "Ты качаешь головой. Он пожимает плечами и идёт к следующему."

# ---------------------------------------------------------------- relationships

- id: old_friend_wedding
  title: Приглашение на свадьбу
  category: relationships
  weight: 2
  text: "Старый школьный друг женится и зовёт тебя. Свадьба в арендованном зале над прачечной, после — танцы до утра."
  choices:
    - label: Пойти с подарком
      effects: {eddies: -200, mood: 12, add_npc:friend: true}
      text: "Двести на подарок, ночь танцев и новый старый друг. Давно не было так весело."
    - label: Пойти без подарка
      effects: {mood: 6}
      text: "Ты приходишь с пустыми руками, но тебе всё равно рады."
    - label: Не пойти
      effects: {mood: -4}
      text: "Ты отправляешь поздравление сообщением. Друг отвечает смайликом."

- id: neighbor_kid_help
  title: Соседский пацан
  category: relationships
  weight: 2
  text: "Пацан лет двенадцати из соседней квартиры просит помочь с уроками. Мать работает в две смены, отца нет."
  choices:
    - label: Помочь
      effects: {mood: 6, humanity: 1, skill_xp:persuasion: 1}
      text: "Два часа дробей и истории Объединённых Штатов. Пацан понимает больше, чем ты ожидал."
    - label: Дать денег на репетитора
      effects: {eddies: -150, mood: 4}
      text: "Ты суёшь его матери полторы сотни. Она долго отказывается, потом плачет."
    - label: Отказать
      effects: {mood: -2}
      text: "Ты говоришь, что занят. Пацан кивает и закрывает дверь."

- id: dating_app_match
  title: Совпадение
  category: relationships
  weight: 2
  conditions:
    forbids: [has_partner]
  text: "Приложение знакомств мигает: совпадение на девяносто восемь процентов. Человек пишет первым и зовёт на ужин в кафе на крыше."
  choices:
    - label: Пойти
      check: {stat: COOL, skill: persuasion, dv: 13}
      success: {text: "Вечер выходит лучше, чем обещали проценты. Вы расходитесь под утро и уже договорились о следующей встрече.", effects: {add_npc:partner: true, mood: 12, eddies: -120}}
      fail: {text: "Вы весь вечер говорите о разном. Счёт пополам, расходитесь вежливо.", effects: {eddies: -60, mood: -2}}
    - label: Отменить в последний момент
      effects: {mood: -1}
      text: "Ты пишешь, что не сможешь. Совпадение исчезает из списка."

# ---------------------------------------------------------------- implants

- id: chrome_recall
  title: Отзывная кампания
  category: implants
  weight: 2
  conditions:
    requires: [has_cyberware]
  text: "Новости: у одной партии имплантов брак в прошивке, производитель отзывает их бесплатно. По серийному номеру твой подходит."
  choices:
    - label: Сдать на проверку
      effects: {mood: -2, humanity: 2}
      text: "Неделя в очереди сервисного центра. Прошивку меняют, и голова впервые за месяцы перестаёт гудеть."
    - label: Подать в суд
      check: {stat: INT, skill: persuasion, dv: 15}
      success: {text: "Коллективный иск, и твоя доля приходит на счёт.", effects: {eddies: 900}}
      fail: {text: "Юристы корпорации оказываются лучше. Ты тратишь время и двести на пошлину.", effects: {eddies: -200, mood: -3}}
    - label: Не обращать внимания
      effects: {mood: 0}
      text: "Работает и ладно. Ты пролистываешь новость."

- id: ripper_apprentice
  title: Подмастерье риппера
  category: implants
  weight: 2
  text: "Молодой подмастерье риппера ищет добровольцев: бесплатная калибровка имплантов, он сдаёт экзамен мастеру. Руки у него немного дрожат."
  choices:
    - label: Согласиться
      check: {stat: LUCK, dv: 11}
      success: {text: "Калибровка идеальная. Мастер ставит ему высший балл, а ты чувствуешь себя легче.", effects: {humanity: 3, mood: 4}}
      fail: {text: "Что-то идёт не так, и неделю у тебя дёргается веко.", effects: {humanity: -2, hp: -3}}
    - label: Отказаться
      effects: {mood: 0}
      text: "Ты вежливо отказываешься. Следующий доброволец находится через минуту."

- id: chrome_envy
  title: Хром у соседа
  category: implants
  weight: 1
  conditions:
    forbids: [has_cyberware]
  text: "Сосед хвастается новыми оптическими имплантами: видит в темноте, зумит на километр. Говорит, что без хрома в этом городе ты никто."
  choices:
    - label: Задуматься
      effects: {mood: -3}
      text: "Ты весь вечер смотришь каталоги рипперов. Цены кусаются."
    - label: Посмеяться
      effects: {mood: 3, humanity: 1}
      text: "Ты отвечаешь, что твоим глазам не нужна прошивка. Сосед обижается."

# ---------------------------------------------------------------- ncpd

- id: ncpd_witness
  title: Свидетель
  category: ncpd
  weight: 2
  text: "На твоих глазах грабят ларёк. Через десять минут патруль опрашивает всех вокруг. Один из грабителей живёт в твоём доме."
  choices:
    - label: Дать показания
      effects: {heat: -1, mood: 2, street_cred: -1}
      text: "Ты описываешь всё. Копы довольны, соседи смотрят косо."
    - label: Промолчать
      effects: {street_cred: 1}
      text: "«Ничего не видел». Сосед потом кивает тебе на лестнице."
    - label: Продать информацию
      check: {stat: COOL, skill: persuasion, dv: 14}
      success: {text: "Детектив платит двести за имя и обещает, что твоё останется в тайне.", effects: {eddies: 200, heat: -1}}
      fail: {text: "Детектив берёт имя и не платит ни эдди. «Скажи спасибо, что не задерживаю».", effects: {mood: -3}}
    - label: "Вспомнить всё"
      ability: recall
      effects: {eddies: 400, street_cred: 1}
      text: "Номер куртки, шрам, марка обуви. Ты сливаешь детали патрулю за награду, а соседу — что его уже ищут."

- id: ncpd_random_scan
  title: Сканер на перекрёстке
  category: ncpd
  weight: 2
  conditions:
    min_heat: 1
  text: "На перекрёстке поставили новый сканер лиц. Очередь медленно движется через рамку, а патрульные проверяют каждого третьего."
  choices:
    - label: Пройти как ни в чём не бывало
      check: {stat: COOL, dv: 14}
      success: {text: "Рамка пищит, но патрульный машет рукой: «Проходи». Обошлось.", effects: {mood: 1}}
      fail: {text: "Тебя отводят в сторону и задают вопросы час. Розыск не снят.", effects: {heat: 1, mood: -3}}
    - label: Обойти через дворы
      check: {stat: REF, skill: stealth, dv: 13}
      success: {text: "Ты уходишь дворами и выходишь на два квартала дальше.", effects: {skill_xp:stealth: 1}}
      fail: {text: "Дрон замечает, как ты сворачиваешь, и записывает лицо.", effects: {heat: 1}}

# ---------------------------------------------------------------- work
    - label: "Спрятать хром"
      ability: hide
      effects: {heat: -1}
      text: "Сканер показывает обычного горожанина. Патрульный машет: проходи."
    - label: "Сменить лицо"
      ability: face
      effects: {heat: -1}
      text: "Две минуты в подворотне, и через рамку проходит незнакомец."

- id: side_hustle_delivery
  title: Подработка
  category: work
  weight: 3
  text: "Курьерская служба набирает на выходные: развезти посылки по району на скутере. Платят сдельно, без вопросов."
  choices:
    - label: Взяться
      check: {stat: REF, skill: driving, dv: 12}
      success: {text: "Двадцать адресов без единой царапины. Двести пятьдесят на руки.", effects: {eddies: 250, skill_xp:driving: 1}}
      fail: {text: "Скутер ломается на середине смены. Платят только за половину.", effects: {eddies: 100, mood: -2}}
    - label: Отдохнуть
      effects: {mood: 4, hp: 2}
      text: "Выходные для того, чтобы спать. Ты так и делаешь."

- id: corp_internship
  title: Стажировка
  category: work
  weight: 1
  conditions:
    min_status: 3
  text: "Знакомая из корпорации пишет: открыт набор на летнюю стажировку для «перспективных людей с улицы». Отбор жёсткий."
  choices:
    - label: Пройти отбор
      check: {stat: INT, skill: persuasion, dv: 16}
      success: {text: "Тебя берут. Платят мало, но связи бесценны.", effects: {status: 3, eddies: 300, mood: 5}}
      fail: {text: "На собеседовании тебя срезают на третьем вопросе.", effects: {mood: -4}}
    - label: Отказаться
      effects: {mood: 0}
      text: "Корпоративная клетка, пусть и с видом на город. Не сейчас."

# ---------------------------------------------------------------- rare

- id: meteor_shower
  title: Звездопад
  category: rare
  weight: 1
  text: "Впервые за годы смог разошёлся, и над городом видно звёзды. По новостям — метеорный поток. Люди выходят на крыши."
  choices:
    - label: Подняться на крышу
      effects: {mood: 15, humanity: 2}
      text: "Ты лежишь на тёплом бетоне и считаешь падающие звёзды. Город внизу впервые кажется тихим."
    - label: Загадать желание и лечь спать
      effects: {mood: 6, luck_pool: 1}
      text: "Ты загадываешь что-то и тут же забываешь что. Утром кажется, что сегодня повезёт."

- id: famous_stranger
  title: Знаменитость в баре
  category: rare
  weight: 1
  text: "За соседним столиком сидит рокербой, чьи песни крутят по всем станциям. Он один, без охраны, и выглядит паршиво."
  choices:
    - label: Подсесть
      check: {stat: EMP, skill: persuasion, dv: 14}
      success: {text: "Вы проговорили до закрытия. Он записывает твой номер и обещает упомянуть тебя в песне. Через месяц ты слышишь своё имя по радио.", effects: {fame: 3, mood: 8}}
