# The oligarchs (owner request 23.10: players who broke out need new ways to spend and to lose). Drawn by the wealth
# threat of the tier «Олигарх» (balance.economy.wealth, 600 000+). `eddies_pct` scales with the fortune.
# The corp asset: `flag_set:corp_asset` makes the character an asset of a megacorp (services/week.py takes a growing
# share every month and calls in favours with `corp_asset_demand`).

- id: wealth_corp_asset
  title: Предложение, от которого не отказываются
  category: work
  weight: 2
  forced_only: true
  conditions:
    flags_none: [corp_asset]
  text: "Вице-президент «Арасаки» ждёт тебя в аэродине на крыше. «Такие, как вы, рано или поздно становятся нашими. Лучше рано: с нашей крышей вас не тронет ни NCPD, ни банды, ни налоговая. Взамен — небольшой процент и иногда услуги»."
  choices:
    - label: Стать активом корпорации
      effects: {flag_set:corp_asset: true, status: 3, heat: -3}
      text: "Ты подписываешь. Охрана у дверей меняется на корпоративную, а розыск исчезает за одну ночь. Процент, сказали, небольшой. Сначала."
    - label: Вежливо отказаться
      check: {stat: COOL, skill: persuasion, dv: 17}
      success: {text: "Ты благодаришь за честь и намекаешь на связи в «Милитехе». Вице-президент улыбается: «Мы вернёмся»."}
      fail: {text: "Улыбка исчезает. Через неделю у твоих счетов появляются странные проверки.", effects: {eddies_pct: -8, status: -1}}
    - label: Послать их
      effects: {street_cred: 3, flag_set:corp_enemy: true}
      text: "Улица аплодирует. Корпорация записывает твоё имя в отдельный список."

- id: corp_asset_demand
  title: Корпорация напоминает о себе
  faction: arasaka
  category: work
  weight: 1
  forced_only: true
  conditions:
    flags_all: [corp_asset]
  text: "Куратор из «Арасаки» приходит без звонка. «Нам нужна услуга. Маленькая. Человек из совета района мешает проекту. Ваши люди, ваши руки, наше спасибо»."
  choices:
    - label: Сделать, что просят
      effects: {humanity: -3, heat: 1, status: 1, mood: -3}
      text: "Член совета исчезает. Куратор присылает бутылку виски и снижает процент на месяц. Ты пьёшь виски один."
    - label: Откупиться деньгами
      effects: {eddies_pct: -10}
      text: "Куратор пересчитывает и кивает. «Мы найдём другие руки. Но запомним, что вы выбрали»."
    - label: Порвать с корпорацией
      check: {stat: INT, skill: persuasion, dv: 18}
      success: {text: "Твои юристы находят в контракте дыру. Корпорация отпускает тебя, забрав напоследок треть.", effects: {eddies_pct: -30, flag_clear:corp_asset: true, heat: 2}}
      fail: {text: "Контракт не рвётся. К дверям подъезжает чёрный фургон.", effects: {start_combat: 5, eddies_pct: -20}}

- id: wealth_gold_digger
  title: Любовь с первого счёта
  category: relationships
  weight: 2
  forced_only: true
  text: "На благотворительном вечере к тебе подсаживается человек невероятной красоты. Через месяц вы уже обсуждаете свадьбу. Юрист осторожно предлагает брачный контракт."
  choices:
    - label: Жениться без контракта
      check: {stat: EMP, skill: persuasion, dv: 17}
      success: {text: "Это оказалось настоящим. Странно, но настоящим.", effects: {mood: 10, humanity: 2, eddies: -20000}}
      fail: {text: "Через полгода развод и лучший адвокат города на той стороне. Половина пентхауса уходит вместе с чемоданами.", effects: {eddies_pct: -25, mood: -10}}
    - label: Подписать брачный контракт
      effects: {mood: -3, eddies: -15000}
      text: "Свадьба красивая, но холодная. Через год вы расходитесь, и контракт держит. Зато сердце — нет."
    - label: Отказаться от романа
      effects: {mood: -2}
      text: "Ты допиваешь шампанское в одиночестве. Безопасно и скучно."

- id: wealth_art_fake
  title: Аукцион искусства
  category: money
  weight: 2
  forced_only: true
  text: "Аукционный дом «Сотбис-Найт» предлагает картину довоенного мастера. Стартовая цена — сто двадцать тысяч. Эксперт клянётся, что подлинник."
  choices:
    - label: Купить
      check: {stat: INT, dv: 17}
      success: {text: "Подлинник. Через месяц коллекционер из Токио предлагает вдвое больше. Ты не продаёшь: она висит в гостиной и все спрашивают о ней.", effects: {eddies: -120000, status: 4, fame: 3, mood: 5}}
      fail: {text: "Через месяц выясняется, что «мастер» нарисовал её в подвале Кабуки на прошлой неделе. Аукционный дом уже ликвидирован.", effects: {eddies: -120000, status: -1, mood: -6}}
    - label: Нанять независимого эксперта
      effects: {eddies: -8000}
      text: "Эксперт смеётся через пять минут: подделка. Восемь тысяч за спасённые сто двадцать — хорошая сделка."
    - label: Пропустить
      effects: {}
      text: "Картину покупает кто-то другой. Через месяц ты читаешь в новостях, что это была подделка. Или нет."

- id: wealth_casino_whale
  title: Кит в казино
  category: money
  weight: 2
  forced_only: true
  text: "Казино в Норт-Оуке присылает приглашение «для особых гостей»: личный стол, без лимитов, шампанское за счёт заведения."
  choices:
    - label: Играть по-крупному
      check: {stat: COOL, dv: 18}
      success: {text: "Ты уходишь, пока стол ещё твой. Менеджер провожает тебя взглядом человека, который запомнил лицо.", effects: {eddies_pct: 12, mood: 6}}
      fail: {text: "Ещё одна раздача. И ещё одна. Под утро ты видишь сумму и понимаешь, что шампанское было не бесплатным.", effects: {eddies_pct: -22, mood: -8}}
    - label: Сыграть немного и уйти
      effects: {eddies: -10000, mood: 3}
      text: "Ты проигрываешь ровно столько, сколько решил, и уходишь. Это редкость, говорит крупье."
    - label: Не ходить
      effects: {}
      text: "Приглашение отправляется в утилизатор."

- id: wealth_tax_hunt
  title: Налоговая охота
  category: money
  weight: 2
  forced_only: true
  text: "Налоговая служба Свободного Штата решила, что твои доходы «не подтверждены». Инспектор в дорогом костюме называет сумму доначислений с тремя нулями после запятой."
  choices:
    - label: Заплатить
      effects: {eddies_pct: -12}
      text: "Платёж уходит. Инспектор желает приятного вечера и, кажется, вспоминает про тебя в следующем году."
    - label: Дать взятку
      check: {stat: COOL, skill: persuasion, dv: 16}
      success: {text: "Конверт решает вопрос. Доначисления превращаются в «ошибку системы».", effects: {eddies: -25000}}
      fail: {text: "Инспектор записывает попытку взятки в протокол. Теперь плюс штраф.", effects: {eddies_pct: -20, heat: 2}}
    - label: Нанять армию юристов
      effects: {eddies: -40000, status: 1}
      text: "Юристы тянут дело полгода и выигрывают. Их счёт почти такой же, как налог, зато ты победил."

- id: wealth_yacht
  title: Яхта в Пасифике
  category: money
  weight: 2
  forced_only: true
  text: "Брокер предлагает яхту бывшего директора «Петрохема»: бассейн, вертолётная площадка, команда из двенадцати человек. «Все серьёзные люди города уже на воде»."
  choices:
    - label: Купить яхту
      effects: {eddies: -250000, status: 5, fame: 4, mood: 10}
      text: "Ты устраиваешь вечеринку на палубе. Половина гостей — люди, которые месяц назад не отвечали на твои звонки."
    - label: Арендовать на выходные
      effects: {eddies: -30000, status: 1, mood: 6}
      text: "Два дня солнца над грязной водой. Потом снова город."
    - label: Отказаться
      effects: {}
      text: "Брокер пожимает плечами: «Вы ещё не привыкли к деньгам. Привыкнете»."
