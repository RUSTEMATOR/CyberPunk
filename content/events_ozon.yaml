# Parody arcs after the improvised audiobooks of Ozon671Games (owner request): «Тихий Дэн», «Ночное такси»,
# «Курьер», «Ночное дежурство», «Сосед», «Карамель», «Катастрофа 2089». No sex scenes, the jokes stay in the absurd:
# the narrator forgets where the story happens, prices jump mid-sentence, everyone drinks «Брепси» and водка «Колхоз».
# Same rules as events_arcs.yaml: the first step is a random event once per life, the next steps are forced_only.

# ======================================================================== «Тихий Дэн»

- id: ozon_dan_1
  title: Тихий Дэн
  category: relationships
  weight: 3
  conditions:
    flags_none: [ozon_dan]
  text: "В холле мегабашни парень в оранжевом жилете тихо моет пол. Начальник смены орёт на него за разводы, потом за то, что разводов нет, потом увольняет. Парень снимает жилет, аккуратно складывает и говорит: «Меня зовут Дэн. Я тихий». Отец у Дэна — шишка в корпорации, но звонить ему Дэн не хочет."
  choices:
    - label: Угостить «Брепси»
      effects: {flag_set:ozon_dan: true, eddies: -20, mood: 3, queue_event:ozon_dan_2: true}
      text: "Две банки «Брепси» из автомата. Дэн пьёт медленно и рассказывает, что «Брепси» лучше «Пепси», потому что на одну букву больше. Логика железная."
    - label: Одолжить на аренду
      effects: {flag_set:ozon_dan: true, eddies: -300, queue_event:ozon_dan_2: true}
      text: "Дэн долго отказывается, потом берёт и обещает вернуть «когда отец перестанет быть отцом». Звучит как никогда."
    - label: Пройти мимо
      effects: {flag_set:ozon_dan: true}
      text: "Тихий Дэн остаётся стоять в пустом холле. «Сейчас такое время: и уборщиков убирают», — говорит он полу. Где-то в этот момент заканчивается одна история и не начинается другая."

- id: ozon_dan_2
  title: Луиза
  category: relationships
  weight: 1
  forced_only: true
  text: "Дэн светится. Он познакомился с девушкой по имени Луиза: она носит шубу летом, называет его «мой миллионер» и уже знает, где Дэн хранит серебряный чайный сервиз, подарок тёти. Дэн просит оценить её «со стороны»."
  choices:
    - label: Открыть Дэну глаза
      check: {stat: EMP, skill: persuasion, dv: 14}
      success: {text: "Дэн слушает, кивает и говорит: «Похоже на правду. Но я её люблю». Хотя бы теперь он прячет карточку в носок.", effects: {mood: 2, queue_event:ozon_dan_3: true}}
      fail: {text: "Дэн обижается и уходит к Луизе. Луиза машет тебе из окна такси, которое оплатил Дэн.", effects: {mood: -2, queue_event:ozon_dan_3: true}}
    - label: Пробить Луизу по сети
      check: {stat: INT, skill: netrunning, dv: 13}
      success: {text: "У Луизы семь имён, четыре мужа и судимость за кражу ложек в Лас-Вегасе. Копия досье уходит её четвёртому мужу за хорошие деньги.", effects: {skill_xp:netrunning: 1, eddies: 600, queue_event:ozon_dan_3: true}}
      fail: {text: "Поиск выдаёт только рецепт пирога «Луиза». Аккаунт Луизы закрыт лучше, чем сервер Арасаки.", effects: {queue_event:ozon_dan_3: true}}
    - label: Не лезть
      effects: {queue_event:ozon_dan_3: true}
      text: "Чужая любовь — не твоё дело. Ты так и говоришь. Дэн благодарит за честность и покупает Луизе шубу на зиму."

- id: ozon_dan_3
  title: Пропал сервиз
  category: money
  weight: 1
  forced_only: true
  text: "Звонок в три ночи. Дэн шепчет: Луиза исчезла. С ней исчезли его деньги, бутылка водки «Колхоз» и тётин серебряный сервиз на двенадцать персон. Отец сказал «сам виноват» и положил трубку. Странно: вчера этот дом был в Уэстбруке, а сегодня, по словам Дэна, почему-то в Пасифике. Цена сервиза тоже успела вырасти втрое за разговор."
  choices:
    - label: Найти её по камерам
      check: {stat: INT, skill: netrunning, dv: 15}
      success: {text: "Камера у ломбарда в Кабуки: Луиза в шубе пытается сдать ложку. Оценщик предлагает за неё бутылку водки «Колхоз». Есть след.", effects: {skill_xp:netrunning: 1, queue_event:ozon_dan_4: true}}
      fail: {text: "Камеры показывают сорок женщин в шубах. Летом. Это Найт-Сити. Придётся искать ногами.", effects: {mood: -2, queue_event:ozon_dan_4: true}}
    - label: Поспрашивать на улице
      check: {stat: COOL, skill: persuasion, dv: 14}
      success: {text: "Бармен в Кабуки помнит женщину, которая расплачивалась серебряными вилками. Есть след.", effects: {queue_event:ozon_dan_4: true}}
      fail: {text: "Тебе продают три разных адреса и один настоящий синяк.", effects: {hp: -3, queue_event:ozon_dan_4: true}}
    - label: Поговорить с отцом Дэна
      check: {stat: COOL, skill: persuasion, dv: 16}
      success: {text: "Отец Дэна, не отрываясь от биржевых сводок, выписывает чек «на поиски сервиза, не сына». Деньги есть деньги.", effects: {eddies: 1500, status: 1, queue_event:ozon_dan_4: true}}
      fail: {text: "Охрана выводит тебя вежливо, но быстро. Отец Дэна даже не поднял глаз.", effects: {mood: -3, queue_event:ozon_dan_4: true}}

- id: ozon_dan_4
  title: Месть тихого Дэна
  category: street
  weight: 1
  forced_only: true
  text: "Луиза нашлась в баре на окраине. Она пьёт «Брепси» с водкой «Колхоз», а под столом — коробка с сервизом. Рядом её новые друзья, Кюни и Сметания, оба размером с холодильник. Дэн стоит за твоей спиной и впервые в жизни не тихий."
  choices:
    - label: Забрать сервиз силой
      check: {stat: BODY, skill: melee, dv: 15}
      success: {text: "Кюни падает на Сметанию, Сметания на стол, стол на Луизу. Сервиз цел. Дэн плачет над ложками, как над родными, и шепчет: «Опа, нормально».", effects: {street_cred: 2, eddies: 1000, flag_set:ozon_dan_done: true}}
      fail: {text: "Сметания бьёт так, что в ушах звенит серебро. Сервиз уезжает с Луизой в такси. Дэн обещает, что это не конец.", effects: {hp: -10, mood: -4}}
    - label: Договориться
      check: {stat: COOL, skill: persuasion, dv: 14}
      success: {text: "Луиза отдаёт сервиз в обмен на то, что Дэн не пойдёт в полицию. Дэн и не собирался: он тихий.", effects: {eddies: 500, flag_set:ozon_dan_done: true}}
      fail: {text: "Луиза смеётся и заказывает ещё «Брепси». Вам с Дэном остаётся счёт за её напитки.", effects: {eddies: -200, mood: -3}}
    - label: Забрать сервиз себе
      check: {stat: REF, skill: stealth, dv: 14}
      success: {text: "Пока все орут, коробка тихо уходит под твоей курткой. Сервиз сдан скупщику за хорошие деньги. Дэн об этом не узнает. Наверное.", effects: {eddies: 4000, humanity: -2, flag_set:ozon_dan_done: true}}
      fail: {text: "Коробка звенит на весь бар. Теперь тебя ненавидят все: Луиза, Кюни, Сметания и даже тихий Дэн.", effects: {hp: -6, street_cred: -1}}

- id: ozon_dan_epilogue
  title: Тихий Дэн. Начало пути
  category: rare
  weight: 2
  conditions:
    flags_all: [ozon_dan_done]
    flags_none: [ozon_dan_epi]
  text: "Дэн снова моет полы, только теперь в собственной химчистке, купленной на деньги за спасённый сервиз. На стене портрет отца, перевёрнутый вверх ногами. Он зовёт тебя на открытие: будут «Брепси», торт и Кюни, который, оказывается, неплохой парень."
  choices:
    - label: Прийти на открытие
      effects: {flag_set:ozon_dan_epi: true, mood: 6, eddies: 500}
      text: "Дэн произносит тост из одного слова: «Спасибо». Это самая длинная речь в его жизни. В конверте немного денег и купон на бесплатную чистку."
    - label: Вложиться в химчистку
      effects: {flag_set:ozon_dan_epi: true, eddies: -2000, later: [{weeks: 12, chance: 0.6, effects: {eddies: 5000}, text: "Химчистка Дэна разрослась до трёх точек. Дэн молча переводит тебе долю.", fail_text: "Химчистку закрыла санэпидемстанция: Кюни стирал в машинах шубы Сметании. Деньги пропали."}]}
      text: "Дэн жмёт руку и записывает тебя в блокнот как «партнёр». Блокнот у него один, и в нём только ты."

# ======================================================================== «Ночное такси»

- id: ozon_taxi_1
  title: Ночное такси
  category: street
  weight: 5
  conditions:
    flags_none: [ozon_taxi]
  text: "Три часа ночи, дождь. Подъезжает жёлтое такси без номеров. Водитель улыбается слишком широко, и зубов у него явно больше тридцати двух. «Садись, довезу. Я вежливых не ем»."
  choices:
    - label: Сесть и быть вежливым
      check: {stat: COOL, skill: persuasion, dv: 12}
      success: {text: "Вы мило болтаете о погоде и ценах на синтомясо. Водитель довозит бесплатно и оставляет визитку: «Если кто-то нагрубит — звони».", effects: {flag_set:ozon_taxi: true, mood: 4, queue_event:ozon_taxi_2: true}}
      fail: {text: "Ты случайно называешь его «шеф». Он долго молчит, потом высаживает посреди Пустошей. Живым. Это уже подарок.", effects: {flag_set:ozon_taxi: true, hp: -4, mood: -3}}
    - label: Выйти на красном
      check: {stat: REF, skill: driving, dv: 13}
      success: {text: "Дверь, лужа, переулок. Сзади хохот и хлопок двери. В новостях наутро: «Пассажир такси пропал без вести». Не ты.", effects: {flag_set:ozon_taxi: true, mood: -2}}
      fail: {text: "Двери заблокированы. Водитель вздыхает: «Ну вот, а я думал, мы подружимся». До дома ты всё же доезжаешь. Без кошелька.", effects: {flag_set:ozon_taxi: true, eddies: -300}}
    - label: Дать щедрые чаевые
      effects: {flag_set:ozon_taxi: true, eddies: -100, queue_event:ozon_taxi_2: true}
      text: "Водитель пересчитывает купюры длинными пальцами и растроганно облизывается. «Хороший человек. Таких мало. Вкусных — много»."

- id: ozon_taxi_2
  title: Грубый пассажир
  category: street
  weight: 1
  forced_only: true
  text: "Звонок с визитки. Ночной таксист просит помощи: пассажир-корпорат отказался платить, обозвал его «шефом» и заперся в машине. Таксист голоден и вежлив: «Помоги мне его выманить, а я поделюсь тем, что у него в карманах»."
  choices:
    - label: Выманить корпората
      check: {stat: COOL, skill: persuasion, dv: 14}
      success: {text: "Корпорат выходит проверить «важный звонок». Дальше ты не смотришь. Таксист честно делится содержимым карманов.", effects: {eddies: 1800, humanity: -2, street_cred: 1}}
      fail: {text: "Корпорат вызывает охрану. Таксист исчезает вместе с машиной, а охрана находит только тебя.", effects: {heat: 2, hp: -5}}
    - label: Спасти корпората
      check: {stat: REF, skill: driving, dv: 15}
      success: {text: "Ты отвлекаешь таксиста, корпорат убегает. Утром на счёт падает благодарность от его секретаря. Таксист больше не звонит.", effects: {eddies: 1200, status: 1, humanity: 1}}
      fail: {text: "Таксист обижен. Он не трогает тебя, но теперь каждую ночь у подъезда стоит жёлтая машина без номеров.", effects: {mood: -8}}
    - label: Сбросить звонок
      effects: {mood: -1}
      text: "Ты выключаешь телефон. В новостях утром: «Корпорат найден в такси. Частично»."

# ======================================================================== «Курьер»

- id: ozon_courier_1
  title: Курьер Аривальдо
  category: money
  weight: 3
  conditions:
    flags_none: [ozon_courier]
  text: "Курьер Аривальдо Сильва привёз тебе чужую посылку и отказывается её забирать: «Бразильский курьер не возвращает. Бразильский курьер забывает». Посылка тикает. Аривальдо курит и рассуждает о том, что жизнь — это доставка, у которой нет адреса."
  choices:
    - label: Открыть посылку
      check: {stat: TECH, skill: tech, dv: 13}
      success: {text: "Внутри будильник, пачка эдди и записка «Аривальдо, это твоя зарплата за год». Аривальдо пожимает плечами: «Забирай. Я всё равно забуду».", effects: {flag_set:ozon_courier: true, eddies: 900, mood: 3}}
      fail: {text: "Внутри будильник с краской. Лицо синее до вечера. Аривальдо смеётся впервые за десять лет.", effects: {flag_set:ozon_courier: true, mood: -3, fame: 1}}
    - label: Доставить по адресу
      check: {stat: REF, skill: driving, dv: 14}
      success: {text: "Адрес — склад Валентино. Тебе платят за доставку и отдельно за то, что вопросов не было. Аривальдо доволен: «В тебе есть что-то бразильское».", effects: {flag_set:ozon_courier: true, eddies: 600, street_cred: 1}}
      fail: {text: "Адреса не существует. Ты кружишь по городу три часа, а посылка перестаёт тикать. Это хуже.", effects: {flag_set:ozon_courier: true, mood: -4, heat: 1}}
    - label: Выпить с Аривальдо
      effects: {flag_set:ozon_courier: true, mood: 5, eddies: -60}
      text: "Две бутылки водки «Колхоз», и Аривальдо рассказывает всю жизнь: Рио, Найт-Сити, двенадцать жён и ни одной доставленной вовремя посылки. Посылку забирает уборщик. Её больше никто не ищет."

# ======================================================================== «Ночное дежурство»

- id: ozon_night_shift
  title: Ночное дежурство
  category: work
  weight: 3
  conditions:
    flags_none: [ozon_guard]
  text: "Подработка: ночной охранник на парковке у торгового центра. Начальник смены, человек с усами и комплексами, первым делом забирает твои чипсы «на экспертизу» и объясняет, что охранник не человек, а функция. На парковке двести машин и одна подозрительная тень."
  choices:
    - label: Проверить тень
      check: {stat: REF, skill: stealth, dv: 13}
      success: {text: "Тень — угонщик. Ты ловишь его у третьего ряда. Начальник докладывает наверх, что поймал сам, но премию всё-таки выдаёт.", effects: {flag_set:ozon_guard: true, eddies: 400, street_cred: 1}}
      fail: {text: "Тень оказывается начальником, который ест твои чипсы в машине. Он штрафует тебя за то, что его видели.", effects: {flag_set:ozon_guard: true, eddies: -100, mood: -4}}
    - label: Ответить начальнику
      check: {stat: COOL, skill: persuasion, dv: 14}
      success: {text: "Ты спокойно объясняешь, кто здесь функция. Начальник краснеет и возвращает чипсы. Охранники с соседних парковок узнают об этом к утру.", effects: {flag_set:ozon_guard: true, mood: 6, fame: 1}}
      fail: {text: "Начальник пишет на тебя докладную на трёх листах. Смена без оплаты, чипсы конфискованы навсегда.", effects: {flag_set:ozon_guard: true, mood: -5}}
    - label: Отработать молча
      effects: {flag_set:ozon_guard: true, eddies: 250, mood: -2}
      text: "Восемь часов под мигающей лампой. Деньги выдают купюрами по одному эдди. Начальник лично пересчитывает их при тебе."

# ======================================================================== «Сосед»

- id: ozon_neighbor
  title: Сосед
  category: relationships
  weight: 3
  conditions:
    flags_none: [ozon_neighbor]
  text: "За стеной новый сосед. Каждую ночь он поёт караоке на корейском, плохо, но с душой. Утром оставляет у двери кимчи и записку: «Простите. Я Дэн. Нет, другой Дэн»."
  choices:
    - label: Спеть вместе
      effects: {flag_set:ozon_neighbor: true, mood: 6}
      text: "К трём ночи вы поёте дуэтом, к четырём к вам стучит весь этаж, к пяти поёт весь этаж. Лучшая ночь в этой мегабашне."
    - label: Пожаловаться управляющему
      check: {stat: COOL, skill: persuasion, dv: 12}
      success: {text: "Управляющий выдаёт соседу шумоизоляцию за счёт башни. Тишина. Кимчи у двери появляется по-прежнему.", effects: {flag_set:ozon_neighbor: true, mood: 3}}
      fail: {text: "Управляющий штрафует обоих: соседа за шум, тебя за жалобу без формы 27-Б.", effects: {flag_set:ozon_neighbor: true, eddies: -150}}
    - label: Взять кимчи и терпеть
      effects: {flag_set:ozon_neighbor: true, hp: 2, mood: -2}
      text: "Кимчи отличное. Сон плохой. В целом честный обмен."

# ======================================================================== «Карамель»

- id: ozon_caramel
  title: Детектив Карамель
  category: ncpd
  weight: 3
  conditions:
    flags_none: [ozon_caramel]
  text: "Под неоновым дождём к тебе подсаживается частный детектив в мятом плаще. Представляется: Карамель. Говорит только внутренним монологом, но вслух: «Город пах ложью и жжёным сахаром. У меня один свидетель по делу о пропавшей кошке миссис Ли. Это ты»."
  choices:
    - label: Помочь со следствием
      check: {stat: INT, skill: persuasion, dv: 13}
      success: {text: "Кошка нашлась в вентиляции ресторана. Карамель произносит монолог на десять минут и платит. Миссис Ли плачет и печёт пирог.", effects: {flag_set:ozon_caramel: true, eddies: 500, mood: 4}}
      fail: {text: "Ты указываешь не ту вентиляцию. Карамель долго смотрит в дождь и произносит: «Ещё один свидетель, который ничего не видел»", effects: {flag_set:ozon_caramel: true, mood: -2}}
    - label: Сдать Карамель копам
      effects: {flag_set:ozon_caramel: true, eddies: 200, heat: -1, humanity: -1}
      text: "У Карамель нет лицензии с 2009 года. NCPD благодарит и забирает плащ как улику. Монолог продолжается уже в участке."
    - label: Сказать монологом
      effects: {flag_set:ozon_caramel: true, mood: 3, fame: 1}
      text: "«Ночь была длинной, а кошки — короткими», — говоришь ты. Карамель снимает шляпу. Вас снимают на камеру, видео расходится по сети."

# ======================================================================== «Катастрофа 2089»

- id: ozon_catastrophe
  title: Катастрофа 2089
  category: rare
  weight: 2
  conditions:
    flags_none: [ozon_doom]
  text: "Уличный проповедник с экраном на груди показывает «запись из будущего»: в 2089 году город затопит газировкой «Брепси», а выживут только те, кто купит у него билет в бункер. Билеты недорогие. Пока."
  choices:
    - label: Купить билет
