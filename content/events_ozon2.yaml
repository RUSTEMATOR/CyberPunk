# Parody events after the improvised audiobooks of Ozon671Games, batch 2 (owner request: more of them).
# Sources: «Тихий Дэн» 2 and «Начало пути», «Курьер 2», «Ночное такси 2», «Ночное дежурство» (second half),
# «Холод» 1-3, «29 Этаж», «Восприятие ужаса», «Полноус», «Семейка Клоу», «Зомби-апокариес», «Дом, в котором живу Я»,
# «Спецотряд E34» / «Сириус 6 Б», «2036: Судьба в дороге не туда», «Ежлесово», «Пожиратель грехов», «Красный предел»,
# «Ранчо Бо», «Приключение Каблучедисона». The trademarks of the reader stay: prices and places drift mid-story,
# «определённый», «можно сказать», «Опа, нормально», «как зажжённый жук», «катится в полный чердак».
# No sex scenes. Same rules as events_arcs.yaml: a first step is a random event once per life, next steps forced_only.

# ======================================================================== «Тихий Дэн 2»

- id: ozon_dan2_1
  title: Дэн вооружается
  category: street
  weight: 3
  conditions:
    flags_all: [ozon_dan]
    flags_none: [ozon_dan2]
  text: "Тихий Дэн снова на связи. Голос ровный, как пол после смены. Он купил два ножа, пистолет и определённую куртку. «Мир меня уволил, — говорит Дэн. — Теперь я увольняю мир». Он просит помочь ему, можно сказать, подготовиться."
  choices:
    - label: Научить держать ствол
      check: {stat: REF, skill: firearms, dv: 13}
      success: {text: "К вечеру Дэн попадает в банку «Брепси» с десяти шагов. Он кивает: «Опа, нормально». Это его самая длинная похвала.", effects: {flag_set:ozon_dan2: true, skill_xp:firearms: 1, queue_event:ozon_dan2_2: true}}
      fail: {text: "Дэн стреляет в автомат с «Брепси». Автомат обиженно выдаёт банку. Дэн считает это знаком.", effects: {flag_set:ozon_dan2: true, eddies: -150, queue_event:ozon_dan2_2: true}}
    - label: Отговорить
      check: {stat: EMP, skill: persuasion, dv: 15}
      success: {text: "Вы долго сидите на лестнице. Дэн сдаёт пистолет обратно в ломбард и покупает швабру с подогревом. Мир выдыхает, не зная, от чего спасся.", effects: {flag_set:ozon_dan2: true, humanity: 2, mood: 4}}
      fail: {text: "Дэн выслушивает до конца и говорит: «Ты хороший человек. Но мир катится в полный чердак». Ножи остаются при нём.", effects: {flag_set:ozon_dan2: true, queue_event:ozon_dan2_2: true}}
    - label: Продать ему ствол подороже
      effects: {flag_set:ozon_dan2: true, eddies: 600, humanity: -1, queue_event:ozon_dan2_2: true}
      text: "Ствол стоил пятьсот, ты называешь девятьсот. Дэн платит не торгуясь. Он вообще не умеет торговаться: он тихий."

- id: ozon_dan2_2
  title: Ночь мести
  category: street
  weight: 1
  forced_only: true
  text: "Дэн решил начать с бывшего начальника смены. Тот как раз празднует в баре, который, по словам Дэна, стоит в центре города, но в его же пригороде. Дэн входит как зажжённый жук. Бармен роняет стакан. Ты стоишь в дверях, и дальше многое зависит от тебя."
  choices:
    - label: Прикрыть Дэна
      check: {stat: COOL, skill: firearms, dv: 15}
      success: {text: "Охрана бара решает, что с вами двумя лучше не спорить. Начальник смены публично извиняется, моет пол под присмотром Дэна и выплачивает ему остаток выходного пособия. Без единого выстрела.", effects: {street_cred: 2, eddies: 800, fame: 1}}
      fail: {text: "Выстрел в потолок, визг, сирены. Дэн уходит через кухню, ты — через окно. Начальник смены цел, но розыск теперь на двоих.", effects: {heat: 2, hp: -5}}
    - label: Остановить Дэна
      check: {stat: BODY, skill: melee, dv: 13}
      success: {text: "Ты забираешь у Дэна нож прежде, чем он вспоминает, зачем пришёл. Дэн садится на пол и плачет. Начальник смены из благодарности платит за всех.", effects: {humanity: 2, eddies: 300, mood: 2}}
      fail: {text: "Дэн неожиданно ловкий. Нож у тебя в плече, Дэн в ужасе, начальник смены в восторге: «Вот поэтому его и уволили».", effects: {hp: -9, mood: -3}}
    - label: Позвонить в NCPD
      effects: {heat: -1, humanity: -1, street_cred: -1}
      text: "Патруль приезжает через сорок минут: в этом районе стандарт. Дэна увозят, начальник смены жмёт тебе руку. На улице это запомнят."

# ======================================================================== «Тихий Дэн: Начало пути»

- id: ozon_dan_origin
  title: Курсы промывателей полов
  category: work
  weight: 2
  conditions:
    flags_none: [ozon_dan_origin]
  text: "Объявление на столбе: «Курсы промывателей полов. Диплом за неделю. Работа гарантирована». Преподаватель, худой парень в оранжевом жилете, представляется Дэном и говорит, что это его первый день. В классе ты одна живая душа и два робота-пылесоса."
  choices:
    - label: Пройти курс
      effects: {flag_set:ozon_dan_origin: true, eddies: -200, skill_xp:tech: 1, later: [{weeks: 6, chance: 0.6, effects: {eddies: 900}, text: "Диплом промывателя полов неожиданно пригождается: мегабашня берёт тебя на подработку по выходным. Платят определённо.", fail_text: "Диплом промывателя полов никому не нужен. Сейчас такое время: и уборщиков убирают."}]}
      text: "Неделя теории: угол наклона швабры, философия разводов, техника «восьмёркой». Дэн вручает диплом и тихо радуется."
    - label: Помочь Дэну с классом
      check: {stat: COOL, skill: persuasion, dv: 12}
      success: {text: "Ты приводишь ещё пятерых. Дэн впервые получает зарплату, и делится. «Опа, нормально», — говорит он.", effects: {flag_set:ozon_dan_origin: true, eddies: 300, mood: 3}}
      fail: {text: "Желающих нет. Роботы-пылесосы получают дипломы с отличием.", effects: {flag_set:ozon_dan_origin: true, mood: -1}}
    - label: Пройти мимо
      effects: {flag_set:ozon_dan_origin: true}
      text: "Объявление срывает ветром. Где-то в этот момент начинается чей-то путь."

- id: ozon_janitors
  title: И уборщиков убирают
  category: work
  weight: 2
  conditions:
    flags_none: [ozon_janitors]
  text: "Мегабашня заменяет всех уборщиков дронами. Уборщики сидят в холле с плакатами «Сейчас такое время: и уборщиков убирают». Управляющий предлагает тебе пятьсот эдди за то, чтобы помочь разогнать сидячую забастовку."
  choices:
    - label: Взять деньги управляющего
      effects: {flag_set:ozon_janitors: true, eddies: 500, humanity: -1, street_cred: -1}
      text: "Забастовка расходится. Дроны моют пол криво, но бесплатно. Уборщики запоминают твоё лицо."
    - label: Сесть с уборщиками
      check: {stat: COOL, skill: persuasion, dv: 14}
      success: {text: "Ты договариваешься: дроны обслуживают коридоры, люди — холл и лифты. Уборщики поднимают тебя на руках. Слух расходится по району.", effects: {flag_set:ozon_janitors: true, fame: 1, street_cred: 1, mood: 4}}
      fail: {text: "Управляющий вызывает охрану. Вас выводят всех вместе, вежливо и под руки.", effects: {flag_set:ozon_janitors: true, heat: 1, mood: -2}}
    - label: Перепрошить дронов
      check: {stat: TECH, skill: tech, dv: 15}
      success: {text: "Дроны начинают мыть только кабинет управляющего, круглосуточно и очень мокро. Через неделю уборщиков возвращают.", effects: {flag_set:ozon_janitors: true, skill_xp:tech: 1, street_cred: 2}}
      fail: {text: "Один дрон влюбляется в тебя и ходит следом. Остальные продолжают работать.", effects: {flag_set:ozon_janitors: true, mood: -1}}

- id: ozon_taxi_9000
  title: Таксист на девять тысяч
  category: money
  weight: 2
  conditions:
    flags_none: [ozon_taxi9000]
  text: "Таксист в кожаной кепке уверяет: за ночь он поднимает девять тысяч эдди. Сколько стоят его часы, он тоже знает: «Пятьсот баксов. Дорого, я переживаю». Он предлагает тебе сменщика на одну ночь."
  choices:
    - label: Отработать ночь
      check: {stat: REF, skill: driving, dv: 14}
      success: {text: "Девяти тысяч нет. Но восемьсот есть, и пассажир из Чартер-Хилла оставляет на чай бутылку «Колхоза». Таксист говорит, что тебе не повезло со сменой.", effects: {flag_set:ozon_taxi9000: true, eddies: 800, skill_xp:driving: 1}}
      fail: {text: "Ты везёшь пассажира в Пасифику, а приезжаешь в Хейвуд. Таксист не удивлён: «В нашем городе так бывает». Штраф за помятое крыло.", effects: {flag_set:ozon_taxi9000: true, eddies: -300}}
    - label: Купить у него часы
      effects: {flag_set:ozon_taxi9000: true, eddies: -500, luck_pool: 1, mood: 2}
      text: "Часы тикают громко и показывают время соседнего часового пояса. Таксист прощается с ними со слезами: «Береги их. Они определённые»."
    - label: Не верить ни слову
      effects: {flag_set:ozon_taxi9000: true}
      text: "Таксист обижается и уезжает. На прощание сигналит девять тысяч раз."

# ======================================================================== «Курьер 2»

- id: ozon_courier_2
  title: Возвращение Аривальдо
  category: money
  weight: 2
  conditions:
    flags_all: [ozon_courier]
    flags_none: [ozon_courier2]
  text: "Аривальдо Сильва вернулся из Рио. Говорит, что открыл курьерскую службу «Сильва-Экспресс»: один курьер, ноль доставленных посылок, сто процентов цинизма. Ему нужен второй курьер на большой заказ. Груз — ящик с надписью «Не открывать, Аривальдо»."
  choices:
    - label: Вести груз вместе
      check: {stat: REF, skill: driving, dv: 15}
      success: {text: "Ящик доставлен, впервые в истории компании. Аривальдо закуривает и говорит: «Жизнь — это доставка. Иногда даже доходит». Деньги пополам.", effects: {flag_set:ozon_courier2: true, eddies: 1500, street_cred: 1}}
      fail: {text: "Ящик открывается сам на кочке. Внутри — сорок бутылок «Брепси», которые теперь на тебе. Заказчик требует компенсацию.", effects: {flag_set:ozon_courier2: true, eddies: -400, mood: -2}}
    - label: Вложиться в «Сильва-Экспресс»
      effects: {flag_set:ozon_courier2: true, eddies: -1000, later: [{weeks: 10, chance: 0.4, effects: {eddies: 4000, fame: 1}, text: "«Сильва-Экспресс» берёт контракт у Арасаки на доставку чего-то, о чём лучше не спрашивать. Аривальдо переводит твою долю и записку: «Не спрашивай».", fail_text: "Аривальдо забыл, где офис «Сильва-Экспресс». Компания, деньги и Аривальдо исчезли в неизвестном направлении."}]}
      text: "Аривальдо записывает тебя в партнёры на обороте накладной. Других документов у компании нет."
    - label: Отказаться
      effects: {flag_set:ozon_courier2: true}
      text: "Аривальдо пожимает плечами: «Бразильский курьер не обижается. Бразильский курьер забывает». Через минуту он забыл."

# ======================================================================== «Ночное такси 2»

- id: ozon_taxi2
  title: Таксопарк с зубами
  category: street
  weight: 5
  conditions:
    flags_all: [ozon_taxi]
    flags_none: [ozon_taxi2]
  text: "Ночной таксист расширился. Теперь у него целый таксопарк: двенадцать жёлтых машин без номеров, водители улыбаются слишком широко. Он помнит тебя и предлагает место диспетчера: «Работа простая. Отправлять вежливых — домой. Грубых — к нам»."
  choices:
    - label: Сесть за пульт
      check: {stat: INT, skill: persuasion, dv: 14}
      success: {text: "Месяц ночных смен. Вежливых всё больше: город быстро учится. Таксист доволен и платит наличными, слегка влажными.", effects: {flag_set:ozon_taxi2: true, eddies: 1600, humanity: -1}}
      fail: {text: "Ты путаешь списки. Вежливого бухгалтера отправляют не туда. Таксист говорит, что ошибаться можно, но лучше не надо.", effects: {flag_set:ozon_taxi2: true, mood: -6, humanity: -2}}
    - label: Сдать таксопарк NCPD
      check: {stat: COOL, skill: stealth, dv: 15}
      success: {text: "NCPD накрывает гараж. Внутри только двенадцать пустых машин и записка «Спасибо за вежливость. Пока». Награду всё же платят.", effects: {flag_set:ozon_taxi2: true, eddies: 1000, heat: -1}}
      fail: {text: "Детектив, которому ты звонишь, приезжает на жёлтом такси без номеров. Разговор получается коротким.", effects: {flag_set:ozon_taxi2: true, hp: -8, mood: -5}}
    - label: Вежливо отказаться
      effects: {flag_set:ozon_taxi2: true, mood: 1}
      text: "Таксист кивает: вежливый отказ — это всё ещё вежливость. Он даже подвозит до дома. Бесплатно."

# ======================================================================== «Ночное дежурство», вторая половина

- id: ozon_guard_2
  title: Минус второй уровень
  category: ncpd
  weight: 2
  conditions:
    flags_all: [ozon_guard]
    flags_none: [ozon_guard2]
  text: "Снова ночное дежурство на парковке. Начальник смены с усами странно ласков и сам отдаёт тебе чипсы. На минус втором уровне в старом седане сидит человек. Он не двигается уже четвёртый час. Начальник говорит: «Не ходи туда. Это не твоя функция»."
  choices:
    - label: Пойти посмотреть
      check: {stat: INT, skill: stealth, dv: 14}
      success: {text: "В седане манекен в форме охранника. Рядом камера, которая пишет только тебя. Начальник проверял, нарушишь ли ты приказ, чтобы уволить без выходного пособия. Запись теперь у тебя.", effects: {flag_set:ozon_guard2: true, eddies: 700, mood: 4}}
      fail: {text: "Ты подходишь к седану, и в этот момент гаснет свет. Когда он включается, седана нет, а начальник смены стоит у тебя за спиной и жуёт твои чипсы.", effects: {flag_set:ozon_guard2: true, mood: -6, glitches: 1}}
    - label: Позвонить в полицию
      effects: {flag_set:ozon_guard2: true, heat: -1, eddies: -100}
      text: "Патруль находит в седане манекен и начальника смены с камерой. Тебя штрафуют за ложный вызов, начальника — за всё остальное. Новый начальник без усов."
    - label: Есть чипсы и не смотреть
      effects: {flag_set:ozon_guard2: true, mood: 2, hp: -1}
      text: "К утру седан исчезает. Начальник жмёт тебе руку: «Хорошая функция». Чипсы были с паприкой."

# ======================================================================== «Холод»

- id: ozon_cold_1
  title: Холод
  category: work
  weight: 2
  conditions:
    flags_none: [ozon_cold]
  text: "Старый инженер, из тех, кого называют старыми волками, ищет напарника на новогоднюю вахту: ремонт ретранслятора на севере, за Пустошами. Холод там, говорит он, не погода, а противник. Платят тройную ставку."
  choices:
    - label: Ехать на вахту
      check: {stat: BODY, skill: tech, dv: 14}
      success: {text: "Неделя в железном вагончике, метель, чай со вкусом солярки. Ретранслятор работает, инженер одобрительно хлопает по плечу. Тройная ставка честно на счету.", effects: {flag_set:ozon_cold: true, eddies: 1800, skill_xp:tech: 1, queue_event:ozon_cold_2: true}}
      fail: {text: "Отмороженные пальцы, сорванный срок, половина ставки. Инженер говорит: «Холод тебя запомнил. Он вернётся».", effects: {flag_set:ozon_cold: true, eddies: 600, hp: -8, queue_event:ozon_cold_2: true}}
    - label: Отказаться
      effects: {flag_set:ozon_cold: true}
      text: "Инженер уезжает один. По радио потом говорят, что ретранслятор заработал. Про инженера по радио не говорят."

- id: ozon_cold_2
  title: Последний рейс
  category: street
  weight: 1
  forced_only: true
  text: "У дальнобойщиков есть легенда: последний рейс — тот, который никто не хочет брать. Фура в Оттаву, где, как сообщают новости, теперь тоже Америка. Инженер с вахты звонит и говорит, что груз — его, водителя нет, а ты холод уже знаешь."
  choices:
    - label: Взять последний рейс
      check: {stat: REF, skill: driving, dv: 16}
      success: {text: "Трое суток по льду. Где-то на середине пути попутчик в кабине исчезает, хотя попутчиков не было. Груз доставлен, оплата по высшему тарифу и молчаливое уважение дальнобойщиков.", effects: {eddies: 3500, street_cred: 2, humanity: -1}}
      fail: {text: "Фура встаёт посреди белого ничего. Тебя находят через сутки, без груза и без памяти о последних шести часах.", effects: {hp: -12, mood: -6, glitches: 1}}
    - label: Отказаться от рейса
      effects: {mood: -1}
      text: "Через неделю в новостях: фура найдена на трассе, кабина пустая, двигатель ещё тёплый. Последний рейс всегда кого-нибудь находит."

# ======================================================================== «29 Этаж»

- id: ozon_29_floor
  title: Двадцать девятый этаж
  category: rare
  weight: 2
  conditions:
    flags_none: [ozon_29]
  text: "В мегабашне на тридцать этажей каждый знает своё место: внизу едят лапшу, наверху пьют шампанское. Тебя приглашают на двадцать девятый, предпоследний. Говорят, самое страшное происходит именно там: тем, кто почти наверху, есть что терять."
  choices:
    - label: Подняться
      check: {stat: COOL, skill: persuasion, dv: 15}
      success: {text: "На двадцать девятом все улыбаются и следят друг за другом. Тебя берут в игру: кто кого столкнёт ниже. Ты выходишь с новыми связями и чужим секретом.", effects: {flag_set:ozon_29: true, status: 2, eddies: 1000, humanity: -1}}
      fail: {text: "Тебя не замечают, а потом замечают слишком внимательно. Утром выясняется, что твоя аренда выросла, а карточка лифта больше не едет выше десятого.", effects: {flag_set:ozon_29: true, status: -1, mood: -5}}
    - label: Остаться внизу
      effects: {flag_set:ozon_29: true, mood: 2}
      text: "Лапша на первом этаже горячая и честная. Сверху иногда что-то падает, но не на тебя."

# ======================================================================== «Восприятие ужаса»

- id: ozon_fear_threshold
  title: Порог ужаса
  category: rare
  weight: 2
  conditions:
    flags_none: [ozon_fear]
  text: "Студенты-медики и психологи из университета ищут добровольцев для полевых испытаний: где в мозгу проходит порог ужаса. Брейнданс-шлем, датчики, подпись под отказом от претензий. Платят прилично, кормят бесплатно."
  choices:
    - label: Записаться
      check: {stat: COOL, dv: 15}
      success: {text: "Студенты повышают уровень, ты не моргаешь. На последнем этапе плачет один из студентов. Твой порог ужаса заносят в учебник как аномалию.", effects: {flag_set:ozon_fear: true, eddies: 1200, fame: 1, mood: -2}}
      fail: {text: "Ты срываешь шлем на третьем уровне. Неделю снится одно и то же: мегабашня без дверей. Деньги всё равно платят, по половине тарифа.", effects: {flag_set:ozon_fear: true, eddies: 500, mood: -8}}
    - label: Взломать их данные
      check: {stat: INT, skill: netrunning, dv: 14}
      success: {text: "Данные о порогах ужаса двадцати добровольцев неплохо продаются. Корпорации любят знать, чего боятся люди.", effects: {flag_set:ozon_fear: true, eddies: 1500, humanity: -2}}
      fail: {text: "Студенты замечают взлом и в отместку записывают тебя в контрольную группу. Без шлема. Без предупреждения.", effects: {flag_set:ozon_fear: true, mood: -5}}
    - label: Пройти мимо
      effects: {flag_set:ozon_fear: true}
      text: "Ужаса в жизни и так хватает. Бесплатно."

# ======================================================================== «Полноус»

- id: ozon_polnous
  title: Полноус
  category: street
  weight: 2
  conditions:
    flags_none: [ozon_polnous]
  text: "Отец с мальчиком лет десяти просят спрятать их до утра. За ними ходит Полноус: человек с огромными усами и кибер-руками, которого на районе называют судьбой. Он появляется там, где его не ждут, и никогда не торопится."
  choices:
    - label: Спрятать у себя
      check: {stat: COOL, skill: stealth, dv: 15}
      success: {text: "Ночь проходит в темноте и шёпоте. Под утро мимо окна медленно проплывают усы. Не останавливаются. Отец оставляет всё, что у него есть, и уводит сына к поезду.", effects: {flag_set:ozon_polnous: true, humanity: 3, eddies: 400, mood: 3}}
      fail: {text: "В три ночи стук в дверь, вежливый и неспешный. Ты держишь дверь, пока отец с сыном уходят через крышу. Усы ты теперь видишь во сне.", effects: {flag_set:ozon_polnous: true, hp: -12, humanity: 2, mood: -4}}
    - label: Встретить Полноуса
      violent: true
      check: {stat: REF, skill: firearms, dv: 17}
      success: {text: "Три выстрела, и усы остаются лежать на асфальте. Сам Полноус уходит, но без усов он больше не судьба. Район вспоминает это ещё долго.", effects: {flag_set:ozon_polnous: true, street_cred: 3, fame: 1, humanity: 1}}
      fail: {text: "Полноус ловит пулю кибер-рукой и разглядывает её. Потом смотрит на тебя. Ты приходишь в себя в мусорном баке, отец с сыном исчезли.", effects: {flag_set:ozon_polnous: true, hp: -18, mood: -6}}
    - label: Закрыть дверь
      effects: {flag_set:ozon_polnous: true, humanity: -2, mood: -3}
      text: "Ты закрываешь дверь. Шаги отца с сыном затихают в конце коридора. Утром в лифте ты чувствуешь запах табака для усов."

# ======================================================================== «Семейка Клоу»

- id: ozon_klou
  title: Семейка Клоу
  category: relationships
  weight: 2
  conditions:
    flags_none: [ozon_klou]
  text: "В квартиру напротив въезжает семья Клоу: мама, папа, трое детей. Все очень вежливые, всегда в одинаковых свитерах и всегда улыбаются одинаково. Они приглашают на ужин. У них нет ни одного зеркала."
  choices:
    - label: Пойти на ужин
      check: {stat: EMP, skill: persuasion, dv: 14}
      success: {text: "Ужин удивительно нормальный. Только дети не моргают, а папа Клоу знает о тебе то, чего не знает никто. На прощание дают пирог и совет, который через неделю спасает тебе деньги.", effects: {flag_set:ozon_klou: true, mood: 2, luck_pool: 1, eddies: 300}}
      fail: {text: "После ужина ты не помнишь, как оказываешься дома. На столе пирог, на руке аккуратная повязка, под ней ничего. Клоу машут из окна.", effects: {flag_set:ozon_klou: true, mood: -6, hp: -3}}
    - label: Проверить их по сети
      check: {stat: INT, skill: netrunning, dv: 15}
      success: {text: "Семья Клоу живёт в двенадцати городах одновременно, по одним и тем же документам. Информацию покупает журналист из Найт-Сити Ньюс 54.", effects: {flag_set:ozon_klou: true, eddies: 900}}
      fail: {text: "Поиск возвращает одно фото: твою дверь, снятую изнутри квартиры Клоу.", effects: {flag_set:ozon_klou: true, mood: -8}}
    - label: Сменить замки
      effects: {flag_set:ozon_klou: true, eddies: -200, mood: -1}
      text: "Новый замок, цепочка, глазок. Через неделю у Клоу появляется пирог для тебя на коврике. Как он попадает внутрь, неясно."

# ======================================================================== «Зомби-апокариес»

- id: ozon_apocaries
  title: Апокариес
  category: implants
  weight: 2
  conditions:
    flags_none: [ozon_caries]
  text: "По району ползёт кибер-кариес: новый штамм ест не только зубы, но и дешёвые импланты челюсти. Заражённые становятся медленными, злыми и всё время хотят сладкого. Подпольный стоматолог продаёт «вакцину» в виде жвачки."
  choices:
    - label: Купить жвачку
      effects: {flag_set:ozon_caries: true, eddies: -150, hp: 2}
      text: "Жвачка со вкусом «Брепси». Работает ли она, неизвестно, но ты не заражаешься. Возможно, просто повезло."
    - label: Помочь стоматологу
      check: {stat: TECH, skill: medicine, dv: 14}
      success: {text: "Ночь у кресла, сорок пациентов, двести пломб. Эпидемию на районе останавливаете вы двое. Стоматолог платит и называет тебя коллегой.", effects: {flag_set:ozon_caries: true, eddies: 1000, skill_xp:medicine: 1, fame: 1}}
      fail: {text: "Пациент кусает тебя за руку. Неделю хочется только сахарной ваты.", effects: {flag_set:ozon_caries: true, hp: -5, mood: -3}}
    - label: Отбиться от заражённых
      violent: true
      check: {stat: BODY, skill: melee, dv: 13}
      success: {text: "Заражённые медленные. Ты нет. До утра подъезд держится, к утру приезжает санитарная служба.", effects: {flag_set:ozon_caries: true, street_cred: 1}}
      fail: {text: "Заражённые медленные, но их много. Тебя спасает только мешок леденцов, брошенный в другую сторону.", effects: {flag_set:ozon_caries: true, hp: -8}}

# ======================================================================== «Дом, в котором живу Я»

- id: ozon_my_house
  title: Дом, в котором живу Я
  category: rare
  weight: 2
  conditions:
    flags_none: [ozon_house]
  text: "Пиратский брейнданс-сериал из будущего: 2223 год, после катастрофы часть людей стала монстрами, а выжившие держатся за свой дом и закон коллектива. Серий много, качество странное, прокат стоит пятьдесят эдди. Сосед уверяет, что это документальное."
  choices:
    - label: Смотреть все серии
      effects: {flag_set:ozon_house: true, eddies: -50, mood: 5, humanity: 1}
      text: "Ночь напролёт. Герои верят людям, люди их предают, дом стоит. К утру ты знаешь закон коллектива наизусть и почему-то хочешь позвонить соседям."
    - label: Продавать копии
      check: {stat: COOL, skill: persuasion, dv: 12}
      success: {text: "Копии расходятся по району как горячая лапша. Сосед требует долю за идею.", effects: {flag_set:ozon_house: true, eddies: 600, heat: 1}}
      fail: {text: "Правообладатель из 2223 года, видимо, существует: твой ларёк закрывают за пиратство.", effects: {flag_set:ozon_house: true, eddies: -200, heat: 1}}
    - label: Отказаться
      effects: {flag_set:ozon_house: true}
      text: "Будущее подождёт. Сосед обижается и смотрит один, громко."

# ======================================================================== «Спецотряд E34» / «Сириус 6 Б»

- id: ozon_e34
  title: Спецотряд E34
  category: work
  weight: 2
  conditions:
    flags_none: [ozon_e34]
  text: "Вербовщик в серебристом костюме набирает людей в «Спецотряд E34» на орбитальную станцию у Сириуса 6 Б. Контракт на полгода, оплата космическая. Что там делают, вербовщик объясняет общими словами: «определённые работы, можно сказать, важные»."
  choices:
    - label: Подписать контракт
      check: {stat: BODY, dv: 14}
      success: {text: "Медкомиссия пройдена. Через полгода по почте приходит расчёт за работу, которую, по контракту, ты выполнишь. Как-то так это работает в космосе.", effects: {flag_set:ozon_e34: true, later: [{weeks: 12, chance: 0.75, effects: {eddies: 6000, fame: 1}, text: "Спецотряд E34 переводит расчёт за полгода и медаль за определённые заслуги.", fail_text: "Станция у Сириуса 6 Б перестаёт выходить на связь. Деньги не приходят. Вербовщик тоже."}]}}
      fail: {text: "Медкомиссия заворачивает: «Слишком земное здоровье». Вербовщик всё равно продаёт тебе значок отряда.", effects: {flag_set:ozon_e34: true, eddies: -100}}
    - label: Пробить вербовщика
      check: {stat: INT, skill: netrunning, dv: 15}
      success: {text: "Сириус 6 Б — склад консервов в Пустошах, а «Спецотряд E34» собирает людей на бесплатную разгрузку. Ты сливаешь это в сеть и получаешь благодарность и немного денег от тех, кто не поехал.", effects: {flag_set:ozon_e34: true, eddies: 500, fame: 1}}
      fail: {text: "Сеть отряда защищена лучше, чем Арасака. Вербовщик теперь знает твой адрес и шлёт открытки из космоса.", effects: {flag_set:ozon_e34: true, mood: -2}}
    - label: Отказаться
      effects: {flag_set:ozon_e34: true}
      text: "Космос шумит где-то наверху. Здесь шумит Найт-Сити. Разницы, если подумать, немного."

# ======================================================================== «2036: Судьба в дороге не туда»

- id: ozon_wrong_road
  title: Дорога не туда
  category: street
  weight: 2
  conditions:
    flags_none: [ozon_wrongroad]
  text: "Художник из Гамбурга, бежавший от кризиса в Германии, просит довезти его до заказчика: огромный мурал на стене в Пасифике. Навигатор у него свой, немецкий. Через двадцать минут дорога ведёт явно не туда."
  choices:
    - label: Довериться навигатору
      check: {stat: LUCK, dv: 13}
      success: {text: "Дорога не туда выводит к заброшенному заводу, где граффити-банда как раз ищет художника. Мурал рисуется здесь, оплата тоже здесь.", effects: {flag_set:ozon_wrongroad: true, eddies: 700, mood: 4}}
      fail: {text: "Дорога не туда выводит в Боевую зону. Художник рисует на ходу, пока вы уезжаете. Получается лучшая его работа, но без оплаты.", effects: {flag_set:ozon_wrongroad: true, hp: -6, mood: 2}}
    - label: Ехать по-своему
      check: {stat: REF, skill: driving, dv: 13}
      success: {text: "Ты доставляешь художника вовремя. Мурал выходит про человека, которого везут не туда, и почему-то похож на тебя.", effects: {flag_set:ozon_wrongroad: true, eddies: 400, fame: 1}}
      fail: {text: "Ты тоже едешь не туда. В Найт-Сити все дороги ведут не туда, если ехать достаточно долго.", effects: {flag_set:ozon_wrongroad: true, mood: -2}}

# ======================================================================== «Ежлесово»

- id: ozon_ezhlesovo
  title: Ежлесово
  category: rare
  weight: 2
  conditions:
    flags_none: [ozon_ezh]
  text: "В Пустошах есть посёлок Ежлесово. Сегодня там будущее: дроны пасут ежей, у каждого жителя по три импланта. Завтра там снова наши дни, и жители делают вид, что так было всегда. Рассказчик, который водит туда экскурсии, сам не помнит, в каком году вы сейчас."
  choices:
    - label: Съездить на экскурсию
      effects: {flag_set:ozon_ezh: true, eddies: -150, mood: 5, skill_xp:tech: 1}
      text: "Утром ты видишь ферму ежей с дронами, вечером — ту же ферму с вилами и тачкой. Жители уверяют, что никаких дронов не было. В кармане остаётся деталь от дрона."
    - label: Торговать с обеими эпохами
      check: {stat: INT, skill: persuasion, dv: 15}
      success: {text: "Утром покупаешь ежиную ферму у будущего за бесценок, вечером продаёшь её настоящему за реальные деньги. Ежи не возражают.", effects: {flag_set:ozon_ezh: true, eddies: 1400}}
      fail: {text: "Ты путаешь, в какой эпохе платишь. Деньги из будущего не принимают ни сегодня, ни завтра.", effects: {flag_set:ozon_ezh: true, eddies: -500}}
    - label: Не ехать
      effects: {flag_set:ozon_ezh: true}
      text: "Ежлесово остаётся там, где оно есть. Или было. Или будет."

# ======================================================================== «Пожиратель грехов»

- id: ozon_sin_eater
  title: Пожиратель грехов
  category: rare
  weight: 2
  conditions:
    flags_none: [ozon_sins]
  text: "В переулке Кабуки стоит старик со столом и тарелкой хлеба. Он пожиратель грехов: съедает хлеб над человеком, и грехи переходят к нему. Берёт недорого. Очередь из корпоратов тянется за угол."
  choices:
    - label: Отдать свои грехи
      effects: {flag_set:ozon_sins: true, eddies: -400, heat: -2, humanity: 2, mood: 3}
      text: "Старик жуёт долго. Тебе становится легче, ему — заметно тяжелее. На прощание он просит больше не грешить так однообразно."
    - label: Предложить ему работу
      check: {stat: COOL, skill: persuasion, dv: 14}
      success: {text: "Ты становишься его менеджером: корпораты платят втрое, старик получает хлеб получше. Твоя доля честно на счету.", effects: {flag_set:ozon_sins: true, eddies: 1200, humanity: -1}}
      fail: {text: "Старик смотрит на тебя и откладывает хлеб: «Твои грехи я есть не буду. Они ещё растут».", effects: {flag_set:ozon_sins: true, mood: -4}}
    - label: Пройти мимо
      effects: {flag_set:ozon_sins: true}
      text: "Грехи при тебе. Своё никому не отдаёшь."

# ======================================================================== «Красный предел»

- id: ozon_red_limit
  title: Красный предел
  category: street
  weight: 2
  conditions:
    flags_none: [ozon_redline]
  text: "Подпольная гонка «Красный предел»: стрелка тахометра в красной зоне весь заезд, кто сбросит газ — проиграл. Взнос двести эдди, приз — касса и уважение. Ведущий объявляет цены, которые по ходу его же речи растут вдвое."
  choices:
    - label: Участвовать
      check: {stat: REF, skill: driving, dv: 15}
      success: {text: "Двигатель воет, ты нет. На финише от машины пахнет горелым, от толпы — восторгом. Касса твоя, хотя ведущий успел трижды пересчитать её в разных валютах.", effects: {flag_set:ozon_redline: true, eddies: 1600, street_cred: 2}}
      fail: {text: "На третьем круге двигатель решает, что с него хватит. Ты выходишь из дыма под аплодисменты. Взнос не возвращают.", effects: {flag_set:ozon_redline: true, eddies: -200, hp: -5}}
    - label: Поставить на фаворита
      check: {stat: LUCK, dv: 13}
      success: {text: "Фаворит доезжает. Букмекер платит, морщась.", effects: {flag_set:ozon_redline: true, eddies: 500}}
      fail: {text: "Фаворит сбрасывает газ за сто метров до финиша. Говорят, увидел гаишника из 2013 года.", effects: {flag_set:ozon_redline: true, eddies: -300}}
    - label: Смотреть со стороны
      effects: {flag_set:ozon_redline: true, mood: 3}
      text: "Красные огни, рёв, запах резины. Лучший бесплатный вечер месяца."

# ======================================================================== «Ранчо Бо»

- id: ozon_ranch_bo
  title: Ранчо Бо
  category: work
  weight: 2
  conditions:
    flags_none: [ozon_ranch]
  text: "Старик Бо держит ранчо в Пустошах: синтетические коровы, ветряк, ружьё на стене. Банда кочевников хочет его землю, наследники Бо хотят его деньги, а сам Бо хочет, чтобы кто-нибудь помог пережить сезон."
  choices:
    - label: Поработать на ранчо
      check: {stat: BODY, skill: tech, dv: 13}
      success: {text: "Сезон пережит: ветряк крутится, коровы целы, кочевники уважительно объезжают ограду. Бо платит и обещает вписать тебя в завещание. Наверное, шутит.", effects: {flag_set:ozon_ranch: true, eddies: 1100, hp: 3, mood: 3}}
      fail: {text: "Синтетическая корова лягается как настоящая. Бо смеётся до кашля и всё равно платит, но меньше.", effects: {flag_set:ozon_ranch: true, eddies: 400, hp: -6}}
    - label: Договориться с кочевниками
      check: {stat: COOL, skill: persuasion, dv: 15}
      success: {text: "Кочевники получают право водопоя, Бо — покой. Обе стороны шлют тебе благодарности. Кочевники — ещё и запчасти.", effects: {flag_set:ozon_ranch: true, eddies: 800, street_cred: 1}}
      fail: {text: "Переговоры заканчиваются тем, что кочевники угоняют твою машину на час. Возвращают с полным баком: так у них принято извиняться.", effects: {flag_set:ozon_ranch: true, mood: -3}}
    - label: Помочь наследникам
      effects: {flag_set:ozon_ranch: true, eddies: 1500, humanity: -3}
      text: "Ты подписываешь бумагу о том, что Бо не в себе. Наследники платят щедро. Бо смотрит, как ты уезжаешь, и не снимает ружьё со стены. Это хуже."

# ======================================================================== «Приключение Каблучедисона»

- id: ozon_kabluchedison
  title: Каблучедисон
  category: implants
  weight: 2
  conditions:
    flags_none: [ozon_kabl]
  text: "Изобретатель по прозвищу Каблучедисон собрал реактивные каблуки: два импланта в пятки и кнопка на запястье. Ищет тестировщика. Обещает славу, проценты с продаж и, возможно, умение летать."
  choices:
    - label: Испытать каблуки
      check: {stat: REF, dv: 15}
