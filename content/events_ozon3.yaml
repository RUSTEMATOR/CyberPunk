# Story chains after the audiobooks of Ozon671Games, batch 3 (owner request: more quests from the books).
# «Тихий Ден III» (Дэн и отец), «Карамель» (дело о сахаре), «Холод 2» (Оттава), «Ежлесово 2» (автор забыл, где всё было),
# «Пространство темноты» / «Невиданные» (лавкрафтовский ужас за Чёрным заслоном). No sex scenes.
# A first step is a random event once per life; the next steps are forced_only and come with the next month.

# ======================================================================== «Тихий Ден III»: отец Дэна

- id: ozon_dad_1
  title: Отец Тихого Дэна
  category: money
  weight: 3
  conditions:
    flags_all: [ozon_dan]
    flags_none: [ozon_dad]
  text: "Звонит не Дэн, а его отец. Голос уже не такой уверенный: рейдеры забрали его корпорацию за одну ночь, охрана перешла на их сторону, счета заморожены. Дэн трубку не берёт. «Ты единственный номер в его телефоне, кроме моего», — говорит отец. Нужна машина и тихое место."
  choices:
    - label: Вывезти его
      check: {stat: REF, skill: driving, dv: 14}
      success: {text: "Ты вывозишь его из Корпо-Плазы в багажнике, под банками «Брепси». Отец впервые в жизни благодарит человека без визитки.", effects: {flag_set:ozon_dad: true, eddies: 1000, queue_event:ozon_dad_2: true}}
      fail: {text: "Хвост висит до самого Уотсона. Отрываетесь, но машина в дырах, а отец в истерике.", effects: {flag_set:ozon_dad: true, hp: -6, heat: 1, queue_event:ozon_dad_2: true}}
    - label: Сначала деньги
      check: {stat: COOL, skill: persuasion, dv: 13}
      success: {text: "Он переводит аванс с последнего живого счёта. Деловой подход он уважает даже сейчас.", effects: {flag_set:ozon_dad: true, eddies: 2000, queue_event:ozon_dad_2: true}}
      fail: {text: "«Мой сын был прав насчёт людей», — говорит он и всё-таки садится в машину. Бесплатно.", effects: {flag_set:ozon_dad: true, queue_event:ozon_dad_2: true}}
    - label: Отказать
      effects: {flag_set:ozon_dad: true, mood: -1}
      text: "Ты кладёшь трубку. Через неделю в новостях: бывший глава корпорации задержан на вокзале с одним чемоданом."

- id: ozon_dad_2
  title: Сейф на сороковом этаже
  category: work
  weight: 1
  forced_only: true
  text: "Отец прячется в химчистке Дэна. Дэн молча гладит рубашки и не смотрит в его сторону. В сейфе бывшего кабинета лежат документы, которые вернут корпорацию. Отец просит достать их. Дэн говорит только одно: «Определённо нет»."
  choices:
    - label: Пробраться в офис
      check: {stat: REF, skill: stealth, dv: 16}
      success: {text: "Лифт, вентиляция, сороковой этаж. Сейф открывается на день рождения Дэна. Отец об этом не знал.", effects: {skill_xp:stealth: 1, queue_event:ozon_dad_3: true}}
      fail: {text: "Охрана рейдеров ловит тебя у сейфа. Документы ты всё же уносишь, но вместе с двумя пулями в куртке и одной в боку.", effects: {hp: -12, heat: 2, queue_event:ozon_dad_3: true}}
    - label: Взломать сейф удалённо
      check: {stat: INT, skill: netrunning, dv: 16}
      success: {text: "Сеть корпорации помнит старого хозяина. Документы утекают на твой шард без единого выстрела.", effects: {skill_xp:netrunning: 1, queue_event:ozon_dad_3: true}}
      fail: {text: "Чёрный лёд рейдеров бьёт в ответ. Документы ты получаешь, а заодно и мигрень на неделю.", effects: {hp: -6, glitches: 1, queue_event:ozon_dad_3: true}}
    - label: Уговорить Дэна помочь
      check: {stat: EMP, skill: persuasion, dv: 15}
      success: {text: "Дэн долго молчит, потом снимает фартук. Уборщика в здании никто не замечает. Через час он возвращается с папкой и пятном на рукаве.", effects: {humanity: 1, mood: 3, queue_event:ozon_dad_3: true}}
      fail: {text: "Дэн уходит в подсобку и закрывает дверь. Приходится идти самому, наспех и громко.", effects: {heat: 2, hp: -5, queue_event:ozon_dad_3: true}}

- id: ozon_dad_3
  title: Крыша
  category: street
  weight: 1
  forced_only: true
  text: "Встреча на крыше мегабашни. Отец ждёт документы. Рейдеры, оказывается, тоже ждут: им сказали, где встреча. Дэн стоит у края, между ними. Папка у тебя. Решать сейчас."
  choices:
    - label: Отдать документы отцу
      effects: {eddies: 5000, status: 2}
      text: "Отец получает корпорацию обратно к утру. Тебе переводят премию и приглашают на совет директоров в качестве гостя. Дэн уходит, не попрощавшись."
    - label: Продать документы рейдерам
      effects: {eddies: 9000, humanity: -3, street_cred: 1}
      text: "Рейдеры платят щедро и быстро. Отец остаётся на крыше один. Дэн смотрит на тебя так, как смотрел на начальника смены."
    - label: Отдать папку Дэну
      effects: {humanity: 3, mood: 6, fame: 1}
      text: "Дэн берёт папку, смотрит на отца, на рейдеров, на город внизу. Потом рвёт её и пускает листы по ветру. «Опа, нормально», — говорит он. Рейдерам нечего забирать, отцу нечего возвращать. Впервые в жизни Дэн улыбается."

# ======================================================================== «Карамель»: дело о сахаре

- id: ozon_caramel_case_1
  title: Дело о сахаре
  category: ncpd
  weight: 3
  conditions:
    flags_all: [ozon_caramel]
    flags_none: [ozon_sugar]
  text: "Детектив Карамель снова здесь, в мятом плаще и в образе. Новое дело: кто-то по ночам опустошает торговые автоматы района, но забирает только сахар. Деньги и банки «Брепси» не трогает. «Мне нужен напарник, — говорит Карамель. — Ассистент. Слушатель моих монологов»."
  choices:
    - label: Стать напарником
      effects: {flag_set:ozon_sugar: true, queue_event:ozon_caramel_case_2: true}
      text: "Карамель выдаёт тебе блокнот и шляпу на размер больше. Расследование начинается с того, что вы три часа сидите в баре и ничего не расследуете."
    - label: Предложить свою цену
      check: {stat: COOL, skill: persuasion, dv: 12}
      success: {text: "Карамель платит аванс сахарными кубиками. Потом, со вздохом, деньгами.", effects: {flag_set:ozon_sugar: true, eddies: 400, queue_event:ozon_caramel_case_2: true}}
      fail: {text: "Карамель долго смотрит в окно: «Цена правды всегда выше, чем кажется». И не платит.", effects: {flag_set:ozon_sugar: true, queue_event:ozon_caramel_case_2: true}}
    - label: Отказаться
      effects: {flag_set:ozon_sugar: true}
      text: "Карамель уходит в дождь. Дело о сахаре так и остаётся нераскрытым, как и почти все дела Карамель."

- id: ozon_caramel_case_2
  title: Засада у автомата
  category: ncpd
  weight: 1
  forced_only: true
  text: "Ночь, дождь, автомат на углу. Карамель произносит монолог о природе сладкого уже сорок минут. Расследование стоит на месте. Вдруг к автомату подходит фигура в капюшоне с кибер-рукой и аккуратно вынимает весь сахар."
  choices:
    - label: Проследить
      check: {stat: REF, skill: stealth, dv: 14}
      success: {text: "Фигура приводит вас к подвалу кондитерской. Карамель записывает в блокнот: «Ниточка». Расследование впервые сдвигается.", effects: {skill_xp:stealth: 1, queue_event:ozon_caramel_case_3: true}}
      fail: {text: "Ты наступаешь в лужу громче, чем хотелось бы. Фигура исчезает. Карамель произносит монолог о шуме. Ещё сорок минут.", effects: {mood: -3, queue_event:ozon_caramel_case_3: true}}
    - label: Взять с поличным
      violent: true
      check: {stat: BODY, skill: melee, dv: 14}
      success: {text: "Подсечка, захват, капюшон слетает. Под ним — человек, которого Карамель явно знает. Карамель бледнеет.", effects: {street_cred: 1, queue_event:ozon_caramel_case_3: true}}
      fail: {text: "Кибер-рука оказывается сильнее. Ты на асфальте, фигура уходит, Карамель записывает: «Напарник упал».", effects: {hp: -7, queue_event:ozon_caramel_case_3: true}}
    - label: Проверить камеры
      check: {stat: INT, skill: netrunning, dv: 13}
      success: {text: "Камера соседнего магазина снимает лицо. Карамель смотрит на экран и долго молчит, что на неё не похоже.", effects: {skill_xp:netrunning: 1, queue_event:ozon_caramel_case_3: true}}
      fail: {text: "На всех записях только дождь и Карамель, говорящая в камеру. Видимо, монолог.", effects: {queue_event:ozon_caramel_case_3: true}}

- id: ozon_caramel_case_3
  title: Развязка в кондитерской
  category: ncpd
  weight: 1
  forced_only: true
  text: "В подвале кондитерской «Карамель» — да, она так и называется — склад сахара под потолок. Хозяйка, бывшая напарница детектива, варит леденцы для детского приюта: город поднял цены на сахар втрое за неделю. Карамель снимает шляпу. Решение, по традиции, за тобой."
  choices:
    - label: Закрыть дело тихо
      effects: {humanity: 2, mood: 5, eddies: 300}
      text: "Карамель пишет в отчёте: «Виновный не установлен». Хозяйка кондитерской вручает вам по пакету леденцов и немного денег. Лучший гонорар в карьере Карамель."
    - label: Сдать хозяйку владельцам автоматов
      effects: {eddies: 1800, humanity: -2, street_cred: -1}
      text: "Компания платит премию. Кондитерскую закрывают. Карамель уходит в дождь без монолога, и это страшнее любого монолога."
    - label: Помочь продавать леденцы
      check: {stat: COOL, skill: persuasion, dv: 14}
      success: {text: "Леденцы «Сахарное дело» расходятся по району за неделю. Хозяйка покупает сахар уже честно, приют сыт, тебе процент.", effects: {eddies: 1200, fame: 1}}
      fail: {text: "Леденцы со вкусом «Брепси» не продаются. Город ещё не готов.", effects: {eddies: -300, mood: -2}}

# ======================================================================== «Холод 2»: Оттава

- id: ozon_cold_ottawa_1
  title: Холод. Оттава
  category: work
  weight: 2
  conditions:
    flags_all: [ozon_cold]
    flags_none: [ozon_ottawa]
  text: "Знакомый инженер с северной вахты передаёт привет из Оттавы: город теперь американский, а дальнобойщик, у которого жена и трое детей, ищет напарника на зимний контракт. «Холод тебя запомнил, — пишет инженер. — Значит, и ты его»."
  choices:
    - label: Поехать напарником
      effects: {flag_set:ozon_ottawa: true, queue_event:ozon_cold_ottawa_2: true}
      text: "Две тысячи километров на север. Дальнобойщик много молчит, много курит и показывает фотографии детей на каждой заправке."
    - label: Не ехать
      effects: {flag_set:ozon_ottawa: true}
      text: "Ты отвечаешь, что в Найт-Сити и так холодно. Не по погоде."

- id: ozon_cold_ottawa_2
  title: Пост на границе
  category: street
  weight: 1
  forced_only: true
  text: "Пост на бывшей границе. Новые американские пограничники проверяют фуру по второму кругу и намекают, что третий круг можно пропустить за определённую сумму. Метель усиливается, у дальнобойщика кончаются лекарства для дочери, которые он везёт домой."
  choices:
    - label: Заплатить
      effects: {eddies: -500, humanity: 1, mood: 2}
      text: "Шлагбаум поднимается. До дома дальнобойщика вы доезжаете к утру. Дочь спит, лекарства на столе, вас кормят супом."
    - label: Объехать через лёд
      check: {stat: REF, skill: driving, dv: 16}
      success: {text: "Озеро трещит, но держит. Вы выходите на трассу за постом. Дальнобойщик впервые смеётся и отдаёт тебе свою долю за рейс.", effects: {eddies: 2200, street_cred: 2}}
      fail: {text: "Лёд держит фуру, но не держит тебя: ты по пояс в воде. Дальнобойщик вытаскивает, отогревает, довозит. Ты чихаешь до весны.", effects: {hp: -10, eddies: 800}}
    - label: Заговорить пограничникам зубы
      check: {stat: COOL, skill: persuasion, dv: 15}
      success: {text: "Через десять минут пограничники угощают вас кофе и машут вслед. Они тоже, оказывается, мёрзнут.", effects: {eddies: 1500, fame: 1}}
      fail: {text: "Пограничники отправляют фуру на полный досмотр. Сутки в метели, лекарства доезжают в последний момент.", effects: {mood: -5, eddies: 600}}

# ======================================================================== «Ежлесово 2»

- id: ozon_ezh2_1
  title: Ежлесово снова здесь
  category: rare
  weight: 2
  conditions:
    flags_all: [ozon_ezh]
    flags_none: [ozon_ezh2]
  text: "Экскурсовод из Ежлесово звонит в панике: посёлок проснулся в наших днях и забыл, что вчера был в будущем. Дроны-пастухи стоят в сараях, ежи разбежались по Пустошам, а жители уверяют, что никакого будущего не было. Нужен свидетель, который помнит, как всё было."
  choices:
    - label: Приехать и вспомнить
      effects: {flag_set:ozon_ezh2: true, queue_event:ozon_ezh2_2: true}
      text: "В Ежлесово всё как ты помнишь, только наоборот. Староста смотрит на тебя с подозрением: «А вы, извините, из какого года?»"
    - label: Отказаться
      effects: {flag_set:ozon_ezh2: true}
      text: "Через неделю по Пустошам ходят слухи о ежах в светящихся ошейниках. Кто-то же должен их собрать. Не ты."

- id: ozon_ezh2_2
  title: Ежиный исход
  category: rare
  weight: 1
  forced_only: true
  text: "Ежи с дронами в ошейниках ушли к трассе. Кочевники уже ловят их на продажу. Староста просит вернуть ежей, кочевники предлагают долю, а один дрон-пастух, кажется, всё ещё работает и слушается того, кто помнит будущее."
  choices:
    - label: Включить дрон-пастух
      check: {stat: TECH, skill: tech, dv: 14}
      success: {text: "Дрон поднимается, мигает и ведёт стадо ежей домой. Ежлесово празднует, староста признаёт, что будущее, возможно, было. Тебе дарят ежа.", effects: {mood: 6, fame: 1, eddies: 600}}
      fail: {text: "Дрон уводит ежей в будущее. Буквально: ни ежей, ни дрона. Староста говорит, что так и было.", effects: {mood: -3}}
    - label: Договориться с кочевниками
      check: {stat: COOL, skill: persuasion, dv: 14}
      success: {text: "Кочевники отдают ежей за ящик «Брепси» и обещание, что Ежлесово продаст им ежей из будущего. Когда оно снова наступит.", effects: {eddies: 400, street_cred: 1}}
      fail: {text: "Кочевники смеются и уезжают с ежами. Один ёж всё-таки остаётся у тебя в кармане.", effects: {mood: 1}}
    - label: Продать ежей самим
      effects: {eddies: 1500, humanity: -2}
      text: "Ежи из будущего хорошо идут на рынке Кабуки. Ежлесово больше не звонит. Возможно, его снова нет."

# ======================================================================== «Пространство темноты» / «Невиданные»

- id: ozon_dark_space_1
  title: Пространство темноты
  category: rare
  weight: 2
  conditions:
    flags_none: [ozon_dark]
  text: "На чёрном рынке продают шард с надписью «Невиданные». Продавец клянётся, что внутри запись нетраннера, который заглянул за Чёрный заслон и вернулся. Частично. Цена смешная, продавец очень хочет от шарда избавиться."
  choices:
    - label: Купить и подключить
      effects: {flag_set:ozon_dark: true, eddies: -200, queue_event:ozon_dark_space_2: true}
      text: "Шард тёплый, хотя должен быть холодным. Первая минута записи — тишина. Вторая — чей-то голос, повторяющий твоё имя."
    - label: Купить и перепродать
      check: {stat: COOL, skill: persuasion, dv: 13}
      success: {text: "Коллекционер в Японтауне платит вдесятеро и просит больше никогда не звонить.", effects: {flag_set:ozon_dark: true, eddies: 1500}}
      fail: {text: "Покупателей нет. Шард лежит у тебя в кармане. Тёплый.", effects: {flag_set:ozon_dark: true, eddies: -200, queue_event:ozon_dark_space_2: true}}
    - label: Пройти мимо
      effects: {flag_set:ozon_dark: true}
      text: "Через неделю продавца находят в его ларьке. Живым. Он смотрит в одну точку и улыбается."

- id: ozon_dark_space_2
  title: То, что смотрит в ответ
  category: rare
  weight: 1
  forced_only: true
  text: "Запись с шарда снится каждую ночь. Там тёмное пространство, где нет пола, и что-то очень большое, что медленно поворачивается к тебе. На третью ночь оно поворачивается до конца. Импланты гудят даже выключенными."
  choices:
    - label: Нырнуть в запись глубже
      check: {stat: INT, skill: netrunning, dv: 17}
      success: {text: "Ты проходишь запись до конца и находишь в ней кусок кода, который не писал человек. Корпорации за такое платят. Сны прекращаются. Почти.", effects: {eddies: 5000, skill_xp:netrunning: 2, humanity: -2}}
      fail: {text: "Ты приходишь в себя на полу через двое суток. В записи стало на один голос больше. Твой.", effects: {hp: -10, humanity: -4, glitches: 2, mood: -8}}
    - label: Сжечь шард
      check: {stat: COOL, dv: 14}
      success: {text: "Шард плавится в банке из-под «Брепси». Сны уходят. Иногда в темноте ещё что-то поворачивается, но уже далеко.", effects: {humanity: 2, mood: 4}}
      fail: {text: "Шард не горит. Он остывает, а утром снова лежит тёплый у тебя в кармане, хотя туда его никто не клал.", effects: {mood: -6, glitches: 1}}
    - label: Отнести к рипперу
      effects: {eddies: -800, humanity: 1, hp: 4}
      text: "Риппер чистит нейропорты и молча кладёт шард в свинцовую коробку. Денег берёт вдвое больше обычного и просит не говорить, откуда шард."
