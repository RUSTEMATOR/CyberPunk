# Path and era events: non-combat path (career, business, stage, media), chrome-free path
# (monastery, preacher, contempt, recruitment) and era events (early chrome, Fourth Corporate War).
# Schema: app/content/schemas.py (Event). Keys: docs/CONTENT_KEYS.md.
# Chrome-free events use requires: [chrome_free] (flag stays false for the rest of the life once any implant was installed)
# (docs/QUESTIONS.md, M1.7d).

# ---------------------------------------------------------------- non-combat path

- id: corpo_report_review
  title: Ревизия в отделе
  category: work
  weight: 2
  conditions:
    careers: [corpo]
  text: "Старший менеджер вызывает тебя в переговорку без окон. На столе отчёт, который ты подписал не читая, и цифры в нём не сходятся. Он ждёт объяснений."
  choices:
    - label: Объяснить цифры
      bus: [work_hard:career=corpo]
      check: {stat: COOL, skill: persuasion, dv: 13}
      success: {text: "Ты называешь двух человек с верхнего этажа, и менеджер переписывает ответственность на них. Наверху запоминают, кто умеет держать удар.", effects: {status: 3, mood: 2}}
      fail: {text: "Объяснение звучит как оправдание. Менеджер записывает твою фамилию и назначает испытательный срок.", effects: {status: -2}}
    - label: Взять вину
      effects:
        status: -1
        later:
          - weeks: 1
            effects: {eddies: 400}
            text: "Пришла премия за отчёт, который ты взял на себя: так отдел благодарит за молчание."
            hint: премия за молчание
      text: "Ты подписываешь признание в личной ошибке. Менеджер кивает: через неделю отдел отблагодарит премией."
    - label: Слить прессе
      bus: [report]
      check: {stat: INT, dv: 15}
      success: {text: "Копия уходит в редакцию без твоего имени. Цифры расходятся по сети раньше, чем их успевают замять, а у тебя остаётся козырь.", effects: {dirt: 2, fame: 1}}
      fail: {text: "У лифта менеджер замечает у тебя флешку. Он ничего не говорит, просто вычёркивает тебя из списков.", effects: {status: -3}}

- id: mechanic_license_test
  title: Экзамен у мастера
  category: work
  weight: 2
  conditions:
    careers: [mechanic]
  text: "Мастер автосервиса в Санто-Доминго кладёт перед тобой разобранный стартер. Соберёшь до конца смены — получишь карточку с печатью. Не соберёшь — будешь мести пол."
  choices:
    - label: Собрать стартер
      bus: [craft, work_hard:career=mechanic]
      check: {stat: TECH, skill: tech, dv: 13}
      success: {text: "Стартер заводится с первого раза. Мастер ставит печать и говорит, что с такими руками объяснять ничего не нужно.", effects: {status: 2, "skill_xp:tech": 2}}
      fail: {text: "Пружина улетает под верстак, и всё приходится начинать заново. Мастер даёт второй шанс, но берёт полторы сотни за испорченные детали.", effects: {eddies: -150, mood: -2}}
    - label: Купить карточку
      effects: {eddies: -500, status: 1}
      text: "Мастер берёт пятьсот, ставит печать и не спрашивает, где ты учился."
    - label: Уйти
      effects: {mood: -1}
      text: "Ты кладёшь ключ на верстак и выходишь. Метла так и остаётся стоять у двери."

- id: trader_filter_lot
  title: Партия фильтров
  category: money
  weight: 2
  conditions:
    roles: [trader]
  text: "Торговец из Бэдлендса продаёт партию фильтров для дек: пятьдесят штук за полторы сотни. Сбыть их надо до конца недели, пока не подсуетились конкуренты."
  choices:
    - label: Взять партию
      bus: [deal:trade]
      check: {stat: COOL, skill: persuasion, dv: 13}
      success: {text: "Ты распродаёшь фильтры за три дня, и покупатели начинают называть твой лоток надёжным. Чистая прибыль — триста.", effects: {eddies: 300, status: 2}}
      fail: {text: "Треть фильтров оказывается бракованной, и покупатели возвращают товар. Полторы сотни потеряны.", effects: {eddies: -150, mood: -2}}
    - label: Сбить цену
      bus: [deal:trade]
      check: {stat: INT, skill: persuasion, dv: 15}
      success:
        text: "Торговец уступает партию за сотню и добавляет ящик упаковки. Он уважает тех, кто умеет считать. Теперь фильтры надо сбыть."
        effects:
          eddies: -100
          status: 1
          later:
            - weeks: 1
              chance: 0.85
              effects: {eddies: 350}
              text: "Фильтры разошлись за неделю: партия окупилась втрое с лишним."
              fail_effects: {eddies: 100}
              fail_text: "Половина фильтров оказалась бракованной. Удалось отбить только сотню."
              hint: распродажа партии фильтров
      fail: {text: "Торговец решает, что с тобой не договориться, и уходит к другому покупателю.", effects: {mood: -1}}
    - label: Пройти мимо
      effects: {mood: -1}
      text: "Ты проходишь мимо. Торговец уже зовёт следующего и ничуть не обижен."

- id: japantown_cafe_stake
  title: Доля в кафе
  category: money
  weight: 2
  conditions:
    districts: [watson]
  text: "Владелец кафе в Кабуки предлагает долю: пятьсот эдди сейчас и процент с выручки потом. Бумаги уже лежат на стойке."
  choices:
    - label: Вложиться
      bus: [deal:trade]
      effects:
        eddies: -500
        status: 2
        later:
          - weeks: 4
            chance: 0.7
            text: "Кафе в Кабуки: первая выручка по твоей доле."
            fail_text: "Кафе в Кабуки прогорело: владелец закрыл двери и не берёт трубку. Вложение пропало."
            hint: первая выручка кафе
            effects:
              eddies: 300
              later:
                - weeks: 4
                  chance: 0.9
                  text: "Кафе в Кабуки: вторая выплата по доле."
                  fail_text: "Кафе в Кабуки закрыли после проверки. Больше выплат не будет."
                  hint: вторая выплата кафе
                  effects:
                    eddies: 300
                    later:
                      - weeks: 4
                        chance: 0.9
                        text: "Кафе в Кабуки: третья выплата, доля окупилась с лихвой."
                        fail_text: "Владелец продал кафе и пропал. Третьей выплаты не будет."
                        hint: третья выплата кафе
                        effects: {eddies: 300}
      text: "Ты подписываешь бумаги и отдаёшь пятьсот. Вывеска прежняя, но в договоре теперь есть и твоё имя. Выручку делят раз в месяц, если кафе выживет."
    - label: Торговаться
      bus: [deal:trade]
      check: {stat: COOL, skill: persuasion, dv: 15}
      success:
        text: "Владелец соглашается взять триста и всё равно даёт хороший процент. Твоё имя вписывают в договор, выручку делят раз в месяц."
        effects:
          eddies: -300
          status: 3
          later:
            - weeks: 4
              chance: 0.7
              text: "Кафе в Кабуки: первая выручка по твоей доле."
              fail_text: "Кафе в Кабуки прогорело: владелец закрыл двери и не берёт трубку. Вложение пропало."
              hint: первая выручка кафе
              effects:
                eddies: 200
                later:
                  - weeks: 4
                    chance: 0.9
                    text: "Кафе в Кабуки: вторая выплата по доле."
                    fail_text: "Кафе в Кабуки закрыли после проверки. Больше выплат не будет."
                    hint: вторая выплата кафе
                    effects:
                      eddies: 200
                      later:
                        - weeks: 4
                          chance: 0.9
                          text: "Кафе в Кабуки: третья выплата, доля окупилась с лихвой."
                          fail_text: "Владелец продал кафе и пропал. Третьей выплаты не будет."
                          hint: третья выплата кафе
                          effects: {eddies: 200}
      fail: {text: "Владелец достаёт другой экземпляр договора, где процент ещё меньше. Ты уходишь без доли.", effects: {mood: -2}}
    - label: Отказаться
      effects: {mood: -1}
      text: "Ты кладёшь ручку на стойку. Владелец кивает: желающие найдутся."

- id: westbrook_open_mic
  title: Открытый микрофон
  category: work
  weight: 2
  conditions:
    careers: [rockerboy]
  text: "В подвальном клубе в Вестбруке открытый микрофон: выйти может любой, денег за выступление не платят. Зато зал набит до отказа."
  choices:
    - label: Выйти на сцену
      bus: [perform]
      check: {stat: EMP, skill: persuasion, dv: 13}
      success: {text: "Зал слушает, кто-то снимает тебя на телефон. Через неделю запись гуляет по лентам с твоим именем, а в шляпе набралось полторы сотни.", effects: {fame: 2, eddies: 150}}
      fail: {text: "Ты забываешь второй куплет и кое-как дотягиваешь песню. Зал свистит, и эта запись тоже уходит в сеть.", effects: {fame: -1, mood: -2}}
    - label: Оставить номер
      effects:
        fame: 1
        later:
          - weeks: 2
            chance: 0.4
            effects: {eddies: 200, fame: 1}
            text: "Ведущий открытого микрофона перезвонил: платный вечер в Вестбруке, двести эдди."
            fail_text: "Ведущий открытого микрофона так и не позвонил."
            hint: может, перезвонят из клуба
      text: "Ведущий записывает твой номер на салфетке и обещает позвонить. Может, и не позвонит, но в списке ты есть."
    - label: Пройти мимо
      effects: {mood: -1}
      text: "Ты проходишь мимо. Из-за двери слышно гитару, которая фальшивит через ноту."

- id: pacifica_photo_sale
  title: Кадр с Пасифики
  category: rare
  weight: 1
  conditions:
    careers: [media]
  text: "Ты снял в Пасифике сильный кадр: пустая улица и силуэт с ребёнком на руках у самого края. Редакция готова его напечатать, а корпорация, которой принадлежит квартал, хочет его выкупить."
  choices:
    - label: Опубликовать
      bus: [report]
      check: {stat: COOL, dv: 13}
      success: {text: "Снимок выходит с твоим именем в подписи. Редактор называет его кадром недели, и на тебя начинают ссылаться.", effects: {fame: 3, status: 1}}
      fail: {text: "Редактор переписывает подпись, и твоё имя остаётся мелким шрифтом в углу.", effects: {fame: 1}}
    - label: Продать корпо
      effects: {eddies: 400, fame: -1}
      text: "Снимок уходит в закрытый архив корпорации за четыреста. Деньги хорошие, но в лентах о тебе забывают."
    - label: Оставить себе
      effects: {mood: -1}
      text: "Ты убираешь снимок в архив. Жаль, но рисковать ты не стал."

# ---------------------------------------------------------------- chrome-free path

- id: monastery_night_watch
  title: Ночное бдение
  category: relationships
  weight: 2
  conditions:
    districts: [westbrook]
    requires: [chrome_free]
  text: "В монастыре в Вестбруке в полночь бьёт гонг. Наставник зовёт на бдение: четыре часа сидеть неподвижно, пока не разрешат встать."
  choices:
    - label: Остаться до утра
      bus: [meditate]
      check: {stat: COOL, dv: 13}
      success: {text: "Ты сидишь до рассвета, не открывая глаз. В голове становится тихо, и даже сирены звучат где-то далеко.", effects: {mood: 4, humanity: 2}}
      fail: {text: "Через час ноги затекают, и ты встаёшь под осуждающими взглядами. Наставник молча кивает на дверь.", effects: {mood: -2}}
    - label: Пожертвовать
      effects: {eddies: -200, status: 1}
      text: "Ты опускаешь двести эдди в ящик у входа. Наставник благодарит без улыбки и вписывает твоё имя в книгу."
    - label: Уйти
      effects: {mood: -1}
      text: "Ты выходишь, пока гонг ещё гудит. Снаружи шумный Вестбрук, и легче от этого не становится."

- id: preacher_commune_child
  title: Мальчик из общины
  category: relationships
  weight: 2
  conditions:
    districts: [heywood]
    requires: [chrome_free]
  text: "У водонапорной башни поёт община проповедника. Женщина в первом ряду держит мальчика, которому вчера вынули неудачный имплант. Ей негде ночевать, пока у сына не заживёт рука."
  choices:
    - label: Найти ночлег
      bus: [service]
      check: {stat: EMP, skill: persuasion, dv: 13}
      success: {text: "Ты уговариваешь хозяина ночлежки дать койку без залога. Женщина плачет от благодарности, а община начинает считать тебя своим.", effects: {status: 2, "rel_npc:friend": 2}}
      fail: {text: "Хозяин требует залог, которого у тебя нет. Ты возвращаешься ни с чем, и смотреть женщине в глаза тяжело.", effects: {mood: -3}}
    - label: Дать денег
      effects: {eddies: -150, fame: 1}
      text: "Ты кладёшь сто пятьдесят в шапку у башни. Кто-то из общины запоминает тебя и рассказывает о тебе другим."
    - label: Послушать
      effects: {mood: 1}
      text: "Ты дослушиваешь песню до конца. Слова простые, и спорить с ними не хочется, даже если не веришь."

- id: clinic_clerk_contempt
  title: Клерк из клиники
  category: work
  weight: 2
  conditions:
    districts: [city_center]
    requires: [chrome_free]
  text: "Клерк Trauma Team смотрит на твои руки без единого импланта и не скрывает презрения. Полисы, говорит, оформляют тем, кто вкладывается в своё тело."
  choices:
    - label: Требовать полис
      check: {stat: COOL, skill: persuasion, dv: 15}
      success: {text: "Клерк перестаёт ухмыляться и при всех извиняется. Очередь за твоей спиной это запоминает.", effects: {status: 1}}
      fail: {text: "Клерк отправляет тебя к частникам, и очередь за твоей спиной смеётся.", effects: {mood: -3}}
    - label: Пройти осмотр
      effects: {eddies: -200, mood: -1}
      text: "Осмотр за двести длится три минуты. Клерк пишет в карту одно слово, и ты не спрашиваешь какое."
    - label: Уйти
      effects: {mood: -2}
      text: "Ты выходишь, и за спиной слышен смешок. Не впервые, но каждый раз неприятно."

- id: watson_bar_bet_clean
  title: Пари на чистого
  category: money
  weight: 2
  conditions:
    districts: [watson]
    requires: [chrome_free]
  text: "В баре в Уотсоне спорят, что человек без хрома не выдержит пять минут в ледяной воде. Ставки открыты, и все смотрят на тебя."
  choices:
    - label: Принять пари
      check: {stat: BODY, dv: 15}
      success: {text: "Ты высиживаешь все пять минут, не дрогнув. Выигрыш твой, а бармен теперь зовёт тебя монахом.", effects: {eddies: 500, status: 1}}
      fail: {text: "Через две минуты тело перестаёт слушаться. Ты выползаешь из ванны синий, ставка проиграна, и бар смеётся тебе вслед.", effects: {eddies: -200, hp: -3}}
    - label: Поставить на другого
      effects: {eddies: -100, mood: 1}
      text: "Ты ставишь сотню на того, кто уже трясётся у стойки, и проигрываешь. Зато смотреть веселее, чем мёрзнуть самому."
    - label: Уйти
      effects: {mood: -1}
      text: "Ты уходишь, не дожидаясь ставок. Бармен кричит вслед, что чистые всегда сбегают первыми."

- id: militech_clean_contract
  title: Контракт с условием
  category: work
  weight: 1
  conditions:
    districts: [city_center]
    requires: [chrome_free]
  text: "Вербовщик Militech предлагает месяц охранять склад в Сити-центре и кладёт на стол всю плату вперёд: восемьсот. В контракте один пункт: в первую же неделю тебе поставят служебный имплант."
  choices:
    - label: Подписать
      effects: {eddies: 800, mood: -3, "vow_break:no_chrome": true, "cyberware_grant:corp_loyalty_plate": true}
      text: "Ты подписываешь контракт вместе с пунктом об импланте. Через день в груди уже сидит пластина лояльности Militech. Обет нарушен, зато восемьсот у тебя."
    - label: Торговаться
      check: {stat: COOL, skill: persuasion, dv: 17}
      success: {text: "Ты добиваешься, чтобы пункт об импланте вычеркнули. Платят меньше, но обет цел.", effects: {eddies: 500, status: 1}}
      fail: {text: "Вербовщик закрывает папку и говорит, что несговорчивых на рынке хватает. Деньги он убирает обратно.", effects: {mood: -2}}
    - label: Отказаться
      effects: {mood: -1}
      text: "Ты отказываешься. Вербовщик пожимает плечами и оставляет визитку."

