    - label: Торговаться
      check: {stat: COOL, skill: persuasion, dv: 15}
      success: {text: "За наличные клиника сбрасывает треть цены. Рука та же, а пятьсот остаются у тебя.", effects: {eddies: -1000, humanity: -6, "cyberware_grant:cyberarm_early": true}}
      fail: {text: "Администратор говорит, что для тебя цена уже выросла. Ты платишь полную, а после установки локоть ещё долго ноет.", effects: {eddies: -1500, humanity: -6, hp: -2, "cyberware_grant:cyberarm_early": true}}
    - label: Уйти
      effects: {mood: -1}
      text: "Ты выходишь на улицу. Через пару лет такие руки подешевеют вдвое, а пока придётся обходиться своими."

