              effects: {eddies: 500}
              text: "Три недели испытаний позади: Militech выплатил остаток наличными."
              fail_text: "Militech свернул программу испытаний. Остаток так и не выплатили."
              hint: остаток оплаты за испытания
      fail: {text: "Разъём встаёт криво, и висок болит два дня. Агент говорит, что так бывает, и берёт с тебя сотню за испорченный образец.", effects: {eddies: -100, humanity: -4, hp: -3}}
