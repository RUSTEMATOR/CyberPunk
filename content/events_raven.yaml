      check: {stat: COOL, skill: persuasion, dv: 15}
      success: {text: "Raven колеблется, потом показывает: заказчик — корпоративный юрист Militech. «Корпоратское дерьмо, — говорит он. — Даже убивают через юристов». С этим можно работать.", effects: {"faction_rep:militech": -3, street_cred: 1, "skill_xp:persuasion": 2}}
