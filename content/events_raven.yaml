      effects: {eddies: -3000, mood: 4, humanity: 1}
      text: "«Это стоит денег, — говорит Raven. — Не мне. Заказчику нужен возврат». Ты переводишь. Имя исчезает. Через неделю бармен наливает тебе бесплатно и не понимает, почему ты так странно смотришь."
