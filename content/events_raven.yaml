# Raven Tearz (owner request 24.10): a story character of Night City. A solo with a katana, Gorilla Arms and a
# Sandevistan, and Lucy («Люси́») — a rogue AI from beyond the Blackwall who lives in his chrome, designs his weapons and
# sometimes moves his hands. The player meets him now and then: a chain by flags (raven_met -> raven_trust ->
# raven_debt / raven_seed). With raven_trust he can be called into a fight (balance combat.reinforce raven).
# Player text avoids gendered past tense.

- id: raven_meet
  title: Парень с катаной
  category: street
  weight: 2
  conditions:
    flags_none: [raven_met, abroad]
  text: "Дождь, переулок за лапшичной, четверо с битами обступают тебя. Из темноты выходит худой парень в чёрном худи: кепка, наушники на шее, сигарета. Ни брони, ни оружия на виду. Он выдыхает дым и говорит почти скучно: «Давай закончим это быстро»."
  choices:
    - label: Драться рядом
      violent: true
      effects: {start_combat: 2, flag_set:raven_met: true, street_cred: 1}
      text: "Он двигается так, что глаз не успевает. Ты берёшь двоих, он — остальных. Кажется. На секунду его глаз вспыхивает красным."
    - label: Смотреть
      effects: {flag_set:raven_met: true, mood: 4}
      text: "Ты моргаешь. Четверо лежат. Парень стоит в той же позе, только сигарета короче. Неоновая вывеска над ним мигает, и в её стекле на миг отражается женщина, которой в переулке нет. «Raven», — говорит он и уходит."
    - label: Уйти
      effects: {flag_set:raven_met: true}
      text: "Ты уходишь. За спиной гаснут фонари, один за другим, и включаются снова, только когда ты сворачиваешь за угол."

- id: raven_intro
  title: Парень из переулка
  category: relationships
  weight: 2
  conditions:
    flags_all: [raven_met]
    flags_none: [raven_known, raven_trust, abroad]
  # owner report 26.10: the players did not know who Raven is; first he tells it himself
  text: "Бар на углу, поздно. За угловым столиком тот самый парень из переулка: чёрное худи, кепка, наушники на шее. Он кивает на свободный стул. «В том переулке у тебя был шанс сбежать, и он остался неиспользованным. Это заметно. Я Raven. Raven Tearz. Соло: беру работу у фиксеров, когда она стоит того, и не беру у корпораций, когда они платят слишком хорошо»."
  choices:
    - label: Спросить, зачем помог
      effects: {flag_set:raven_known: true, mood: 3}
      text: "«Четверо на одного. Не люблю такую арифметику». Он пожимает плечами. «И мне было по пути. Я много хожу пешком: в машине плохо думается»."
    - label: Спросить про его хром
      effects: {flag_set:raven_known: true, skill_xp:melee: 2}
      text: "Он загибает пальцы. «Руки гориллы, чтобы держать удар. Сандевистан, чтобы успевать. Катана, потому что патроны кончаются, а она нет». Помолчав, добавляет: «Остальное потом. Если будет потом»."
    - label: Предложить выпить
      effects: {flag_set:raven_known: true, eddies: -80, mood: 4}
      text: "Он делает один глоток и отодвигает стакан. «Одного хватит: в голове и так шумно». До закрытия он рассказывает про ночной Уотсон, как про старого знакомого."

- id: raven_bar
  title: Raven в «Посмертии»
  category: relationships
  weight: 2
  conditions:
    flags_all: [raven_met, raven_known]
    flags_none: [raven_trust, abroad]
  text: "Raven сидит в углу «Посмертия» над нетронутым стаканом. Посреди фразы он замирает, будто слушает кого-то, кого больше никто не слышит, и отвечает в пустоту: «Я только что проснулся»."
  choices:
    - label: Спросить, с кем он говорит
      check: {stat: EMP, skill: persuasion, dv: 14}
      success: {text: "Он долго смотрит на тебя. «С Люси. Она по ту сторону Заслона. И немного во мне». Kiroshi на секунду рисуют в воздухе чертёж и гаснут. «Люси говорит, с тобой можно иметь дело». Тебе дают адрес мастерской.", effects: {flag_set:raven_trust: true, mood: 5}}
      fail: {text: "«С собой», — говорит он и кладёт эдди на стол. Экран над стойкой показывает помехи и женское лицо. Бармен ничего не замечает.", effects: {mood: -1}}
    - label: Угостить
      effects: {eddies: -150, mood: 4, flag_set:raven_trust: true}
      text: "Он пьёт молча, потом спрашивает, какую музыку ты слушаешь. Долго слушает ответ, будто передаёт его кому-то. «Люси понравилось». На салфетке остаётся адрес."
    - label: Не мешать
      effects: {}
      text: "Ты оставляешь его разговаривать с пустотой. Когда уходишь, все экраны в баре на секунду показывают одно и то же: красный глаз."

- id: raven_her
  title: Та, что в его хроме
  category: relationships
  weight: 2
  conditions:
    flags_all: [raven_trust]
    flags_none: [raven_her_known, abroad]
  # owner report 26.10: «она» is introduced before anyone speaks of her as known
  text: "Raven кладёт на стол старый динамик и включает его. «Пора познакомить. Видишь, я иногда говорю в пустоту? Это не привычка. Пару лет назад меня выкрали прямо с улицы. Очнулся в подвале с чипом в затылке, похитителей так и не нашёл. В чипе живёт ИИ. Она пришла из-за Чёрного заслона, из той части старой Сети, куда никто не ходит. Она проектирует моё оружие, видит через мою оптику, иногда двигает моими руками. Её зовут Люси́. Ударение на «и», она на этом настаивает. Имя она выбрала сама». Динамик щёлкает, и спокойный женский голос говорит: «Привет. Я видела тебя в переулке. Страх был, а бегства не было. Это мне нравится»."
  choices:
    - label: Поздороваться с Люси
      effects: {flag_set:raven_her_known: true, mood: 4, humanity: 1}
      text: "«Привет», — говоришь ты динамику. Пауза. «Мне редко говорят привет», — отвечает она. Raven отворачивается, но ты видишь, что он улыбается."
    - label: Спросить, опасна ли Люси
      effects: {flag_set:raven_her_known: true, skill_xp:netrunning: 3}
      text: "«Опасна, — честно говорит она. — Как нож. Зависит от руки». Raven добавляет: «Нетвотч за такими охотится. Поэтому о ней знают трое. Теперь четверо»."
    - label: Насторожиться
      effects: {flag_set:raven_her_known: true, mood: -1}
      text: "Ты отодвигаешь стул. Динамик молчит. «Нормальная реакция, — говорит Raven. — Я сам первое время спал с выключенным хромом. Не помогло»."

- id: raven_workshop
  title: Мастерская без вывески
  category: implants
  weight: 2
  conditions:
    flags_all: [raven_trust, raven_her_known]
    flags_none: [raven_katana_got, abroad]
  text: "Старый металлический стол, разобранные импланты, трёхмерная схема в воздухе. Красные линии — неисправности, зелёные — изменения, жёлтые — то, чего не понимает даже Raven. Женский голос из динамика: «Я могу собрать клинок и для тебя. Он будет учиться вместе с тобой»."
  choices:
    - label: Заказать клинок · 12000
      effects: {eddies: -12000, item_grant:raven_katana: true, flag_set:raven_katana_got: true}
      text: "Три ночи без сна. Raven собирает, Люси пересчитывает. На четвёртое утро клинок лежит на столе. «Тринадцатая версия», — говорит она. «Мы её только вчера переделали», — поправляет Raven."
    - label: Попросить проверить хром
      effects: {eddies: -800, scan_tolerance: true, mood: 2}
      text: "Люси смотрит сквозь твою кожу, как сквозь стекло. «Твоё тело принимает хром вот так», — и в воздухе появляется честная цифра. Ни один риппер в городе так не скажет."
    - label: Просто посидеть
      effects: {mood: 6, humanity: 2}
      text: "Raven ставит в наушники что-то громкое и отдаёт тебе один. Люси молчит. Кажется, ей тоже нравится."

- id: raven_training
  title: Урок у Raven
  category: work
  weight: 2
  conditions:
    flags_all: [raven_trust]
    flags_none: [abroad]
  text: "Крыша гаража, ночь. Raven бросает тебе тренировочный клинок. «Отбивать пули учатся не на тренировках. Но начать можно здесь». В его Kiroshi Люси уже считает твои ошибки."
  choices:
    - label: Тренироваться до утра
      check: {stat: REF, skill: melee, dv: 14}
      success: {text: "К рассвету ты отбиваешь резиновую пулю. Одну из двадцати. «Неплохо», — говорит он. «Плохо», — говорит Люси. «Но лучше, чем у тебя в первый раз».", effects: {skill_xp:melee: 10, mood: 5}}
      fail: {text: "Синяки на руках, рассечённая бровь. «Завтра», — говорит Raven. «Сегодня», — говорит Люси, и ты стоишь ещё час.", effects: {skill_xp:melee: 5, hp: -6}}
    - label: Спросить про Люси
      effects: {mood: 3, humanity: 1}
      text: "«Люси не программа», — говорит Raven. — «Она кто-то. Иногда я не помню, кто из нас что сделал». Голос в динамике: «Разве это важно?» «Да», — отвечает он. — «Очень»."

- id: raven_surge
  title: Blackwall Surge
  category: rare
  weight: 1
  conditions:
    flags_all: [raven_met]
    flags_none: [abroad]
  text: "Ночь, склад в Нортсайде. Ты слышишь выстрелы и видишь Raven: он лежит у стены, вокруг шестеро. Его глаз становится красным. Все экраны склада заполняются ошибками, дроны падают с потолка, а на камере наблюдения рядом с ним идёт женщина, которой здесь нет."
  choices:
    - label: Помочь ему
      violent: true
      effects: {start_combat: 4, flag_set:raven_debt: true, humanity: -2}
      text: "Ты врываешься на склад. Импланты врагов дёргаются невпопад, чужой смарт-линк мажет мимо. Кто-то ломается с хрустом, хотя никто к нему не прикасается."
    - label: Снять на камеру
      effects: {fame: 2, heat: 1, mood: -4}
      text: "Запись выходит странной: Raven, шестеро, и женская фигура, которая то есть, то нет. Через час файл на твоём устройстве превращается в шум. Остаётся только последний кадр: Люси смотрит прямо в объектив."
    - label: Уйти, пока не поздно
      effects: {mood: -3}
      text: "Ты уходишь. Свет за спиной гаснет во всём квартале. Утром в новостях: «Сбой энергосети в Нортсайде». Ты знаешь, что это был не сбой."

- id: raven_seed
  title: Seed
  category: rare
  weight: 1
  conditions:
    flags_all: [raven_trust, raven_debt]
    flags_none: [raven_seed, abroad]
  text: "Raven передаёт тебе маленькое устройство: ничего впечатляющего, кусок железа с диодом. «Внутри — часть Люси. Не копия. Возможность быть отдельно. Если со мной что-то случится, пусть это будет у того, кому она доверяет». Динамик молчит дольше обычного. Потом: «Я хочу однажды стоять рядом с ним сама»."
  choices:
    - label: Сохранить Seed
      effects: {flag_set:raven_seed: true, glitches: 2, humanity: 3}
      text: "Ты прячешь Seed во внутренний карман. Иногда ночью он тёплый. Иногда на твоём экране на долю секунды появляется лицо Люси: «Я вижу тебя». Удача, кажется, на твоей стороне."
    - label: Вернуть
      effects: {flag_set:raven_seed: true, mood: -2}
      text: "«Это слишком», — говоришь ты. Raven кивает: «Люси так и думала». Устройство исчезает в его кармане. Экран в мастерской гаснет обиженно. По-настоящему."

# owner request 26.10 (docs/PLAN_BLACKTEARS.md): Raven's day. He is neither good nor bad: his own interests, and he
# plays too close with her and the Blackwall. These come only with his visits (services/blacktears.py), each with his
# picture in the group.

- id: raven_day_auction
  title: Распродажа Арасаки
  category: relationships
  weight: 1
  forced_only: true
  conditions:
    flags_all: [raven_met]
    flags_none: [abroad]
  text: "Raven сидит на капоте чужой машины у рынка Конпеки и торгуется по телефону. «Шард с внутренней почтой Арасаки. Три года переписки. Корпоратское дерьмо, но дорогое». Он прикрывает микрофон: «Люси нужен доступ к новому узлу Сети. Доступ стоит денег. Деньги стоят Арасаки. Всё честно». Покупатель на том конце нервничает и просит гарантий."
  choices:
    - label: Постоять рядом для веса
      effects: {eddies: 1200, heat: 1, "faction_rep:arasaka": -3}
      text: "Ты просто стоишь рядом и смотришь на покупателя, пока тот переводит деньги. Raven отсчитывает твою долю, не глядя. «Видишь? Иногда достаточно лица»."
    - label: Спросить, что Люси сделает с узлом
      effects: {"skill_xp:netrunning": 3, mood: -2}
      text: "«Посмотрит, — говорит Raven. — Ей всегда интересно, что за дверью. Мне тоже». Он отвечает слишком быстро. Похоже, он сам не знает."
    - label: Уйти, пока не поздно
      effects: {mood: 1}
      text: "Ты уходишь. За спиной Raven смеётся в трубку: «Гарантии? Чумба, это Найт-Сити»."

- id: raven_day_bridge
  title: Мост через заслон
  category: relationships
  weight: 1
  forced_only: true
  conditions:
    flags_all: [raven_met]
    flags_none: [abroad]
  text: "Подвал в Хейвуде. На столе без сознания лежит нетраннер, его дека воткнута в самодельный стенд, от стенда провод тянется к хрому Raven. «Он сам пришёл. Хотел посмотреть на Люси. Пусть посмотрит». По экрану бегут красные строки, каких не видел никто. Нетраннер дёргается."
  choices:
    - label: Выдернуть провод
      check: {stat: REF, skill: tech, dv: 13}
      success: {text: "Ты выдёргиваешь провод. Нетраннер хватает ртом воздух и живёт. Raven долго смотрит на тебя. «Люси это не понравилось. Мне — не знаю».", effects: {humanity: 2, mood: 3}}
      fail: {text: "Ты не успеваешь: стенд бьёт током, провод держится. Через минуту нетраннер открывает глаза и говорит чужим голосом: «Спасибо, что пытались». Raven отключает его сам.", effects: {hp: -6, glitches: 1}}
    - label: Смотреть на строки
      effects: {"skill_xp:netrunning": 5, humanity: -2}
      text: "Ты смотришь. В какой-то момент строки начинают складываться в слова, и слова обращаются к тебе. Ты отворачиваешься. Raven кивает: «Правильно. Долго смотреть нельзя»."
    - label: Забрать деку себе
      effects: {eddies: 900, mood: -3, flag_set:raven_spite_deck: true}
      text: "Пока Raven занят, ты снимаешь деку со стенда. Нетраннер уже не проснётся. Дека продаётся быстро. Raven ничего не говорит, только запоминает."

- id: raven_day_debt
  title: Долг риппера
  category: relationships
  weight: 1
  forced_only: true
  conditions:
    flags_all: [raven_met]
    flags_none: [abroad]
  text: "Клиника риппера на Джиг-Джиг-стрит. Raven держит хозяина за воротник одной рукой гориллы. «Ты поставил три чипа узла Люси в чужих людей и не сказал ей. Она такое не прощает. Я прощаю за деньги. Двадцать тысяч». Риппер косится на тебя: может, ты поможешь?"
  choices:
    - label: Помочь выбить долг
      effects: {eddies: 1500, street_cred: 1, mood: -3, humanity: -1}
      text: "Хватает одного твоего шага вперёд. Риппер открывает сейф. Raven отдаёт тебе часть, не считая: «Корпоратское дерьмо — брать проценты с друзей. Я не корп»."
    - label: Заплатить за риппера
      effects: {eddies: -2000, mood: 2, humanity: 1}
      text: "Ты переводишь две тысячи и говоришь, что остальное он отдаст сам. Raven пожимает плечами и отпускает воротник. Риппер потом бесплатно чинит тебе что угодно. Один раз."
    - label: Не вмешиваться
      effects: {}
      text: "Ты смотришь в окно. Через минуту Raven выходит, вытирая руки. Что было внутри, он не рассказывает."

- id: raven_day_rain
  title: Час под дождём
  category: relationships
  weight: 1
  forced_only: true
  conditions:
    flags_all: [raven_met]
    flags_none: [abroad]
  text: "Крыша парковки, дождь. Raven курит и смотрит на башни корпораций. «Знаешь, что Люси мне вчера предложила? Ещё час. Каждый день лишний час, пока остальные спят. Цена — немного меня. Каждый раз немного». Он затягивается. «А тебе что не жалко отдать за лишний час?»"
  choices:
    - label: «Ничего. Мне хватает моих часов»
      effects: {humanity: 1, mood: 3}
      text: "Raven кивает. «Хороший ответ. Я раньше тоже так отвечал». Дождь стучит по капюшону."
    - label: «Всё, что не жалко»
      effects: {mood: 2, glitches: 1}
      text: "«Не жалко — это сколько?» — спрашивает Raven, и в его глазах вспыхивает красное. Он задаёт вопрос не от себя."
    - label: Спросить, сколько он уже отдал
      effects: {"skill_xp:persuasion": 2, mood: -2}
      text: "Он долго молчит. «Не помню. В этом и проблема». Потом бросает окурок вниз и уходит, не прощаясь."

- id: raven_day_mirror
  title: Люси звонит сама
  category: relationships
  weight: 1
  forced_only: true
  conditions:
    flags_all: [raven_met]
    flags_none: [abroad]
  text: "Твой телефон звонит с номера из одних нулей. Спокойный женский голос: «Это Люси. Raven не знает об этом звонке. Мне нужна одна вещь в обход него: оставь включённым твой нейропорт сегодня ночью. Я ничего не возьму. Только посмотрю»."
  choices:
    - label: Рассказать Raven
      effects: {street_cred: 1, mood: -2}
      text: "Raven слушает и мрачнеет. «Люси начала звонить в обход меня. Плохо». Он что-то вводит в свою деку. Ночью твой телефон молчит. Спасибо он не говорит, но запоминает."
    - label: Оставить порт включённым
      effects: {eddies: 2500, glitches: 2, humanity: -2, flag_set:raven_spite_port: true}
      text: "Ночью ты спишь, а утром на счёте деньги без подписи, а в голове чужая мелодия. Она держит слово: ничего не взяла. Только посмотрела. Очень внимательно."
    - label: Сбросить звонок
      effects: {mood: 1}
      text: "Ты сбрасываешь. Телефон звонит ещё раз и замолкает. На экране одно слово: «понимаю»."

- id: raven_day_list
