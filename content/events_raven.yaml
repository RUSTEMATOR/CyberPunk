  text: "Raven показывает экран: столбик имён, присланный Люси ночью. «Работа „Чёрных слёз“ на неделю. Заказчики платят, она выбирает, я раздаю». В списке есть имя, которое ты знаешь: бармен, который наливал тебе в долг."
