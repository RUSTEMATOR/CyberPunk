  weight: 3
  conditions: {districts: [tokyo_shinjuku, tokyo_adachi]}
  text: "В последнем поезде метро клерк спит стоя, держась за поручень. Его телефон звонит: начальник. Восьмидесятый час работы на неделе. Таких в Токио называют кандидатами на кароси."
  choices:
    - label: Разбудить и отвести домой
      effects: {humanity: 2, mood: 1}
      text: "Он кланяется тебе девять раз и плачет на десятом. Завтра он снова пойдёт на работу."
