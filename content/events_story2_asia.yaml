# Chapter 2 of the stories of Asia (owner request 30.10: «загугли лор стран мира Cyberpunk и раскрась наши государства»,
# docs/PLAN_WORLD2.md phase 3): steps 5-8 continue chapter 1 and weave in the big lore of the country, then three local
# events of each city (drawn at random in its districts). Gender-neutral text.

# ======================================================================== Japan: Saburo's inheritance

- id: jp_story_5
  title: Смерть Сабуро
  category: rare
  weight: 1
  forced_only: true
  text: "Все экраны Синдзюку чернеют одновременно. Сабуро Арасака, сто пятьдесят восемь лет, глава самой могущественной корпорации мира, мёртв. Каори Ито звонит в три ночи: «Клан Курогава сорок лет брал деньги «Арасаки». Теперь у «Арасаки» два наследника, и каждый спрашивает клан: ты с кем?»"
  choices:
    - label: Прийти к Каори
      effects: {flag_set:jp_st2_in: true, street_cred: 1}
      text: "Каори наливает чай и раскладывает на столе две фотографии: Ханако, лицо корпорации, и Ёринобу, сын-бунтарь, вернувшийся из Найт-Сити."
    - label: Держаться подальше
      effects: {mood: -1, flag_set:jp_st2_in: true}
      text: "Ты выключаешь телефон. Утром у твоей двери стоят двое в чёрных костюмах. Подальше не получится."

- id: jp_story_6
  title: Киото без хрома
  category: work
  weight: 1
  forced_only: true
  foe: Агент «Арасаки»
  foe_faction: arasaka
  text: "Оябун Курогава просит отвезти письмо в Киото, старому мастеру чайной церемонии. Почти половина Киото живёт без имплантов, и человека с хромом там видно за километр. Письмо написано кистью: его нельзя взломать, только прочитать."
  choices:
    - label: Ехать открыто на синкансэне
      check: {stat: COOL, skill: persuasion, dv: 15}
      success: {text: "Ты кланяешься контролёрам, пьёшь чай в вагоне и выходишь в Киото незамеченным. Мастер читает письмо и долго молчит.", effects: {flag_set:jp_st2_letter: true, humanity: 2}}
      fail: {text: "На вокзале Киото тебя встречают люди «Арасаки». Письмо ты спасаешь, но рёбра — нет.", effects: {flag_set:jp_st2_letter: true, hp: -12}}
    - label: Пробиваться силой
      violent: true
      effects: {start_combat: 4, flag_set:jp_st2_letter: true, enmity: 1}
      text: "У храма Кинкаку-дзи тебя ждут. Золотой павильон отражается в пруду, и в пруду же отражаются вспышки выстрелов."

- id: jp_story_7
  title: Радужный мост
  category: street
  weight: 1
  forced_only: true
  foe: Байкер «Красного грома»
  foe_faction: jp_bosozoku
  text: "Ответ мастера — данные на чипе, и их надо доставить в Синдзюку до рассвета. «Красный гром» держит Радужный мост. Их вожак смеётся: «Хочешь проехать — обгони нас. Не обгонишь — останешься под мостом»."
  choices:
    - label: Гонка по мосту
      check: {stat: REF, skill: driving, dv: 16}
      success: {text: "Неон, вой моторов, флаги на ветру. Ты финишируешь первым. Вожак босодзоку снимает шлем и кланяется.", effects: {flag_set:jp_st2_chip: true, street_cred: 3}}
      fail: {text: "Тебя таранят на повороте. Чип цел, байк — нет, колено — тоже нет.", effects: {flag_set:jp_st2_chip: true, hp: -14}}
    - label: Драка на мосту
      violent: true
      effects: {start_combat: 3, flag_set:jp_st2_chip: true}
      text: "Биты и цепи против всего, что у тебя есть. Внизу течёт Сумида."

- id: jp_story_8
  title: Чья Япония
  category: rare
  weight: 1
  forced_only: true
  text: "В чипе — доказательство: смерть Сабуро была не естественной. Его убили в собственных покоях. Каори, оябун и старый мастер ждут, что ты сделаешь. Кому отдашь правду, тот и получит империю."
  choices:
    - label: Отдать Ханако
      effects: {eddies: 40000, status: 2, humanity: -3, fame: 2}
      text: "Ханако Арасака принимает чип из твоих рук и благодарит лично. Корпорация остаётся единой. Клан Курогава получает подряды на десять лет вперёд."
    - label: Отдать Ёринобу
      effects: {eddies: 25000, street_cred: 4, enmity: 1, fame: 3}
      text: "Ёринобу смеётся: «Отец любил порядок. Посмотрим, как он полюбит хаос». В Токио начинается тихая война корпоративных фракций."
    - label: Выложить в сеть для всех
      effects: {humanity: 5, fame: 6, heat: 3, enmity: 2}
      text: "Через час правду о смерти Сабуро читает вся планета. Акции «Арасаки» падают на треть. Старый мастер в Киото наливает тебе чай и впервые улыбается."

# ======================================================================== Hong Kong: the old plague

- id: hk_story_5
  title: Пробирка из руин
  category: rare
  weight: 1
  forced_only: true
  text: "Гонконг отстроили на руинах после Четвёртой корпоративной: биоатака 2022 года убила город за неделю. Тётушка Мэй приносит находку соседей из старого подвала: запечатанная пробирка с маркировкой военной лаборатории. «Это то, что убило мою мать»."
  choices:
    - label: Спрятать пробирку
      effects: {flag_set:hk_st2_vial: true, mood: -2}
      text: "Ты прячешь её в холодильник для лекарств у Доктора Вонга. Вонг не спрашивает, что это. Он видел такие маркировки."
    - label: Отнести Винсенту
      effects: {flag_set:hk_st2_vial: true, flag_set:hk_st2_vincent: true, eddies: 3000}
      text: "Винсент бледнеет и платит за молчание. «Кан Тао отдаст за это половину Сентрала. И убьёт всех, кто знал»."

- id: hk_story_6
  title: Охота Кан Тао
  category: street
  weight: 1
  forced_only: true
  foe: Оперативник Кан Тао
  foe_faction: hk_clones
  text: "В Коулуне отключают свет на три квартала. Оперативники Кан Тао обыскивают каждую клинику. Близнецы показывают им дорогу: корпорация платит им лицами."
  choices:
    - label: Встретить их в переулках
      violent: true
      effects: {start_combat: 4, flag_set:hk_st2_hunt: true, enmity: 1}
      text: "Темно, тесно, одинаковые лица в каждом окне. Ты знаешь эти переулки лучше."
    - label: Вывезти пробирку на пароме
      check: {stat: COOL, skill: stealth, dv: 15}
      success: {text: "Пробирка в термосе с чаем, паром на Лантау, ни одного взгляда. Кан Тао обыскивает пустую клинику.", effects: {flag_set:hk_st2_hunt: true}}
      fail: {text: "На причале проверка. Ты прыгаешь в воду с термосом в зубах.", effects: {flag_set:hk_st2_hunt: true, hp: -10, heat: 1}}

- id: hk_story_7
  title: Учёный из лаборатории
  category: relationships
  weight: 1
  forced_only: true
  text: "Доктор Вонг находит человека, который делал эту чуму в 2022-м. Старик живёт в монастыре на острове и молится каждый день. «Есть противоядие. Его так и не произвели: мёртвые не платят. Я помню формулу»."
  choices:
    - label: Записать формулу
      check: {stat: INT, skill: medicine, dv: 15}
      success: {text: "Ты понимаешь каждое слово. Формула — в двух местах: в твоей голове и в бумажной тетради.", effects: {flag_set:hk_st2_cure: true, skill_xp:medicine: 3}}
      fail: {text: "Половину ты не понимаешь. Старик терпеливо пишет всё на бумаге. Это занимает неделю.", effects: {flag_set:hk_st2_cure: true, mood: -2}}
    - label: Заставить его работать на тебя
      effects: {flag_set:hk_st2_cure: true, humanity: -4, eddies: 5000}
      text: "Старик плачет, но работает. Монахи смотрят на тебя так, как смотрели на тех, кто приходил в 2022-м."

- id: hk_story_8
  title: Что останется от чумы
  category: rare
  weight: 1
  forced_only: true
  text: "Пробирка, формула противоядия и три покупателя: Кан Тао, 14К и Всемирная организация здравоохранения, которая уже десять лет не может доказать, кто убил Гонконг."
  choices:
    - label: Отдать всё медикам
      effects: {humanity: 6, fame: 5, enmity: 1, eddies: 10000}
      text: "Противоядие запускают в производство в Женеве. Кан Тао впервые за двадцать лет даёт показания. Тётушка Мэй ставит на алтарь матери чашку чая."
    - label: Продать Кан Тао
      effects: {eddies: 90000, status: 2, humanity: -8}
      text: "Пробирку и формулу уносят в бронированном кейсе. Через год у Кан Тао выходит новая вакцина. Цена на неё такая, что Коулун снова учится молиться."
    - label: Уничтожить пробирку
      effects: {humanity: 4, street_cred: 3, mood: 3}
      text: "Ты сжигаешь пробирку в печи Доктора Вонга. Формулу оставляешь монахам. Пусть лежит, пока миру не понадобится."

# ======================================================================== China: the South China Sea

- id: cn_story_5
  title: Морской рейтинг
  category: work
  weight: 1
  forced_only: true
  text: "Китай — растущая держава и союзник NUSA. В Южно-Китайском море снова стреляют. Мин Чжао предлагает дело: флот набирает «добровольцев» с низким рейтингом, а за каждого добровольца вербовщику повышают собственный. Учитель Чэнь в списке."
  choices:
    - label: Вычеркнуть Чэня
      check: {stat: INT, skill: netrunning, dv: 15}
      success: {text: "Ты меняешь одну строчку в базе вербовщика. Чэнь остаётся учить детей.", effects: {flag_set:cn_st2_navy: true, humanity: 2}}
      fail: {text: "База ловит правку. Чэня вычёркивают, а тебя вписывают.", effects: {flag_set:cn_st2_navy: true, flag_set:cn_st2_drafted: true, heat: 2}}
    - label: Заплатить вербовщику
      effects: {flag_set:cn_st2_navy: true, eddies: -5000}
      text: "Вербовщик берёт деньги и вычёркивает Чэня. Вместо него вписывает кого-то ещё из подвала Бабушки Ли."

- id: cn_story_6
  title: Порт Пудуна
  category: street
  weight: 1
  foe: Змееголовый
  foe_faction: cn_snakeheads
  forced_only: true
  text: "Змееголовые вывозят «добровольцев» из порта: флот платит за головы, а на кораблях их ждут не форма, а цепи на минных тральщиках. Бабушка Ли знает номер контейнера."
  choices:
    - label: Вскрыть контейнер ночью
      violent: true
      effects: {start_combat: 3, flag_set:cn_st2_port: true, humanity: 2}
      text: "Ломик, замок, тридцать лиц в темноте. И Змееголовые с ножами за спиной."
    - label: Подменить накладную
      check: {stat: INT, skill: stealth, dv: 15}
      success: {text: "Контейнер с людьми уходит на склад Бабушки Ли, контейнер с маджонгом — на флот.", effects: {flag_set:cn_st2_port: true, street_cred: 2}}
      fail: {text: "Кран поднимает не тот контейнер. Ты успеваешь открыть его в последнюю минуту.", effects: {flag_set:cn_st2_port: true, hp: -8, heat: 1}}

- id: cn_story_7
  title: Отчёт для Пекина
  category: money
  weight: 1
  forced_only: true
  text: "Мин Чжао показывает отчёт: Кан Тао продаёт флоту бракованные дроны, и люди на тральщиках гибнут из-за этого, а не из-за врага. «Если отчёт уйдёт в Пекин, полетят головы. Если не уйдёт — полетят тральщики»."
  choices:
    - label: Отправить отчёт в Пекин
      check: {stat: COOL, skill: persuasion, dv: 16}
      success: {text: "Отчёт доходит до нужного стола. Через неделю совет директоров Кан Тао меняется на треть.", effects: {flag_set:cn_st2_report: true, fame: 2}}
      fail: {text: "Отчёт перехватывают. Кан Тао знает твоё имя.", effects: {flag_set:cn_st2_report: true, enmity: 2}}
    - label: Продать отчёт Кан Тао
      effects: {flag_set:cn_st2_report: true, eddies: 30000, humanity: -5}
      text: "Кан Тао платит щедро и вежливо. Отчёт исчезает. Дроны продолжают падать."

- id: cn_story_8
  title: Урок Чэня
  category: rare
  weight: 1
  forced_only: true
  text: "Учитель Чэнь собирает учеников в подвале и просит тебя прийти. На доске написано: «Почему мы воюем в море?» Мин Чжао стоит в дверях. Камера на потолке мигает зелёным: кто-то смотрит."
  choices:
    - label: Помочь Чэню провести урок
      effects: {humanity: 6, fame: 4, heat: 3}
      text: "Урок идёт в прямом эфире на весь Шанхай. Рейтинги всех, кто смотрел, падают на десять пунктов. Никто не выключает трансляцию."
    - label: Увести Чэня из города
      effects: {humanity: 3, eddies: -8000, street_cred: 3}
      text: "Бабушка Ли собирает в дорогу пирожки. Чэнь будет учить детей в горах, где камер меньше, чем звёзд."
    - label: Сдать урок системе
      effects: {eddies: 15000, status: 2, humanity: -8}
      text: "Твой рейтинг взлетает до небес. Подвал Бабушки Ли закрыт. Камера на потолке больше не мигает: смотреть не на кого."

# ======================================================================== Korea: the closed country

- id: kr_story_5
  title: Закрытая страна
  category: ncpd
  weight: 1
  forced_only: true
  text: "Объединённая Корея снова закрывает границы: иностранцев с просроченной визой высылают за сутки. Чжи У Пак звонит в панике: «Ты в списке. Агентство «Стар-Лайт» постаралось после истории с Ханой»."
  choices:
    - label: Исправить визу
      check: {stat: INT, skill: netrunning, dv: 15}
      success: {text: "Ты переписываешь дату в базе миграционной службы. Тебя нет ни в одном списке.", effects: {flag_set:kr_st2_visa: true}}
      fail: {text: "Правка оставляет след. Виза продлена, но в деле красная пометка.", effects: {flag_set:kr_st2_visa: true, heat: 2}}
    - label: Залечь в Курёне у Бабушки
      effects: {flag_set:kr_st2_visa: true, mood: -2, eddies: -1000}
      text: "Трущобы под небоскрёбами Каннама. Бабушка кормит тебя кимчи и не задаёт вопросов."

- id: kr_story_6
  title: Правда о «Стар-Лайт»
  category: money
  weight: 1
  forced_only: true
  text: "Хана Со приходит к тебе сама. Она не поёт с той ночи в пентхаусе. «Я не одна. Агентство продало сорок девочек за десять лет. Мне нужен человек, который поможет открыть архив»."
  choices:
    - label: Взломать архив агентства
      check: {stat: INT, skill: netrunning, dv: 16}
      success: {text: "Сорок контрактов, сорок клиентов, сорок имён. Хана плачет, читая их вслух.", effects: {flag_set:kr_st2_files: true, skill_xp:netrunning: 3}}
      fail: {text: "Агентство замечает взлом. Архив горит, но половину ты успеваешь скачать.", effects: {flag_set:kr_st2_files: true, enmity: 1}}
    - label: Добыть архив через бухгалтера
      check: {stat: COOL, skill: persuasion, dv: 15}
      success: {text: "Бухгалтер агентства давно хотел спать спокойно. Он отдаёт тебе всё.", effects: {flag_set:kr_st2_files: true}}
      fail: {text: "Бухгалтер берёт деньги и сдаёт тебя агентству.", effects: {flag_set:kr_st2_files: true, eddies: -3000, enmity: 1}}

- id: kr_story_7
  title: Кханпхэ у ворот
  category: street
  weight: 1
  forced_only: true
  foe: Боевик кханпхэ
  foe_faction: kr_kkangpae
  text: "Агентство нанимает кханпхэ. Ночью они приходят в Курён, к дому Бабушки, где прячется Хана. Ночные гонщики обещали прийти, но их пока не слышно."
  choices:
    - label: Держать дверь
      violent: true
      effects: {start_combat: 4, flag_set:kr_st2_siege: true, humanity: 2}
      text: "Узкий проход между лачугами, один фонарь, много ножей."
    - label: Увести Хану по крышам
      check: {stat: REF, skill: stealth, dv: 15}
      success: {text: "Крыши Курёна похожи на лестницу в небо. Вы спускаетесь в Каннаме, где гонщики уже прогревают моторы.", effects: {flag_set:kr_st2_siege: true}}
      fail: {text: "Шифер ломается под ногой. Вы падаете во двор к кханпхэ, но гонщики врываются туда же.", effects: {flag_set:kr_st2_siege: true, hp: -12}}

- id: kr_story_8
  title: Последняя песня
  category: rare
  weight: 1
  forced_only: true
  text: "Хана хочет выйти на сцену в последний раз, на главный фестиваль страны, и спеть песню с именами сорока девочек. Агентство требует отдать архив в обмен на её свободу."
  choices:
    - label: Песня в прямом эфире
      effects: {humanity: 6, fame: 6, enmity: 1}
      text: "Пятьдесят тысяч человек замолкают на третьем имени. К утру агентство «Стар-Лайт» закрыто, директор под арестом, а песня — первая в чартах."
    - label: Сделка с агентством
      effects: {eddies: 35000, humanity: -4, mood: -2}
      text: "Хана свободна и молчит. Тридцать девять девочек — нет. Деньги приходят ровно в срок."
    - label: Отдать архив прокурору тихо
      check: {stat: INT, skill: persuasion, dv: 15}
      success: {text: "Тихий процесс, тихие приговоры. Хана поёт новую песню, уже свою.", effects: {humanity: 4, fame: 2, eddies: 8000}}
      fail: {text: "Прокурор оказывается другом директора. Архив исчезает, но Хана успела запомнить все имена.", effects: {humanity: 2, mood: -3}}

# ======================================================================== India: the algae farms

- id: ind_story_5
  title: Зелёная вода
  category: work
  weight: 1
  forced_only: true
  text: "Азия давно ест водоросли CHOOH2 и топит машины их маслом. Фермы водорослей у Мумбаи огромны, как моря. Прия Капур снимает о них новый фильм, но на съёмочной площадке рабочие падают в обморок от ядовитых испарений."
  choices:
    - label: Проверить ферму
      check: {stat: TECH, skill: tech, dv: 14}
      success: {text: "Ты находишь утечку: корпорация экономит на фильтрах. Рабочие дышат ядом ради лишней прибыли.", effects: {flag_set:ind_st2_farm: true, skill_xp:tech: 2}}
      fail: {text: "Ты надышался сам. Неделю кашляешь зелёным.", effects: {flag_set:ind_st2_farm: true, hp: -8}}
    - label: Расспросить рабочих
      check: {stat: EMP, skill: persuasion, dv: 13}
      success: {text: "Рабочие рассказывают всё, а один даёт тебе запись с телефона.", effects: {flag_set:ind_st2_farm: true, humanity: 2}}
      fail: {text: "Рабочие боятся говорить. Один шепчет: «Приходи ночью».", effects: {flag_set:ind_st2_farm: true}}

- id: ind_story_6
  title: Ночная смена
  category: street
  weight: 1
  forced_only: true
  foe: Охранник компании Д
  foe_faction: ind_dcompany
  text: "Ночью на ферме разгружают бочки без маркировки. Компания Д охраняет погрузку: ферма принадлежит им через подставную фирму."
  choices:
    - label: Снять всё на камеру и уйти
      check: {stat: REF, skill: stealth, dv: 15}
      success: {text: "Кадры чёткие: бочки, логотип, лица охраны. Прия будет довольна.", effects: {flag_set:ind_st2_night: true}}
      fail: {text: "Прожектор находит тебя. Ты уходишь вплавь через пруд с водорослями.", effects: {flag_set:ind_st2_night: true, hp: -10}}
    - label: Остановить погрузку
      violent: true
      effects: {start_combat: 3, flag_set:ind_st2_night: true, enmity: 1}
      text: "Белые костюмы, зелёная вода, выстрелы над прудами."

- id: ind_story_7
  title: Армия Шивы за рабочих
  category: relationships
  weight: 1
  forced_only: true
  text: "Армия Шивы предлагает союз: они выведут рабочих на забастовку, если ты дашь им доказательства. Раджу Бхай предупреждает: «Они любят рабочих, пока те голосуют правильно»."
  choices:
    - label: Отдать доказательства Армии
      effects: {flag_set:ind_st2_strike: true, street_cred: 2}
      text: "Сто тысяч человек выходят к фермам. Компания Д впервые отступает."
    - label: Оставить их Прие
      effects: {flag_set:ind_st2_film: true, fame: 1}
      text: "Прия монтирует фильм ночами. Армия Шивы обижена, но ждёт."

- id: ind_story_8
  title: Премьера под дождём
  category: rare
  weight: 1
  forced_only: true
  text: "Сезон муссонов. Премьера фильма Прии в открытом кинотеатре Дхарави, экран под дождём, тысячи зрителей с зонтами. Компания Д предлагает купить фильм целиком, прямо сейчас, наличными."
  choices:
    - label: Показать фильм
      effects: {humanity: 5, fame: 5, enmity: 1}
      text: "Экран загорается. Дождь, толпа, ни одного звука до самых титров. Через неделю на фермах ставят фильтры."
    - label: Продать фильм компании Д
      effects: {eddies: 50000, humanity: -6}
      text: "Чемодан денег, плёнку жгут на твоих глазах. Прия больше не снимает кино."
    - label: Выложить фильм бесплатно
      effects: {humanity: 4, fame: 3, street_cred: 3}
      text: "Фильм смотрят сто миллионов человек за ночь. Денег никто не получает. Фильтры ставят всё равно."

# ======================================================================== Thailand: the fixed fights go big

- id: th_story_5
  title: Приглашение в Макао
  category: money
  weight: 1
  forced_only: true
  text: "После той субботы в Лумпини о Ное говорит вся Азия. Крёстные отцы приглашают его на бой в Макао против чемпиона корпорации, бойца с хромом за три миллиона. Сомчай боится: «Его там убьют»."
  choices:
    - label: Согласиться на бой
      effects: {flag_set:th_st2_macau: true, eddies: 5000}
      text: "Ной кивает. Он не боится. Боится Сомчай, и правильно."
    - label: Торговаться за условия
      check: {stat: COOL, skill: persuasion, dv: 15}
      success: {text: "Ты выбиваешь правило: без хрома в руках. Корпоративный чемпион будет драться почти как человек.", effects: {flag_set:th_st2_macau: true, flag_set:th_st2_rules: true}}
      fail: {text: "Крёстные смеются. Условия те же.", effects: {flag_set:th_st2_macau: true}}

- id: th_story_6
  title: Лаборатория чемпиона
  category: implants
  weight: 1
  forced_only: true
  text: "Плой из клуба знает, где готовят корпоративного чемпиона: частная клиника на Сукхумвит. Ему меняют рефлексы каждую неделю. Если узнать, какие, Ной будет знать, куда бить."
  choices:
    - label: Проникнуть в клинику
      check: {stat: INT, skill: stealth, dv: 16}
      success: {text: "Протокол операций у тебя. У чемпиона новый Керензиков, ещё сырой: он срабатывает с опозданием на левую сторону.", effects: {flag_set:th_st2_intel: true}}
      fail: {text: "Охрана клиники хватает тебя у сервера. Плой вытаскивает тебя через прачечную.", effects: {flag_set:th_st2_intel: true, hp: -8, heat: 1}}
    - label: Купить протокол у медсестры
      effects: {flag_set:th_st2_intel: true, eddies: -4000}
      text: "Медсестра берёт деньги и шепчет: «Бейте слева»."

- id: th_story_7
  title: Ночь перед Макао
  category: street
  weight: 1
  forced_only: true
  foe: Человек крёстных отцов
  foe_faction: th_jao_pho
  text: "Ночью к залу Сомчая приезжают люди крёстных: те, кто поставил на корпорацию, хотят, чтобы Ной не доехал до Макао. Целым."
  choices:
    - label: Защитить зал
      violent: true
      effects: {start_combat: 4, flag_set:th_st2_guard: true}
      text: "Маты, груши, ринг. Сегодня дерёшься ты, а Ной смотрит из угла."
    - label: Спрятать Ноя в храме
      check: {stat: EMP, skill: persuasion, dv: 14}
      success: {text: "Монахи храма Ват Пхо принимают Ноя на ночь. Сюда люди крёстных не войдут.", effects: {flag_set:th_st2_guard: true, humanity: 2}}
      fail: {text: "Монахи отказывают. Вы прячетесь на лодке в клонге до утра.", effects: {flag_set:th_st2_guard: true, mood: -2}}

- id: th_story_8
  title: Бой в Макао
  category: rare
  weight: 1
  forced_only: true
  text: "Макао, зал на десять тысяч мест, ставки на миллиарды. Ной в углу, напротив — корпоративный чемпион с хромом под кожей. В пятом раунде у Ноя есть шанс. Крёстные отцы в первом ряду смотрят на тебя."
  choices:
    - label: Ной бьёт слева и побеждает
      effects: {fame: 6, street_cred: 5, eddies: 30000, enmity: 1}
      text: "Удар слева, задержка рефлекса, чемпион на полу. Ставки сгорают, Азия ревёт. Ной поднимает перчатку и показывает на Сомчая."
    - label: Ной ложится, как велели
      effects: {eddies: 60000, humanity: -6, mood: -4}
      text: "Ной падает в пятом. Крёстные платят щедро. Ной уезжает домой и больше никогда не выходит на ринг."
    - label: Сорвать бой
      check: {stat: INT, skill: netrunning, dv: 16}
      success: {text: "Ты выкладываешь протокол операций чемпиона в сеть за час до боя. Бой отменяют, ставки возвращают, корпорацию дисквалифицируют.", effects: {humanity: 3, fame: 3}}
      fail: {text: "Взлом не удаётся. Бой идёт, Ной проигрывает по очкам, но живой.", effects: {mood: -3}}

# ======================================================================== Singapore: the perfect city cracks

- id: sg_story_5
  title: Морская стена
  category: work
  weight: 1
  forced_only: true
  text: "Сингапур строит морскую стену против поднявшегося океана. Рэйчел Тан узнаёт: деньги Синдиката Лотоса, которые ты помог проследить, ушли на подряд стены. Бетон там разбавлен песком."
  choices:
    - label: Взять пробу бетона
      check: {stat: TECH, skill: tech, dv: 14}
      success: {text: "Лаборатория подтверждает: стена не выдержит большого шторма.", effects: {flag_set:sg_st2_wall: true}}
      fail: {text: "Охрана стройки ловит тебя у опоры. Пробу ты всё же уносишь.", effects: {flag_set:sg_st2_wall: true, heat: 1}}
    - label: Найти инженера стены
      check: {stat: EMP, skill: persuasion, dv: 14}
      success: {text: "Инженер спивается в Гейланге. Он знает всё и хочет, чтобы кто-то знал тоже.", effects: {flag_set:sg_st2_wall: true, humanity: 1}}
      fail: {text: "Инженер пугается и звонит своему начальству.", effects: {flag_set:sg_st2_wall: true, enmity: 1}}

- id: sg_story_6
  title: Тайфун
  category: rare
  weight: 1
  forced_only: true
  text: "Тайфун приходит раньше прогноза. Вода встаёт у стены. В Гейланге, ниже всего, Дядюшка Тан и тысячи соседей. Стена может не выдержать в любую минуту."
  choices:
    - label: Эвакуировать Гейланг
      check: {stat: COOL, skill: persuasion, dv: 15}
      success: {text: "Ты поднимаешь квартал за час. Когда стена трескается, Гейланг уже на крышах торгового центра.", effects: {flag_set:sg_st2_storm: true, humanity: 4, fame: 2}}
      fail: {text: "Половина не верит. Вода приходит в нижние этажи. Дядюшку Тана ты выносишь на руках.", effects: {flag_set:sg_st2_storm: true, hp: -10, humanity: 2}}
    - label: Спасать доказательства
      effects: {flag_set:sg_st2_storm: true, humanity: -3}
      text: "Пока вода поднимается, ты вывозишь пробы и записи из офиса подрядчика. Это важно. Наверное."

- id: sg_story_7
  title: А Лонг ищет виноватых
  category: street
  weight: 1
  forced_only: true
  foe: Ростовщик А Лонг
  foe_faction: sg_ah_long
  text: "После тайфуна Синдикат ищет, кто слил историю про стену. Ростовщики А Лонг пишут краской на дверях свидетелей. Твоя дверь — следующая."
  choices:
    - label: Встретить их
      violent: true
      effects: {start_combat: 3, flag_set:sg_st2_ahlong: true}
      text: "Банки с краской, биты, сингапурская вежливость кончилась."
    - label: Откупиться у Синдиката
      effects: {flag_set:sg_st2_ahlong: true, eddies: -10000}
      text: "Конверт, поклон, краска смывается за ночь. Синдикат запомнил, что у тебя есть деньги."

- id: sg_story_8
  title: Идеальный город треснул
  category: rare
  weight: 1
  forced_only: true
  text: "У тебя всё: проба бетона, слова инженера, записи подрядчика. Правительство предлагает тихо перестроить стену и молчать. Синдикат предлагает долю в новом подряде. Рэйчел хочет суда."
  choices:
    - label: Публичный суд
      effects: {humanity: 5, fame: 5, enmity: 2}
      text: "Процесс идёт полгода. Половина подрядчиков в тюрьме, стену перестраивают честно. В Гейланге тебе бесплатно наливают кофе."
    - label: Тихая сделка с правительством
      effects: {eddies: 30000, status: 2, humanity: -2}
      text: "Стену перестраивают. Никто не сидит. Ты получаешь медаль за «гражданскую ответственность» и закрытый счёт."
    - label: Доля в подряде Синдиката
      effects: {eddies: 70000, humanity: -8}
      text: "Новый подряд, новый песок в бетоне. Следующий тайфун через пять лет. До этого ты успеешь уехать."

# ======================================================================== UAE: New Dubai

- id: ae_story_5
  title: Руины старого Дубая
  category: rare
  weight: 1
  forced_only: true
  text: "Новый Дубай стоит на морской платформе у руин старого: после Ближневосточного Расплава девяносто седьмого года пустыня вокруг светится по ночам. Шейх даёт тебе задание: в руинах старого города лежит сейф его деда. Радиация там до сих пор."
  choices:
    - label: Идти в руины
      check: {stat: BODY, dv: 14}
      success: {text: "Скафандр, дозиметр, мёртвые небоскрёбы в песке. Ты находишь сейф и выходишь до того, как дозиметр замолкает.", effects: {flag_set:ae_st2_ruins: true, hp: -6}}
      fail: {text: "Ты остаёшься внутри дольше, чем надо. Сейф у тебя, а в крови — лишние зиверты.", effects: {flag_set:ae_st2_ruins: true, hp: -18}}
    - label: Нанять мусорщиков пустыни
      effects: {flag_set:ae_st2_ruins: true, eddies: -6000}
      text: "Мусорщики пустыни живут в руинах поколениями. Они приносят сейф и просят за молчание отдельно."

- id: ae_story_6
  title: Что лежит в сейфе
  category: money
  weight: 1
  forced_only: true
  text: "В сейфе не золото. Там документы 1997 года: кто знал о Расплаве заранее и вывел деньги за неделю до ядерного обмена. В списке — семья шейха."
  choices:
    - label: Отдать сейф шейху запечатанным
      effects: {flag_set:ae_st2_sealed: true, eddies: 15000}
      text: "Шейх благодарит и не задаёт вопросов. Ты — тоже. Пока."
    - label: Сделать копии
      check: {stat: INT, skill: stealth, dv: 15}
      success: {text: "Копии лежат в трёх надёжных местах. Сейф шейх получает целым на вид.", effects: {flag_set:ae_st2_copy: true}}
      fail: {text: "Шейх замечает вскрытую печать. Его вежливость становится ледяной.", effects: {flag_set:ae_st2_copy: true, enmity: 1}}

- id: ae_story_7
  title: Буря из пустыни
  category: street
  weight: 1
  forced_only: true
  foe: Гвардеец шейха
  foe_faction: ae_sheikh_guard
  text: "Радиоактивная буря идёт с иранских пустошей, и платформу закрывают щитами. В это же время Гвардия шейха приходит в Дейру за всеми, кто видел документы."
  choices:
    - label: Драться в буре
      violent: true
      effects: {start_combat: 4, flag_set:ae_st2_storm: true}
      text: "Песок светится, щиты гудят, гвардейцы в противогазах."
    - label: Уйти под щитами на дау
      check: {stat: REF, skill: driving, dv: 15}
      success: {text: "Дау капитана Соколов проскальзывает под закрывающимся щитом. Гвардия остаётся в буре.", effects: {flag_set:ae_st2_storm: true}}
      fail: {text: "Щит закрывается перед носом. Вы пережидаете бурю в трюме, с дозиметром наперевес.", effects: {flag_set:ae_st2_storm: true, hp: -10}}

- id: ae_story_8
  title: Тридцать лет молчания
  category: rare
  weight: 1
  forced_only: true
  text: "Шейх приглашает тебя на яхту ещё раз. На столе твоя копия документов. «Мой дед спас семью. Миллионы погибли. Ты можешь сделать так, чтобы об этом узнали все. Или можешь стать богатым человеком в самом безопасном городе Ближнего Востока»."
  choices:
    - label: Опубликовать документы
      effects: {humanity: 5, fame: 6, enmity: 2, heat: 2}
      text: "Мир читает. Семья шейха теряет половину платформы. Мусорщики пустыни впервые за тридцать лет получают компенсацию."
    - label: Продать молчание
      effects: {eddies: 100000, status: 3, humanity: -6}
      text: "Яхта, вид на залив, гражданство Нового Дубая. Руины старого города светятся по ночам прямо под твоим окном."
    - label: Отдать документы мусорщикам
      effects: {humanity: 4, street_cred: 4}
      text: "Пусть решают те, чьи деды остались в пустыне. Они решают не спешить, но больше никогда не работают на шейха бесплатно."

# ======================================================================== Kazakhstan: Baikonur

- id: kz_story_5
  title: Байконур
  category: work
  weight: 1
  forced_only: true
  text: "После войны Исламской Азиатской Республики «СовОйл» выторговал Союзу доступ к Байконуру. Айгерим из министерства знает: уран из контейнера с яблоками был для частной ракеты, которая стартует оттуда через неделю."
  choices:
    - label: Поехать на космодром
      effects: {flag_set:kz_st2_baikonur: true, eddies: -2000}
      text: "Степь, верблюды, ракета на горизонте, как игла. Пропуск стоит двух тысяч и одного вопроса без ответа."
    - label: Сначала узнать заказчика
      check: {stat: INT, skill: netrunning, dv: 15}
      success: {text: "Заказчик — подставная фирма «СовОйла». Ракета везёт не спутник.", effects: {flag_set:kz_st2_baikonur: true, flag_set:kz_st2_known: true}}
      fail: {text: "Следы ведут в никуда. Придётся смотреть самому.", effects: {flag_set:kz_st2_baikonur: true}}

- id: kz_story_6
  title: Степные волки на космодроме
  category: street
  weight: 1
  forced_only: true
  foe: Степной волк
  foe_faction: kz_steppe
  text: "Степные волки охраняют космодром для «СовОйла». Им платят за то, чтобы никто не подходил к стартовому столу. Их вожак узнаёт тебя по контейнеру с яблоками."
  choices:
    - label: Пробиться к столу
      violent: true
      effects: {start_combat: 4, flag_set:kz_st2_pad: true}
      text: "Ветер, пыль, бетонные отбойники и мотоциклы волков."
    - label: Договориться с вожаком
      check: {stat: COOL, skill: persuasion, dv: 16}
      success: {text: "Вожак выслушивает про уран и сплёвывает: «Мои дети тоже живут под этим небом». Волки уходят со стола.", effects: {flag_set:kz_st2_pad: true, street_cred: 2}}
      fail: {text: "Вожак не верит. Ты уходишь, а волки остаются.", effects: {flag_set:kz_st2_pad: true, hp: -8}}

- id: kz_story_7
  title: Что в ракете
  category: rare
  weight: 1
  forced_only: true
  text: "В головной части ракеты — орбитальная платформа с урановыми стержнями. Оружие, которое «СовОйл» повесит над Азией, чтобы никто больше не говорил о суб-союзах. Старт через двенадцать часов."
  choices:
    - label: Сломать систему наведения
      check: {stat: TECH, skill: tech, dv: 16}
      success: {text: "Ты меняешь одну плату. Платформа выйдет на орбиту и навсегда уйдёт в сторону Солнца.", effects: {flag_set:kz_st2_rocket: true, skill_xp:tech: 3}}
      fail: {text: "Плата не та. Ты успеваешь только поджечь кабели: старт отложат на месяц.", effects: {flag_set:kz_st2_rocket: true, heat: 2}}
    - label: Позвать Айгерим с министерством
      effects: {flag_set:kz_st2_rocket: true, flag_set:kz_st2_ministry: true}
      text: "Айгерим приезжает с проверкой через три часа. Старт отменяют «по техническим причинам»."

- id: kz_story_8
  title: Небо над степью
  category: rare
  weight: 1
  forced_only: true
