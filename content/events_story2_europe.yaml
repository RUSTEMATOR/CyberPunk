      text: "Они благодарят и уходят. Мокрая собака оглядывается."

- id: nl_ev_dike
  title: Тревога на дамбе
  category: rare
  weight: 2
  conditions: {districts: [nl_port]}
  text: "Сирена: дамба у порта даёт течь. Нужны руки с мешками песка."
  choices:
    - label: Таскать мешки
      effects: {humanity: 2, hp: -3, street_cred: 1}
      text: "К утру течь закрыта. Портовые рабочие хлопают тебя по плечу."
    - label: Уехать повыше
      effects: {}
      text: "Ты переживаешь ночь на десятом этаже. Дамба держит без тебя."

- id: se_ev_fika
  title: Фика
  category: relationships
  weight: 3
  conditions: {districts: [se_rinkeby, se_gamla_stan]}
  text: "Коллеги зовут на фику: кофе, булочки с корицей и разговор ни о чём. Здесь это святое."
  choices:
    - label: Пойти
      effects: {mood: 4}
      text: "Корица, кофе, тихий смех. Швеция умеет быть уютной."
    - label: Сослаться на дела
      effects: {mood: -1}
      text: "Коллеги вежливо кивают. В следующий раз позовут реже."

- id: se_ev_dark
  title: Полярная ночь
  category: rare
  weight: 2
  conditions: {districts: [se_rinkeby, se_gamla_stan]}
  text: "Зимой солнце встаёт на пять часов. Ты не помнишь, когда в последний раз видел его."
  choices:
    - label: Купить лампу дневного света
      effects: {mood: 3, eddies: -300}
      text: "Лампа светит, как маленькое солнце. Становится легче."
    - label: Терпеть
      effects: {mood: -4}
      text: "Темнота давит. Ты понимаешь, почему здесь столько детективов про убийства."

- id: se_ev_wolves_flyers
  title: Листовки волков
  category: street
  weight: 2
  conditions: {districts: [se_rinkeby]}
  text: "Северные волки клеят листовки на двери в Ринкебю: «Уезжайте домой». Подростки срывают их и клеят свои."
  choices:
    - label: Помочь подросткам
      effects: {humanity: 1, street_cred: 1}
      text: "К утру на дверях только листовки с футболом и концертами."
    - label: Не лезть
      effects: {}
      text: "Листовки висят до первого дождя."

- id: pl_ev_milk_bar
  title: Бар молочный
  category: relationships
  weight: 3
  conditions: {districts: [pl_praga, pl_srodmiescie]}
  text: "Старый молочный бар: пироги, борщ, кассирша с советским характером и цены из прошлого века."
  choices:
    - label: Пообедать
      effects: {hp: 3, mood: 3, eddies: -30}
      text: "Пироги с картошкой, компот, тишина. Варшава, которой больше нигде нет."
    - label: Поговорить с кассиршей
      effects: {street_cred: 1, mood: 1}
      text: "Кассирша знает всё о Праге и всех её жильцах. Через полчаса ты тоже знаешь."

- id: pl_ev_kibole_match
  title: Дерби
  category: street
  weight: 2
  conditions: {districts: [pl_praga]}
  text: "Киболе после дерби ищут фанатов соперника. Твоя куртка, как назло, нужного цвета."
  choices:
    - label: Снять куртку
      effects: {mood: -1}
      text: "Холодно, но цело."
    - label: Объясниться
      check: {stat: COOL, skill: persuasion, dv: 13}
      success: {text: "Ты говоришь, что ты из Найт-Сити. Киболе в восторге и ведут тебя пить пиво.", effects: {mood: 3, street_cred: 1}}
      fail: {text: "Им всё равно, откуда ты.", effects: {hp: -6}}

- id: pl_ev_amber
  title: Янтарь на рынке
  category: money
  weight: 2
  conditions: {districts: [pl_praga, pl_srodmiescie]}
  text: "На рынке продают янтарь. В одном камне ты замечаешь знакомый чип."
  choices:
    - label: Купить камень
      effects: {eddies: -150, street_cred: 1}
      text: "Внутри старые данные контрабандистов. Збышек купит это у тебя в три раза дороже."
    - label: Сообщить Магде
      effects: {humanity: 1}
      text: "Магда благодарит. Ещё одна ниточка в её расследовании."

- id: ua_ev_kyiv_coffee
  title: Кава на Подолі
  category: relationships
  weight: 3
  conditions: {districts: [ua_podil, ua_troieshchyna]}
  text: "Кофейня в подвале на Подоле. Бариста варит кофе на песке и спорит с посетителем о поэзии."
  choices:
    - label: Ввязаться в спор
      effects: {mood: 4}
      text: "Через час вы втроём читаете стихи вслух. Бариста не берёт денег."
    - label: Тихо выпить кофе
      effects: {mood: 2}
      text: "Кофе крепкий, как зима. За окном Андреевский спуск."

- id: ua_ev_marshrutka
  title: Маршрутка
  category: street
  weight: 2
  conditions: {districts: [ua_podil, ua_troieshchyna]}
  text: "Маршрутка на Троещину набита так, что дышать можно только по очереди. Водитель рассчитывается с пассажирами одной рукой, второй рулит."
  choices:
    - label: Передать деньги через весь салон
      effects: {mood: 2}
      text: "Деньги идут через десять рук, сдача возвращается до копейки. Магия."
    - label: Выйти и идти пешком
      effects: {mood: -1}
      text: "Пешком до Троещины далеко. Очень далеко."

- id: ua_ev_garage_repair
  title: Гаражи Богдана
  category: work
  weight: 2
  conditions: {districts: [ua_troieshchyna]}
  text: "Богдан Гаражный чинит всё: машины, импланты, телевизоры. Сегодня ему нужна пара рук."
  choices:
    - label: Помочь
      check: {stat: TECH, skill: tech, dv: 12}
      success: {text: "К вечеру ты умеешь то, чему в Найт-Сити не учат. Богдан наливает чай.", effects: {skill_xp:tech: 3, eddies: 300}}
      fail: {text: "Ты роняешь блок питания. Богдан ругается, но не выгоняет.", effects: {eddies: -100}}
    - label: Отказаться
      effects: {}
      text: "Богдан найдёт другие руки. Их на Троещине много."

- id: ru_ev_metro
  title: Метро
  category: street
  weight: 3
  conditions: {districts: [ru_kitai_gorod, ru_kapotnya]}
  text: "Станция метро как дворец: мрамор, люстры, мозаики. Бабушка в переходе продаёт пирожки и смотрит на твой хром с подозрением."
  choices:
    - label: Купить пирожок
      effects: {hp: 2, mood: 2, eddies: -20}
      text: "С капустой. Горячий. Бабушка смягчается и крестит тебя на дорогу."
    - label: Поспешить
      effects: {}
      text: "Поезд приходит каждые девяносто секунд. Москва не ждёт."

- id: ru_ev_traffic_cop
  title: ДПС
  category: ncpd
  weight: 2
  conditions: {districts: [ru_kitai_gorod, ru_kapotnya]}
  text: "Инспектор останавливает машину, в которой ты едешь. «Нарушаем, гражданин?» Он явно не про скорость."
  choices:
    - label: Заплатить на месте
      effects: {eddies: -500}
      text: "Инспектор желает счастливого пути. Его фуражка видела всё."
    - label: Спорить по закону
      check: {stat: COOL, skill: persuasion, dv: 14}
      success: {text: "Инспектор удивлён и отпускает: с таким знанием законов связываться себе дороже.", effects: {}}
      fail: {text: "Протокол, эвакуатор, штрафстоянка.", effects: {eddies: -1500, heat: 1}}

- id: ru_ev_banya
  title: Баня
  category: relationships
  weight: 2
  conditions: {districts: [ru_kapotnya]}
  text: "Валентина Петровна зовёт в баню: веники, квас, ледяная купель. Там все дела решаются быстрее."
  choices:
    - label: Париться
      effects: {hp: 6, mood: 4}
      text: "Пар, веник, снег. Ты выходишь другим человеком."
    - label: Слушать разговоры в предбаннике
      effects: {street_cred: 1, mood: 2}
      text: "В предбаннике обсуждают, кто из воров с кем поругался. Ценные сведения."

- id: tr_ev_simit
  title: Симит у Босфора
  category: relationships
  weight: 3
  conditions: {districts: [tr_beyoglu, tr_fatih]}
  text: "Чайки, паромы, симит с кунжутом и стакан чая в форме тюльпана. Старик рядом кормит чаек с руки."
  choices:
    - label: Покормить чаек
      effects: {mood: 3}
      text: "Чайка забирает у тебя половину симита. Старик смеётся."
    - label: Сыграть в нарды со стариком
      check: {stat: INT, dv: 12}
      success: {text: "Ты выигрываешь. Старик требует реванш и угощает чаем.", effects: {mood: 4}}
      fail: {text: "Старик выигрывает три раза подряд и не берёт денег.", effects: {mood: 2}}

- id: tr_ev_dust_storm
  title: Красная пыль
  category: rare
  weight: 2
  conditions: {districts: [tr_beyoglu, tr_fatih]}
  text: "Сирены: радиоактивная пыль с востока. Город закрывает окна. У тебя нет фильтра."
  choices:
    - label: Купить фильтр втридорога
      effects: {eddies: -1500}
      text: "Фильтр шумит всю ночь. Утром небо снова голубое."
    - label: Переждать в цистерне
      effects: {hp: -3, mood: -1}
      text: "Под землёй пыли меньше. Но тоже есть."

- id: tr_ev_carpet
  title: Ковёр за полцены
  category: money
  weight: 2
  conditions: {districts: [tr_fatih]}
  text: "Торговец на Гранд-базаре предлагает ковёр «ручной работы, триста лет» за полцены, если ты купишь прямо сейчас."
  choices:
    - label: Торговаться
      check: {stat: COOL, skill: persuasion, dv: 14}
      success: {text: "Ты сбиваешь цену вдвое и выпиваешь с торговцем три стакана чая. Ковёр, правда, машинный.", effects: {mood: 3, eddies: -200}}
      fail: {text: "Торговец выигрывает. Ковёр дорогой и машинный.", effects: {eddies: -800, mood: 1}}
    - label: Уйти
      effects: {}
      text: "Торговец кричит тебе вслед цену ещё ниже. Ты не оборачиваешься."
