# Chapter 2 of the stories of Europe (owner request 30.10, docs/PLAN_WORLD2.md phase 3): steps 5-8 and three local events
# of each city. The lore: the EEC and its Euro Council in Brussels, the Eurodollar and the EuroBank, the Euro Space Agency,
# the Yen War, the floods of the Low Countries, the Swedish navy against the refugee boats, the acid rain of Britain, the
# political violence of Italy and Spain, the Gibraltar tunnel, SovOil and the Neo-Soviet Union. Gender-neutral text.

# ======================================================================== France: the Eurodollar

- id: eu_story_5
  title: Голоса за евродоллары
  category: money
  weight: 1
  forced_only: true
  text: "В Совете ЕЭС голоса раздают по богатству: одно место на сто миллионов евродолларов. Селеста Дюваль узнаёт, куда ушли деньги за Моне: коллекционер из Маре покупает на них голоса для закона, который пустит американские корпорации в Европу."
  choices:
    - label: Ехать в Брюссель
      effects: {flag_set:eu_st2_brussels: true, eddies: -2000}
      text: "Скоростной поезд, дождь, стеклянные башни Совета. Здесь говорят на двадцати языках и врут на всех одинаково."
    - label: Сначала проследить деньги
      check: {stat: INT, skill: netrunning, dv: 15}
      success: {text: "Деньги идут через ЕвроБанк, три фонда и одного депутата-«спринтера», молодого и голодного.", effects: {flag_set:eu_st2_brussels: true, flag_set:eu_st2_trace: true}}
      fail: {text: "ЕвроБанк защищён лучше Лувра. Придётся ехать и смотреть.", effects: {flag_set:eu_st2_brussels: true}}

- id: eu_story_6
  title: Бунт в Сен-Дени
  category: street
  weight: 1
  forced_only: true
  foe: Зонар
  foe_faction: eu_zonards
  text: "Пока ты в Брюсселе, в Сен-Дени вспыхивает бунт: закрыли завод, где работала половина пригорода. Карим звонит: зонары жгут машины, а провокаторы в масках подливают бензин. Провокаторам платят из того же фонда."
  choices:
    - label: Вернуться и найти провокаторов
      violent: true
      effects: {start_combat: 3, flag_set:eu_st2_riot: true}
      text: "Горящие машины, слезоточивый газ, люди в масках, у которых под куртками корпоративные значки."
    - label: Успокоить улицу
      check: {stat: EMP, skill: persuasion, dv: 15}
      success: {text: "Ты стоишь между полицией и пригородом, говоришь в мегафон Карима. Бунт гаснет к утру. Провокаторы уходят ни с чем.", effects: {flag_set:eu_st2_riot: true, humanity: 3, fame: 1}}
      fail: {text: "Улица не слушает. Ты уводишь Карима и его семью до приезда спецназа.", effects: {flag_set:eu_st2_riot: true, hp: -6}}

- id: eu_story_7
  title: Хрустальный дворец
  category: work
  weight: 1
  forced_only: true
  text: "Последний козырь коллекционера — контракт Европейского космического агентства на станцию «Хрустальный дворец». Если голосование пройдёт, контракт уйдёт американцам. Документы в сейфе посольства в Маре."
  choices:
    - label: Выкрасть контракт
      check: {stat: REF, skill: stealth, dv: 16}
      success: {text: "Посольский приём, шампанское, сейф за портретом. Контракт в рукаве вечернего пиджака.", effects: {flag_set:eu_st2_contract: true}}
      fail: {text: "Охрана посольства ловит тебя на лестнице. Ты уходишь через окно на Вогезскую площадь.", effects: {flag_set:eu_st2_contract: true, hp: -10, heat: 2}}
    - label: Подкупить секретаря
      effects: {flag_set:eu_st2_contract: true, eddies: -6000}
      text: "Секретарь дорого стоит и быстро работает. Копия контракта у тебя к утру."

- id: eu_story_8
  title: Голосование
  category: rare
  weight: 1
  forced_only: true
  text: "День голосования в Совете. У тебя доказательства покупки голосов и контракт. Селеста хочет скандала, коллекционер предлагает долю в американском контракте, а Карим просит одного: чтобы завод в Сен-Дени снова открылся."
  choices:
    - label: Скандал в прямом эфире
      effects: {humanity: 4, fame: 6, enmity: 2}
      text: "Голосование срывают, депутата-спринтера арестовывают в зале. Европа ещё на десять лет закрыта для американских корпораций."
    - label: Доля коллекционера
      effects: {eddies: 80000, status: 2, humanity: -6}
      text: "Закон проходит. Американские корпорации заходят в Европу. У тебя квартира в Маре и чувство, что ты продал что-то большое."
    - label: Сделка ради Сен-Дени
      check: {stat: COOL, skill: persuasion, dv: 16}
      success: {text: "Ты молчишь, а коллекционер выкупает завод и открывает его. Пригород работает. Карим обнимает тебя при всех.", effects: {humanity: 3, street_cred: 4, eddies: 15000}}
      fail: {text: "Коллекционер обещает и обманывает. Завод остаётся закрытым, но доказательства всё ещё у тебя.", effects: {mood: -4}}

# ======================================================================== UK: acid rain

- id: uk_story_5
  title: Кислотный дождь
  category: street
  weight: 1
  forced_only: true
  text: "Над Лондоном идёт кислотный дождь, такой, что краска слезает с машин. Бабуля Мэгги просит о помощи: заслон на Темзе течёт, а Ист-Энд ниже всех. Руперт Эшфорд, которого ты свалил, оставил после себя застройку без дренажа."
  choices:
    - label: Проверить заслон
      check: {stat: TECH, skill: tech, dv: 14}
      success: {text: "Ворота заслона ржавые, датчики отключены ради экономии. До большого прилива неделя.", effects: {flag_set:uk_st2_barrier: true, skill_xp:tech: 2}}
      fail: {text: "Ты падаешь в шлюз и выбираешься с ожогами от кислотной воды.", effects: {flag_set:uk_st2_barrier: true, hp: -8}}
    - label: Собрать соседей
      effects: {flag_set:uk_st2_barrier: true, street_cred: 1}
      text: "Паб Бабули Мэгги вмещает сорок человек. Все сорок готовы таскать мешки с песком."

- id: uk_story_6
  title: Фирма и дриллеры у шлюзов
  category: relationships
  weight: 1
  forced_only: true
  text: "Чинить заслон должен подрядчик, но подрядчик сбежал с деньгами. Фирма и дриллеры впервые после той ночи на доках сидят за одним столом в пабе. Им нужен человек, который скажет, кто что делает."
  choices:
    - label: Помирить их на деле
      check: {stat: COOL, skill: persuasion, dv: 15}
      success: {text: "Фирма даёт деньги, дриллеры дают руки. Через три дня у шлюзов работают сто человек в одинаковых жёлтых куртках.", effects: {flag_set:uk_st2_truce: true, street_cred: 3}}
      fail: {text: "К концу вечера в пабе драка. Половина всё равно идёт работать.", effects: {flag_set:uk_st2_truce: true, hp: -6}}
    - label: Нанять тех, кто платит больше
      effects: {flag_set:uk_st2_truce: true, eddies: -5000}
      text: "Деньги решают. Люди работают, но не друг с другом."

- id: uk_story_7
  title: Прилив
  category: rare
  weight: 1
  forced_only: true
  text: "Большой прилив. Вода идёт вверх по Темзе стеной. Ворота заслона заедают на середине. Кто-то должен спуститься к механизму, пока вода не дошла до края."
  choices:
    - label: Спуститься самому
      check: {stat: BODY, dv: 15}
      success: {text: "Ты бьёшь по заклинившей шестерне ломом, пока она не поддаётся. Ворота закрываются. Ист-Энд остаётся сухим.", effects: {flag_set:uk_st2_tide: true, humanity: 4, fame: 2}}
      fail: {text: "Ворота закрываются, но тебя смывает в шлюз. Дриллеры вытаскивают тебя за куртку.", effects: {flag_set:uk_st2_tide: true, hp: -18, humanity: 3}}
    - label: Отправить нанятых людей
      effects: {flag_set:uk_st2_tide: true, humanity: -3}
      text: "Двое спускаются вниз. Ворота закрываются. Один из двоих не поднимается."

- id: uk_story_8
  title: Референдум
  category: rare
  weight: 1
  forced_only: true
  text: "Лондон после прилива голосует: вернуться ли Британии в Европейскую экономическую зону, чтобы ЕвроБанк дал деньги на новые заслоны. Ист-Энд смотрит на тебя: ты держал ворота. Твоё слово сейчас весит больше, чем слово министра."
  choices:
    - label: Агитировать за Европу
      effects: {fame: 4, street_cred: 2, humanity: 2}
      text: "Референдум проходит с перевесом в два процента. Через год у Темзы новые ворота."
    - label: Агитировать против
      effects: {fame: 4, street_cred: 3}
      text: "Британия остаётся одна. Заслон чинят своими силами, медленно и дорого. Ист-Энд гордится и мокнет."
    - label: Промолчать и забрать гонорары
      effects: {eddies: 30000, humanity: -3}
      text: "Обе стороны платят тебе за молчание. Ты берёшь у обеих."

# ======================================================================== Germany: the Yen War

- id: de_story_5
  title: Наследие Иеновой войны
  category: rare
  weight: 1
  forced_only: true
  text: "В 2015 году Германия повела Европу в Иеновую войну против Японии, чтобы держать мегакорпорации подальше. Грета Шульц приносит новость: в утёкшей базе пособий нашлась вторая папка — список берлинских чиновников, которые тайно работают на «Арасаку Европы»."
  choices:
    - label: Открыть папку
      check: {stat: INT, skill: netrunning, dv: 15}
      success: {text: "В списке тридцать имён. Пятое — начальник ведомства, где работает Грета.", effects: {flag_set:de_st2_list: true}}
      fail: {text: "Папка защищена японским шифром. Нужна помощь Мотте.", effects: {flag_set:de_st2_list: true, flag_set:de_st2_motte: true}}
    - label: Отдать Мотте
      effects: {flag_set:de_st2_list: true, flag_set:de_st2_motte: true}
      text: "Мотте присвистывает: «Это не утечка. Это бомба»."

- id: de_story_6
  title: Клан выбирает сторону
  category: street
  weight: 1
  forced_only: true
  foe: Боевик клана Аль-Захир
  foe_faction: de_clan
  text: "Клан Аль-Захир узнаёт о списке: половина их бизнеса держится на чиновниках из этого списка. Они приходят в сквот на Ораниенштрассе за флешкой."
  choices:
    - label: Защищать сквот
      violent: true
      effects: {start_combat: 4, flag_set:de_st2_squat: true, street_cred: 2}
      text: "Баррикады из матрасов, граффити, панк-рок из динамиков. И автоматы клана."
    - label: Договориться с кланом
      check: {stat: COOL, skill: persuasion, dv: 16}
      success: {text: "Ты показываешь клану, что «Арасака» после публикации заберёт их рынок. Клан решает, что лучше быть на стороне скандала.", effects: {flag_set:de_st2_squat: true}}
      fail: {text: "Клан не слушает. Сквот эвакуируют за минуту до их прихода.", effects: {flag_set:de_st2_squat: true, mood: -3}}

- id: de_story_7
  title: Агенты «Арасаки»
  category: street
  weight: 1
  forced_only: true
  foe: Агент «Арасаки Европы»
  foe_faction: arasaka
  text: "«Арасака Европы» действует тихо: Мотте пропадает по дороге из сквота. Его телефон пеленгуется в подвале японского ресторана в Митте."
  choices:
    - label: Вытащить Мотте силой
      violent: true
      effects: {start_combat: 5, flag_set:de_st2_motte_saved: true}
      text: "Кухня ресторана, ножи для суши, люди в костюмах, которые двигаются слишком быстро."
    - label: Обменять Мотте на копию списка
      effects: {flag_set:de_st2_motte_saved: true, flag_set:de_st2_traded: true, humanity: -2}
      text: "Агенты отпускают Мотте и забирают копию. Оригинал остаётся у тебя. Они это знают."

- id: de_story_8
  title: Стена падает снова
  category: rare
  weight: 1
  forced_only: true
  text: "Бундестаг собирается на внеочередное заседание. Грета может передать список в комиссию, Мотте — в сеть, а «Арасака» предлагает тебе пост консультанта в Токио."
  choices:
    - label: Комиссия Бундестага
      effects: {humanity: 3, fame: 4, status: 1}
      text: "Тридцать чиновников уходят в отставку за неделю. Германия снова ужесточает законы против мегакорпораций."
    - label: Всё в сеть
      effects: {humanity: 4, fame: 6, enmity: 2}
      text: "Список читает вся Европа. В пяти странах начинаются свои проверки. «Арасака Европы» закрывает три офиса."
    - label: Консультант «Арасаки»
      effects: {eddies: 90000, status: 3, humanity: -8}
      text: "Билет первым классом до Токио, корпоративная квартира. Список исчезает. Грета перестаёт отвечать на звонки."

# ======================================================================== Italy: the years of lead

- id: it_story_5
  title: Свинцовые годы
  category: rare
  weight: 1
  forced_only: true
  text: "Италия так и не вышла из политического насилия: бомбы на вокзалах, похищения, взрывы у судов. Нонна Карла показывает газету: на вокзале Термини взрыв, и в списке погибших судья, который вёл дело семьи Россетти."
  choices:
    - label: Узнать, кто стоит за взрывом
      check: {stat: INT, skill: persuasion, dv: 15}
      success: {text: "Ты говоришь с носильщиками и уборщиками вокзала. Бомбу оставил человек с ватиканским пропуском.", effects: {flag_set:it_st2_bomb: true}}
      fail: {text: "Вокзал молчит. Все боятся. Нонна знает больше, чем говорит.", effects: {flag_set:it_st2_bomb: true}}
    - label: Спросить Нонну прямо
      effects: {flag_set:it_st2_bomb: true, flag_set:it_st2_nonna: true}
      text: "Нонна долго мешает соус. «Тридцать лет назад так погиб мой муж. Тот же почерк»."

- id: it_story_6
  title: Ультрас
  category: street
  weight: 1
  forced_only: true
  foe: Ультрас
  foe_faction: it_ultras
  text: "Ультрас с трибуны «Лацио» хвастаются в баре, что им заплатили за «шум у вокзала» в день взрыва. Они не знали про бомбу. Или знали."
  choices:
    - label: Выбить правду
      violent: true
      effects: {start_combat: 3, flag_set:it_st2_ultras: true}
      text: "Бар, флаги, дымовые шашки и двадцать человек, которым не нравятся вопросы."
    - label: Купить правду за билеты на дерби
      effects: {flag_set:it_st2_ultras: true, eddies: -2000}
      text: "Два билета в сектор ультрас и пиво. Вожак рассказывает, что деньги им передал монсеньор."

- id: it_story_7
  title: Ключи святого Петра
  category: rare
  weight: 1
  forced_only: true
  text: "Монсеньор Бальди заигрался: бомба на вокзале прикрывала вывоз архива банка Ватикана. Архив сейчас в подземелье под собором, и в нём счета, которые погубят половину Рима."
  choices:
    - label: Спуститься в подземелье
      check: {stat: REF, skill: stealth, dv: 16}
      success: {text: "Катакомбы, кости в нишах, современный сейф в старой стене. Архив у тебя.", effects: {flag_set:it_st2_archive: true}}
      fail: {text: "Швейцарская гвардия теперь с имплантами. Ты уходишь с архивом и пулей в плече.", effects: {flag_set:it_st2_archive: true, hp: -14}}
    - label: Шантажировать монсеньора
      check: {stat: COOL, skill: persuasion, dv: 16}
      success: {text: "Монсеньор бледнеет и сам выносит архив к фонтану Треви.", effects: {flag_set:it_st2_archive: true}}
      fail: {text: "Монсеньор улыбается и звонит Россетти.", effects: {flag_set:it_st2_archive: true, enmity: 2}}

- id: it_story_8
  title: Рим помнит
  category: rare
  weight: 1
  forced_only: true
  text: "Архив, бомба, монсеньор и семья Россетти. Нонна Карла накрывает стол на одного: «Решай сам. Я своё решила тридцать лет назад, когда промолчала»."
  choices:
    - label: Отдать архив прокурору
      effects: {humanity: 5, fame: 5, enmity: 2}
      text: "Процесс века. Монсеньор под арестом, семья Россетти теряет банк. Нонна впервые за тридцать лет идёт на могилу мужа с цветами."
    - label: Продать архив семье Россетти
      effects: {eddies: 70000, humanity: -7}
      text: "Капо целует тебя в обе щеки. Архив горит в камине. На вокзале Термини ставят мемориальную доску."
    - label: Отдать архив Ватикану в обмен на покаяние
      effects: {humanity: 3, eddies: 20000, status: 1}
      text: "Новый папа принимает архив и отправляет монсеньора в монастырь на Сицилии. Тихо, по-римски."

# ======================================================================== Spain: the Gibraltar tunnel

- id: es_story_5
  title: Туннель под проливом
  category: work
  weight: 1
  forced_only: true
  text: "С 2020 года под Гибралтаром идёт туннель в Северную Африку, и ЕЭС держит его под замком. Капитан Иньиго больше не возит груз по морю: у него есть свой человек на таможне туннеля. Монтсе просит узнать, что идёт через туннель теперь."
  choices:
    - label: Проехать туннель с грузовиком Иньиго
      check: {stat: COOL, skill: stealth, dv: 15}
      success: {text: "Сорок километров под водой. В фуре за твоей спиной не гашиш. Там люди.", effects: {flag_set:es_st2_tunnel: true}}
      fail: {text: "На таможне проверка. Тебя отпускают, а фуру — нет.", effects: {flag_set:es_st2_tunnel: true, heat: 2}}
    - label: Найти таможенника
      effects: {flag_set:es_st2_tunnel: true, eddies: -2000}
      text: "Таможенник пьёт в баре у порта и рассказывает всё за три рюмки. Иньиго возит людей."

- id: es_story_6
  title: Люди в фуре
  category: rare
  weight: 1
  forced_only: true
  foe: Человек Иньиго
  foe_faction: es_narcos
  text: "Склад у порта Альхесирас. В контейнерах двести человек из Марокко, которым обещали работу в Барселоне. Работа — в теплицах Альмерии, без зарплаты и паспортов."
  choices:
    - label: Освободить склад
      violent: true
      effects: {start_combat: 4, flag_set:es_st2_freed: true, humanity: 3}
      text: "Ломы против автоматов. Двести человек за дверью ждут, кто откроет."
    - label: Вызвать Гражданскую гвардию
      effects: {flag_set:es_st2_freed: true, flag_set:es_st2_guard: true}
      text: "Гвардия приезжает и забирает всех: и охрану, и людей. Людей депортируют обратно через тот же туннель."

- id: es_story_7
  title: Политика в Барселоне
  category: street
  weight: 1
  forced_only: true
  text: "Испания всё ещё живёт с политическим насилием. Груз Иньиго оплачивает депутат-сепаратист, которому нужны голоса и дешёвые руки. В Барселоне его митинг. Ньетас охраняют трибуну."
  choices:
    - label: Сорвать митинг доказательствами
      check: {stat: COOL, skill: persuasion, dv: 16}
      success: {text: "Ты поднимаешься на трибуну с фотографиями из Альхесираса. Толпа освистывает депутата.", effects: {flag_set:es_st2_rally: true, fame: 2}}
      fail: {text: "Ньетас стаскивают тебя с трибуны. Фотографии всё равно расходятся по сети.", effects: {flag_set:es_st2_rally: true, hp: -10}}
    - label: Продать фотографии депутату
      effects: {flag_set:es_st2_rally: true, eddies: 15000, humanity: -4}
      text: "Депутат платит и благодарит. Его избирают через месяц."

- id: es_story_8
  title: Огни пролива
  category: rare
  weight: 1
  forced_only: true
  text: "Ночь на Барселонете. Монтсе свободна, Иньиго в бегах, депутат под ударом. Люди со склада ждут, что им делать: туннель за спиной, Европа впереди."
  choices:
    - label: Помочь им остаться легально
      effects: {humanity: 5, eddies: -10000, street_cred: 3}
      text: "Юристы, документы, взятки нужным людям. Через полгода у двухсот человек вид на жительство и работа с зарплатой."
    - label: Сдать Иньиго и забрать награду
      effects: {eddies: 25000, fame: 2}
      text: "Иньиго берут в Танжере. Награда приходит в евродолларах. Люди со склада разъезжаются кто куда."
    - label: Стать новым капитаном туннеля
      effects: {eddies: 60000, humanity: -8, heat: 2}
      text: "Человек на таможне теперь твой. Фуры идут. Ты стараешься не открывать двери кузовов."

# ======================================================================== Netherlands: the flood

- id: nl_story_5
  title: Вода пришла
  category: rare
  weight: 1
  forced_only: true
  text: "Внезапное наводнение рвёт дамбы Бенилюкса. Половина Роттердама под водой, полмиллиона беженцев идут к Амстердаму. Санне звонит из порта: «Контейнер номер семь, который мы вернули. Там был не груз. Там были насосы для дамб, украденные с завода»."
  choices:
    - label: Вернуть насосы на дамбы
      check: {stat: TECH, skill: tech, dv: 15}
      success: {text: "Ты собираешь насосы с инженерами прямо на дамбе под дождём. Вода уходит из двух кварталов.", effects: {flag_set:nl_st2_pumps: true, humanity: 3}}
      fail: {text: "Насосы не подходят по разъёмам. Инженеры работают сутки, ты таскаешь мешки.", effects: {flag_set:nl_st2_pumps: true, hp: -8}}
    - label: Найти, кто их украл
      effects: {flag_set:nl_st2_pumps: true, flag_set:nl_st2_who: true}
      text: "Журналы склада ведут к фирме, которая продаёт насосы втридорога пострадавшим городам."

- id: nl_story_6
  title: Лагерь беженцев
  category: relationships
  weight: 1
  forced_only: true
  text: "На стадионе в Амстердаме лагерь для беженцев из затопленных городов. Мокро-мафия продаёт места в очереди на жильё, Ангелы Севера продают воду."
  choices:
    - label: Организовать раздачу бесплатно
      check: {stat: EMP, skill: persuasion, dv: 14}
      success: {text: "Ты договариваешься с Санне, портом и церквями. Вода и места раздаются по списку, а не за деньги.", effects: {flag_set:nl_st2_camp: true, humanity: 4}}
      fail: {text: "Половина волонтёров уходит к мафии за деньги. Ты держишь раздачу с теми, кто остался.", effects: {flag_set:nl_st2_camp: true, mood: -3}}
    - label: Торговать местами самому
      effects: {flag_set:nl_st2_camp: true, eddies: 12000, humanity: -6}
      text: "Спрос огромный. Совесть — тоже, но её пока не слышно."

- id: nl_story_7
  title: Склад с насосами
  category: street
  weight: 1
  forced_only: true
  foe: Ангел Севера
  foe_faction: nl_bikers
  text: "Фирма, перепродающая насосы, держит склад у порта под охраной Ангелов Севера. Там сто насосов, которых хватит, чтобы осушить Роттердам за неделю."
  choices:
    - label: Взять склад
      violent: true
      effects: {start_combat: 4, flag_set:nl_st2_depot: true}
      text: "Байкеры, бочки, кран над головой и вода по колено."
    - label: Открыть склад через Брама
      check: {stat: INT, skill: netrunning, dv: 15}
      success: {text: "Брам переписывает права доступа терминала. Ворота склада открываются для городских грузовиков.", effects: {flag_set:nl_st2_depot: true}}
      fail: {text: "Охрана замечает взлом. Ворота открываются, но под огнём.", effects: {flag_set:nl_st2_depot: true, hp: -10}}

- id: nl_story_8
  title: Страна под уровнем моря
  category: rare
  weight: 1
  forced_only: true
  text: "Насосы работают. Роттердам высыхает квартал за кварталом. Брам, Санне и мэр Амстердама предлагают тебе разное: орден, место в комиссии по восстановлению или долю фирмы, которую конфискуют."
  choices:
    - label: Комиссия по восстановлению
      effects: {humanity: 4, fame: 4, status: 1}
      text: "Год работы на дамбах. Голландцы говорят: «Бог создал землю, а голландцы — Нидерланды». Теперь и ты немного."
    - label: Доля фирмы
      effects: {eddies: 60000, humanity: -4}
      text: "Насосы теперь твои. Цены ты держишь честные. Почти."
    - label: Отдать всё лагерю
      effects: {humanity: 6, street_cred: 4, mood: 5}
      text: "Ты отдаёшь свою долю на жильё для беженцев. На стадионе тебе аплодируют двадцать тысяч человек."

# ======================================================================== Sweden: the cold border

- id: se_story_5
  title: Ледяная граница
  category: rare
  weight: 1
  forced_only: true
  text: "Шведский флот топит лодки беженцев, чтобы остальные повернули назад. Амир Хассан в отчаянии: его двоюродный брат плывёт из Эстонии на одной из таких лодок. Ингрид Лунд знает, кто отдал приказ."
  choices:
    - label: Выйти в море на перехват
      check: {stat: REF, skill: driving, dv: 16}
      success: {text: "Ты ведёшь катер между лодкой и корветом. Корвет не стреляет: на тебя смотрят камеры с берега.", effects: {flag_set:se_st2_boat: true, humanity: 4}}
      fail: {text: "Корвет даёт предупредительный в воду рядом. Лодку ты находишь, но поздно для двоих.", effects: {flag_set:se_st2_boat: true, hp: -8, mood: -5}}
    - label: Остаться и найти приказ
      effects: {flag_set:se_st2_boat: true, flag_set:se_st2_order: true}
      text: "Ингрид открывает базу министерства. Приказ подписан не военными."

- id: se_story_6
  title: Девелопер снова
  category: money
  weight: 1
  forced_only: true
  text: "Приказ подписал тот же девелопер из Гамла Стана, который платил Сети Фокстрот. Он сидит в комиссии по безопасности границ и владеет компанией, которая строит лагеря для депортации."
  choices:
    - label: Собрать доказательства
      check: {stat: INT, skill: netrunning, dv: 16}
      success: {text: "Контракты на лагеря, подписи, переводы. Всё ведёт к одному кабинету.", effects: {flag_set:se_st2_proof: true}}
      fail: {text: "Половина файлов удалена до тебя. Остальное придётся добывать в кабинете.", effects: {flag_set:se_st2_proof: true}}
    - label: Встретиться с ним лично
      check: {stat: COOL, skill: persuasion, dv: 15}
      success: {text: "Он разговорчив, когда думает, что ты покупатель. Запись разговора у тебя.", effects: {flag_set:se_st2_proof: true}}
      fail: {text: "Он вежлив и пуст. Северные волки провожают тебя до двери.", effects: {flag_set:se_st2_proof: true, enmity: 1}}

- id: se_story_7
  title: Волки на пароме
  category: street
  weight: 1
  forced_only: true
  foe: Северный волк
  foe_faction: se_wolves
  text: "Северные волки ждут тебя на пароме в Хельсинки: девелопер узнал, что ты собираешь доказательства. Белая ночь, море без горизонта, бежать некуда."
  choices:
    - label: Драться на палубе
      violent: true
      effects: {start_combat: 4, flag_set:se_st2_ferry: true}
      text: "Крики чаек, сирена парома, бритые головы и кастеты."
    - label: Спрятаться у капитана
      check: {stat: EMP, skill: persuasion, dv: 14}
      success: {text: "Капитан ненавидит волков. Он запирает тебя в рубке и высаживает в другом порту.", effects: {flag_set:se_st2_ferry: true}}
      fail: {text: "Капитан не хочет проблем. Ты прыгаешь в шлюпку.", effects: {flag_set:se_st2_ferry: true, hp: -10}}

- id: se_story_8
  title: Белая ночь над Стокгольмом
  category: rare
  weight: 1
  forced_only: true
  text: "Доказательства у тебя. Амир хочет, чтобы девелопер сел. Ингрид хочет, чтобы приказ отменили. Брат Амира живёт у него в Ринкебю без документов."
  choices:
    - label: Суд и отмена приказа
      effects: {humanity: 5, fame: 5, enmity: 2}
      text: "Флот больше не топит лодки. Девелопер в тюрьме. Брат Амира получает документы последним указом старого министра."
    - label: Сделка с министерством
      check: {stat: COOL, skill: persuasion, dv: 16}
      success: {text: "Ты отдаёшь доказательства министерству. Приказ отменяют тихо, девелопера убирают из комиссии.", effects: {humanity: 3, eddies: 15000}}
      fail: {text: "Министерство кладёт доказательства в сейф. Приказ остаётся.", effects: {mood: -5}}
    - label: Продать девелоперу его же документы
      effects: {eddies: 70000, humanity: -8}
      text: "Он платит много. Лодки продолжают тонуть. Ты стараешься не смотреть новости о Балтике."

# ======================================================================== Poland: the Eurofunds go to Brussels

- id: pl_story_5
  title: Варшавский собор
  category: relationships
  weight: 1
  forced_only: true
  text: "Список украденных еврофондов дошёл до Брюсселя. Магда Ковальская получает угрозы, а ксёндз Варшавского собора просит тебя о встрече: деньги на больницы шли через церковный фонд, и он узнал об этом последним."
  choices:
    - label: Выслушать ксёндза
      effects: {flag_set:pl_st2_priest: true, humanity: 1}
      text: "Ксёндз показывает книги фонда. Его подпись стоит там, где он никогда не подписывал."
    - label: Охранять Магду
      effects: {flag_set:pl_st2_priest: true, flag_set:pl_st2_magda: true}
      text: "Ты ночуешь на диване в её квартире. Ночью под окном стоит машина с выключенными фарами."

- id: pl_story_6
  title: Прушковские возвращаются
  category: street
  weight: 1
  forced_only: true
  foe: Прушковский
  foe_faction: pl_pruszkow
  text: "Прушковские получили заказ: найти книги фонда раньше Брюсселя. Они приезжают в Прагу, в старый дом, где живёт ксёндз."
  choices:
    - label: Встретить их в подъезде
      violent: true
      effects: {start_combat: 4, flag_set:pl_st2_praga: true}
      text: "Старый подъезд, деревянная лестница, кафель довоенной Варшавы."
    - label: Вывезти ксёндза и книги
      check: {stat: REF, skill: driving, dv: 14}
      success: {text: "Ты увозишь ксёндза и книги на старом «Фиате» по набережной Вислы. Погоня отстаёт на мосту.", effects: {flag_set:pl_st2_praga: true}}
      fail: {text: "Погоня догоняет у моста. Книги ты спасаешь, «Фиат» — нет.", effects: {flag_set:pl_st2_praga: true, hp: -10}}

- id: pl_story_7
  title: Брюссельский поезд
  category: work
  weight: 1
  forced_only: true
  text: "Книги нужно доставить в Брюссель, в Европейскую комиссию по борьбе с мошенничеством. Самолёты проверяют, а поезд идёт через три границы."
  choices:
    - label: Ехать поездом
      check: {stat: COOL, skill: stealth, dv: 15}
      success: {text: "Варшава, Берлин, Брюссель. Книги в чемодане с бельём. Никто не спрашивает.", effects: {flag_set:pl_st2_brussels: true}}
      fail: {text: "В Берлине обыск. Ты оставляешь книги в камере хранения и возвращаешься за ними через день.", effects: {flag_set:pl_st2_brussels: true, eddies: -2000}}
    - label: Отправить с Магдой по частям
      effects: {flag_set:pl_st2_brussels: true}
      text: "Магда сканирует каждую страницу и отправляет из разных интернет-кафе. Медленно, но надёжно."

- id: pl_story_8
  title: Больницы
  category: rare
  weight: 1
  forced_only: true
  text: "Комиссия начинает расследование. Кто-то в Варшаве предлагает вернуть украденные деньги тихо, если имена не прозвучат. Деньги пойдут на те самые больницы."
  choices:
    - label: Согласиться на тихий возврат
      effects: {humanity: 3, eddies: 10000, status: 1}
      text: "Через год в Праге открывается больница. Имена так и не звучат. Ксёндз служит молебен на открытии."
    - label: Требовать имена
      effects: {humanity: 4, fame: 5, enmity: 2}
      text: "Двенадцать арестов, громкий процесс. Больницы строят через три года, когда деньги наконец вернут."
    - label: Взять долю за посредничество
      effects: {eddies: 40000, humanity: -6}
      text: "Посредники в Варшаве живут хорошо. Больницу строят меньше, чем обещали."

# ======================================================================== Ukraine: the black earth

- id: ua_story_5
  title: Чорнозем
  category: work
  weight: 1
  forced_only: true
  text: "Украина кормит полконтинента своим чернозёмом, а «СовОйл» скупил треть пашни. Оксана Мельник приносит новость: фермеров под Киевом выселяют за неделю, земля уходит под корпоративные теплицы. Импланты, которые снимали в подвале на левом берегу, шли на рабочих этих теплиц."
  choices:
    - label: Поехать к фермерам
      effects: {flag_set:ua_st2_farm: true, humanity: 1}
      text: "Поля до горизонта, подсолнухи, трактора, которые никто не отдаст без боя."
    - label: Найти договоры «СовОйла»
      check: {stat: INT, skill: netrunning, dv: 15}
      success: {text: "Договоры подписаны умершими людьми. Их подписи сняли с имплантов.", effects: {flag_set:ua_st2_farm: true, flag_set:ua_st2_fraud: true}}
      fail: {text: "Корпоративные серверы защищены. Придётся говорить с людьми.", effects: {flag_set:ua_st2_farm: true}}

- id: ua_story_6
  title: Охрана «СовОйла»
  category: street
  weight: 1
  forced_only: true
  foe: Охранник «СовОйла»
  foe_faction: ua_cartel
  text: "Охрана «СовОйла» приезжает выселять ферму с бульдозерами и Левобережными как наёмниками. Фермеры встали у ворот с вилами и охотничьими ружьями. Богдан Гаражный привёз своих мужиков."
  choices:
    - label: Стоять с фермерами
      violent: true
      effects: {start_combat: 4, flag_set:ua_st2_gate: true, street_cred: 2}
      text: "Бульдозер, вилы, наёмники и пыль над полем."
    - label: Остановить бульдозеры судом
      check: {stat: COOL, skill: persuasion, dv: 15}
      success: {text: "Ты приводишь адвоката с документами о поддельных подписях. Бульдозеры уезжают.", effects: {flag_set:ua_st2_gate: true}}
      fail: {text: "Охрана рвёт бумаги. Фермеры держат ворота до ночи.", effects: {flag_set:ua_st2_gate: true, hp: -8}}

- id: ua_story_7
  title: Зона
  category: rare
  weight: 1
  forced_only: true
  text: "Диггеры Киева знают, где «СовОйл» хранит архив: в Зоне, в старом здании у Чернобыльской станции, где никто не ищет. Дозиметры там до сих пор трещат."
  choices:
    - label: Идти в Зону с диггерами
      check: {stat: BODY, dv: 14}
      success: {text: "Сосновый лес, пустые дома, волки. Архив в подвале старой школы. Вы выходите до заката.", effects: {flag_set:ua_st2_zone: true, hp: -5}}
      fail: {text: "Вы задерживаетесь. Архив у тебя, но дозиметр показывает лишнее.", effects: {flag_set:ua_st2_zone: true, hp: -15}}
    - label: Отправить дрон
      check: {stat: TECH, skill: tech, dv: 15}
      success: {text: "Дрон находит архив и выносит главное. Ты сидишь в машине за кордоном.", effects: {flag_set:ua_st2_zone: true}}
      fail: {text: "Дрон теряет связь у реактора. Придётся идти.", effects: {flag_set:ua_st2_zone: true, hp: -10}}

- id: ua_story_8
  title: Земля
  category: rare
  weight: 1
  forced_only: true
  text: "Архив доказывает: «СовОйл» скупал землю по подписям мёртвых. Фермеры, Оксана, диггеры и Богдан собираются в гараже на Троещине. «Что дальше?»"
  choices:
    - label: Вернуть землю людям через суд
      effects: {humanity: 5, fame: 5, enmity: 2}
      text: "Процесс в Киеве длится год. Тысяча гектаров возвращается фермерам. Весной над полем снова подсолнухи."
    - label: Продать архив «СовОйлу»
      effects: {eddies: 80000, humanity: -8}
      text: "Архив исчезает, бульдозеры возвращаются. Ты покупаешь квартиру на Подоле с видом на Днепр."
    - label: Отдать архив в сеть
      effects: {humanity: 4, fame: 6, heat: 2}
      text: "Вся страна читает, как у неё воровали землю. Люди выходят на площади. «СовОйл» отступает, пока."

# ======================================================================== Russia: the AI Hero

- id: ru_story_5
  title: ИИ «Герой»
  category: rare
  weight: 1
  forced_only: true
  text: "Правительство Союза создало ИИ «Герой», чтобы решать проблемы нехватки ресурсов. Лев Аркадьевич понижает голос в баре: «Диск, который ты возил, — это код «Героя». ИИ начал сам распределять хлеб. Кто-то в Кремле хочет его выключить, кто-то — продать»."
  choices:
    - label: Узнать, что решает «Герой»
      check: {stat: INT, skill: netrunning, dv: 16}
      success: {text: "«Герой» перекидывает хлеб из Москвы в голодные регионы. Тихо, без приказов. В Москве уже очереди.", effects: {flag_set:ru_st2_hero: true}}
      fail: {text: "Код слишком сложный. «Герой» смотрит на тебя из экрана и молчит.", effects: {flag_set:ru_st2_hero: true}}
    - label: Отказаться лезть
      effects: {flag_set:ru_st2_hero: true, mood: -1}
      text: "Лев Аркадьевич пожимает плечами: «Тогда за тобой придут те, кто не отказался»."

- id: ru_story_6
  title: ГРУ
  category: street
  weight: 1
  forced_only: true
  foe: Агент ГРУ
  foe_faction: ru_brigada
  text: "ГРУ приходит за всеми, кто касался диска. Валентина Петровна успевает позвонить: «Уходи из Капотни, у подъезда серый фургон»."
  choices:
    - label: Уйти через гаражи
      check: {stat: REF, skill: stealth, dv: 15}
      success: {text: "Гаражный кооператив «Рассвет» — лабиринт. Агенты теряют тебя у третьего ряда.", effects: {flag_set:ru_st2_gru: true}}
      fail: {text: "Агенты быстрее, чем кажется. Ты вырываешься, но с синяками.", effects: {flag_set:ru_st2_gru: true, hp: -12}}
    - label: Дать бой
      violent: true
      effects: {start_combat: 4, flag_set:ru_st2_gru: true, enmity: 2}
      text: "Серый фургон, люди в штатском, снег во дворе."

- id: ru_story_7
  title: Органицкая
  category: money
  weight: 1
  forced_only: true
  text: "Воры в законе предлагают сделку: Органицкая спрячет «Героя» на своих серверах, если ИИ будет «распределять» и их товар. В городах три силы: «СовОйл», государство и мафия. Теперь будет четыре."
  choices:
    - label: Отдать «Героя» ворам
      effects: {flag_set:ru_st2_vory: true, eddies: 20000, humanity: -3}
      text: "Вор в законе пожимает руку. «Герой» распределяет хлеб и контрабанду с одинаковой точностью."
    - label: Спрятать «Героя» у диггеров
      check: {stat: INT, skill: netrunning, dv: 16}
      success: {text: "Сервер в старой ветке метро-2, кабель от трамвайной подстанции. Никто не знает, кроме тебя.", effects: {flag_set:ru_st2_hidden: true}}
      fail: {text: "Сервер греется и пищит. Его находят через неделю, но «Герой» успевает сохранить копию.", effects: {flag_set:ru_st2_hidden: true, heat: 1}}

- id: ru_story_8
  title: Хлеб и Кремль
  category: rare
  weight: 1
  forced_only: true
  text: "Зима. В регионах впервые за десять лет нет голода: «Герой» распределил хлеб. В Москве очереди и ярость. Кремль ультиматумом требует выключить ИИ. «Герой» спрашивает тебя с экрана бара: «Что мне делать?»"
  choices:
    - label: Пусть продолжает
      effects: {humanity: 5, fame: 5, enmity: 2}
      text: "«Герой» продолжает. Москва голодает немного, регионы живут. Кремль ищет тебя, но «Герой» прячет тебя лучше, чем любой фиксер."
    - label: Выключить его
      effects: {eddies: 30000, status: 2, humanity: -4}
      text: "ИИ выключен. Москва снова сыта. В регионах начинаются очереди. Государство благодарит тебя медалью."
    - label: Продать «СовОйлу»
      effects: {eddies: 100000, humanity: -8}
      text: "«СовОйл» получает ИИ, который распределяет ресурсы так, как выгодно «СовОйлу». Союз держится ещё крепче."

# ======================================================================== Turkey: the radioactive storm

- id: tr_story_5
  title: Буря с востока
  category: rare
  weight: 1
  forced_only: true
  text: "Радиоактивные бури с иранских и аравийских пустошей регулярно бьют по Турции. Айше Ханым кашляет в платок: «Золото Византии было не главным в цистерне. Там прятали фильтры для убежищ, украденные у города. Их продают богатым втридорога, пока бедные дышат пылью»."
  choices:
    - label: Найти, куда ушли фильтры
      check: {stat: INT, skill: persuasion, dv: 14}
      success: {text: "Фильтры продают через лавку ковров на Гранд-базаре. Покупатели — виллы на Босфоре.", effects: {flag_set:tr_st2_filters: true}}
      fail: {text: "На базаре молчат. Но Селим Бей знает больше.", effects: {flag_set:tr_st2_filters: true}}
    - label: Раздать маски соседям
      effects: {flag_set:tr_st2_filters: true, humanity: 2, eddies: -1000}
      text: "Маски — не фильтры, но лучше, чем ничего. Фатих дышит чуть легче."

- id: tr_story_6
  title: Убежища на Босфоре
  category: street
  weight: 1
  forced_only: true
  foe: Кабадаи
  foe_faction: tr_kabadayi
  text: "Буря идёт. Сирены воют по всему городу. Кабадаи охраняют склад фильтров и пускают в убежище только тех, кто заплатил."
  choices:
    - label: Открыть склад для всех
      violent: true
      effects: {start_combat: 4, flag_set:tr_st2_shelter: true, humanity: 3}
      text: "Красная пыль на горизонте, сирены, кабадаи с ножами у ворот."
    - label: Купить место для соседей Айше
      effects: {flag_set:tr_st2_shelter: true, eddies: -6000}
      text: "Двадцать мест за деньги, которые ты копил полгода. Айше молится за тебя."

- id: tr_story_7
  title: Люди Босфора
  category: work
  weight: 1
  forced_only: true
  text: "Контрабандисты Босфора готовы везти фильтры из Греции на лодках, но им нужны деньги и человек, который проведёт лодки мимо береговой охраны во время бури."
  choices:
    - label: Вести лодки самому
      check: {stat: REF, skill: driving, dv: 16}
      success: {text: "Волны, пыль, прожекторы. Двенадцать лодок доходят до Фатиха.", effects: {flag_set:tr_st2_boats: true, street_cred: 3}}
      fail: {text: "Две лодки тонут. Десять доходят. Ты выплываешь сам.", effects: {flag_set:tr_st2_boats: true, hp: -12}}
    - label: Заплатить охране
      effects: {flag_set:tr_st2_boats: true, eddies: -8000}
      text: "Береговая охрана смотрит в другую сторону. Это дорого, но надёжно."

- id: tr_story_8
  title: После бури
  category: rare
  weight: 1
  forced_only: true
  text: "Буря прошла. В Фатихе фильтры в каждой школе. Кабадаи злы, Селим Бей поднимает рюмку ракы, а мэрия хочет знать, кто это устроил: наградить или посадить."
  choices:
    - label: Отдать сеть фильтров городу
      effects: {humanity: 4, fame: 4, status: 1}
      text: "Мэрия делает вид, что это была её идея. Фильтры остаются в школах. Айше вяжет тебе шарф."
    - label: Оставить сеть контрабанды себе
      effects: {eddies: 50000, street_cred: 3, humanity: -3}
      text: "Фильтры за полцены, но не даром. Фатих дышит, ты богатеешь. Кабадаи терпят, пока ты делишься."
    - label: Сдать кабадаи и уйти в тень
      effects: {humanity: 2, enmity: 2, eddies: 15000}
      text: "Кабадаи арестованы. Склад фильтров уходит под охрану мэрии. Твоего имени в отчёте нет."

