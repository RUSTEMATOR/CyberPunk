  choices:
    - label: За нигерийский
      effects: {mood: 4, street_cred: 1}
      text: "Свадьба кричит от радости. Тебе дают добавку."
    - label: За ганский
      effects: {mood: 1}
      text: "Тишина. Потом смех. Тебя прощают, но не забудут."

- id: ng_ev_floodwater
  title: Наводнение в Макоко
  category: rare
  weight: 2
  conditions: {districts: [ng_makoko]}
  text: "Вода в лагуне поднялась. Дома на сваях качаются, дети на крышах."
  choices:
    - label: Помогать лодкой
      effects: {humanity: 3, hp: -2}
      text: "Ты возишь детей до берега весь день."
    - label: Купить мешки с песком
      effects: {humanity: 1, eddies: -400}
      text: "Мешки помогают трём домам."

- id: eg_ev_felucca
  title: Фелука на Ниле
  category: relationships
  weight: 3
  conditions: {districts: [eg_city_dead, eg_zamalek]}
