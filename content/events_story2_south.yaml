  choices:
    - label: Плыть
      effects: {mood: 5, eddies: -20}
      text: "Солнце садится за пирамиды. Капитан поёт старые песни."
    - label: Спросить капитана о гробницах
      effects: {street_cred: 1, mood: 2}
      text: "Капитан знает, какие гробницы новые, а какие — очень новые."

- id: eg_ev_tourist_trap
  title: Пирамиды
  category: money
  weight: 2
  conditions: {districts: [eg_city_dead, eg_zamalek]}
  text: "У пирамид погонщик верблюда предлагает «бесплатную фотографию». Слезть с верблюда стоит сто долларов."
  choices:
    - label: Торговаться
      check: {stat: COOL, skill: persuasion, dv: 13}
      success: {text: "Ты слезаешь за десять. Погонщик уважает.", effects: {eddies: -10, mood: 3}}
      fail: {text: "Ты слезаешь за двести.", effects: {eddies: -200, mood: -1}}
    - label: Не садиться
      effects: {}
      text: "Пирамиды прекрасны и с земли."

- id: eg_ev_dust
  title: Хамсин
  category: rare
  weight: 2
  conditions: {districts: [eg_city_dead, eg_zamalek]}
  text: "Пятидесятидневный ветер хамсин несёт песок из пустыни. Город становится оранжевым."
  choices:
    - label: Переждать с Хасаном
      effects: {mood: 2}
      text: "Чай, нарды, песок стучит в окно."
    - label: Работать в маске
      effects: {hp: -3, eddies: 300}
      text: "Песок в зубах, но деньги заработаны."

- id: ke_ev_matatu
  title: Матату
  category: street
  weight: 3
  conditions: {districts: [ke_kibera, ke_westlands]}
  text: "Матату с граффити, неоном и басами, от которых дрожат окна. Кондуктор свисает из двери."
  choices:
    - label: Ехать
      effects: {mood: 4, eddies: -30}
      text: "Лучшая вечеринка в городе — это поездка до работы."
    - label: Идти пешком
      effects: {mood: 1}
      text: "Найроби пешком — это тоже Найроби."

- id: ke_ev_mpesa
  title: Кошелёк в телефоне
  category: money
  weight: 2
  conditions: {districts: [ke_kibera, ke_westlands]}
  text: "Соседка просит перевести деньги сыну в деревню: у неё нет телефона."
  choices:
    - label: Помочь
      effects: {humanity: 2}
      text: "Сын получает деньги через минуту. Соседка приносит тебе мандази."
    - label: Сказать, что занят
      effects: {}
      text: "Она находит кого-то другого."

- id: ke_ev_launch
  title: Запуск шаттла
  category: rare
