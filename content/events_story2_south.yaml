    - label: Загадать желание
      effects: {mood: 3, humanity: 1}
      text: "Ты загадываешь, сам не знаешь что."

- id: za_ev_braai
  title: Брай
  category: relationships
  weight: 3
  conditions: {districts: [za_cape_flats, za_waterfront]}
  text: "Субботний брай во дворе: мясо, мьюзик, споры о регби."
  choices:
    - label: Присоединиться
      effects: {mood: 4, hp: 2}
      text: "Тебе дают щипцы. Это высшая честь."
    - label: Принести своё
      effects: {mood: 3, eddies: -100}
      text: "Твоё мясо хвалят из вежливости."

- id: za_ev_load_shedding
  title: Отключение света
  category: street
  weight: 2
  conditions: {districts: [za_cape_flats, za_waterfront]}
  text: "Плановое отключение электричества: четыре часа без света по расписанию."
  choices:
    - label: Свечи и разговоры
      effects: {mood: 2}
      text: "Соседи собираются на улице. Темнота сближает."
    - label: Купить генератор
      effects: {eddies: -800, mood: 1}
      text: "Генератор гремит на весь квартал."

- id: za_ev_penguins
  title: Пингвины на пляже
  category: relationships
  weight: 2
  conditions: {districts: [za_waterfront]}
  text: "На пляже у Саймонстауна пингвины дерутся за рыбу с чайками."
  choices:
    - label: Смотреть
      effects: {mood: 4}
      text: "Пингвины побеждают. Ты болел за них."
    - label: Кормить
      effects: {mood: 2, heat: 1}
      text: "Смотритель выписывает штраф. Пингвины сыты."

- id: ma_ev_hammam
  title: Хаммам
  category: relationships
  weight: 3
  conditions: {districts: [ma_medina, ma_port]}
  text: "Старый хаммам в медине: пар, чёрное мыло, кесе и разговоры шёпотом."
  choices:
    - label: Пойти
      effects: {hp: 4, mood: 4, eddies: -50}
      text: "Ты выходишь, будто родился заново."
    - label: Слушать сплетни
      effects: {street_cred: 1, mood: 2}
      text: "В хаммаме знают, кто куда плывёт и сколько платит."

- id: ma_ev_souk
  title: Лабиринт медины
  category: street
  weight: 2
  conditions: {districts: [ma_medina]}
  text: "Ты потерялся в медине. Мальчишка предлагает проводить за монету."
  choices:
    - label: Пойти с мальчишкой
      effects: {eddies: -20, mood: 2}
      text: "Он ведёт тебя через лавку своего дяди. Ты покупаешь лампу."
