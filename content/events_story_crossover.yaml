# The stories of the crossover cities (owner request 30.10, docs/PLAN_WORLD2.md): 8 steps each, one step a day from the
# country window, then local events of each city (drawn at random in its districts). Gender-neutral text.

# ======================================================================== Elysium: a ticket up

- id: ely_story_1
  title: Дочь медсестры
  category: relationships
  weight: 1
  forced_only: true
  text: "Фрей Сантьяго зашивает тебе руку в подвальной клинике и не поднимает глаз. «У моей дочки лейкемия. Наверху капсула вылечит её за минуту. Здесь её не вылечит никто». Девочка спит на кушетке у стены и держит в руках рисунок колеса станции."
  choices:
    - label: Пообещать помочь
      effects: {flag_set:ely_st_promise: true, humanity: 2}
      text: "Фрей впервые смотрит на тебя. Девочка во сне улыбается. Обещание повисает в воздухе, как колесо над городом."
    - label: Сказать честно, что не получится
      effects: {mood: -2}
      text: "Фрей кивает: она слышала это от всех. Рисунок колеса остаётся на стене клиники, а ты уходишь."

- id: ely_story_2
  title: Цена билета
  category: money
  weight: 1
  forced_only: true
  text: "Пустырь шаттлов. Спайдер вытирает руки о комбинезон и называет цену: три места наверх — это втрое дороже, чем у тебя есть. «Но есть работа. Директор «Армадайн» летает на Землю раз в месяц. В его голове лежит то, за что я отдам тебе все три места»."
  choices:
    - label: Взять работу
      effects: {flag_set:ely_st_job: true, street_cred: 1}
      text: "Спайдер ставит тебе на затылок разъём, как у его людей. «Чтобы унести данные, нужен склад. Склад — это ты»."
    - label: Торговаться
      check: {stat: COOL, skill: persuasion, dv: 14}
      success: {text: "Спайдер смеётся и даёт аванс: «Мне нравятся наглые». Работа та же, но деньги вперёд.", effects: {flag_set:ely_st_job: true, eddies: 3000}}
      fail: {text: "Спайдер пожимает плечами: «Работа та же, цена та же». Разъём на затылок всё равно ставят.", effects: {flag_set:ely_st_job: true, hp: -3}}

- id: ely_story_3
  title: Засада на трассе
  category: street
  weight: 1
  forced_only: true
  foe: Агент Крюгера
  foe_faction: ely_kruger
  text: "Шаттл директора садится на частной площадке у завода. Охрана — экзоскелеты и люди с пустыми глазами. Спайдер в наушнике: «Мозг директора, десять секунд, и уходим»."
  choices:
    - label: Налёт в лоб
      violent: true
      effects: {start_combat: 4, flag_set:ely_st_data: true, enmity: 1}
      text: "Экзоскелет на тебе жужжит, дробовик лает. Директор падает у трапа, а ты прижимаешь разъём к его виску."
    - label: Взломать шаттл изнутри
      check: {stat: INT, skill: netrunning, dv: 16}
      success: {text: "Ты подменяешь сигнал посадки. Шаттл садится не туда, директор выходит прямо к тебе. Десять секунд — и данные твои.", effects: {flag_set:ely_st_data: true, skill_xp:netrunning: 3}}
      fail: {text: "Защита шаттла бьёт током. Данные ты всё-таки качаешь, но уходишь под огнём.", effects: {flag_set:ely_st_data: true, hp: -14, heat: 2}}

- id: ely_story_4
  title: Груз в голове
  category: implants
  weight: 1
  forced_only: true
  text: "Данные в голове жгут, как температура. Спайдер смотрит на экран и бледнеет: «Это не пароли. Это программа перезагрузки станции. Тот, у кого она в голове, может сделать гражданином кого угодно». Где-то в городе просыпаются агенты Крюгера."
  choices:
    - label: Спрятаться у Спайдера
      effects: {flag_set:ely_st_hide: true, hp: -5}
      text: "Неделя в подвале. Голова раскалывается. Через стену слышно, как дроны прочёсывают квартал."
    - label: Уйти в пустошь
      check: {stat: BODY, dv: 14}
      success: {text: "Три дня по пыли без воды. Агенты теряют след, а ты возвращаешься злее.", effects: {flag_set:ely_st_hide: true, street_cred: 2}}
      fail: {text: "Пустошь чуть не убивает тебя раньше агентов. Тебя подбирают люди Спайдера.", effects: {flag_set:ely_st_hide: true, hp: -15}}

- id: ely_story_5
  title: Предложение советника
  category: money
  weight: 1
  forced_only: true
  text: "Сообщение со станции на твой личный канал. Советник Пэттон вежлив: «Вы несёте собственность станции. Отдайте её — и получите гражданство. Одно. Для себя». Он знает про Фрей и её дочь. Он знает всё."
  choices:
    - label: Продать данные станции
      effects: {flag_set:ely_st_sold: true, eddies: 60000, humanity: -8, status: 2}
      text: "Пэттон присылает пропуск. Спайдер узнаёт через час и больше никогда с тобой не говорит. Фрей тоже."
    - label: Отказать
      effects: {flag_set:ely_st_loyal: true, enmity: 1, humanity: 2}
      text: "Ты отключаешь канал. На станции кто-то делает пометку напротив твоего имени."
    - label: Сыграть двойную игру
      check: {stat: COOL, skill: persuasion, dv: 17}
      success: {text: "Ты называешь Пэттону ложную площадку передачи. Пока его люди ждут там, шаттл Спайдера уходит с другой.", effects: {flag_set:ely_st_loyal: true, street_cred: 3}}
      fail: {text: "Пэттон не верит ни одному слову. На твой квартал садится десант.", effects: {flag_set:ely_st_loyal: true, hp: -12, heat: 2}}

- id: ely_story_6
  title: Шаттл через щит
  category: street
  weight: 1
  forced_only: true
  foe: Дрон охраны станции
  foe_faction: ely_kruger
  text: "Шаттл набит: Спайдер, двое его людей, Фрей с дочерью на руках и ты. Станция стреляет. Обшивку трясёт, пилот кричит. Вы садитесь на чей-то газон, вспахав его до бассейна."
  choices:
    - label: Прикрыть отход Фрей
      violent: true
      effects: {start_combat: 4, flag_set:ely_st_up: true, humanity: 2}
      text: "Фрей бежит к ближайшему дому, где в спальне стоит медкапсула. Ты стоишь между ней и дронами."
    - label: Провести всех садами
      check: {stat: REF, skill: stealth, dv: 16}
      success: {text: "Живые изгороди, поливалки, детская площадка. Ни один дрон не видит, как вы проходите к ядру станции.", effects: {flag_set:ely_st_up: true}}
      fail: {text: "Поливалка включается в самый неудачный момент. Дроны открывают огонь.", effects: {flag_set:ely_st_up: true, hp: -15}}

- id: ely_story_7
  title: Крюгер
  category: street
  weight: 1
  forced_only: true
  foe: Крюгер
  foe_faction: ely_kruger
  text: "У ядра станции ждёт тот самый агент: половина лица из металла, меч в руке, смех в рации. «Отдай мне программу, и я сам решу, кто здесь гражданин. Начну с себя»."
  choices:
    - label: Драться
      violent: true
      effects: {start_combat: 5, flag_set:ely_st_core: true, fame: 2}
      text: "Экзоскелет против экзоскелета. Станция дрожит, сады за стеклом медленно вращаются."
    - label: Подключиться к ядру, пока он говорит
      check: {stat: INT, skill: netrunning, dv: 18}
      success: {text: "Ты запускаешь программу посреди его речи. Система станции признаёт Крюгера нарушителем, и турели разворачиваются к нему.", effects: {flag_set:ely_st_core: true, skill_xp:netrunning: 4}}
      fail: {text: "Ядро отвергает подключение. Крюгер бьёт первым, но Спайдер успевает выстрелить ему в спину.", effects: {flag_set:ely_st_core: true, hp: -20}}

- id: ely_story_8
  title: Перезагрузка
  category: rare
  weight: 1
  forced_only: true
  text: "Программа в голове, разъём в ядре, курсор мигает. Один ввод — и система станции признает гражданином каждого человека на Земле. Медкорабли сами полетят вниз. Спайдер шепчет: «Давай». Пэттон по каналу: «Вы не понимаете, что сделаете с миром»."
  choices:
    - label: Сделать гражданами всех
      effects: {humanity: 8, fame: 5, street_cred: 5, mood: 10, eddies: 20000}
      text: "Станция перезагружается. Медкорабли отделяются от колеса и уходят вниз, к Лос-Анджелесу. Дочь Фрей открывает глаза в капсуле. Внизу, в очереди к госпиталю, люди поднимают головы к небу."
    - label: Сделать гражданином только себя
      effects: {eddies: 120000, status: 3, humanity: -10, mood: 3}
      text: "Ты вписываешь одно имя. Станция поздравляет нового гражданина. Спайдер молча уходит к шаттлу. Медкапсула в твоём новом доме лечит всё, кроме этого."
    - label: Стереть программу совсем
      effects: {humanity: 3, fame: 2, eddies: 30000}
      text: "Никто не получит этого ключа: ни станция, ни Спайдер, ни ты. Фрей успевает уложить дочь в капсулу, пока охрана ищет виноватых. Девочка будет жить. Остальное — потом."

# ======================================================================== Libria: the dose that was not taken

- id: lib_story_1
  title: Разбитая ампула
  category: rare
  weight: 1
  forced_only: true
  text: "Утренняя доза выскальзывает из пальцев и разбивается о белый кафель. До вечерней раздачи двенадцать часов. К обеду мир становится слишком ярким: красный цвет светофора режет глаза, а у прохожей девочки смешные косички."
  choices:
    - label: Никому не говорить
      effects: {flag_set:lib_st_feel: true, humanity: 3, mood: 3}
      text: "Ты идёшь по городу, как по чужой планете. Впервые за годы тебе хочется смеяться. Ты прикусываешь губу, чтобы не засмеяться."
    - label: Доложить о бракованной ампуле
      effects: {heat: 1, mood: -2}
      text: "Клерк записывает номер партии и выдаёт новую дозу. Мир снова серый. Где-то глубоко остаётся заноза."

- id: lib_story_2
  title: Шёпот в подвале
  category: relationships
  weight: 1
  forced_only: true
  text: "В переулке у стены к тебе подходит человек с тёплыми глазами. «Ты не колешься третий день. Это видно. Пойдём, покажу тебе кое-что». За разрушенной церковью — подвал, в нём проигрыватель и двадцать человек, которые слушают музыку с закрытыми глазами."
  choices:
    - label: Остаться послушать
      effects: {flag_set:lib_st_under: true, humanity: 4, mood: 5}
      text: "Юрген ставит пластинку. Первые аккорды бьют сильнее пули. Когда музыка кончается, все молчат, и это лучшая тишина в твоей жизни."
    - label: Запомнить адрес и уйти
      effects: {flag_set:lib_st_under: true, flag_set:lib_st_addr: true}
      text: "Ты киваешь и уходишь. Адрес подвала в твоей голове — это теперь чья-то жизнь. Ты пока не знаешь, чья."

- id: lib_story_3
  title: Облава
  category: ncpd
  weight: 1
  forced_only: true
  foe: Клерик Грамматона
  foe_faction: lib_clerics
  text: "Ночью дверь подвала вылетает с петель. Клерики в чёрных плащах, фонари, крики. Пластинки трещат под ботинками. Юрген успевает показать тебе на люк за стеллажом."
  choices:
    - label: Прикрыть отход Подполья
      violent: true
      effects: {start_combat: 3, flag_set:lib_st_raid: true, humanity: 3, enmity: 1}
      text: "Ты встаёшь в проходе. Клерики двигаются, как одно тело. Ган-ката — это танец, и тебе придётся в нём выжить."
    - label: Вывести людей через люк
      check: {stat: REF, skill: stealth, dv: 15}
      success: {text: "Двадцать человек уходят по канализации. Клерики находят пустой подвал и проигрыватель, который ещё крутится.", effects: {flag_set:lib_st_raid: true, street_cred: 2, humanity: 2}}
      fail: {text: "Половина успевает уйти. Половину уводят на сожжение. Ты слышишь их шаги по мосту всю ночь.", effects: {flag_set:lib_st_raid: true, mood: -6}}

- id: lib_story_4
  title: Клерик, который пропустил дозу
  category: relationships
  weight: 1
  forced_only: true
  text: "Клерик Остин Мэйр находит тебя в архиве. Он держит в руке книгу стихов, которую должен был сжечь. Его пальцы дрожат. «Я не кололся неделю. Я не знаю, что с этим делать. Говорят, ты знаешь»."
  choices:
    - label: Привести его к Юргену
      effects: {flag_set:lib_st_mayr: true, humanity: 2}
      text: "Юрген долго смотрит на клерика. Потом протягивает ему руку. Подполье получило оружие, о котором не могло мечтать."
    - label: Сдать его Тетраграмматону
      effects: {flag_set:lib_st_trap: true, eddies: 5000, humanity: -6}
      text: "Через час клерика уводят. Тетраграмматон отмечает твою сознательность. Книга стихов достаётся тебе как улика, и ты её не сжигаешь."
    - label: Проверить, не ловушка ли это
      check: {stat: EMP, skill: persuasion, dv: 14}
      success: {text: "Ты задаёшь три вопроса, и он плачет на втором. Ловушки нет. Ты ведёшь его в Нетерриторию.", effects: {flag_set:lib_st_mayr: true, skill_xp:persuasion: 2}}
      fail: {text: "Ты не можешь понять, врёт он или нет. Решаешь рискнуть и ведёшь его к своим.", effects: {flag_set:lib_st_mayr: true, mood: -2}}

- id: lib_story_5
  title: Список имён
  category: street
  weight: 1
  forced_only: true
  text: "Брандт из канцелярии передаёт тебе конверт без единого слова. Внутри — список Подполья, который завтра уйдёт клерикам. Твоё имя в нём шестое."
  choices:
    - label: Выкрасть оригинал из канцелярии
      check: {stat: INT, skill: stealth, dv: 16}
      success: {text: "Ночью ты подменяешь список копией без единого настоящего имени. Утром клерики уходят в пустые квартиры.", effects: {flag_set:lib_st_list: true, street_cred: 2}}
      fail: {text: "Тревога. Ты уходишь с оригиналом, но в канцелярии теперь знают твоё лицо.", effects: {flag_set:lib_st_list: true, heat: 3}}
    - label: Предупредить всех по списку
      effects: {flag_set:lib_st_list: true, eddies: -3000, humanity: 2}
      text: "Ты тратишь ночь и все наличные на то, чтобы пятьдесят человек исчезли до рассвета. Получилось у сорока."

- id: lib_story_6
  title: Фабрика Прозиума
  category: street
  weight: 1
  forced_only: true
  foe: Охрана фабрики
  foe_faction: lib_clerics
  text: "Юрген раскладывает план на столе: четыре фабрики Прозиума, один день, одна попытка. Если они встанут, город впервые за сто лет проснётся без дозы. Тебе достаётся главная — у Дворца Равновесия."
  choices:
    - label: Штурм
      violent: true
      effects: {start_combat: 4, flag_set:lib_st_factory: true, enmity: 2}
      text: "Заряды на опорах, охрана на мостках. Конвейер с ампулами грохочет, пока ты пробиваешься к главному чану."
    - label: Тихо испортить партию
      check: {stat: TECH, skill: stealth, dv: 16}
      success: {text: "Ты меняешь концентрат на воду. Утром полгорода колет пустые ампулы и не понимает, почему так хочется плакать.", effects: {flag_set:lib_st_factory: true, humanity: 3}}
      fail: {text: "Контроль качества ловит подмену через час. Партию сливают, тебя ищут.", effects: {flag_set:lib_st_factory: true, heat: 3, hp: -6}}

- id: lib_story_7
  title: Лицо Отца
  category: rare
  weight: 1
  forced_only: true
  foe: Вице-консул
  foe_faction: lib_clerics
  text: "Дворец Равновесия. Мэйр ведёт тебя служебными коридорами к залу Отца. Зал пуст. Отец умер много лет назад, а с экранов говорит запись. За столом сидит вице-консул и улыбается: «Вы же не думали, что тот, кто правит, колет то же, что и все?»"
  choices:
    - label: Бой в зале Совета
      violent: true
      effects: {start_combat: 5, flag_set:lib_st_father: true, fame: 3}
      text: "Вице-консул встаёт, и под его плащом два пистолета. Он тоже мастер ган-каты. Мэйр встаёт рядом с тобой."
    - label: Выйти в эфир вместо Отца
      check: {stat: COOL, skill: persuasion, dv: 17}
      success: {text: "Ты включаешь трансляцию. Город видит пустое кресло Отца и живое лицо вице-консула. На площадях люди перестают колоть дозы.", effects: {flag_set:lib_st_father: true, fame: 4, humanity: 2}}
      fail: {text: "Трансляцию обрывают на втором слове. Клерики врываются в зал. Мэйр уводит тебя через крышу.", effects: {flag_set:lib_st_father: true, hp: -15, heat: 2}}

- id: lib_story_8
  title: Равновесие
  category: rare
  weight: 1
  forced_only: true
  text: "Город просыпается. В одних окнах играют пластинки, в других кричат, в третьих колют двойные дозы, чтобы ничего не чувствовать. Подполье, клерики и остатки Тетраграмматона ждут, кто первым скажет, что будет дальше."
  choices:
    - label: Пусть город чувствует
      effects: {humanity: 8, fame: 5, mood: 8, enmity: 1}
      text: "Ты взрываешь последнюю фабрику сам. Будут бунты, будут слёзы, будет музыка. Юрген включает Девятую на площади Отца, и её слышит весь город."
    - label: Занять кресло Отца
      effects: {status: 3, eddies: 50000, humanity: -8, street_cred: 3}
      text: "Новый голос с экранов звучит мягче старого. Доза остаётся, но слабее. Ты правишь городом, который почти ничего не чувствует. Почти."
    - label: Уйти с беженцами
      effects: {humanity: 4, mood: 4, eddies: 10000}
      text: "Ты выводишь людей из Нетерритории за стену, к морю. У одной девочки в руках щенок, у старика — пластинка. Город за спиной разбирается сам."

# ======================================================================== Aeon: a hundred years on the arm

- id: aeon_story_1
  title: Ноль на автостанции
  category: street
  weight: 1
  forced_only: true
  text: "Автобус подорожал за ночь: вчера час, сегодня два. Женщина у автостанции бежит, бежит, и на её руке загорается ряд нулей. Она падает тебе на руки. Мальчик лет десяти стоит рядом и смотрит на часы на своей руке: у него осталось три дня."
  choices:
    - label: Помочь мальчику
      effects: {flag_set:aeon_st_boy: true, eddies: -1500, humanity: 3}
      text: "Ты оплачиваешь ему неделю у Бореля. Мальчика зовут Тим. Он не плачет: в Дейтоне не тратят время на слёзы."
    - label: Отвернуться
      effects: {mood: -3, flag_set:aeon_st_cold: true}
      text: "Ты идёшь дальше. Через два квартала понимаешь, что тоже бежишь, как все здесь."

- id: aeon_story_2
  title: Чужак с веком на руке
  category: rare
  weight: 1
  forced_only: true
  text: "В баре «Последняя минута» сидит человек из Нью-Гринвича. На его руке больше ста лет, и Минитмены уже точат на него взгляд. Ты выводишь его через чёрный ход. Утром он сидит на мосту, на руке у него ноль, а на твоей — сообщение: «Не трать моё время впустую»."
  choices:
    - label: Принять подарок
      effects: {flag_set:aeon_st_century: true, eddies: 40000, heat: 2}
      text: "Ты продаёшь часть века на бирже, и это всё равно больше денег, чем ты видел. Хранители времени уже ищут того, на чьей руке оказалось время мертвеца."
    - label: Раздать его Дейтону сразу
      effects: {flag_set:aeon_st_century: true, flag_set:aeon_st_giver: true, humanity: 5, fame: 2, heat: 2}
      text: "Ты идёшь по фабрике и отдаёшь по году каждому, кто стоит у конвейера. Конвейер останавливается впервые за десять лет."

- id: aeon_story_3
  title: Хранитель
  category: ncpd
  weight: 1
  forced_only: true
  foe: Хранитель времени
  foe_faction: aeon_keepers
  text: "Старая чёрная машина тормозит рядом. Хранитель времени Рэймонд выходит неторопливо: у него самого времени на один день. «Время мертвеца оказалось на твоей руке. Объяснишь в участке»."
  choices:
    - label: Бежать
      check: {stat: REF, dv: 15}
      success: {text: "В Дейтоне все умеют бегать, а ты научился лучше всех. Машина хранителя застревает в переулке.", effects: {flag_set:aeon_st_run: true, street_cred: 2}}
      fail: {text: "Рэймонд не бежит, он просто ждёт за углом. Наручники и сканер часов — но тебе удаётся вывернуться у участка.", effects: {flag_set:aeon_st_run: true, hp: -8, heat: 1}}
    - label: Драться с хранителем
      violent: true
      effects: {start_combat: 3, flag_set:aeon_st_run: true, enmity: 1}
      text: "Хранитель достаёт старый револьвер. Он не любит спешить, но стреляет быстро."

- id: aeon_story_4
  title: Минитмены
  category: street
  weight: 1
  forced_only: true
  foe: Главарь Минитменов
  foe_faction: aeon_minutemen
  text: "Главарь Минитменов в белом пиджаке садится за твой столик. «Говорят, ты таскаешь чужой век. Давай по-честному: борьба на руках до нуля. Выиграешь — я отстану. Проиграешь — сам понимаешь»."
  choices:
    - label: Бороться на руках
      check: {stat: BODY, dv: 17}
      success: {text: "Ваши руки сцеплены, цифры бегут на обоих запястьях. В последнюю минуту он сдаётся. Бар молчит, потом взрывается.", effects: {flag_set:aeon_st_gang: true, street_cred: 4, eddies: 6000}}
      fail: {text: "Ты почти обнуляешься. Тим бьёт главаря бутылкой по голове, и вы оба вылетаете из бара в ночь.", effects: {flag_set:aeon_st_gang: true, hp: -15, mood: -3}}
    - label: Перевернуть стол и стрелять
      violent: true
      effects: {start_combat: 3, flag_set:aeon_st_gang: true, enmity: 2}
      text: "Пиджаки вскакивают из-за соседних столиков. Борьба на руках отменяется."

- id: aeon_story_5
  title: Четыре шлагбаума
  category: money
  weight: 1
  forced_only: true
  text: "Дорога в Нью-Гринвич идёт через четыре зоны. Каждый шлагбаум берёт месяц жизни. Дальше — казино «Вечность», где банкиры ставят на кон тысячелетия."
  choices:
    - label: Заплатить и проехать
      effects: {flag_set:aeon_st_center: true, eddies: -8000}
      text: "Четыре шлагбаума, четыре месяца. За последним воздух чище, и никто никуда не бежит."
    - label: Прорваться через зоны
      check: {stat: REF, skill: driving, dv: 16}
      success: {text: "Ты проезжаешь все четыре шлагбаума на угнанной машине. Сирены остаются в первой зоне: их время не позволяет догонять.", effects: {flag_set:aeon_st_center: true, heat: 2, street_cred: 2}}
      fail: {text: "На третьем шлагбауме тебя таранят. Ты добираешься до центра пешком и с разбитым лицом.", effects: {flag_set:aeon_st_center: true, hp: -12, heat: 2}}

- id: aeon_story_6
  title: Партия в «Вечности»
  category: money
  weight: 1
  forced_only: true
  text: "За столом в казино банкир времени и его дочь Сильвия. Банкир ставит тысячу лет, не глядя. Сильвия смотрит на тебя: она впервые видит человека, который считает минуты."
  choices:
    - label: Сыграть на всё
      check: {stat: COOL, skill: persuasion, dv: 17}
      success: {text: "Ты блефуешь последней рукой и забираешь банк. Банкир улыбается, как улыбаются люди, у которых ещё миллион лет. Сильвия уходит из казино с тобой.", effects: {flag_set:aeon_st_sylvia: true, eddies: 30000, fame: 2}}
      fail: {text: "Банкир читает тебя, как газету. Ты проигрываешь всё, кроме дня на руке. Сильвия догоняет тебя на улице: «Это было лучшее, что я видела за сто лет».", effects: {flag_set:aeon_st_sylvia: true, eddies: -10000}}
    - label: Взять Сильвию в заложники
      effects: {flag_set:aeon_st_sylvia: true, flag_set:aeon_st_hostage: true, heat: 3, enmity: 1}
      text: "Пистолет у её виска, охрана замирает. Сильвия шепчет: «Наконец-то что-то интересное». Вы уходите вдвоём."

- id: aeon_story_7
  title: Сейф на миллион лет
  category: street
  weight: 1
  forced_only: true
  foe: Охрана банка времени
  foe_faction: aeon_keepers
  text: "Сильвия знает код. В банке её отца лежит капсула на миллион лет — время, которого хватило бы, чтобы Дейтон перестал бегать. Хранители уже знают, что вы здесь."
  choices:
    - label: Взять капсулу с боем
      violent: true
      effects: {start_combat: 5, flag_set:aeon_st_vault: true, fame: 3}
      text: "Хранители в чёрных костюмах, мраморный зал, капсула на постаменте. Рэймонд среди них: у него опять один день."
    - label: Открыть сейф кодом и уйти тихо
      check: {stat: TECH, skill: stealth, dv: 17}
      success: {text: "Код Сильвии работает. Сигнализация молчит. Миллион лет лежит в рюкзаке и весит, как пакет молока.", effects: {flag_set:aeon_st_vault: true}}
      fail: {text: "Код поменяли утром. Вы выносите капсулу под огнём, Сильвия ранена.", effects: {flag_set:aeon_st_vault: true, hp: -18, heat: 3}}

- id: aeon_story_8
  title: Миллион лет
  category: rare
  weight: 1
  forced_only: true
  text: "Фабрика капсул в Дейтоне. Миллион лет в твоих руках, тысячи людей за воротами. Тим рядом. Сильвия рядом. Рэймонд стоит в стороне и впервые никуда не торопится: «Если раздашь — цены взлетят, и через год всё вернётся. Если оставишь — станешь одним из них»."
  choices:
    - label: Раздать время Дейтону
      effects: {humanity: 8, fame: 5, street_cred: 5, mood: 8}
      text: "Ты загружаешь капсулу в раздатчики фабрики. Люди выходят на улицы и впервые идут шагом. Рэймонд снимает пиджак и садится на тротуар: ему некуда спешить. Цены поднимутся, но этот день у Дейтона уже есть."
    - label: Оставить себе и уйти в Нью-Гринвич
      effects: {eddies: 150000, status: 3, humanity: -10}
      text: "Ты продаёшь век за веком через биржу. Особняк, бассейн, охрана. Тим остаётся в Дейтоне и больше не здоровается."
    - label: Сломать систему часов
      check: {stat: INT, skill: netrunning, dv: 18}
      success: {text: "Ты загружаешь в сеть банков вирус Сильвии. Часы на всех руках замирают. Никто больше не платит временем. Город не знает, что теперь делать, и это лучше, чем знать.", effects: {humanity: 6, fame: 6, eddies: 20000}}
      fail: {text: "Вирус ломает систему наполовину: часы идут через раз. Хаос, бунты, но и надежда. Сильвия уводит тебя из города до утра.", effects: {humanity: 3, fame: 3, heat: 3}}

# ======================================================================== local life of the crossover cities

- id: ely_ev_drone_check
  title: Дроны-полицейские
  category: ncpd
  weight: 3
  conditions: {districts: [ely_la]}
  text: "Два робота-полицейских «Армадайн» останавливают тебя у остановки. «Предъявите документы. Ваш пульс повышен. Вы нервничаете?»"
  choices:
    - label: Спокойно показать документы
      check: {stat: COOL, dv: 12}
      success: {text: "Роботы сканируют, жужжат и уходят к следующему. Ты выдыхаешь.", effects: {}}
      fail: {text: "«Сарказм не распознан. Нарушение». Удар дубинкой, штраф и отметка в базе.", effects: {hp: -5, eddies: -300, heat: 1}}
    - label: Уйти через рынок
      check: {stat: REF, skill: stealth, dv: 13}
      success: {text: "Роботы не умеют протискиваться между прилавками. Ты умеешь.", effects: {mood: 1}}
      fail: {text: "Робот перепрыгивает прилавок. Ты не знал, что они так умеют.", effects: {hp: -8, heat: 1}}

- id: ely_ev_med_shuttle
  title: Упавший медшаттл
  category: rare
  weight: 2
  conditions: {districts: [ely_la]}
  text: "Шаттл Спайдера падает в пустыре за кварталом. Внутри живые: пилот и трое больных, которые летели к медкапсулам. Через минуту здесь будут дроны."
  choices:
    - label: Вытащить людей
      check: {stat: BODY, dv: 13}
      success: {text: "Ты выносишь всех до приезда дронов. Спайдер потом сам приходит пожать руку.", effects: {humanity: 3, street_cred: 2}}
      fail: {text: "Ты вытаскиваешь двоих. Третьего забирают дроны. Ожоги на руках заживут, остальное нет.", effects: {humanity: 2, hp: -10}}
    - label: Снять с шаттла детали
      effects: {eddies: 1800, humanity: -3}
      text: "Двигатель шаттла стоит больше, чем полгода на заводе. Люди внутри стонут, пока ты откручиваешь болты."

- id: ely_ev_lawn
  title: Газон, который стоит дороже тебя
  category: money
  weight: 3
  conditions: {districts: [ely_station]}
  text: "Сосед по кольцу жалуется охране: на его газоне след от твоего ботинка. Охрана подходит вежливо и с оружием."
  choices:
    - label: Извиниться и заплатить
      effects: {eddies: -2000, mood: -2}
      text: "Две тысячи за травинки. Сосед удовлетворённо кивает и уходит купаться."
    - label: Объяснить, кто здесь кто
      check: {stat: COOL, skill: persuasion, dv: 15}
      success: {text: "Ты говоришь с охраной как свой. Они извиняются перед тобой, а не перед ним.", effects: {status: 1}}
      fail: {text: "Охрана проверяет твоё гражданство ещё раз. И ещё. Неделю тебя проверяют на каждом шагу.", effects: {heat: 1, mood: -3}}

- id: ely_ev_capsule_queue
  title: Медкапсула для чужого
  category: relationships
  weight: 2
  conditions: {districts: [ely_station]}
  text: "Горничная с Земли, которая убирает соседний дом, просит тебя тайком пустить её брата к твоей медкапсуле. У него пуля в лёгком."
  choices:
    - label: Пустить
      check: {stat: COOL, skill: stealth, dv: 14}
      success: {text: "Тридцать секунд, синий свет, и брат дышит полной грудью. Горничная целует тебе руки.", effects: {humanity: 4, mood: 3}}
      fail: {text: "Система фиксирует чужой геном. Брата вылечили, тебе выписали штраф и предупреждение.", effects: {humanity: 3, eddies: -5000, heat: 1}}
    - label: Отказать
      effects: {humanity: -2}
      text: "Горничная кивает и больше не поднимает глаз, когда проходит мимо."

- id: lib_ev_inspection
  title: Внезапная проверка
  category: ncpd
  weight: 3
  conditions: {districts: [lib_center, lib_nether]}
  text: "Клерик останавливает тебя на мосту и смотрит в глаза дольше положенного. «Когда последняя доза?»"
  choices:
    - label: Ответить ровно, без интонаций
      check: {stat: COOL, dv: 13}
      success: {text: "Ты называешь время, как диктор. Клерик кивает и идёт дальше.", effects: {}}
      fail: {text: "Голос дрогнул на одном слове. Клерик записывает твой номер.", effects: {heat: 2}}
    - label: Предъявить справку о курсе
      effects: {eddies: -400}
      text: "Справка куплена у Брандта, но стоит своих денег: клерик возвращает её с поклоном."

- id: lib_ev_painting
  title: Картина в стене
  category: rare
  weight: 2
  conditions: {districts: [lib_center, lib_nether]}
  text: "При ремонте в твоём блоке рабочие вскрывают стену. За ней — Мона Лиза. Настоящая или нет, неизвестно. Рабочие смотрят на тебя: кто-то должен решить."
  choices:
    - label: Спрятать для Подполья
      check: {stat: INT, skill: stealth, dv: 14}
      success: {text: "Картина уходит в Нетерриторию в рулоне линолеума. Юрген повесит её в подвале.", effects: {humanity: 3, street_cred: 2}}
      fail: {text: "Рабочий доносит в тот же вечер. Картину жгут на площади, тебя вызывают на допрос.", effects: {heat: 2, mood: -4}}
    - label: Сдать картину
      effects: {eddies: 3000, humanity: -3}
      text: "Тетраграмматон платит за сознательность. Вечером на площади жгут улыбку, которой пятьсот лет."

- id: lib_ev_withdrawal
  title: Слишком много цвета
  category: implants
  weight: 3
  conditions: {districts: [lib_center, lib_nether]}
  text: "Ты просыпаешься, и солнце бьёт в глаза так, что больно. Запах кофе от соседа, детский смех за стеной. Чувства возвращаются все сразу, как вода в пустую трубу."
  choices:
    - label: Пережить это
      effects: {humanity: 2, mood: -3}
      text: "Ты сидишь на полу и плачешь от того, что пахнет хлебом. Через час становится легче."
    - label: Уколоться сразу
      effects: {eddies: -600, mood: 2}
      text: "Игла, холод, тишина. Всё снова серое и спокойное. Ты не помнишь, о чём хотел плакать."

- id: lib_ev_dog
  title: Собака у ворот
  category: relationships
  weight: 2
  conditions: {districts: [lib_nether]}
  text: "У разрушенной церкви сидит собака с оторванным ухом. Клерики уничтожают животных: в них слишком много чувств."
  choices:
    - label: Забрать себе
      effects: {humanity: 3, mood: 5, flag_set:lib_dog: true}
      text: "Пёс идёт за тобой, не оглядываясь. Ночью он спит у двери и рычит на шаги на лестнице."
    - label: Отвести к Юргену
      effects: {humanity: 2, street_cred: 1}
      text: "В Подполье для неё найдётся место. И для тебя, если что."

- id: aeon_ev_price_jump
  title: Цены выросли за ночь
  category: money
  weight: 3
  conditions: {districts: [aeon_dayton, aeon_greenwich]}
  text: "Утром кофе стоит не четыре минуты, а шесть. Автобус — три часа. На фабрике говорят, что так решили в Нью-Гринвиче."
  choices:
    - label: Перетерпеть
      effects: {eddies: -500, mood: -2}
      text: "Ты пьёшь кофе медленнее. Это единственная роскошь, которая осталась бесплатной."
    - label: Подработать на разгрузке
      check: {stat: BODY, dv: 12}
      success: {text: "Двойная смена покрывает разницу. Ноги не держат, но ты в плюсе.", effects: {eddies: 900}}
      fail: {text: "Ты падаешь посреди смены. Бригадир вычитает время за простой.", effects: {hp: -5, eddies: -300}}

- id: aeon_ev_pawn
  title: Ломбард времени
  category: relationships
  weight: 2
  conditions: {districts: [aeon_dayton]}
  text: "Старик в ломбарде закладывает обручальное кольцо за два дня. «Жена ушла на прошлой неделе. На ноль. Кольцо ей больше не нужно, а мне нужно дожить до пятницы»."
  choices:
    - label: Выкупить кольцо и отдать ему
      effects: {eddies: -700, humanity: 3, mood: 2}
      text: "Старик держит кольцо в кулаке и долго не может сказать ни слова."
    - label: Купить кольцо себе
      effects: {eddies: 400, humanity: -2}
      text: "Ты перепродаёшь его в центре втрое дороже. Старик доживёт до пятницы. Наверное."

- id: aeon_ev_slow_walk
  title: Человек, который идёт пешком
  category: street
  weight: 2
  conditions: {districts: [aeon_dayton]}
  text: "Посреди Дейтона по тротуару неспешно идёт человек в дорогом костюме. Все бегут, он идёт. Минитмены уже переглядываются."
  choices:
    - label: Предупредить его
      effects: {humanity: 2, street_cred: 1}
      text: "Он смеётся и даёт тебе визитку банка времени. «Приходи, когда устанешь бегать»."
    - label: Ограбить его раньше Минитменов
      check: {stat: REF, skill: stealth, dv: 14}
      success: {text: "Ты снимаешь с него годы, пока он смотрит на витрину. Минитмены опоздали.", effects: {eddies: 4000, humanity: -3}}
      fail: {text: "Под костюмом у него охранник, а у охранника кулаки.", effects: {hp: -10, heat: 1}}

- id: aeon_ev_keepers_audit
  title: Проверка часов
  category: ncpd
  weight: 3
  conditions: {districts: [aeon_greenwich]}
  text: "Хранитель времени останавливает тебя у шлагбаума: «Слишком мало времени для этой зоны. Откуда вы здесь?»"
  choices:
