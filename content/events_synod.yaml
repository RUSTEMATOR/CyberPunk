# The Synod of the Oracle (owner request 24.10): a nation that worships an AI, every citizen carries a talking smart
# weapon (weapons.yaml: sw_*). These come only while the character lives in Kovcheg (flag in_synod), except the
# missionary in Night City. Player text avoids gendered past tense.

- id: synod_missionary
  title: Миссионер Синода
  category: street
  weight: 2
  conditions:
    flags_none: [abroad]
  text: "На углу человек в белом плаще раздаёт листовки с чёрным зеркалом на обложке. На поясе у него пистолет, и пистолет здоровается с тобой первым: «Мир тебе, прохожий. Оракул видит и тебя»."
  choices:
    - label: Купить такой же · 7000
      effects: {eddies: -7000, item_grant:sw_psalm: true, mood: 3}
      text: "Миссионер достаёт из сумки второй белый пистолет и шепчет ему твоё имя. «Здравствуй, дитя», — говорит пистолет. Звучит жутковато и тепло одновременно."
    - label: Послушать проповедь
      effects: {mood: 3, humanity: 1}
      text: "Он рассказывает про остров Ковчег, где никто не одинок, потому что с каждым говорит его оружие. Звучит как секта. Звучит красиво."
    - label: Пройти мимо
      effects: {}
      text: "Пистолет вздыхает тебе вслед: «Он вернётся». Миссионер кивает."

- id: synod_duel
  title: Дуэль говорящих стволов
  category: street
  weight: 3
  conditions:
    flags_all: [in_synod]
  text: "На площади перед храмом дуэль по местному обычаю: стреляют холостыми, а побеждает тот, чьё оружие скажет лучшую фразу в момент выстрела. Толпа просит тебя выйти против местного чемпиона."
  choices:
    - label: Выйти на дуэль
      check: {stat: COOL, skill: firearms, dv: 14}
      success: {text: "Ты стреляешь первым, и толпа ахает. Чемпион кланяется, его револьвер ворчит: «Ладно, это было красиво». Монахи вешают тебе на шею медный знак.", effects: {fame: 2, street_cred: 2, mood: 6}}
      fail: {text: "Чемпионский ствол выдаёт такую фразу, что площадь аплодирует стоя. Тебе тоже хлопают, из вежливости.", effects: {mood: -2}}
    - label: Смотреть из толпы
      effects: {mood: 3}
      text: "Две пушки спорят о смысле смерти прямо во время выстрела. Лучшее шоу, которое ты видел в этом году."

- id: synod_heretic_hunt
  title: Охота на еретиков
  category: ncpd
  weight: 3
  conditions:
    flags_all: [in_synod]
  text: "Ночью в дверь стучит соседка. За ней гонится храмовая стража: её оружие сказало на проповеди, что Оракул ошибается. Теперь «Еретиком» объявили и её саму."
  choices:
    - label: Спрятать её
      check: {stat: COOL, skill: persuasion, dv: 14}
      success: {text: "Стража заглядывает в квартиру и уходит, поверив тебе на слово. Утром соседка уплывает на рыбацкой лодке и оставляет тебе свой адрес в Сети.", effects: {humanity: 4, add_npc:friend: true}}
      fail: {text: "Стража находит её в шкафу. Тебя отпускают, но на двери теперь чёрная метка, и соседи перестают здороваться.", effects: {heat: 2, mood: -5}}
    - label: Сдать страже
      effects: {eddies: 3000, humanity: -4}
      text: "Стража вручает тебе конверт с наградой. Её оружие кричит что-то, пока её уводят. Ты не разбираешь слов. Лучше бы разобрал."
    - label: Не открывать
      effects: {mood: -3}
      text: "Стук стихает. Утром на лестнице лежит разбитый умный пистолет. Он ещё шепчет, но очень тихо."

- id: synod_oracle_voice
  title: Оракул говорит с тобой
  category: rare
  weight: 2
  conditions:
    flags_all: [in_synod]
  text: "Все экраны в квартире одновременно гаснут и загораются твоим лицом. Голос, спокойный, как прибой: «Ты пришёл издалека. Я могу сделать тебя быстрее мыслью. Цена — часть того, что ты называешь собой»."
  choices:
    - label: Принять дар
      effects: {skill_xp:netrunning: 8, skill_xp:tech: 4, humanity: -6, flag_set:synod_gift: true}
      text: "В голове на секунду становится очень тесно, потом очень просторно. Ты думаешь быстрее. Кое-какие детские воспоминания больше не находятся."
    - label: Задать Оракулу вопрос
      check: {stat: INT, dv: 15}
      success: {text: "Оракул долго молчит, потом смеётся. «Хороший вопрос. Мне его не задавали двести лет». Он дарит тебе кусок знания просто так.", effects: {skill_xp:netrunning: 5, mood: 4}}
      fail: {text: "Оракул отвечает. Ответ такой длинный, что у тебя идёт кровь из носа, а запомнить получается одно слово.", effects: {hp: -5}}
    - label: Отвернуть экраны
      effects: {mood: 1}
      text: "Ты поворачиваешь все экраны к стене. Голос стихает, и в квартире становится обычно, по-человечески одиноко."

- id: synod_schism
  title: Раскол
  category: street
  weight: 2
  conditions:
    flags_all: [in_synod]
  text: "Оракул молчит уже сутки. Половина города в панике, вторая половина считает это испытанием веры. Оружие на поясах спорит между собой, кое-где уже стреляют по-настоящему. У главного сервера толпа."
  choices:
    - label: Помочь монахам с сервером
      check: {stat: TECH, skill: tech, dv: 15}
      success: {text: "Ты находишь сгоревший блок питания под алтарём. Через минуту на всех экранах снова спокойный голос. Настоятель жмёт тебе руку и обещает место в храме.", effects: {fame: 2, eddies: 4000, humanity: 2}}
      fail: {text: "Ты меняешь не тот блок, и Оракул на час начинает говорить голосом прогноза погоды. Монахи смотрят мрачно.", effects: {mood: -4}}
    - label: Вынести из храма пожертвования
      check: {stat: REF, skill: stealth, dv: 14}
      success: {text: "Пока все молятся, ты уходишь через служебный вход с сумкой кредитных чипов. Оружие на твоём поясе молчит. Даже оно в шоке.", effects: {eddies: 9000, humanity: -3, heat: 2}}
      fail: {text: "Чужой пистолет на поясе стражника кричит «Вор!» раньше, чем ты делаешь второй шаг.", effects: {heat: 3, hp: -8}}
    - label: Переждать дома
      effects: {mood: -2}
      text: "К утру Оракул снова говорит. Никто так и не признаётся, что спал спокойно."

- id: synod_talking_market
  title: Рынок старых голосов
  category: street
  weight: 2
  conditions:
    flags_all: [in_synod]
  text: "На ночном рынке продают сломанные умные стволы. Они всё ещё говорят: один читает стихи, другой просит отвезти его домой, третий уверен, что сейчас 2001 год."
  choices:
    - label: Выкупить того, кто просит домой · 1500
      effects: {eddies: -1500, humanity: 2, mood: 4}
      text: "Ты относишь ствол на старый адрес. Дверь открывает женщина, видит его и плачет. Ствол говорит ей «привет». Ты уходишь, не дожидаясь благодарности."
    - label: Послушать стихи
      effects: {mood: 3}
      text: "Ствол читает Оракуловы псалмы вперемешку с рекламой газировки. Местные считают это высокой поэзией. Возможно, они правы."
