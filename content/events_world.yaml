# Life in the countries of the world (owner request 23.10). These come only while the character lives there
# (flag in_<country>, app/engine/abroad.py). Player text avoids gendered past tense.

- id: world_jp_quake
  title: Землетрясение в Токио
  category: street
  weight: 3
  conditions:
    flags_all: [in_japan]
  text: "Ночью дом качается, как лодка. Сирены, механический голос в каждом телефоне: «Сохраняйте спокойствие». Японцы спокойно выходят на улицу с заранее собранными рюкзаками. У тебя рюкзака нет."
  choices:
    - label: Помогать соседям
      check: {stat: BODY, dv: 13}
      success: {text: "Ты вытаскиваешь старушку с третьего этажа. Утром весь дом кланяется тебе в коридоре, а она приносит рисовые шарики каждый день неделю.", effects: {humanity: 2, mood: 4, add_npc:friend: true}}
      fail: {text: "Лестница обрушивается под ногами. Синяки, порезы и уважение соседей за попытку.", effects: {hp: -8, mood: 1}}
    - label: Спасаться самому
      effects: {mood: -2}
      text: "Ты выбегаешь на улицу в одном носке. Через час всё стихает. Японцы расходятся по домам, будто ничего не случилось."

- id: world_jp_salaryman
  title: Пьяный сарариман
  category: relationships
  weight: 3
  conditions:
    flags_all: [in_japan]
  text: "Полночь, последний поезд. Корпорат «Арасаки» в мятом костюме спит у тебя на плече. Из кармана торчит пропуск на сорок второй этаж штаб-квартиры."
  choices:
    - label: Довезти до дома
      effects: {humanity: 1, add_npc:contact: true}
      text: "Ты будишь его на нужной станции и ведёшь до двери. Утром он присылает визитку и благодарность. Полезный знакомый внутри «Арасаки»."
    - label: Одолжить пропуск
      check: {stat: REF, skill: stealth, dv: 15}
      success: {text: "Пропуск копируется за минуту и возвращается в карман. Копию в Найт-Сити купят за хорошие деньги.", effects: {eddies: 6000, heat: 1}}
      fail: {text: "Сарариман просыпается с твоей рукой у себя в кармане. Крик на весь вагон, полиция на следующей станции.", effects: {heat: 2, eddies: -1000}}

- id: world_us_checkpoint
  title: Блокпост федералов
  category: ncpd
  weight: 3
  conditions:
    flags_all: [in_nusa]
  text: "На въезде в округ блокпост армии Новых Штатов. Солдат в экзоскелете сканирует твой имплант и долго смотрит в планшет. «Цель визита? Лояльность Президенту подтверждаете?»"
  choices:
    - label: Подтвердить лояльность
      effects: {mood: -2, status: 1}
      text: "Ты отвечаешь по форме. Солдат кивает и ставит тебе галочку в базе лояльных. Неприятно, но удобно."
    - label: Пошутить
      check: {stat: COOL, skill: persuasion, dv: 15}
      success: {text: "Солдат неожиданно смеётся и пропускает. Чувство юмора у федералов есть, просто его выдают по талонам.", effects: {mood: 3}}
      fail: {text: "Шутку не оценили. Шесть часов в фильтрационном пункте и запись в деле.", effects: {heat: 2, mood: -4}}

- id: world_us_parade
  title: Парад победы
  category: street
  weight: 2
  conditions:
    flags_all: [in_nusa]
  text: "Вашингтон празднует годовщину победы в Объединительной войне. По авеню идут танки «Милитеха», над Капитолием пролетают ави. Толпа машет флагами. Кто-то сзади шепчет, что Свободные штаты эту войну проигравшей не считают."
  choices:
    - label: Махать флагом
      effects: {mood: 2}
      text: "Ты машешь флагом. Рядом семья ветерана раздаёт хот-доги. Сегодня все за одно."
    - label: Продавать флажки
      effects: {eddies: 900}
      text: "Ты продаёшь флажки по пять эдди. К вечеру распродан весь ящик."

- id: world_tx_ranch
  title: Ранчо в засуху
  category: work
  weight: 3
  conditions:
    flags_all: [in_texas]
  text: "Хозяин ранчо под Остином просит помочь: кочевой клан ворует воду из его колодца по ночам. Предлагает деньги, лошадь и ночёвку."
  choices:
    - label: Сторожить колодец
      violent: true
      check: {stat: REF, skill: firearms, dv: 14}
      success: {text: "Ночью ты стреляешь в воздух, и кочевники уходят без воды. Хозяин платит и наливает виски.", effects: {eddies: 2000, street_cred: 1}}
      fail: {text: "Кочевники стреляют не в воздух. Пуля в бедро, вода ушла.", effects: {hp: -10}}
    - label: Договориться с кочевниками
      check: {stat: EMP, skill: persuasion, dv: 13}
      success: {text: "Кочевники платят хозяину за воду бензином. Обе стороны довольны, ты тоже: заплатили оба.", effects: {eddies: 2500, humanity: 1}}
      fail: {text: "Обе стороны считают тебя предателем. Хорошо, что лошадь быстрая.", effects: {mood: -3}}

- id: world_tx_tornado
  title: Торнадо
  category: rare
  weight: 2
  conditions:
    flags_all: [in_texas]
  text: "Небо становится зелёным. Сирена. На горизонте вращается воронка, и она идёт прямо на мотель, где ты живёшь."
  choices:
    - label: Спуститься в подвал
      effects: {mood: -2}
      text: "Ты сидишь в подвале с семьёй мексиканцев и котом. Когда вылезаете, мотеля нет, а твоя машина висит на дереве."
    - label: Снимать торнадо
      check: {stat: REF, skill: driving, dv: 15}
      success: {text: "Ты едешь вдоль воронки и снимаешь лучшие кадры года. Новостной канал покупает запись.", effects: {eddies: 3000, fame: 2}}
      fail: {text: "Воронка меняет курс. Машину переворачивает трижды.", effects: {hp: -15}}

- id: world_mx_wedding
  title: Мексиканская свадьба
  category: relationships
  weight: 3
  conditions:
    flags_all: [in_mexico]
  text: "Соседи по улице зовут тебя на свадьбу. «Ты же теперь наш». Три дня музыки, четыреста гостей, пять поросят и двоюродный дядя невесты, который подозрительно похож на главу картеля."
  choices:
    - label: Танцевать три дня
      effects: {mood: 8, hp: -3, add_npc:friend: true}
      text: "Ты танцуешь, пока не отваливаются ноги. На третий день ты уже знаешь всех по именам, а бабушка невесты зовёт тебя родным."
    - label: Поговорить с дядей
      check: {stat: COOL, skill: persuasion, dv: 15}
      success: {text: "Дядя ценит уважение. Через неделю тебе приходит предложение работы. Очень хорошо оплачиваемой.", effects: {eddies: 4000, street_cred: 2}}
      fail: {text: "Дядя смотрит на тебя долго и молча. Тебе вежливо предлагают уйти до торта.", effects: {mood: -3}}

- id: world_mx_quinceanera
  title: Пятнадцатилетие
  category: relationships
  weight: 2
  conditions:
    flags_all: [in_mexico]
  text: "Дочь хозяйки дома празднует пятнадцатилетие. Платье как у принцессы, мариачи во дворе, и кто-то должен станцевать с ней вальс вместо отца, который не вернулся с заработков в Найт-Сити."
  choices:
    - label: Станцевать вальс
      effects: {humanity: 2, mood: 5}
      text: "Ты танцуешь неумело, но честно. Девочка смеётся, мать плачет. Это лучший вечер за долгое время."
    - label: Помочь деньгами
      effects: {eddies: -500, humanity: 1}
      text: "Ты оплачиваешь мариачи на всю ночь. Музыка играет до рассвета."

- id: world_eu_strike
  title: Всеобщая забастовка
  category: work
  weight: 3
  conditions:
    flags_all: [in_europe]
  text: "Профсоюзы ЕЭС объявили всеобщую забастовку против роботизации. Метро стоит, кафе закрыты, на площадях костры и плакаты «Люди, а не машины». Хозяин мастерской просит тебя выйти на смену тайком."
  choices:
    - label: Выйти на смену
      effects: {eddies: 1500, humanity: -1, mood: -2}
      text: "Ты работаешь один в пустом цеху. Деньги двойные. Вечером на двери мастерской кто-то пишет «штрейкбрехер»."
    - label: Присоединиться к забастовке
      effects: {mood: 4, street_cred: 1, add_npc:friend: true}
      text: "Ты стоишь на площади с плакатом, пьёшь вино из бумажного стакана, и все спорят о будущем до рассвета. Через неделю правительство уступает."

- id: world_eu_bureaucracy
  title: Европейская бюрократия
  category: money
  weight: 3
  conditions:
    flags_all: [in_europe]
  text: "Чтобы продлить разрешение на жизнь, нужна справка А-38. Чтобы получить А-38, нужна справка Б-12. Справку Б-12 выдают в окне, которое работает по вторникам с десяти до одиннадцати, если в этот вторник не забастовка."
  choices:
    - label: Пройти все круги
      check: {stat: COOL, dv: 14}
      success: {text: "Три недели, двенадцать окон, сорок подписей. Разрешение продлено. Ты чувствуешь себя героем древнего мифа.", effects: {mood: 3, skill_xp:persuasion: 1}}
      fail: {text: "На последнем окне выясняется, что форма изменилась вчера. Всё сначала. Пошлина — тоже.", effects: {eddies: -800, mood: -4}}
    - label: Дать взятку
      check: {stat: COOL, skill: persuasion, dv: 16}
      success: {text: "Клерк молча берёт конверт, и справка находится за пять минут. Европа не так уж и отличается.", effects: {eddies: -1000}}
      fail: {text: "Клерк оскорблён до глубины души и вызывает полицию. В Европе такое не прощают.", effects: {heat: 2, eddies: -1500}}

- id: world_hk_typhoon
  title: Тайфун номер десять
  category: street
  weight: 3
  conditions:
    flags_all: [in_hongkong]
  text: "Сигнал тайфуна номер десять. Город закрылся: рынки свёрнуты, паромы стоят, ветер срывает вывески с небоскрёбов. Ты застреваешь в ресторане с хозяином, его семьёй и двумя бандитами триады."
  choices:
    - label: Играть в маджонг
      check: {stat: INT, dv: 14}
      success: {text: "Двое суток маджонга. Ты выигрываешь у триады честно, и они уважают это больше, чем деньги.", effects: {eddies: 2500, add_npc:contact: true}}
      fail: {text: "Ты проигрываешь всё, что было в карманах, и ещё немного сверху. Триада щедро прощает долг. Пока.", effects: {eddies: -2000, mood: -2}}
    - label: Помогать хозяину
      effects: {humanity: 1, mood: 3}
      text: "Ты заклеиваешь окна, носишь мешки с рисом, готовишь с бабушкой. Когда тайфун уходит, тебя кормят бесплатно до конца месяца."

- id: world_hk_clone
  title: Хром-копия
  category: implants
  weight: 3
  conditions:
    flags_all: [in_hongkong]
  text: "Рипперша из подпольной клиники в Монгкоке предлагает поставить копию топового импланта «Кан Тао» за треть цены. Копия работает «почти как оригинал». Почти."
  choices:
    - label: Поставить копию
      effects:
        eddies: -3000
        later:
          - weeks: 6
            chance: 0.6
            effects: {mood: 4, skill_xp:tech: 2}
            text: "Копия работает отлично. Даже лучше оригинала: в ней нет корпоративного жучка."
            fail_effects: {hp: -10, glitches: 1}
            fail_text: "Копия сгорает в самый неподходящий момент. Дым из уха, глюк в голове."
            hint: "копия импланта"
      text: "Операция занимает двадцать минут. Рипперша ест лапшу одной рукой и паяет другой."
    - label: Отказаться
      effects: {}
      text: "Ты уходишь. Рипперша пожимает плечами: «Оригинал тоже кто-то копировал»."
