gig_brief:
  - "{fixer} пишет коротко: «{name}, есть работа. Сделаешь чисто, заплачу, как договаривались. Лишних вопросов не задавай»."
  - "{fixer} на связи: «Ничего сложного, {name}». Когда фиксер так говорит, жди подвоха."
  - "{fixer} обходится без любезностей: «Берёшь или нет? Не возьмёшь ты, возьмёт кто-нибудь другой»."
gig_result:
  clean:
    - "Всё прошло чисто. {fixer} переводит деньги и лишних вопросов не задаёт."
    - "Ни свидетелей, ни лишнего шума. {fixer} запоминает, что на тебя можно положиться."
    - "Всё по плану, даже подозрительно. Деньги пришли, а {fixer} уже пишет про следующий заказ."
  complication:
    - "Не по плану, но сделано. {fixer} платит меньше обещанного и напоминает, что клиент ждал тишины."
    - "Сделано, но шума вышло больше, чем нужно. {fixer} это запомнит."
    - "Закрыто кое-как. Деньги пришли не все: {fixer} удерживает часть за лишние хлопоты."
  fail:
    - "Сорвалось. Денег не будет."
    - "Пришлось уходить, и заказ сорвался. {fixer} сбрасывает звонок, не дослушав."
    - "Денег нет, зато пульс есть. Иногда это лучшее, что может дать ночь."
  disaster:
    - "Полный провал. {fixer} такое не забывает."
    - "Всё пошло не так с первой минуты. Что с тобой делать дальше, {fixer} решит позже."
    - "Всё, что могло сломаться, сломалось. Такие ночи в резюме не пишут, чумба."
event_text:
  - "{district}, поздний вечер. {event_title}. {name}, переулок кажется тихим, пока не замечаешь, кто в нём стоит."
  - "{district}. {event_title}. Здесь за любой ответ платят эдди или кровью, {name}, и торговаться не принято."
  - "{district}. {event_title}. {name}, сегодня тут неспокойно, и кто-то уже запомнил твоё лицо."
event_outcome:
  - "{name}: «{choice_label}». Решение принято, назад дороги нет."
  - "{name} выбирает: «{choice_label}». Скоро станет ясно, чем это обернётся."
  - "«{choice_label}», решает {name}. Где-то в баре уже принимают ставки, чем это кончится."
obituary:
  - "{name}, {role}. Возраст: {age}. Причина смерти: {cause}. Уличная репутация: {street_cred}. Запомнят за одно: {achievement}."
  - "По улицам ходит слух: {name} ({role}) больше не возьмёт заказ. Возраст: {age}, причина: {cause}. Уличная репутация: {street_cred}. Вспоминать будут одно: {achievement}."
  - "Плита без фотографии. {name}, {role}, возраст: {age}. Для Найт-Сити это уже немало. Причина: {cause}. Уличная репутация: {street_cred}. Эпитафия короткая: {achievement}."
news:
  - "«Good Morning, Night City». Район {district}, происшествий за сутки: {count}. В сводке звучат имена: {names}. Подробности, как обычно, не сообщаются."
  - "«Good Morning, Night City». Район {district} снова в хронике, происшествий за ночь: {count}. В эфире прозвучали имена: {names}. Остальное узнают те, кто доживёт до утра."
  - "«Good Morning, Night City», сводка за сутки. Район {district}, событий: {count}. Фигуранты: {names}. Корпорации от комментариев отказались."
news_quiet:
  - "«Good Morning, Night City». Тихая ночь. Даже Мусорщики взяли выходной."
  - "«Good Morning, Night City». За сутки ничего не случилось. Банды молчат, NCPD молчит, а значит, кто-то готовит что-то крупное."
  - "«Good Morning, Night City». Сводка пустая, город спит. Для Найт-Сити это подозрительно."
npc_chat:
  - "{npc_name} ({npc_role}) даже не поднимает головы, когда {name} заходит. «Сегодня не до тебя, чумба», — слышно через плечо."
  - "{npc_name} ({npc_role}) выслушивает и цедит: «Либо ты дурак, либо тебе кто-то платит. Пока не знаю, что хуже»."
  - "{name} садится за стол. {npc_name} ({npc_role}) молча наливает себе и пододвигает пепельницу. Значит, разговор будет."
unique_event:
  - "{district}. {title}. {name}, будь начеку: тебя уже заметили."
  - "{title}. Без предупреждения и без всякой причины. {name}, похоже, сегодня кто-то решил пошутить."
  - "{district}. {title}. Вечер пошёл не по плану, {name}, и спокойной ночи уже не будет."
