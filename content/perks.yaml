    renaissance_punk: {name: Ренессанс-панк, text: "Каждый атрибут 9+ даёт нагрузку хрома −5% и RAM +1.", ranks: 1, need: 7, per_attr9: {chrome_load_pct: 5, ram_max: 1}}
    driver_update: {name: Обновление драйверов, text: "Хром работает чище: проверки в бою +1, RAM +1, анализ врагов +1.", ranks: 1, need: 8, mods: {check.combat: 1, ram_max: 1, enemy_scan: 1}}
    overclock: {name: Разгон оружия, text: "Урон из огнестрела +2 за ранг.", ranks: 2, need: 8, mods: {ranged_damage: 2}}
