# Perk trees after Cyberpunk 2077 (owner request 24.10: more for characters who are not netrunners; extended 24.10:
# the TECH tree with the game's perks, the EMP and LUCK trees).
# Every level of the character gives one attribute point, one perk (talent) point and skill points (engine/perks.py).
# A perk has ranks; `mods` are per rank (summed into the modifiers); `need` is the attribute value for the first rank,
# each next rank needs one more. `special` names a combat ability the fight engine reads (engine/combat.py).
# `min_implants: N` = the mods work only with N+ installed implants; `per_attr9` = mods per attribute at 9 or more.

BODY:
  title: "ТЕЛО · Громила"
  perks:
    iron_skin: {name: Железная шкура, text: "Здоровье +6 за ранг.", ranks: 3, need: 3, mods: {hp_max: 6}}
    painkiller: {name: Обезболивающее, text: "Восстановление +1 в неделю и здоровье +3 за ранг.", ranks: 2, need: 4, mods: {hp_regen: 1, hp_max: 3}}
    cleave: {name: Таран, text: "Удар в ближнем бою задевает ещё одного врага за ранг.", ranks: 2, need: 5, special: cleave}
    wrecker: {name: Разрушитель, text: "Урон в ближнем бою +2 за ранг.", ranks: 3, need: 6, mods: {melee_damage: 2}}
    second_wind: {name: Второе дыхание, text: "Раз за бой на четверти здоровья — лечение 20% за ранг.", ranks: 2, need: 7, special: second_wind}
    wall_breaker: {name: Сносит стены, text: "Сила +2 и урон в ближнем бою +1. Двери вылетают вместе с косяком.", ranks: 1, need: 8, mods: {strength: 2, melee_damage: 1}}
    bloodlust: {name: Жажда крови, text: "Каждое убийство в бою лечит 5% здоровья за ранг.", ranks: 2, need: 8, special: bloodlust}
    juggernaut: {name: Джаггернаут, text: "Снижение урона +1, побег −1. Тебя не остановить, но и не догнать.", ranks: 1, need: 9, mods: {damage_reduction: 1, flee: -1}}
    quake: {name: Землетрясение, text: "Удар в ближнем бою с шансом 25% оглушает цель на ход.", ranks: 1, need: 10, special: quake}

REF:
  title: "РЕФЛ · Клинок"
  perks:
    quick_hands: {name: Быстрые руки, text: "Проверки в бою +1 за ранг.", ranks: 2, need: 4, mods: {check.combat: 1}}
    evasion: {name: Неуловимый, text: "Побег и скрытность +1 за ранг.", ranks: 3, need: 4, mods: {flee: 1, check.escape: 1}}
    deflect: {name: Отбивать пули, text: "С клинком в руках: шанс 15% за ранг отбить пулю. На 3-м ранге отбитая пуля летит в стрелка.", ranks: 3, need: 5, special: deflect}
    fury: {name: Кровавая ярость, text: "Ниже половины здоровья — урон в ближнем бою +3 за ранг.", ranks: 2, need: 6, special: fury}
    blade_dancer: {name: Танцор с клинками, text: "Урон в ближнем бою +1 и проверки в бою +1 за ранг.", ranks: 2, need: 7, mods: {melee_damage: 1, check.combat: 1}}
    finisher: {name: Добивание, text: "Враг ниже четверти здоровья падает от удара клинком.", ranks: 1, need: 8, special: finisher}
    dual_guns: {name: Два ствола, text: "С двумя одноручными стволами (пистолеты, ПП) второй стреляет без штрафа к попаданию; на 2-м ранге дважды за ход.", ranks: 2, need: 5, special: dual_guns}
    dual_blades: {name: Два клинка, text: "С двумя клинками второй бьёт без штрафа; на 2-м ранге дважды за ход. С «Отбивать пули» шанс отбить +10%.", ranks: 2, need: 5, special: dual_blades}
    ninja: {name: Кибер-ниндзя, text: "Первые две атаки по тебе в каждом бою проходят мимо: тебя просто нет там, куда стреляют.", ranks: 1, need: 9, special: ninja}

