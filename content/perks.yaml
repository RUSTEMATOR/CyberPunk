    transfusion: {name: Переливание, text: "Последний заряд инжектора лечит на 30% больше.", ranks: 1, need: 5, special: transfusion}
    plating: {name: Бронепластины, text: "Защита +1 за ранг.", ranks: 2, need: 5, mods: {armor: 1}}
    chrome_heart: {name: Хромированное сердце, text: "Нагрузка хрома на тело −10% за ранг.", ranks: 2, need: 6, mods: {chrome_load_pct: 10}}
