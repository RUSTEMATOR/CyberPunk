    extended_warranty: {name: Расширенная гарантия, text: "Активные импланты (Сандевистан, Берсерк) работают на ход дольше.", ranks: 1, need: 8, mods: {active.all.duration_ticks: 1}}
    license_to_chrome: {name: Лицензия на хром, text: "Защита +1 и нагрузка хрома −5% за ранг.", ranks: 3, need: 8, mods: {armor: 1, chrome_load_pct: 5}}
    ambidextrous: {name: Амбидекстр, text: "Обе руки работают: урон в ближнем и дальнем бою +1, проверки в бою +1.", ranks: 1, need: 9, mods: {melee_damage: 1, ranged_damage: 1, check.combat: 1}}
