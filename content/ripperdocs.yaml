# -- ripperdocs of the new districts (owner request: more districts) -----------------------------------------------------

- key: doc_furnace
  name: Риппер «Горн»
  district: northside
  description: "Мастерская при литейном цехе. Ставит военный хром прямо на сварочном столе. Наркоз — бутылка и песня."
  price_mod: 0.7
  complication_chance: 0.25
  infection_chance: 0.15
  scan_lie_chance: 0.1
  underground: true

- key: doc_pier
  name: Плавучая клиника на пирсе 13
  district: waterfront
  description: "Клиника на старом катере. Импланты прямо с контейнеров, иногда ещё в заводской смазке. Качает на волнах во время операции."
  price_mod: 0.8
  complication_chance: 0.2
  infection_chance: 0.1

- key: clinic_vienna
  name: Клиника доктора Штайнера
  district: little_europe
  description: "Частная клиника в старинном особняке: мрамор, классическая музыка и счёт с тремя нулями. Зато руки у доктора не дрожат."
  price_mod: 1.3
  complication_chance: 0.04
  infection_chance: 0.01

- key: clinic_lotus
  name: Клиника «Лотус»
  district: north_oak
  description: "Корпоративная клиника для своих. Импланты ставят во сне, а будят с бокалом шампанского и счётом на подносе."
  price_mod: 1.6
  complication_chance: 0.02
  infection_chance: 0.0

- key: doc_glen_morgue
  name: Риппер из морга
  district: the_glen
  description: "Патологоанатом городского морга подрабатывает по ночам. Хром в основном снят с тех, кому он больше не нужен."
  price_mod: 0.6
  complication_chance: 0.3
  infection_chance: 0.2
  underground: true

- key: doc_combat_zone
  name: Мясник Боевой зоны
  district: combat_zone
  description: "Операционная в бывшем кинотеатре, свет от генератора. Ставит что угодно за что угодно. Выживают не все, но выжившие возвращаются."
  price_mod: 0.4
  complication_chance: 0.4
  infection_chance: 0.3
  underground: true

- key: clinic_university
  name: Учебная клиника NCU
  district: university
  description: "Студенты-медики оперируют под присмотром профессора. Дёшево, старательно и очень медленно."
  price_mod: 0.7
  complication_chance: 0.15
  infection_chance: 0.05

- key: doc_geiger_tent
  name: Палатка ликвидаторов
  district: hot_zone
  description: "Военная палатка с пломбированными ящиками хрома, найденного в руинах. Перед операцией меряют фон, после — тоже."
  price_mod: 0.5
  complication_chance: 0.3
  infection_chance: 0.2
  underground: true
  available_from: 2023
