traits:
  - key: cold_blooded
    name: "Хладнокровие"
    description: "Ты не вздрагиваешь, когда рядом стреляют."
  - key: soft_voice
    name: "Тихий голос"
    description: "Говоришь вполголоса, и собеседники сами подаются ближе, чтобы расслышать."
  - key: paranoid
    name: "Паранойя"
    description: "Дважды проверяешь замки и ловишь своё отражение в витринах: вдруг кто-то идёт следом."
  - key: gambler
    name: "Азарт"
    description: "Ставишь на всё, что крутится: рулетку, бои, чужие жизни."
  - key: loyal
    name: "Верность"
    description: "Держишься за данное слово и за своих людей дольше, чем стоило бы."
  - key: sharp_tongue
    name: "Злой язык"
    description: "Говоришь правду, когда все молчат, и потом за неё расплачиваешься."
  - key: night_owl
    name: "Сова"
    description: "Днём спишь, ночью живёшь. После двух часов ночи люди говорят честнее."
  - key: hustler
    name: "Хватка"
    description: "С порога видишь, сколько стоит каждая вещь в комнате и каждый человек в ней."
  - key: quiet_grief
    name: "Тихое горе"
    description: "О погибших близких ты не говоришь. Молчишь, пока кто-нибудь не спросит."
  - key: superstitious
    name: "Суеверие"
    description: "Без старой монеты в кармане из дома не выходишь, а по пятницам не садишься в машину."
  - key: stubborn
    name: "Упрямство"
    description: "Принятое решение не меняешь, даже когда уже поздно."
  - key: funny_bone
    name: "Чёрный юмор"
    description: "Шутишь над трупами и над собой. Окружающие не всегда понимают, где кончается шутка."
  - key: honest_to_fault
    name: "Честность во вред"
    description: "Не врёшь, даже когда ложь спасла бы шкуру."
  - key: street_eyes
    name: "Глаза улицы"
    description: "Замечаешь, кто нервно курит, кто держит руку у пояса и кто смотрит не туда."
  - key: frugal
    name: "Скупость"
    description: "Считаешь каждый эдди и помнишь все долги, свои и чужие. Чаевых не оставляешь."
  - key: dreamer
    name: "Мечтательность"
    description: "Веришь, что однажды уедешь из Найт-Сити. Карта на стене вся в пометках."
  - key: rough_hands
    name: "Тяжёлая рука"
    description: "Вещи в твоих руках долго не живут: чашки бьются, двери хлопают."
  - key: nosy
    name: "Любопытство"
    description: "Суёшь нос в чужие папки и разговоры. Иногда находишь то, чего лучше бы не находить."
  - key: scarred_pride
    name: "Гордость"
    description: "Не просишь помощи и не берёшь в долг, даже когда очень нужно."
  - key: calm_under_fire
    name: "Холодная голова"
    description: "Под обстрелом ты становишься тише, а не громче. Это замечают все, кто рядом."
marks:
  - key: chrome_scar
    name: "Шрам от пластины"
    description: "Белая полоса вдоль виска, где стояла хромированная пластина. Видна при любой причёске."
  - key: burned_palms
    name: "Ожоги на ладонях"
    description: "Кожа на ладонях гладкая и блестящая. Держать горячее больше не больно."
  - key: missing_finger
    name: "Нет мизинца"
    description: "На левой руке не хватает мизинца, и кулак сжимается непривычно."
  - key: gang_neck_tattoo
    name: "Тату банды на шее"
    description: "Старую метку свели наполовину, но контур остался. Кому надо, тот узнает."
  - key: yellow_eye
    name: "Жёлтый глаз"
    description: "Белок одного глаза пожелтел после импланта. Незнакомцы задерживают на нём взгляд."
  - key: broken_nose
    name: "Сломанный нос"
    description: "Сросся криво, и голос с тех пор звучит глуше."
  - key: rash_on_arms
    name: "Сыпь от хрома"
    description: "Пятна на предплечьях, которые не сходят. Тело отторгает хром, но пока терпит."
  - key: bullet_hole_shoulder
    name: "Сквозное в плече"
    description: "Пуля прошла навылет. Рука до конца не поднимается."
  - key: cracked_teeth
    name: "Вставные зубы"
    description: "Два передних зуба когда-то выбили, теперь на их месте протезы. Улыбаешься редко и не разжимая губ."
  - key: subdermal_scars
    name: "Подкожные швы"
    description: "На плече под кожей видны рубцы от старой установки импланта."
  - key: tan_no_sun
    name: "Бледная кожа"
    description: "Солнца ты не видишь годами. Кожа серая, как асфальт в Пасифике."
  - key: tattoo_serial
    name: "Выжженный номер"
    description: "На запястье номер, выжженный кислотой. Откуда он, ты не рассказываешь."
  - key: cybernetic_wrist
    name: "Хромированное запястье"
    description: "Стоит снять перчатку, и видна стальная пластина под кожей."
  - key: hollow_cheek
    name: "Впалые щёки"
    description: "Последние годы съели весь лишний вес и немного сверх того. Одежда висит, как на вешалке."
  - key: eyebrow_split
    name: "Рассечённая бровь"
    description: "Шрам от ножа делит бровь пополам. Зажило криво, как всё, что зашивали наспех."
  - key: neck_ring
    name: "След от кабеля"
    description: "Полоса на шее от кабеля, который годами не вынимали."
  - key: freckles_faded
    name: "Выцветшие веснушки"
    description: "Смог и годы почти стёрли их. Видны только на ярком свету."
  - key: knuckle_scar
    name: "Сбитые костяшки"
    description: "Костяшки всегда в ссадинах. Драки начинались не по твоей вине, но заканчивать их приходилось тебе."
  - key: hearing_aid
    name: "Слуховой имплант"
    description: "Маленький чип за ухом. Слышно всё, кроме того, что хочется услышать."
  - key: nicotine_stains
    name: "Жёлтые пальцы"
    description: "Никотин въелся в кожу так, что уже не отмывается."
obsessions:
  - key: debt_free
    name: "Выплатить всё до последнего эдди"
    description: "По ночам пересчитываешь долг и не можешь остановиться."
  - key: find_brother
    name: "Найти брата"
    description: "Брат пропал в Пасифике полгода назад. Ты ищешь его по моргам и подпольным клиникам."
  - key: revenge_tyger_claws
    name: "Счёт к Тигриным когтям"
    description: "Ты помнишь имя того, кто тебя подставил, и ждёшь подходящего вечера."
  - key: clean_skin
    name: "Чистая кожа"
    description: "Хочется прожить без хрома. Каждый новый имплант ощущается как предательство."
  - key: leave_city
    name: "Уехать из Найт-Сити"
    description: "Копишь на билет в один конец, но каждый раз что-то съедает накопленное."
  - key: perfect_shot
    name: "Идеальный выстрел"
    description: "Тренируешься по ночам в пустых тоннелях и никому не показываешь результат."
  - key: keep_family
    name: "Сохранить семью"
    description: "Мать живёт в Хейвуде на пособие. Всё заработанное сначала уходит ей."
  - key: know_everything
    name: "Знать всё"
    description: "Читаешь всё, что попадает в руки, и слушаешь каждый разговор в баре."
  - key: stay_sober
    name: "Не пить"
    description: "Был срыв, и счёт трезвых дней пошёл заново."
  - key: legend_name
    name: "Стать легендой"
    description: "Хочется, чтобы о тебе говорили в барах Уотсона, а не только в сводках NCPD."
  - key: find_mother
    name: "Найти мать"
    description: "Мать ушла в Бэдлендс, когда тебе было девять. Адреса нет, есть только слухи."
  - key: protect_street
    name: "Защитить район"
    description: "Не хочешь отдавать Уотсон корпорациям, хотя понимаешь, что шансов мало."
  - key: beat_the_clock
    name: "Успеть до тридцати"
    description: "Ставишь себе сроки и каждый год какой-нибудь срываешь."
  - key: no_more_cops
    name: "Не попасть в тюрьму"
    description: "Камеры пугают больше, чем пули. В любом помещении ты первым делом ищешь выход."
  - key: prove_wrong
    name: "Доказать, что ошибались"
    description: "Тебе сказали, что ты ничего не добьёшься. Эти слова ты помнишь дословно."
  - key: perfect_suit
    name: "Идеальный костюм"
    description: "На одежду уходит больше, чем на еду. Ты называешь это вложением."
  - key: sleep_well
    name: "Спать спокойно"
    description: "Три замка, проверенные окна, и всё равно сон чуткий, как у кошки."
  - key: loyal_crew
    name: "Держать команду"
    description: "Хочешь, чтобы все, с кем работаешь, возвращались живыми. Пока это не удалось ни разу."
  - key: ghost_name
    name: "Стать призраком"
    description: "Хочешь исчезнуть из всех баз. Старые документы уже сожжены."
  - key: quit_cyber
    name: "Избавиться от хрома"
    description: "Каждый вечер считаешь, сколько человечности осталось, и решаешь, стоило ли оно того."
