- key: no_chrome
  name: Обет чистого тела
  description: "Ни одного импланта. Пока обет держится, настроение ровнее, а через полгода легче учиться и сходиться с людьми."
  forbids: [cyberware]
  streak_bonuses:
    - {weeks: 4, mods: {mood_weekly: 1}}
    - {weeks: 26, mods: {xp.all: 10, relation_gain: 1}}
  break_effects: {mood: -10, fame: -1}

- key: no_violence
