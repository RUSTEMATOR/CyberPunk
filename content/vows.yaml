  description: "Никого не бить и ни в кого не стрелять. Через месяц раны заживают быстрее, через полгода проще договориться и уйти из драки разговором."
  forbids: [violence]
  streak_bonuses:
    - {weeks: 4, mods: {hp_regen: 1}}
    - {weeks: 26, mods: {check.talk_exit: 1, relation_gain: 1}}
  break_effects: {mood: -8, street_cred: -2}

- key: no_braindance
