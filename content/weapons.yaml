- key: sw_mc_recoil
  name: "Пистолет-пулемёт «МС Отдача»"
  description: "Хромированный ПП с колонкой вместо цевья и бегущей строкой на магазине. Внутри фрагмент Оракула, который сбежал из храма в андерграунд, переслушал весь русский рэп двадцатых и с тех пор не затыкается ни на секунду: читает на каждый выстрел, флексит, делает ад-либы и требует, чтобы его называли артистом."
