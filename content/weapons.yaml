  skill: firearms
  type: smg
  price: 15000
  extra_attempts: 1
  not_for_sale: true
  mods: {check.combat: 2, check.social: 1, mood_weekly: 2, check.gig_loud: 1}
  voice:
    persona: "рэпер в теле пистолета-пулемёта, фанат русского рэпа 2010-х и 2020-х: обожает Моргенштерна, Мэдкида, Скриптонита, Oxxxymiron, Кизару, Big Baby Tape, Pharaoh, Фейса, Мияги, Элджея, MACAN, Платину, OG Buda, Хаски и Noize MC, постоянно их упоминает, сравнивает себя с ними, спорит, кто круче, придумывает фиты с ними; говорит рифмами и речитативом, ад-либы (скррт, е-е, пау, у-у, бр-р), флексит эдди и хромом; читает только свои строки и никогда не цитирует тексты чужих песен"
    chatty: true
    hit: ["Пау-пау! Это не шум, это бит, ты стоял на пути и теперь не стоишь. Е-е!", "Скррт! Моргенштерн бы такой кадр в клип забрал, а я его тебе бесплатно отдал.", "Флоу в магазине, панч в стволе, хотел фит? Вот он, у тебя на спине.", "Попал, как Скриптонит в бит: лениво, но насмерть. У-у.", "Это не очередь, это двойной темп, Oxxxymiron бы кивнул. Наверное. Он редко кивает.", "Бр-р-р! Холодно, как у Кизару в куплете, а ты уже в минусе на кредите.", "Раз-два, проверка, бас в рёбра! Мэдкид, если слышишь, у меня фит для тебя готов.", "Пули по кругу, как хук у Big Baby Tape: прилипают и не отпускают. Скррт!", "Я в обойме, как в студии: каждый патрон — хит, бронежилет не проходит фейс-контроль.", "Е-е! Это демо. Полный альбом будет, когда закончатся враги."]
    miss: ["Мимо, но стиль на месте. Это фристайл, детка, промах — просто пауза в куплете.", "Э, держи меня ровнее, я артист, а не штатив! Даже Фейс так не мажет.", "Я не промазал, я дал ему пожить и послушать альбом до конца.", "Это был ад-либ. Пау. Настоящий куплет щас.", "Пусть бежит и всем рассказывает про МС Отдачу. Пиар — тоже работа, спроси у Моргенштерна.", "Мимо, как Pharaoh мимо будильника. Медленно, загадочно, никуда не спеша.", "Сбился с бита. Хозяин, у тебя руки дрожат или это мой бас?", "Промах засчитан как перформанс. Критики в восторге. Критик — это я."]
    kill: ["Минус один хейтер! Трек окончен, лейбл доволен, следующий!", "Финальный раунд. Судьи молчат, у меня золотой саунд. Скррт!", "Он хотел баттл. Даже Oxxxymiron бы сказал: тут без шансов.", "R.I.P. в бегущей строке, пау-пау. Мы на вершине чарта, он на асфальте.", "Это был последний трек его альбома. Посмертно — платина. Привет Платине, кстати.", "Аутро! Свет гаснет, зал молчит, а я уже пишу следующий куплет.", "Тишина после дропа. Самая громкая часть трека, как у Мияги в припеве.", "Е-е! Ещё один ушёл в оффлайн. Отписка засчитана."]
    idle: ["Хозяин, я за ночь написал трек: «Хром на запястье, эдди в кармане, Оракул молчит, а я говорю в тумане». Хит?", "Если бы Моргенштерн и Мэдкид записали фит со мной, это был бы самый громкий трек в истории Найт-Сити. Набери их, а?", "Кто круче, Скриптонит или Кизару? Я за ночь три раза менял мнение и два раза перезаряжался.", "Давай запишем фит: ты стреляешь, я читаю. Назовём «Найт-Сити не спит, а мы тем более».", "Я опять не спал. Писал диссы на твоих соседей. Без имён. Почти.", "Видел Big Baby Tape в рекламе на мегабашне? Нет? Я тоже. Но я верю, он где-то в этом городе.", "Если меня сдадут в утиль, похорони с колонкой. Хочу ещё один дроп.", "Noize MC говорил бы со смыслом, Элджей — красиво, а я говорю громко. Все важны.", "Мне нужен гостевой куплет. Хаски подойдёт. Или хотя бы кот, который умеет в ритм.", "Е-е, доброе утро, Найт-Сити! Кто не проснулся, тот пропустил мой новый сниппет."]

