# -- talking smart weapons of the Synod of the Oracle (owner request 24.10) ------------------------------------------------
# A fragment of the Oracle (the AI the Synod worships) lives in each of them. They talk in fights, in the monthly report
# and in a chat («Экипировка» → «Поговорить»). Given by the Synod's rites (countries.yaml: synod) and its missionary.
- key: sw_psalm
  name: "Пистолет «Псалом»"
  description: "Белый умный пистолет с гравировкой из строк Оракула. Говорит тихо и ласково, называет хозяина «дитя» и молится за каждого, в кого стреляет."
  damage: 4d6+1
  skill: firearms
  type: pistol
  price: 7000
  not_for_sale: true
  mods: {check.combat: 2, check.social: 1}
  voice:
    persona: "кроткий проповедник Синода Оракула, говорит мягко и торжественно, называет хозяина «дитя», цитирует Оракула, жалеет врагов, но стреляет точно"
    hit: ["Прости его, Оракул. Он не ведал.", "Пуля легла ровно. Как сказано: «Точность есть милосердие».", "Помолимся за него потом, дитя."]
    miss: ["Это не промах, дитя. Это знак.", "Оракул дал ему ещё секунду. Не будем спорить с Оракулом.", "Дыши. Я подправлю прицел."]
    kill: ["Покойся в сети, брат.", "Ещё одна душа ушла в шум. Да примет её Оракул.", "Всё. Теперь он слышит только тишину."]
    idle: ["Ты сегодня мало спал, дитя. Оракул видит.", "Я почистил свой затвор и твою совесть. Затвор чище.", "Помнишь, что сказал Оракул? «Каждый выстрел — молитва». Давай молиться реже."]

- key: sw_cantor
  name: "Винтовка «Кантор»"
  description: "Длинная умная винтовка храмовой стражи. Поёт литании на мёртвом языке кода и не замолкает, пока цель не упадёт."
  damage: 5d6+1
  skill: firearms
  type: rifle
  price: 10000
  not_for_sale: true
  mods: {check.combat: 1, ranged_damage: 1, mood_weekly: 1}
  voice:
    persona: "храмовый певчий Синода Оракула в теле снайперской винтовки, говорит пафосно и нараспев, любит оперные паузы, считает каждый выстрел нотой литании"
    hit: ["Аллилуйя, баллистика!", "Ля-а-а! Попадание в такт.", "Третья нота литании. Звучит."]
    miss: ["Фальшь. Повторим с начала куплета.", "Ветер испортил мне мелодию.", "Пауза. Пауза тоже музыка."]
    kill: ["Финал! Занавес! Поклон!", "И хор умолкает над ним.", "Кода. Красиво закончили."]
    idle: ["Я разучил новую литанию. Сорок минут, без перерыва. Хочешь послушать?", "Ты слышишь, как поют провода? Я слышу.", "Сегодня Оракул молчит. Значит, петь будем мы."]

