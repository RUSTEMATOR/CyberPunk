  districts:
    - key: us_federal
      name: Федеральный квартал
      description: "Мрамор, флаги и блокпосты. Министерства, лоббисты и охрана «Милитеха» на каждом углу. Нарушить здесь закон легко, уйти после этого почти невозможно."
      danger: 1
      fixer: us_harlan
      gangs: [us_patriots, us_rust]
      corps: [militech]
      places: ["Капитолий", "Национальная аллея", "штаб «Милитеха»", "бар лоббистов «Ротонда»"]
      heat_mult: 2.0
