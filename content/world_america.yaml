  gangs:
    - {key: tx_cartel, name: Картель Лос-Сетас-Нуэвос, name_gen: картеля Лос-Сетас-Нуэвос, name_dat: картелю Лос-Сетас-Нуэвос, name_acc: картель Лос-Сетас-Нуэвос, name_ins: картелем Лос-Сетас-Нуэвос, name_pre: картеле Лос-Сетас-Нуэвос, description: "Картель, который возит через границу всё: людей, стволы, импланты, синтетику.", style: "тяжёлые пикапы, золото, автоматы и вежливость до первого выстрела", fights_as: valentinos, disposition: {bribe_dv: 15, talk_dv: 17, bribe_cost_mult: 2.5, flee_mod: 1, surrender: {robbed: 3, beaten: 2}}}
