    - {key: tx_h_bungalow, name: Бунгало в рабочем посёлке, district: tx_ship_channel, tier: 2, rent: 320, food: 110, description: "Свой дворик, свой гриль и соседи, которые придут с ружьём, если позовёшь."}
    - {key: tx_h_tower, name: Лофт в нефтяной башне, district: tx_downtown, tier: 3, rent: 1100, food: 170, description: "Тридцатый этаж, мрамор, виски в баре консьержа."}

