    - {key: us_mama_g, name: Мама Глория, districts: [us_anacostia], description: "Держит закусочную и половину рынка Анакостии. Кормит ветеранов в долг и знает, у кого какой ствол.", voice: "тепло и громко, называет всех «солнышко», угрожает с той же интонацией"}
  gangs:
    - {key: us_patriots, name: Сыны Республики, name_gen: Сынов Республики, name_dat: Сынам Республики, name_acc: Сынов Республики, name_ins: Сынами Республики, name_pre: Сынах Республики, description: "Ополчение патриотов в камуфляже. Охотятся на «врагов нации» и тех, кто плохо смотрит на флаг.", style: "армейские винтовки, лозунги, флаги на пикапах", fights_as: sixth_street, disposition: {bribe_dv: 17, talk_dv: 15, bribe_cost_mult: 2.0, flee_mod: 0, surrender: {beaten: 3, robbed: 1}}}
    - {key: us_rust, name: Ржавые псы, name_gen: Ржавых псов, name_dat: Ржавым псам, name_acc: Ржавых псов, name_ins: Ржавыми псами, name_pre: Ржавых псах, description: "Дезертиры и списанные солдаты. Торгуют армейскими имплантами и патронами, грабят конвои.", style: "армейский хром, короткие очереди, никаких разговоров", fights_as: maelstrom, disposition: {bribe_dv: 14, talk_dv: 17, bribe_cost_mult: 1.5, flee_mod: 1, surrender: {robbed: 3, chrome_stripped: 1}}}
  ripperdocs:
    - {key: us_doc_reyes, name: Сержант-медик Рейес, district: us_anacostia, description: "Полевой медик с тремя войнами за спиной. Ставит армейский хром быстро и грубо, лишних вопросов не задаёт.", price_mod: 0.9, complication_chance: 0.08}
  housing:
    - {key: us_h_barracks, name: Койка в бывшей казарме, district: us_anacostia, tier: 1, rent: 150, food: 90, description: "Двухъярусные кровати, общий душ, ветераны храпят по расписанию."}
    - {key: us_h_rowhouse, name: Таунхаус у реки, district: us_anacostia, tier: 2, rent: 380, food: 110, description: "Узкий кирпичный дом, крыльцо, соседи с ружьями на стене."}
    - {key: us_h_condo, name: Кондо у Национальной аллеи, district: us_federal, tier: 3, rent: 1200, food: 180, description: "Охрана в холле, вид на обелиск и лифт, который сканирует лицо."}

- country: texas
