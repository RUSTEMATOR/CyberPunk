      name: Анакостия
      description: "Восточный берег реки, где кончаются деньги федералов. Пустые склады, лагеря ветеранов, гаражные мастерские и рынки краденого армейского снаряжения."
      danger: 3
      fixer: us_mama_g
      gangs: [us_rust, us_patriots]
      corps: [militech, petrochem]
      places: ["лагерь ветеранов", "армейский рынок у моста", "заброшенная верфь", "закусочная «Последний патрон»"]
  fixers:
