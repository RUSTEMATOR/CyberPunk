# The cities of the world (owner request 25.10, docs/PLAN_WORLD.md): every country is an alternative to Night City.
# A pack gives the city its districts (with fixers, gangs, corps, places), fixers, gangs (`fights_as`: whose fighters
# they borrow in a fight), a ripper, homes and a story of 4 steps (events_story_*.yaml). Player text is gender-neutral.

- country: japan
  police: Полиция Токио
  story_title: Долг клана Курогава
  story: [jp_story_1, jp_story_2, jp_story_3, jp_story_4, jp_story_5, jp_story_6, jp_story_7, jp_story_8]
  districts:
    - key: tokyo_shinjuku
      name: Синдзюку
      description: "Небоскрёбы «Арасаки», неон Кабукитё, офисные муравейники и бары размером со шкаф. Полиция вежливая и вездесущая: за драку здесь ищут втрое быстрее."
      danger: 2
      fixer: jp_kaori
      gangs: [jp_kurogawa, jp_bosozoku]
      corps: [arasaka]
      places: ["Кабукитё", "Золотой квартал", "башня «Арасаки» в Синдзюку", "станция Синдзюку"]
      heat_mult: 1.5
    - key: tokyo_adachi
      name: Адати
      description: "Северная окраина: бетонные муравейники для рабочих, заброшенные заводы, ночные гонки по набережной. Здесь живут те, кого Токио не показывает туристам."
      danger: 3
      fixer: jp_matsuda
      gangs: [jp_bosozoku, jp_kurogawa]
      corps: [arasaka]
      places: ["набережная Аракавы", "заброшенный завод «Хитати»", "рынок Кита-Сэндзю", "общежитие рабочих"]
  fixers:
    - key: jp_kaori
      name: Каори Ито
      districts: [tokyo_shinjuku]
      description: "Фиксер Синдзюку. Бывший секретарь совета директоров, знает, чьи грехи стоят дороже. Работает только с теми, кого ей порекомендовали."
      voice: безупречно вежливо, длинные паузы, ни одного прямого слова о насилии
    - key: jp_matsuda
      name: Старик Мацуда
      districts: [tokyo_adachi]
      description: "Фиксер Адати, хозяин лапшичной под эстакадой. Сорок лет держит район, пережил три войны кланов. Платит наличными, не прощает болтливых."
      voice: ворчливо, коротко, с присказками о погоде и рыбалке
  gangs:
    - key: jp_kurogawa
      name: Клан Курогава
      name_gen: клана Курогава
      name_dat: клану Курогава
      name_acc: клан Курогава
      name_ins: кланом Курогава
      name_pre: клане Курогава
      description: "Якудза старой школы: татуировки до запястий, чёрные костюмы, кодекс и бухгалтерия. Держат патинко, долги и половину строительных подрядов."
      style: поклоны перед ударом, катаны и короткие пистолеты, отрубленный палец как извинение
      fights_as: tyger_claws
      disposition: {bribe_dv: 16, talk_dv: 16, bribe_cost_mult: 2.5, flee_mod: 1, surrender: {robbed: 2, beaten: 2}}
    - key: jp_bosozoku
      name: Красный гром
      name_gen: Красного грома
      name_dat: Красному грому
      name_acc: Красный гром
      name_ins: Красным громом
      name_pre: Красном громе
      description: "Босодзоку на ревущих байках с флагами и неоном. Дети окраин, которым нечего терять, кроме скорости."
      style: биты и цепи, гонки по ночам, крики и сигналы клаксонов
      fights_as: maelstrom
      disposition: {bribe_dv: 13, talk_dv: 14, bribe_cost_mult: 1.0, flee_mod: -1, surrender: {robbed: 3, beaten: 3}}
  ripperdocs:
    - key: jp_sato
      name: Доктор Сато
      district: tokyo_adachi
      description: "Бывший хирург «Арасаки», уволенный за то, что лечил не тех. Японское качество, японская цена, ни одной лишней улыбки."
      price_mod: 1.4
      complication_chance: 0.0
      sells_software: true
  housing:
    - {key: jp_capsule, name: Капсула в Синдзюку, district: tokyo_shinjuku, tier: 1, rent: 260, food: 120, description: "Капсульный отель для офисных работников, опоздавших на последний поезд. Чисто, тихо, на ширину плеч."}
    - {key: jp_danchi, name: Квартира в данти Адати, district: tokyo_adachi, tier: 2, rent: 420, food: 140, description: "Бетонная многоэтажка для рабочих. Татами, балкон с бельём, соседи кланяются в лифте."}
    - {key: jp_tower, name: Апартаменты над Синдзюку, district: tokyo_shinjuku, tier: 3, rent: 1400, food: 220, description: "Сороковой этаж, окна во всю стену и вид на Фудзи в ясный день. Консьерж помнит, когда ты вернулся."}

