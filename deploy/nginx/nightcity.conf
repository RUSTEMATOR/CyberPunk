# Night City Life, Telegram Mini App (docs/WEBAPP.md). Installed by the bot itself (app/webapp/nginx.py):
# edit this file in the project, deploy, and the bot copies it into /opt/homebrew/etc/nginx/servers/, runs nginx -t
# and reloads nginx only when the test passes.
#
# Path of a request: https://nightcity.qa-temple-of-serenity.cc -> Cloudflare -> cloudflared on this Mac
# -> nginx :8080 (this block) -> the bot process on 127.0.0.1:8787 (aiohttp inside app.main).
#
# - only connections from this Mac (cloudflared) get in; the local network gets 403;
# - no access log: the event stream carries the Telegram initData in its query string;
# - the event stream (/api/events) is never buffered, so a window change reaches the app at once.

server {
    listen      8080;
    server_name nightcity.qa-temple-of-serenity.cc;

    allow 127.0.0.1;
    allow ::1;
    deny  all;

    access_log off;
    error_log  /opt/homebrew/var/log/nginx/nightcity-error.log warn;

    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    client_max_body_size 64k;

    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    location /api/events {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 90s;
        # owner report 31.10: the 4 MB Unity build broke off after a few hundred KB on the way out. A big answer must
        # not go through nginx's temp files: nginx holds what fits in memory and waits for the client
        proxy_max_temp_file_size 0;
        proxy_buffers 16 64k;
        proxy_busy_buffers_size 128k;
    }
}
