<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>HTML5 Pacman</title>
    
    <style type="text/css">
      @font-face {
	    font-family: 'BDCartoonShoutRegular';
        src: url('BD_Cartoon_Shout-webfont.ttf') format('truetype');
	    font-weight: normal;
	    font-style: normal;
      }
      #pacman {
        height:450px;
        width:342px;
        margin:20px auto;
      }
      #shim { 
        font-family: BDCartoonShoutRegular; 
        position:absolute;
        visibility:hidden
      }
      h1 { font-family: BDCartoonShoutRegular; text-align:center; }
      body { width:342px; margin:0px auto; font-family:sans-serif; }
      a { text-decoration:none; }
    </style>

<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><link rel="stylesheet" href="../nc-theme.css"><script data-bar="tl" data-short="1" src="../nc.js" charset="utf-8"></script><script>document.addEventListener('DOMContentLoaded',function(){NC.pad({left:37,up:38,right:39,down:40,actions:[{label:'Старт',key:78},{label:'Пауза',key:80}]})})</script>
<style>body{background:var(--nc-bg)!important;color:var(--nc-text)!important}h1,h2,p,a{color:var(--nc-yellow)!important;font-family:'NC Pixel',monospace!important}#pacman canvas{box-shadow:0 0 22px rgba(255,60,172,.35)}</style>
</head>

<body>
  
  <div id="shim">shim for font face</div>

  <h1>ПАКМАН</h1>

  <div id="pacman"></div>
  <script src="pacman.js"></script>
  <script src="modernizr-1.5.min.js"></script>

  <script>

    var el = document.getElementById("pacman");

    if (Modernizr.canvas && Modernizr.localstorage && 
        Modernizr.audio && (Modernizr.audio.ogg || Modernizr.audio.mp3)) {
      window.setTimeout(function () { PACMAN.init(el, "./"); }, 0);
    } else { 
      el.innerHTML = "Sorry, needs a decent browser<br /><small>" + 
        "(firefox 3.6+, Chrome 4+, Opera 10+ and Safari 4+)</small>";
    }
  </script>

</body>
</html>
