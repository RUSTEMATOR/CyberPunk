<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Найт-Сити 3D</title>
<style>
  :root { --acc: #FF3E8A; --acc2: #FFB547; --ink: #F3EEE8; --bg: #0B0A12; }
  html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none;
    font: 500 14px/1.3 system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--ink); }
  canvas#view { position: fixed; inset: 0; width: 100vw; height: 100vh; image-rendering: pixelated; image-rendering: crisp-edges; display: block; }
  .hud { position: fixed; left: 0; right: 0; top: 0; padding: calc(10px + env(safe-area-inset-top)) 12px 8px; display: flex; gap: 8px; align-items: flex-start;
    background: linear-gradient(rgba(0,0,0,.65), transparent); pointer-events: none; }
  .where b { display: block; font-size: 16px; letter-spacing: .02em; }
  .where span { opacity: .75; font-size: 12px; }
  .hud .sp { flex: 1; }
  .btn { pointer-events: auto; background: rgba(10,10,16,.72); color: var(--ink); border: 1px solid rgba(255,255,255,.18); border-radius: 10px;
    padding: 9px 12px; font: 600 14px/1 inherit; cursor: pointer; backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); }
  .btn:active { transform: scale(.96); }
  #mini { pointer-events: none; width: 92px; height: 92px; border-radius: 50%; border: 1px solid rgba(255,255,255,.25); background: rgba(0,0,0,.45); }
  #prompt { position: fixed; left: 50%; bottom: calc(150px + env(safe-area-inset-bottom)); transform: translateX(-50%); max-width: 80vw; text-align: center;
    background: rgba(10,10,16,.8); border: 1px solid var(--acc); border-radius: 10px; padding: 8px 12px; display: none; box-shadow: 0 0 18px color-mix(in srgb, var(--acc) 40%, transparent); }
  #prompt small { display: block; opacity: .7; font-size: 12px; margin-top: 2px; }
  #act { position: fixed; right: 20px; bottom: calc(40px + env(safe-area-inset-bottom)); width: 86px; height: 86px; border-radius: 50%; display: none;
    background: var(--acc); color: #120610; font: 800 15px/1.1 inherit; border: 0; box-shadow: 0 0 24px var(--acc); }
  #car { position: fixed; right: 118px; bottom: calc(52px + env(safe-area-inset-bottom)); display: none; }
  #run { position: fixed; right: 24px; bottom: calc(140px + env(safe-area-inset-bottom)); }
  #stick { position: fixed; left: 24px; bottom: calc(28px + env(safe-area-inset-bottom)); width: 128px; height: 128px; border-radius: 50%;
    background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.2); }
  #knob { position: absolute; left: 39px; top: 39px; width: 50px; height: 50px; border-radius: 50%; background: rgba(255,255,255,.28); border: 1px solid rgba(255,255,255,.45); }
  #toast { position: fixed; left: 50%; top: 40%; transform: translate(-50%, -50%); background: rgba(10,10,16,.88); padding: 12px 16px; border-radius: 10px;
    border: 1px solid var(--acc2); display: none; text-align: center; max-width: 80vw; }
  #load { position: fixed; inset: 0; display: grid; place-items: center; background: var(--bg); font: 600 16px/1.4 inherit; z-index: 10; }
  @media (hover: hover) and (pointer: fine) { #stick { display: none; } }
  /* docs/PLAN_CITY3D_2.md: the heat, the view, the sound, the chrome */
  #heat { display: none; margin-top: 4px; font: 700 12px/1.2 inherit; color: #ff4d4d; text-shadow: 0 0 8px rgba(255,40,40,.7); }
  #heat.chase { animation: hb .5s steps(2) infinite; }
  @keyframes hb { 50% { color: #4d7bff; text-shadow: 0 0 8px rgba(60,100,255,.8); } }
  .tools { position: fixed; right: 12px; top: calc(118px + env(safe-area-inset-top)); display: flex; flex-direction: column; gap: 8px; }
  .tools .btn { padding: 8px 10px; font-size: 13px; min-width: 56px; }
  #abil { position: fixed; left: 16px; bottom: calc(172px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 8px; }
  #abil .btn { font-size: 13px; padding: 8px 10px; border-color: var(--acc2); }
  #abil .btn[disabled] { opacity: .45; }
  #tint { position: fixed; inset: 0; pointer-events: none; opacity: 0; transition: opacity .25s; mix-blend-mode: screen; }
  #fxword { position: fixed; left: 50%; top: 38%; transform: translate(-50%, -50%); pointer-events: none; font: 900 34px/1 inherit;
    letter-spacing: .12em; color: #fff; opacity: 0; white-space: nowrap; }
  #fxword.go { animation: fw 1.6s ease-out forwards; }
  @keyframes fw { 0% { opacity: 1; transform: translate(-50%, -50%) scale(1); } 100% { opacity: 0; transform: translate(-50%, -50%) scale(2.4); } }
  #glitch { position: fixed; inset: 0; pointer-events: none; display: none; }
  #glitch i { position: absolute; left: 0; right: 0; background: #000; mix-blend-mode: normal; }
  #glitch b { position: absolute; left: 0; right: 0; background: rgba(255,0,40,.35); }
  body.bwflash canvas#view { filter: grayscale(1) contrast(1.6) sepia(1) hue-rotate(-50deg) saturate(4); }
</style>
</head>
<body>
<canvas id="view"></canvas>
<div class="hud">
  <div class="where"><b id="dname">Найт-Сити</b><span id="cname">загрузка…</span><div id="heat"></div></div>
  <div class="sp"></div>
  <canvas id="mini" width="92" height="92"></canvas>
  <button class="btn" id="close" type="button">← Выйти</button>
</div>
<div id="prompt"></div>
<button id="act" type="button">Войти</button>
<button class="btn" id="car" type="button">Сесть</button>
<button class="btn" id="run" type="button">Бег</button>
<div class="tools"><button class="btn" id="cam" type="button">Вид</button><button class="btn" id="snd" type="button">Звук</button></div>
<div id="abil"></div>
<div id="tint"></div>
<div id="fxword"></div>
<div id="glitch"></div>
<div id="stick"><div id="knob"></div></div>
<div id="toast"></div>
<div id="load">Город загружается…</div>
<script type="module" src="city.js"></script>
</body>
</html>
